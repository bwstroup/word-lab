}
const SOL_MODES=[['files','Planet Files'],['order','Line-Up'],['weigh','Weigh-In'],['walk','Scale Walk'],['paper','Paper mission']];

/* ---------- Planet Files (browse) ---------- */

        sol.stamped.push(cur);let bonus=false;if(!sol.filesDone&&sol.stamped.length===SOLAR_ORDER.length){sol.filesDone=true;award(3);bonus=true;}

/* size bar: Earth next to the world, drawn to scale (the Sun is shown as a huge curve) */
function sizeCompare(id){
  const P=SOLAR[id];if(P.xE==null||id==='earth')return el('span',{});
  const box=el('div',{class:'sol-size'});const W=520,H=160;
  let svg;
  if(id==='sun'){const eR=1.2,sR=eR*109;svg=`<circle cx="${-sR+170}" cy="${H/2}" r="${sR}" fill="#FFD23F" stroke="#05060F" stroke-width="4"/><circle cx="300" cy="${H/2}" r="${Math.max(eR,2)}" fill="#3FA7F5" stroke="#05060F" stroke-width="1"/><circle cx="300" cy="${H/2}" r="10" fill="none" stroke="#7FE9FF" stroke-width="2" stroke-dasharray="3 3"/><text x="300" y="${H/2-20}" class="sz">Earth (the dot in the ring!)</text><text x="90" y="${H/2+5}" class="sz dark">Sun</text>`;}
  else{const big=Math.max(1,P.xE);const R=Math.min(58,H/2-22)/big;const eR=R*1,pR=R*P.xE;
    const used=2*eR+30+2*pR,ex=(W-used)/2+eR,px=ex+eR+30+pR;
    svg=`<circle cx="${ex}" cy="${H/2}" r="${Math.max(eR,1.5)}" fill="#3FA7F5" stroke="#05060F" stroke-width="${eR>6?3:1}"/><text x="${ex}" y="${H/2-Math.max(eR,2)-8}" class="sz">Earth</text>
      <circle cx="${px}" cy="${H/2}" r="${Math.max(pR,1.5)}" fill="${{mercury:'#A9A3A0',venus:'#E8C27A',moon:'#C9C6BE',mars:'#D9572B',jupiter:'#E9C9A0',saturn:'#EBCB8B',uranus:'#9EE6E6',neptune:'#3B63D9',pluto:'#D8B89A'}[id]}" stroke="#05060F" stroke-width="${pR>6?3:1}"/><text x="${px}" y="${H/2-Math.max(pR,2)-8}" class="sz">${solarName(id)}</text>`;}
  box.innerHTML=`<div class="label">Size compared with Earth</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escAttr(solarName(id))} next to Earth, to scale">${svg}</svg>`;
  return box;
}
function escAttr(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- Line-Up ---------- */
function makeLineup(L,n){
  const set=LINEUPS[L];const all=set.items;const size=n>=2?all.length:Math.min(all.length,n===0?4:5);
  for(let t=0;t<60;t++){const ids=shuffle(all).slice(0,size);
    if(size<all.length&&set.close&&set.close.some(([a,b])=>ids.includes(a)&&ids.includes(b)))continue;
    return {set,ids};}
  return {set,ids:shuffle(all).slice(0,size)};
}
function lineupTask(T,work,padWrap,done){
  const {set}=T;const answer=lineAnswer(set,T.ids);const N=answer.length;
  const slots=Array(N).fill(null),locked=Array(N).fill(false);let tries=0;
  const slotRow=el('div',{class:'lu-slots'});const pool=el('div',{class:'lu-pool'});
  const check=el('button',{class:'btn',type:'button',disabled:true},'Check order');
  const ends=el('div',{class:'lu-ends'},el('span',{},'← '+set.first),el('span',{},set.last+' →'));
  const paint=()=>{slotRow.textContent='';pool.textContent='';
    slots.forEach((id,i)=>slotRow.append(el('button',{type:'button',class:'lu-slot'+(id?' full':'')+(locked[i]?' right':''),'aria-label':id?`Spot ${i+1}: ${solarName(id)}${locked[i]?', correct':''}. Tap to take it back.`:`Spot ${i+1}: empty`,
      onclick:()=>{if(!id||locked[i])return;SFX.tap();slots[i]=null;paint();}},el('span',{class:'lu-n'},String(i+1)),id?artEl(id,46):el('span',{class:'lu-empty'},'?'),id?el('span',{class:'lu-name'},solarName(id)):'')));
    T.ids.filter(id=>!slots.includes(id)).forEach(id=>pool.append(el('button',{type:'button',class:'lu-item',onclick:()=>{const k=slots.indexOf(null);if(k<0)return;SFX.tap();slots[k]=id;paint();}},artEl(id,46),el('span',{},solarName(id)))));
    check.disabled=slots.includes(null);};
  check.onclick=()=>{if(slots.includes(null))return;let wrong=0;
    slots.forEach((id,i)=>{if(id===answer[i])locked[i]=true;else{wrong++;slots[i]=null;}});
    if(!wrong){SFX.ok();check.disabled=true;paint();slotRow.querySelectorAll('.lu-slot').forEach(b=>b.disabled=true);
      const tbl=el('div',{class:'lu-reveal'},answer.map(id=>el('div',{},artEl(id,30),el('b',{},solarName(id)),el('span',{},set.show(id)))));
      work.append(tbl);sayLine('cheer',tries?'Got them all in order.':'Perfect order on the first try!');done(tries===0);return;}
    tries++;SFX.no();anim(slotRow,'wiggle');paint();
    say(tries===1?'enc':'hint',tries===1?`${N-wrong} of ${N} are in the right spot, and they stay locked. Try the others again.`:`${set.hint} ${N-wrong} of ${N} are locked in.`);};
  work.append(el('div',{class:'prompt'},`Line them up: ${set.ask}.`),ends,slotRow,el('div',{class:'label'},'Tap a world to put it in the next spot'),pool,el('div',{},check));
  paint();say('hero',`${N} worlds. Put them in order, ${set.ask}.`);
}

/* ---------- Weigh-In ---------- */
function weighTask(T,work,padWrap,done){
  const R=WEIGH_RULES[T.rule],W=SOLAR[T.world];let tries=0;
  const inp=numInput({dot:T.dec,max:7,onCheck:s=>{
    if(sameNum(s,T.ans)){inp.box.classList.add('right');anim(inp.box,'pop');SFX.ok();keyHandler=null;
      const first=!S.solar.massTip;S.solar.massTip=true;save();
      work.append(el('div',{class:'factbox'},first?[el('b',{},'Same stuff, different pull. '),'Things have the same amount of stuff (mass) on every world. The scale changes because each world pulls with a different strength (gravity).']
        :[el('b',{},`${W.name}: `),`a scale ${['jupiter','saturn','uranus','neptune'].includes(T.world)?'floating at the cloud tops would read':'there reads'} ${fmtNum(W.g*100)} for every 100 on Earth.`]));
      sayLine('cheer');done(tries===0);return;}
    tries++;SFX.no();anim(inp.box,'wiggle');inp.clear();
    if(tries===1)say('enc',`${W.name} pulls ${R.txt} as Earth. So ${R.how}.`);
    else{say('hint',`${withCommas(T.w)}, ${R.how}: ${fmtNum(T.ans)}. Type ${fmtNum(T.ans)}.`);}
  }});
  inp.box.dataset.ans=String(T.ans);
  const scale=(world,val,q)=>el('div',{class:'wi-side'},artEl(world,70),el('div',{class:'wi-name'},SOLAR[world].short||SOLAR[world].name),
    el('div',{class:'wi-scale'+(q?' q':'')},q?inp.box:el('span',{},withCommas(val)),el('small',{},'pounds')));
  work.append(el('div',{class:'prompt'},`${cap(T.thing)} weighs ${withCommas(T.w)} pounds on Earth. What would a scale read on ${W.short?'the '+W.short:W.name}?`),
    el('div',{class:'wi-row'},scale('earth',T.w,false),el('div',{class:'wi-arrow','aria-hidden':'true'},'→'),scale(T.world,null,true)),
    el('div',{class:'stat'},`${W.short?'The '+W.short:W.name} pulls `,el('b',{},R.txt),' as Earth.'));
  padWrap.append(inp.pad);say('hero',T.dec?'Watch the decimal point. Estimate first, then work it out.':`Think: ${R.how}.`);
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ---------- Scale Walk ---------- */
function ribbon(highlight,{per=0,maxAU=41}={}){
  const W=640,H=124,M=26,X=au=>M+au/maxAU*(W-2*M);
  const ids=['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune','pluto'];
  let s=`<rect width="${W}" height="${H}" rx="8" fill="#070A1F"/><line x1="${M}" y1="72" x2="${W-M}" y2="72" class="rb-line"/>`;
  for(let a=0;a<=maxAU;a+=5)s+=`<line x1="${X(a)}" y1="66" x2="${X(a)}" y2="78" class="rb-tick"/><text x="${X(a)}" y="98" class="rb-num">${a}</text>`;
  for(let k=0;k<7;k++)s+=`<circle cx="${(X(2.2)+(X(3.2)-X(2.2))*k/6).toFixed(1)}" cy="${72+[-6,4,-2,7,-7,2,5][k]}" r="1.8" fill="#B39E86"/>`;
  if(!highlight.some(id=>SOLAR[id].au<4))s+=`<text x="16" y="24" class="rb-lab" style="text-anchor:start">4 inner planets</text><line x1="${X(0.8)}" y1="30" x2="${X(0.8)}" y2="60" class="rb-tick"/>`;
  s+=`<circle cx="${M}" cy="72" r="9" fill="#FFD23F" stroke="#05060F" stroke-width="3"/>`;
  ids.forEach((id,i)=>{const on=highlight.includes(id);const x=X(SOLAR[id].au);
    s+=`<circle cx="${x}" cy="72" r="${on?8:4.5}" fill="${on?'#7FE9FF':'#C3CBEE'}" stroke="#05060F" stroke-width="${on?3:1.5}"/>`;
    if(on||SOLAR[id].au>4)s+=`<text x="${x}" y="${on?46:54}" class="rb-lab${on?' on':''}">${solarName(id)}</text>`;});
  s+=`<text x="${W-M}" y="118" class="rb-unit">AU from the Sun${per?` · ${per} step${per===1?'':'s'} per AU`:''}</text>`;
  const box=el('div',{class:'sky rb'});box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distance ribbon from the Sun out to Pluto">${s}</svg>`;return box;
}
function walkTask(T,work,padWrap,done){
  let tries=0,prompt,hint1,hint2,visual,unit;
  const P=id=>SOLAR[id].short||SOLAR[id].name;
  if(T.kind==='steps'){prompt=`Sidewalk model: ${T.per} giant steps for every AU. ${P(T.id)} is about ${T.au} AU from the Sun. How many steps from the Sun?`;
    hint1=`Multiply the AU by ${T.per}.`;hint2=`${T.au} × ${T.per} = ${T.ans}.`;visual=ribbon([T.id],{per:T.per});unit='steps';}
  else if(T.kind==='gap'){const sa=Math.round(WALK_AU1[T.a]*10),sb=Math.round(WALK_AU1[T.b]*10);
    prompt=`10 steps per AU: ${P(T.a)} is ${sa} steps from the Sun and ${P(T.b)} is ${sb} steps. How many steps from ${P(T.a)} to ${P(T.b)}?`;
    hint1='Take the smaller number away from the bigger one.';hint2=`${sb} − ${sa} = ${T.ans}.`;visual=ribbon([T.a,T.b],{per:10});unit='steps';}
  else if(T.kind==='size'){const what=T.id==='sun'?'The Sun':P(T.id);const xs=T.x===0.5?'about half as wide as':T.x===0.25?'about a quarter as wide as':`about ${T.x} times as wide as`;
    prompt=`Model: Earth is a ball ${T.earthCm} cm wide. ${what} is ${xs} Earth. How wide is its ball?`;
    hint1=T.x<1?`${T.x===0.5?'Half':'A quarter'} of ${T.earthCm} cm.`:`${T.earthCm} × ${T.x}.`;hint2=`${T.earthCm} × ${T.x} = ${fmtNum(T.ans)} cm.`;visual=sizeCompare(T.id);unit='cm';}
  else{prompt=`1 AU is about 150 million km. ${P(T.id)} is about ${T.au} AU from the Sun. How many million km is that?`;
    hint1='Multiply the AU by 150.';hint2=`${T.au} × 150 = ${T.ans}.`;visual=ribbon([T.id]);unit='million km';}
  const inp=numInput({dot:T.kind==='size',max:6,onCheck:s=>{
    if(sameNum(s,T.ans)){inp.box.classList.add('right');anim(inp.box,'pop');SFX.ok();keyHandler=null;
      const tip=T.kind==='gap'&&['saturn','uranus','neptune','pluto'].includes(T.b)?'Out past Jupiter, the gaps get huge. The outer planets are lonely!'
        :T.kind==='size'&&T.id==='sun'?'A 218 cm ball is taller than a grown-up. And Earth is just a marble!'
        :T.kind==='km'?`Real average: about ${withCommas(SOLAR[T.id].mkm)} million km.`
        :`${P(T.id||T.b)}: ${SOLAR[T.id||T.b].line}`;
      work.append(el('div',{class:'factbox'},tip));sayLine('cheer');done(tries===0);return;}
    tries++;SFX.no();anim(inp.box,'wiggle');inp.clear();say(tries===1?'enc':'hint',tries===1?hint1:`${hint2} Type ${fmtNum(T.ans)}.`);}});
  inp.box.dataset.ans=String(T.ans);
  work.append(el('div',{class:'prompt'},prompt),visual,el('div',{class:'row'},inp.box,el('span',{class:'eq'},unit)));
  padWrap.append(inp.pad);say('hero',T.kind==='size'?'Sizes first, then multiply.':'Look at the ribbon. Everything in the inner solar system is squeezed close to the Sun!');
}

/* ---------- Paper mission: Sidewalk Solar System ---------- */
