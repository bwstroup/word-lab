<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Energy Lab">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="theme-color" content="#2E2A26">
<title>Energy Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a fixed top bar (home, title, level dial, stars) over one screen at a time: the Powerhouse cutaway, a zone's station list, a station, the Lobby, or Grown-ups. Single theme: Copper and Glass. */
:root{
  --copper:#B4622D; --copper-d:#8A4418; --glass:#4FA39A; --glass-d:#1F6E68; --enamel:#F6EFE2; --paper:#FBF7EE; --slate:#5C6770; --brass:#E8B84A; --ink:#2E2A26; --line:#D9CFBD; --good:#2F7D4F; --soft:#EFE7D6;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--enamel);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,.hit:focus-visible{outline:3px solid var(--glass-d);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
#app{min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--ink);color:var(--enamel);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.bar h1{font-size:1.5rem;flex:1 1 7ch;min-width:7ch}
@media (max-width:560px){.bar h1{flex-basis:calc(100% - 170px)}.dial{order:3;flex:1 1 100%}.dial button{flex:1}}
.home{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--brass);background:transparent;color:var(--brass);font-weight:700;padding:0 12px}
.dial{display:flex;border:2px solid var(--brass);border-radius:99px;overflow:hidden}
.dial button{min-height:44px;padding:0 12px;border:0;background:transparent;color:var(--enamel);font-weight:700;font-size:.9rem}
.dial button[aria-pressed="true"]{background:var(--brass);color:var(--ink)}
.total{font-family:var(--display);font-size:1.35rem;color:var(--brass);white-space:nowrap}
main{flex:1;width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:16px max(14px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.lede{color:var(--slate);max-width:62ch}
/* home */
.ph{width:100%;height:auto;display:block;border-radius:14px;border:3px solid var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ph .pn{font:700 18px var(--display)} .ph .pl{font:700 15px var(--body);fill:#2E2A26} .ph .ps{font:400 12px var(--body);fill:#5C6770}
.ph .hit{fill:transparent;cursor:pointer}
.ph .hit:hover{fill:rgba(232,184,74,.18)}
.ph .soon{fill:rgba(92,103,112,.30);pointer-events:none}
.ph .cnt{font:700 15px var(--display);fill:#2E2A26;text-anchor:end}
.ph .lamp{stroke:#2E2A26;stroke-width:2.5;fill:#CFC6B4}
.ph .lamp.on{fill:#FFD23F}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:52px;padding:0 20px;border-radius:14px;border:2.5px solid var(--ink);background:var(--paper);font-weight:700}
.btn.go{background:var(--copper);color:#fff}
.btn.quiet{border-color:var(--line);color:var(--slate);font-weight:400;font-size:.9rem;min-height:44px}
.toast{min-height:1.5em;color:var(--copper-d);font-weight:700}
/* zone list */
.guide{display:flex;gap:12px;align-items:center}
.guide .j{flex:none;width:108px;line-height:0}
.guide .j svg{width:100%;height:auto}
.bubble{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:12px 16px;max-width:60ch}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--paper);border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.st{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:118px;padding:14px;border-radius:14px;border:2.5px solid var(--ink);background:var(--paper)}
.st h3{font-size:1.5rem}
.st small{color:var(--slate);font-size:.9rem}
.pips{display:flex;gap:5px;margin-top:auto}
.pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:#E3DACA}
.pip.on{background:var(--brass)}
.pip.cur{box-shadow:0 0 0 3px var(--glass)}
/* station */
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.q{font-size:1.25rem;font-weight:700;max-width:56ch}
.sub{color:var(--slate);font-size:.95rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.ch{min-height:60px;padding:10px 14px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;font-weight:700;text-align:left}
.ch.right{background:#D8EFD9;border-color:var(--good)}
.ch.dim{opacity:.45}
.why{border-left:6px solid var(--glass);padding:8px 12px;background:#E7F2EF;border-radius:0 10px 10px 0;max-width:62ch}
.why b{color:var(--glass-d)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:#E3DACA;border:1.5px solid var(--slate)}
.dot.on{background:var(--glass)}
.pic{max-width:340px;line-height:0;border:2px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
.pic svg{width:100%;height:auto;display:block}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;min-height:92px;padding:10px;border:2.5px dashed var(--slate);border-radius:14px;background:#fff}
.link{display:flex;flex-direction:column;align-items:center;gap:2px;width:112px;padding:6px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);font-size:.82rem;font-weight:700;text-align:center;line-height:1.2}
.link .j{width:54px;line-height:0} .link .j svg{width:100%;height:auto}
.link em{font-style:normal;font-weight:400;color:var(--slate);font-size:.75rem}
.arrow{align-self:center;font-family:var(--display);font-size:1.6rem;color:var(--copper)}
.slot{align-self:center;color:var(--slate);font-size:.9rem;padding:0 6px}
.num{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num output{font-family:var(--display);font-size:2.6rem;min-width:2.4ch;text-align:center;font-variant-numeric:tabular-nums}
.step{width:60px;height:60px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-size:1.8rem;font-weight:700;line-height:1}
.ledger{display:flex;flex-direction:column;gap:6px;max-width:440px}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;border-radius:10px;background:var(--soft);font-weight:700;font-variant-numeric:tabular-nums}
.ledger .in{background:var(--ink);color:var(--enamel)}
.ledger .miss{background:#fff;border:2.5px dashed var(--copper)}
/* paddle lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.lab{grid-template-columns:1fr}}
.lab svg{width:100%;height:auto;display:block;background:#fff;border:2px solid var(--ink);border-radius:12px}
.ctl{display:flex;flex-direction:column;gap:10px}
.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--slate);font-size:.95rem}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--slate)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i,.mixrow i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ink);display:block;flex:none}
.mixrow{display:flex;align-items:center;gap:8px}
.mixrow span{flex:1;font-weight:700;min-width:0}
.mixrow output{font-family:var(--display);font-size:1.6rem;min-width:1.4ch;text-align:center}
.step.sm{width:48px;height:48px;font-size:1.5rem}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg span{min-width:5.2em;font-weight:700}
.seg button{min-width:56px;min-height:48px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--glass);color:#fff}
.pd-riders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:900px){.pd-riders{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rider{position:relative;display:flex;flex-direction:column;gap:3px;padding:6px;border:2px solid var(--ink);border-radius:12px;background:#EEF0E6;min-width:0}
.rider.pack{grid-column:1/-1}
.lab .rider svg,.lab .devs svg{border:0;background:none;border-radius:0}
.rider .rn{font-size:.8rem;color:var(--slate);text-align:center;margin:0}
.rider input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--copper);touch-action:pan-y}
.rider output{font-size:.8rem;white-space:nowrap;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.ebar,.pbar{border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.ebar{height:10px}.pbar{height:18px}
.ebar i,.pbar i{display:block;height:100%;width:0;background:#6DBE45}
.pbar i{transition:width .45s cubic-bezier(.2,.8,.2,1),background-color .3s}
.whew{position:absolute;top:18px;left:6px;padding:1px 7px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-weight:700;font-size:.8rem}
.pd-meter{margin-top:10px;display:flex;flex-direction:column;gap:3px}.pd-meter p{margin:0;font-size:.95rem}.pd-meter .pdn{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.devs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.devs>span{grid-column:1/-1}
.devs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;min-width:0;font-size:.78rem;line-height:1.15;transition:background-color .3s,box-shadow .3s}
.devs button small{font-weight:400;color:var(--slate)}
.devs button[aria-pressed="true"]{background:#FFF6DA;color:var(--ink);box-shadow:inset 0 0 0 3px var(--copper)}
.lab .devs svg{width:56px;height:56px}.devs .g{opacity:var(--a,0)}
.pd-stage{margin-top:8px}.lab .pd-stage svg{border-radius:12px}.pd-cap{margin:4px 0 0;font-weight:700}
.wn{transition:fill .5s}
.lab .gscene svg{border-radius:12px}
@media (min-width:900px){.gbox{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.gctl{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;align-items:center}.gctl>.seg,.gctl>.read,.gctl>.legend{grid-column:1/-1}}.gtime{display:flex;gap:10px;align-items:center;margin:8px 0 2px}.gtime input{flex:1;height:44px;margin:0;accent-color:var(--copper);touch-action:pan-y}.gtime .btn{white-space:nowrap}
.read{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
details{max-width:62ch} summary{font-weight:700;color:var(--glass-d);min-height:44px;display:flex;align-items:center;cursor:pointer}
/* win */
.win{align-items:center;text-align:center}
.win .j{width:170px;line-height:0} .win .j svg{width:100%;height:auto}
.jwrap{position:relative;animation:jin .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes jin{0%{transform:translateY(-60px) scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
.win .bigstar{animation:spop .6s .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes spop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.spk{position:absolute;width:14px;height:14px;background:var(--brass);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:twk 1.6s ease-out both}
.spk.s1{left:-14px;top:30px;animation-delay:.7s}.spk.s2{right:-10px;top:8px;animation-delay:.85s}.spk.s3{right:-18px;bottom:30px;animation-delay:1s}
@keyframes twk{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1.1) rotate(45deg)}100%{opacity:0;transform:scale(.6) rotate(90deg)}}
#total.tick{animation:tick .5s ease-out}
@keyframes tick{40%{transform:scale(1.35);color:#FFD23F}}
.link.pulse{animation:lp 1.1s ease-in-out both}
@keyframes lp{0%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 0 6px var(--pc);background:#FFFDF2;transform:translateY(-3px)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.ph .lamp{transition:fill .8s}
.ph .lamp.fresh{animation:lampon 1.4s ease-out}
@keyframes lampon{0%{fill:#CFC6B4}20%{fill:#FFD23F;stroke-width:6}35%{fill:#E9DFC4}55%{fill:#FFD23F}100%{fill:#FFD23F}}
.bigstar{font-family:var(--display);font-size:3rem;color:var(--copper)}
/* lobby */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.badge{padding:12px;border-radius:14px;border:2.5px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;gap:4px}
.badge.off{opacity:.45;border-style:dashed}
.badge b{font-family:var(--display);font-size:1.3rem}
.mission ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.mission ul{margin:0;padding-left:1.2em}
.stamp{max-width:260px;border:4px solid var(--ink);border-radius:10px;transform:rotate(-2deg);display:block}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;inset:0;width:0;background:rgba(180,98,45,.35)}
.wiggle{animation:wig .35s}
.pop{animation:pop .35s}
.rotor{transform-origin:200px 104px}
.rotor.spin{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wig{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@keyframes pop{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.wiggle,.pop,.rotor.spin,.jwrap,.win .bigstar,.spk,#total.tick,.link.pulse,.ph .lamp.fresh{animation:none}.spk{display:none}.wiggle{outline:3px solid var(--copper)}}
</style></head><body>
<div id="app">
  <div class="bar">
    <button class="home" id="homeBtn" type="button" aria-label="Back">Home</button>
    <h1 id="title">Energy Lab</h1>
    <div class="dial" role="group" aria-label="Level" id="dial"></div>
    <span class="total" id="total" aria-label="Stars earned"></span>
  </div>
  <main id="main"></main>
</div>
<script src="content.js"></script>
<script>if(typeof BIG==="undefined")document.addEventListener("DOMContentLoaded",()=>{document.body.innerHTML="<p style=\"font:20px sans-serif;padding:24px\">Energy Lab could not load its content file. Check the connection and open it again.</p>";});</script>

const WARM=(kg,m,drops)=>kg*9.8*m*drops/4186; // degrees C for 1 liter (1 kg) of water
const f3=x=>x.toFixed(3);
function rPaddle(st){
  const L=S.level; let kg=L===0?5:1, h=L===0?2:1, drops=0, temp=0, stage=0, guess=null;
  const host=guide(st.intro[L]); main.append(host);
  const mood=m=>{host.firstChild.innerHTML=JOULE.glow[m];};
  const svgBox=el('div'); const read=el('p',{class:'read','aria-live':'polite'}); const task=el('div',{class:'panel'}); const ctl=el('div',{class:'ctl'});
  main.append(el('div',{class:'lab'},svgBox,ctl),task,
    el('details',null,el('summary',null,'Tell me more: who was James Joule?'),
      el('p',null,'James Joule was born in 1818 in Salford, England. His family ran a brewery, and he did experiments at home. In the 1840s he let falling weights turn a paddle wheel in a tub of water and measured the tiny rise in temperature with very exact thermometers. He showed that the same amount of motion always makes the same amount of heat. The unit of energy, the joule, is named for him.')),
    el('p',{class:'sub'},'This lab uses the real rule. It takes about 4,186 joules to warm one liter of water by one degree Celsius. The water here is one liter.'));
  const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches; let vq=0, vt=0, pang=0, tSh=0, lastT=0, N=null, lastRead='';
  function draw(){const lift=60+(2-h)*45;
    svgBox.innerHTML='<svg viewBox="0 0 320 260" role="img" aria-label="A weight on a string turns a paddle wheel in a tub of water with a thermometer"><path d="M60,30H250" stroke="#2E2A26" stroke-width="5"/><circle cx="250" cy="30" r="12" fill="#E8B84A" stroke="#2E2A26" stroke-width="3"/><path class="spk" d="M250,20v20M240,30h20" stroke="#2E2A26" stroke-width="2"/><path class="str" d="M250,42V'+lift+'" stroke="#2E2A26" stroke-width="2.5"/><g class="wt"><rect x="'+(250-12-kg*3)+'" y="'+lift+'" width="'+(24+kg*6)+'" height="'+(22+kg*4)+'" rx="4" fill="#5C6770" stroke="#2E2A26" stroke-width="3"/><text x="250" y="'+(lift+17+kg*2)+'" text-anchor="middle" font-family="Saira Condensed,sans-serif" font-weight="700" font-size="15" fill="#fff">'+kg+' kg</text></g><path d="M286,'+lift+'V'+(lift+h*45)+'" stroke="#B4622D" stroke-width="2" stroke-dasharray="4 4"/><text x="292" y="'+(lift+h*22+5)+'" font-family="Atkinson Hyperlegible,sans-serif" font-size="13" fill="#B4622D">'+h+' m</text><path d="M60,30V120" stroke="#2E2A26" stroke-width="2.5"/><path d="M20,120V235H150V120" fill="#CFE6E2" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/><path d="M22,140H148V233H22Z" fill="#8FCFC6"/><path class="swl" d="M30,158q8,-7 16,0t16,0M82,160q8,-7 16,0t16,0M34,224q8,-7 16,0t16,0M78,222q8,-7 16,0t16,0" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0"/><path d="M60,120V215" stroke="#2E2A26" stroke-width="5"/><g class="pad"><path d="M38,190H82M60,168V212" stroke="#5C6770" stroke-width="4" stroke-linecap="round"/><rect x="30" y="184" width="14" height="12" rx="2" fill="#B4622D" stroke="#2E2A26" stroke-width="2"/><rect x="76" y="184" width="14" height="12" rx="2" fill="#B4622D" stroke="#2E2A26" stroke-width="2"/><rect x="54" y="160" width="12" height="14" rx="2" fill="#B4622D" stroke="#2E2A26" stroke-width="2"/><rect x="54" y="206" width="12" height="14" rx="2" fill="#B4622D" stroke="#2E2A26" stroke-width="2"/></g><rect x="118" y="96" width="12" height="110" rx="6" fill="#fff" stroke="#2E2A26" stroke-width="2.5"/><rect class="th" x="121" y="192" width="6" height="8" fill="#C4472A"/><circle cx="124" cy="208" r="9" fill="#C4472A" stroke="#2E2A26" stroke-width="2.5"/></svg>';
    const q=x=>svgBox.querySelector(x); N={str:q('.str'),wt:q('.wt'),pad:q('.pad'),th:q('.th'),swl:q('.swl'),spk:q('.spk'),lift,fall:h*45}; paint();}
  function paint(){ if(!N)return; const sm=x=>x*x*(3-2*x), dn=vq>0?(vt<0.62?sm(vt/0.62):1-sm((vt-0.62)/0.38)):0, off=dn*N.fall;
    N.wt.setAttribute('transform','translate(0 '+off.toFixed(1)+')'); N.str.setAttribute('d','M250,42V'+(N.lift+off).toFixed(1));

    N.swl.setAttribute('opacity',vq>0&&vt<0.75?'0.85':'0'); if(vq>0)N.swl.setAttribute('transform','translate('+(Math.sin(pang/40)*4).toFixed(1)+' 0)');
    const t='Drops: '+(drops-vq)+'   Water is warmer by '+f3(Math.max(0,temp-vq*WARM(kg,h,1)))+' °C'; if(t!==lastRead){lastRead=t;read.textContent=t;}}
  function frame(ts){ if(!svgBox.isConnected)return; const dt=Math.min(0.05,lastT?(ts-lastT)/1000:0); lastT=ts;
    if(vq>0){const dur=vq>3?0.42:0.85, sp=vt<0.62?Math.sin(Math.PI*vt/0.62):0; pang=(pang+dt*sp*(vq>3?420:260)*(0.7+0.15*kg*h))%360; vt+=dt/dur; if(vt>=1){vt=0;vq--; if(vq===0)checkTask();}}

  requestAnimationFrame(frame);

  function drop(n){for(let k=0;k<n;k++){drops++;temp+=WARM(kg,h,1);} if(RM){tSh=temp;paint();checkTask();} else vq+=n;}
  function buildCtl(){ctl.textContent='';
    if(L>0||stage>0){ctl.append(seg('Weight',L===2?[1,2]:[1,2,5],()=>kg,v=>kg=v,'kg'),seg('Height',[1,2],()=>h,v=>h=v,'m'));}
    ctl.append(el('div',{class:'row'},el('button',{class:'btn go',type:'button',onclick:()=>drop(1)},'Drop once'),el('button',{class:'btn',type:'button',onclick:()=>drop(10)},'Drop 10 times'),el('button',{class:'btn quiet',type:'button',onclick:()=>{drops=0;temp=0;vq=0;vt=0;draw();}},'Fresh water')),read);}
  function ask(q,choices,right,why,then){task.textContent='';task.append(el('p',{class:'q'},q));const box=el('div',{class:'choices'});let solved=false;
    choices.forEach((c,k)=>box.append(el('button',{class:'ch',type:'button',onclick:e=>{if(solved)return;const b=e.currentTarget; if(k===right){solved=true;b.classList.add('right');mood('happy');task.append(el('p',{class:'why'},el('b',null,'Yes. '),why),el('button',{class:'btn go',type:'button',onclick:then},'Next'));}else{fx(b,'wiggle');b.classList.add('dim');mood('think');}}},c)));task.append(box);}
  function say(t){task.textContent='';task.append(el('p',{class:'q'},t));}

      else if(stage===2&&drops>=10&&(kg!==5||h!==2)){stage=3;ask('With a lighter weight or a lower drop, the water warmed...',['Less','More','Exactly the same'],0,'Less motion in, less heat out. The heat always matches the motion.',()=>award(st));}}
    else if(L===1){ if(stage===0&&temp>=0.2){stage=1;ask('You warmed the water by '+f3(temp)+' °C with '+kg+' kg from '+h+' m, dropped '+drops+' times. Which change would warm it faster?',['A heavier weight from higher up','A lighter weight from lower down','Dropping it fewer times'],0,'More weight and more height both mean more motion energy in each drop.',()=>award(st));}}
    else{ if(stage===1&&drops>=10&&kg*h===1){drops=0;temp=0;draw();say('That is the starting setup: 1 kg from 1 m. Change the weight or the height, then tap Drop 10 times.');}
      else if(stage===1&&drops>=10){stage=2;const base=WARM(1,1,10),now=WARM(kg,h,10);ask('1 kg from 1 m, 10 drops, warms the water by '+f3(base)+' °C. With '+kg+' kg from '+h+' m, 10 drops warms it by '+f3(now)+' °C. That is how many times as much?',['2 times','4 times','The same'],kg*h===2?0:1,'Double the weight or double the height, and the heat doubles. Double both, and it is four times.',()=>{stage=3;ask('It takes about 4,186 joules to warm a liter of water by one degree. Dropping 1 kg from 1 m gives about 10 joules. About how many drops would it take to warm the water by one whole degree?',['About 420','About 42','About 4'],0,'4,186 divided by about 10 is roughly 420 drops. Turning motion into heat takes a lot of motion. That is why Joule\'s result was so hard to measure.',()=>award(st));});}}
