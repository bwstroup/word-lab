<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6DEC4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Logic Lab</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logic Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=UnifrakturMaguntia&family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<style>
/* Layout: Mossy Hollow sketchbook. A painted valley sits behind every screen; content rests on parchment sheets. Two places (the Tower, the Hollow Oak) are visited at night. */
:root{
  --bg:#E6DEC4; --sheet:#F4EEDD; --sheet-2:#EADFC4; --edge:#B39C70; --frame:#8C7A55;
  --ink:#3A2A1C; --ink-soft:#6E5D47; --text:#3A2A1C; --muted:#6E5D47;
  --rust:#9A4E2C; --rust-deep:#7A3A1E; --moss:#5E6F45; --moss-deep:#46552F; --glow:#E8B95A; --good:#4E7A3E; --good-soft:#DCE8C8; --miss:#A8432A;
  --btn:#9A4E2C; --btn-text:#F7F0DE; --chip:#EADFC4; --chip-text:#3A2A1C; --hl:#F3D58A;
  --display:'IM Fell English SC','IM Fell English',Georgia,'Times New Roman',serif;
  --italic:'IM Fell English',Georgia,serif;
  --body:'Alegreya',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
body.night{--bg:#1C221D;--text:#ECE3CC;--muted:#B9AF94;--btn:#C98A36;--btn-text:#221A10;--chip:#2E372D;--chip-text:#ECE3CC;--frame:#6E6146;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:19px;line-height:1.45;-webkit-tap-highlight-color:transparent;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
body.night button:focus-visible{outline-color:var(--glow)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.08;text-wrap:balance}
.backdrop{position:fixed;left:0;right:0;bottom:0;height:62vh;z-index:0;pointer-events:none;background-repeat:no-repeat;background-size:cover;background-position:center bottom;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30%);mask-image:linear-gradient(to bottom,transparent 0,#000 30%);opacity:.9;transition:opacity .4s}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px}
.view{display:flex;flex-direction:column;gap:22px}
.sheet{background:var(--sheet);color:var(--ink);border:1.5px solid var(--edge);border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 16px 30px -18px rgba(0,0,0,.6),inset 0 0 36px rgba(140,100,40,.12)}
.parch{background:var(--sheet);color:var(--ink);border:1.5px solid var(--edge);border-radius:4px;box-shadow:0 16px 30px -18px rgba(0,0,0,.6),inset 0 0 36px rgba(140,100,40,.12)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border:1.5px solid rgba(0,0,0,.35);border-radius:4px;
  background:var(--btn);color:var(--btn-text);font-family:var(--display);font-size:21px;letter-spacing:.8px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.28);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{background:var(--chip);color:var(--chip-text);border-color:var(--frame)}
.parch .btn.ghost,.sheet .btn.ghost{background:var(--sheet-2);color:var(--ink);border-color:var(--edge)}
.btn[disabled]{opacity:.45;cursor:default}
.iconbtn{width:54px;height:54px;border-radius:4px;border:1.5px solid var(--frame);background:var(--chip);display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);flex:none}
.iconbtn svg{width:26px;height:26px;stroke:var(--chip-text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.orbpill{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 18px;border-radius:999px;border:1.5px solid var(--frame);background:var(--chip);color:var(--chip-text);font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.orbpill i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 36%,#FFF8E6 0,#F6CE75 40%,#C98A36 100%);box-shadow:0 0 12px rgba(232,185,90,.8)}

/* home */
.home-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.logo{font-family:var(--display);font-size:clamp(50px,8.5vw,90px);line-height:.92;color:var(--ink)}
.logo small{display:block;font-family:var(--italic);font-style:italic;font-size:.27em;color:var(--moss-deep);margin-top:10px}
.tools{display:flex;gap:10px;align-items:center}
.greet{display:flex;align-items:center;gap:16px}
.ava{flex:none;width:112px;height:131px;border-radius:3px;overflow:hidden;background:var(--sheet);border:1.5px solid var(--edge);box-shadow:0 10px 20px -12px rgba(0,0,0,.6)}
.ava img{width:100%;height:100%;display:block}
.bubble{position:relative;background:var(--sheet);color:var(--ink);border:1.5px solid var(--edge);border-radius:14px;padding:12px 18px;font-size:19px;max-width:640px;box-shadow:0 10px 22px -14px rgba(0,0,0,.6)}
.bubble b{color:var(--rust-deep)}
.greet .bubble::before,.bubble.side::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:12px solid var(--edge);border-left:0}
.greet .bubble::after,.bubble.side::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:10px solid var(--sheet);border-left:0}

.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:880px){.places{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.places{grid-template-columns:minmax(0,1fr)}}
.place{display:flex;flex-direction:column;text-align:left;padding:0;border:1.5px solid var(--edge);border-radius:4px;overflow:hidden;background:var(--sheet);color:var(--ink);cursor:pointer;
  box-shadow:0 16px 30px -18px rgba(0,0,0,.6);transition:transform .15s}
.place:active{transform:scale(.985)}
.place .art{position:relative;height:170px;background-size:cover;background-position:center bottom;border-bottom:1.5px solid var(--edge)}
.place .art img{position:absolute;left:10px;bottom:0;height:150px;width:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.place .art .night-tag{position:absolute;right:10px;top:10px;padding:2px 10px;border-radius:999px;background:rgba(20,26,20,.75);color:#EFE3C0;font-size:13px;font-weight:700;letter-spacing:.5px}
.place .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.place .where{font-family:var(--italic);font-style:italic;font-size:17px;color:var(--moss-deep)}
.place h2{font-size:27px}
.place p{margin:0;color:var(--ink-soft);font-size:17px}
.place .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;background:var(--sheet-2);border:1px solid var(--edge);font-size:14px;font-weight:700;color:var(--ink)}
.tag.on{background:var(--moss);color:#F4EEDD;border-color:var(--moss-deep)}
.place.soon .art{filter:saturate(.45) sepia(.2)}
.place.soon h2{color:var(--ink-soft)}
.place.soon:active{transform:none}

/* zone frame */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
.topbar h1{font-size:clamp(30px,4.6vw,44px);flex:1 1 auto;min-width:0;color:var(--text)}
.dial{display:flex;border:1.5px solid var(--frame);border-radius:4px;overflow:hidden;background:var(--chip)}
.dial button{min-height:50px;padding:0 14px;border:0;border-left:1px solid var(--frame);background:transparent;color:var(--chip-text);font-family:var(--display);font-size:17px;cursor:pointer;touch-action:manipulation}
.dial button:first-child{border-left:0}
.dial button[aria-checked="true"]{background:var(--btn);color:var(--btn-text)}
.game{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.game{grid-template-columns:minmax(0,1fr)}}
.host{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.host .portrait{width:100%;max-width:230px;aspect-ratio:240/280;background:var(--sheet);border:1.5px solid var(--edge);border-radius:3px;overflow:hidden;box-shadow:0 16px 30px -18px rgba(0,0,0,.6)}
.host .portrait img{width:100%;height:100%;display:block}
.host .name{font-family:var(--display);font-size:22px;color:var(--text)}
.host .name small{font-family:var(--italic);font-style:italic;font-size:17px;color:var(--muted)}
.host .bubble::before{content:"";position:absolute;left:30px;top:-12px;border:10px solid transparent;border-bottom:12px solid var(--edge);border-top:0}
.host .bubble::after{content:"";position:absolute;left:32px;top:-9px;border:8px solid transparent;border-bottom:10px solid var(--sheet);border-top:0}
@media (max-width:820px){
  .host{position:static;flex-direction:row;align-items:center}
  .host .portrait{width:104px;flex:none}
  .host .name{display:none}
  .host .bubble{flex:1;min-width:0}
  .host .bubble::before{left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:12px solid var(--edge);border-left:0}
  .host .bubble::after{left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:10px solid var(--sheet);border-left:0}
}
.stage{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.label{font-family:var(--display);font-size:15px;letter-spacing:1.6px;color:var(--moss-deep)}
.wiggle{animation:wiggle .4s}
@keyframes wiggle{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.05)}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--frame);background:var(--chip)}
.dots i.done{background:radial-gradient(circle at 40% 36%,#FFF8E6 0,#F6CE75 45%,#C98A36 100%);border-color:#B07A2A;box-shadow:0 0 8px rgba(232,185,90,.8)}
.dots i.now{border-color:var(--rust);border-width:2.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:12px 22px;border-radius:999px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--edge);font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:0s!important}}


.rs{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border:1px solid var(--edge);border-radius:4px;background:#FBF6E8;cursor:pointer}
.rs input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--rust);flex:none}
.rs b{display:block;font-weight:700}.rs small{color:var(--ink-soft);font-size:15px}
.btn.hold{position:relative;overflow:hidden;align-self:flex-start;touch-action:none;-webkit-touch-callout:none}
.btn.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.28)}
.btn.hold .txt{position:relative}


/* --- analogies --- */
.an-card{padding:22px;display:flex;flex-direction:column;gap:18px}
.an-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 18px;font-family:var(--italic);font-size:20px;color:var(--ink-soft)}
.an-pair{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.an-row .as{font-family:var(--display);font-size:24px;color:var(--rust-deep)}
.tile{display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:58px;padding:6px 16px;border-radius:4px;background:#FBF6E8;border:1.5px solid var(--edge);font-family:var(--display);font-size:clamp(22px,3.6vw,30px);color:var(--ink);box-shadow:0 3px 0 #C2AA7A}
.tile.q{border-style:dashed;color:var(--rust)}
.tile.found{border-style:solid;background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.an-bonus{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid #D7C49A}
.choice.small{min-height:54px;font-size:17px;font-weight:600}
/* --- Brindle's bridge --- */
.bridge{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.fb-card{padding:22px;display:flex;flex-direction:column;gap:14px}
.arg{margin:0;padding:14px 18px;border-left:4px solid var(--moss);background:#FBF6E8;font-family:var(--italic);font-size:clamp(20px,3.2vw,25px);line-height:1.35;color:var(--ink)}
.fb-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.fb-opts{grid-template-columns:minmax(0,1fr)}}
.choice.fb{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;font-size:18px}
.choice.fb small{font-weight:400;font-size:15px;color:var(--ink-soft)}
.choice.fb[data-k="sound"]{background:#EEF3E2;border-color:var(--moss)}
/* --- Ember's games --- */
.gtabs{display:flex;gap:8px;flex-wrap:wrap}
.gtab{min-height:50px;padding:0 18px;border-radius:4px;border:1.5px solid var(--frame);background:var(--chip);color:var(--chip-text);font-family:var(--display);font-size:18px;cursor:pointer}
.gtab[aria-selected="true"]{background:var(--btn);color:var(--btn-text);border-color:rgba(0,0,0,.35)}
.nim,.code,.tower{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.gems{display:flex;flex-wrap:wrap;gap:12px;padding:8px 4px}
.gem{width:34px;height:34px;transform:rotate(45deg);border-radius:6px;background:radial-gradient(circle at 35% 30%,#FFF6DA,#F2C463 40%,#B9862B);border:1.5px solid #6E4C14;box-shadow:0 0 12px rgba(242,196,99,.8);transition:opacity .4s,transform .4s}
.gem.gone{opacity:.15;box-shadow:none;transform:rotate(45deg) scale(.7)}
.gem.gone.e{background:#A65E38}
.nimlog{margin:0;font-size:19px;font-weight:700;color:var(--ink)}
.btn.take{min-width:120px}
.legend2{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--ink-soft)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.peg,.pegs i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid #8C7A55;background:#E9DFC6}
.peg.gold,.pegs i.gold{background:radial-gradient(circle at 35% 30%,#FFF4D0,#E2A93B);border-color:#8A5E14}
.peg.silver,.pegs i.silver{background:radial-gradient(circle at 35% 30%,#FFFFFF,#A9B1B8);border-color:#5E6870}
.board{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pegs{display:inline-grid;grid-template-columns:repeat(2,14px);gap:4px;margin-left:8px}
.pot{display:inline-grid;place-items:center;width:44px;height:52px;border-radius:40% 40% 46% 46%/30% 30% 62% 62%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.55),transparent 40%),var(--pc);border:1.5px solid #3A2A1C;position:relative;color:#FFF8E6;font-size:18px;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.pot::before{content:"";position:absolute;top:-9px;left:50%;width:14px;height:10px;margin-left:-7px;background:#8A6A44;border:1.5px solid #3A2A1C;border-radius:2px}
.pot[style*="#EDE6D6"]{color:#7A6A50;text-shadow:none}
.slot{width:56px;height:66px;display:inline-grid;place-items:center;border-radius:6px;border:1.5px dashed #B39C70;background:#FBF6E8;padding:0;cursor:pointer}
.slot.empty{cursor:default}
.palette{display:flex;gap:10px;flex-wrap:wrap}
.pbtn{width:64px;height:74px;border-radius:8px;border:1.5px solid var(--edge);background:#FBF6E8;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #C2AA7A;padding:0}
.pbtn[disabled]{opacity:.35;cursor:default}
.peds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ped{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:250px;padding:10px 4px 36px;border-radius:6px;border:1.5px solid var(--edge);background:#FBF6E8;cursor:pointer}
.ped.sel{border-color:var(--rust);box-shadow:0 0 0 3px rgba(154,78,44,.25)}
.ped::before{content:"";position:absolute;bottom:36px;top:24px;left:50%;width:8px;margin-left:-4px;background:#8A6A44;border-radius:4px}
.ped .stack{position:relative;display:flex;flex-direction:column-reverse;align-items:center;width:100%;gap:3px}
.disk{display:block;height:22px;width:var(--w);border-radius:11px;background:linear-gradient(180deg,#F8DA8A,#D9A23A 60%,#A6782A);border:1.5px solid #6E4C14;box-shadow:0 0 8px rgba(242,196,99,.5);transition:transform .15s}
.disk.lift{transform:translateY(-22px)}
.ped .base{position:absolute;left:8%;right:8%;bottom:28px;height:10px;border-radius:4px;background:#6E6656}
.ped .pnum{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--display);font-size:15px;color:var(--ink-soft)}

/* --- clue grids --- */
.picker{display:flex;gap:8px;flex-wrap:wrap}
.picker button{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--frame);background:var(--chip);color:var(--chip-text);font-family:var(--display);font-size:19px;cursor:pointer}
.picker button[aria-current="true"]{border:2.5px solid var(--glow);box-shadow:0 0 0 3px rgba(232,185,90,.3)}
.picker button.solved{background:radial-gradient(circle at 40% 36%,#FFF8E6 0,#F6CE75 45%,#C98A36 100%);color:#2A1D12;border-color:#B07A2A}
.cluebox{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.story{margin:0;font-family:var(--italic);font-style:italic;color:var(--ink-soft);font-size:19px}
.clues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;counter-reset:c}
.clues li{counter-increment:c;display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:4px;cursor:pointer;user-select:none;-webkit-user-select:none}
.clues li::before{content:counter(c);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--sheet);font-family:var(--display);font-size:16px;margin-top:1px}
.clues li.used{color:#A39276;text-decoration:line-through;text-decoration-thickness:1.5px}
.clues li.used::before{background:#B9A57E}
.clues li.flash{background:var(--hl)}
.gridwrap{overflow-x:auto;padding:16px;-webkit-overflow-scrolling:touch}
.lg{display:grid;gap:0;width:max-content;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.lg .colhead{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:flex-start;padding:6px 0;font-weight:700;font-size:15px;line-height:1.05;white-space:nowrap;color:var(--ink)}
.lg .rowhead{display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-weight:700;font-size:15px;white-space:nowrap;color:var(--ink)}
.lg .cathead{font-family:var(--display);font-size:15px;letter-spacing:1px;color:var(--rust-deep);display:flex;align-items:center;justify-content:center;text-align:center}
.lg .cathead.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.cell{width:var(--cs);height:var(--cs);border:1px solid #BCA678;background:#FBF6E8;display:grid;place-items:center;cursor:pointer;padding:0;font-size:calc(var(--cs) * .55);font-weight:800;line-height:1;color:var(--ink)}
.cell.x{color:var(--rust)}
.cell.x.auto{color:#CDAE98}
.cell.o{background:#F8EBC8}
.cell.o::after{content:"";width:58%;height:58%;border-radius:50%;background:radial-gradient(circle at 38% 35%,#FFF8E6,#F6CE75 45%,#C98A36);box-shadow:0 0 8px rgba(232,185,90,.9)}
.cell.bad{outline:3px solid var(--miss);outline-offset:-3px;animation:wiggle .4s}
.cell.bl{border-left:2.5px solid var(--ink)}
.cell.bt{border-top:2.5px solid var(--ink)}
.cell.br{border-right:2.5px solid var(--ink)}
.cell.bb{border-bottom:2.5px solid var(--ink)}
.answers{width:100%;border-collapse:collapse;font-size:17px;color:var(--ink)}
.answers th,.answers td{padding:8px 10px;border-bottom:1px solid #CDB88C;text-align:left}
.answers th{font-family:var(--display);font-size:15px;letter-spacing:1px;color:var(--rust-deep);font-weight:400}
.answers td.blank{color:#B9A57E}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{--cs:26px;cursor:default}
.toggle{display:inline-flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;font-weight:700;background:none;border:0;padding:0;color:var(--text);font-size:17px}
.toggle .sw{width:54px;height:32px;border-radius:999px;background:var(--chip);border:1.5px solid var(--frame);position:relative;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle[aria-checked="true"] .sw{background:var(--moss)}
.toggle[aria-checked="true"] .sw::after{left:25px;background:#F4EEDD}

/* --- rebus --- */
.rcard{padding:22px;display:flex;flex-direction:column;gap:18px;align-items:center}
.rcard .label{align-self:flex-start}
.rb{min-height:200px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 10px;border-radius:3px;background:#FBF6E8;border:1.5px dashed #C2AA7A;
  font-family:'IM Fell English',Georgia,serif;font-size:clamp(32px,6.4vw,56px);letter-spacing:3px;line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
.rb .stk{display:inline-flex;flex-direction:column;align-items:center;gap:6px;vertical-align:middle}
.rb .ln{display:block;width:110%;height:3px;background:var(--ink);border-radius:2px}
.rb .big{font-size:1.9em;letter-spacing:4px}
.rb .tiny{font-size:.42em;letter-spacing:1px}
.rb .thin{font-family:var(--body);font-size:.9em;letter-spacing:10px;transform:scaleX(1.25) scaleY(.55);display:inline-block}
.rb .high{display:inline-block;transform:translateY(-58px);font-size:.8em}
.rb .high2{transform:translateY(-14px)}
.rb .low2{transform:translateY(14px)}
.rb .box{display:inline-block;border:4px solid var(--ink);padding:10px 18px;border-radius:2px}
.rb .spread{letter-spacing:6px}
.rb .fall{display:inline-block;line-height:.95;font-size:.9em;transform:skewX(-8deg)}
.qa{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.qa{grid-template-columns:minmax(0,1fr)}}
.choice{min-height:64px;padding:10px 16px;border-radius:4px;border:1.5px solid var(--edge);background:#FBF6E8;color:var(--ink);font-family:var(--body);font-weight:700;font-size:20px;cursor:pointer;text-align:center;box-shadow:0 3px 0 #C2AA7A;touch-action:manipulation}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 #C2AA7A}
.choice.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.choice.no{opacity:.45;text-decoration:line-through}
.why{width:100%;padding:12px 16px;border-radius:4px;background:#FBF4E0;border:1.5px solid var(--good);font-size:18px;color:var(--ink)}
.why b{font-family:var(--display);font-weight:400;font-size:20px}


/* picture-riddle color, texture and lettering */
.rb .rbi{display:inline-block;white-space:nowrap;transform-origin:center}
.rb .lt{display:inline-block}
.rb .c-black{color:#1A1410}.rb .c-red{color:#B3261E}.rb .c-green{color:#2E7D32}.rb .c-blue{color:#1F5FA8}.rb .c-pink{color:#D9578F}.rb .c-rose{color:#C9566F}
.rb .c-gold{background:linear-gradient(180deg,#F6D27A,#B8862B 65%,#8A5E14);-webkit-background-clip:text;background-clip:text;color:transparent}
.rb .c-silver{background:linear-gradient(180deg,#F4F7F9,#9AA4AC 55%,#5E6870);-webkit-background-clip:text;background-clip:text;color:transparent}
.rb .c-white{color:#FFFFFF;-webkit-text-stroke:1.5px #3A2A1C;paint-order:stroke fill}
.rb .fx-it{font-style:italic;font-size:.78em}
.rb .fx-blur{filter:blur(2.4px)}
.rb .fx-pale{opacity:.25}
.rb .fx-upside{display:inline-block;transform:rotate(180deg)}
.rb .fx-mirror{display:inline-block;transform:scaleX(-1)}
.rb .fx-shadow{text-shadow:12px 10px 0 rgba(58,42,28,.3)}
.rb .fx-glow{color:#8A5A10;text-shadow:0 0 8px #F6CE75,0 0 18px #F6CE75,0 0 30px #F2C063}
.rb .spk{color:#C9963A;font-size:.55em;vertical-align:super;margin:0 .1em}.rb .spk.s2{vertical-align:sub}
.rb .fx-strike{text-decoration:line-through;text-decoration-thickness:.12em;text-decoration-color:#B3261E}
.rb .fx-frost{color:#4F8DB3;text-shadow:0 0 4px #FFFFFF,0 0 10px #CFEAFF}
.rb .fx-fire{background:linear-gradient(0deg,#A8261C,#E8701E 55%,#F6C860);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(232,112,30,.6))}
.rb .fx-stretch{display:inline-block;transform:scaleX(1.9)}
.rb .fx-lean{display:inline-block;transform:rotate(-13deg);transform-origin:left bottom}
.rb .fx-old{font-family:'UnifrakturMaguntia','IM Fell English',Georgia,serif;letter-spacing:1px;color:#5A3A1E;text-shadow:1px 1px 0 rgba(120,80,30,.25)}
.rb .fx-hollow{color:transparent;-webkit-text-stroke:2px #3A2A1C}
.rb .fx-bold{font-family:var(--body);font-weight:800;font-size:1.25em;letter-spacing:1px}
.rb .hid{position:relative;display:inline-block}
.rb .hid::after{content:"";position:absolute;left:46%;top:-10%;width:60%;height:120%;background:linear-gradient(135deg,#7E8C5A,#5E6F45);border-radius:40% 8px 40% 8px;transform:rotate(5deg);box-shadow:0 4px 8px rgba(0,0,0,.25)}
.rb .bluebox{display:inline-block;width:1.1em;height:1.1em;background:#1F5FA8;border:3px solid #3A2A1C;vertical-align:middle;border-radius:3px}
.rb .cd{font-size:.42em;letter-spacing:1px;color:var(--ink-soft)}
.rb .lt.shake{animation:shk .45s ease-in-out infinite alternate}
@keyframes shk{to{translate:0 2px}}
.rb .crack{position:relative;display:inline-block}
.rb .crack .t{display:inline-block;clip-path:polygon(0 0,100% 0,100% 44%,84% 56%,66% 42%,50% 58%,34% 43%,16% 57%,0 46%)}
.rb .crack .b{position:absolute;left:0;top:0;clip-path:polygon(0 46%,16% 57%,34% 43%,50% 58%,66% 42%,84% 56%,100% 44%,100% 100%,0 100%);transform:translate(5px,8px) rotate(3deg)}
.scroll-list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.scroll-list li{padding:10px 4px;border-bottom:1px solid #D7C49A;font-size:17px}
.scroll-list li b{display:block;font-family:var(--display);font-weight:400;font-size:21px;color:var(--rust-deep)}

/* --- rhymes --- */
.hcard{padding:22px;display:flex;flex-direction:column;gap:16px}
.kind{display:inline-flex;align-self:flex-start;align-items:center;padding:3px 14px;border-radius:999px;background:var(--moss);color:#F4EEDD;font-family:var(--display);font-size:16px;letter-spacing:1px}
.hclue{font-family:var(--italic);font-size:clamp(28px,4.6vw,40px);line-height:1.2;color:var(--ink)}
.slots{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.slot{display:flex;flex-direction:column;gap:6px}
.slot input{width:calc(var(--len) * 1.15em + 40px);max-width:100%;min-width:120px;min-height:62px;padding:0 14px;border-radius:4px;border:1.5px solid var(--edge);background:#FFFBF0;color:var(--ink);
  font-family:var(--italic);font-size:30px;letter-spacing:3px;text-transform:lowercase}
.slot input.right{border-color:var(--good);background:var(--good-soft)}
.slot small{font-size:15px;color:var(--ink-soft);font-weight:700}
.tip{padding:14px 18px;border-radius:4px;background:var(--chip);color:var(--chip-text);border:1px solid var(--frame);font-size:17px}

.finish{padding:28px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.finish h2{font-size:36px;color:var(--ink)}
.burst{display:flex;gap:10px}
.burst i{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 36%,#FFF8E6 0,#F6CE75 40%,#C98A36 100%);box-shadow:0 0 18px rgba(232,185,90,.9);animation:pop .6s both}
.sect{font-family:var(--display);font-size:22px;color:var(--text);border-bottom:1.5px solid var(--frame);padding-bottom:6px}
.crew{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media (max-width:880px){.crew{grid-template-columns:repeat(3,minmax(0,1fr))}}
.crew figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.crew .ava{width:100%;max-width:120px;height:auto;aspect-ratio:240/280}
.crew figcaption{font-size:15px;line-height:1.25;color:var(--ink-soft)}
.crew figcaption b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
</style>

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
const SFX={
  tap(){if(S.sound)tone(1320,0,.08,'triangle',.06)},

};

/* item formats — fill: [d, color, strokeW(0=none), clipId, tag]   line: [d, width, color, tag]
   tag 'm' = resting mouth (swapped for ch.smile when happy), 'p' = pupil (glances up when thinking) */
function sketch(ch,mood){
  if(ch.v2)return sketch2(ch,mood);
  const happy=mood==='cheer'||mood==='encourage';
  const F=ch.fills.filter(f=>!(happy&&f[4]==='m')).concat(happy?(ch.smile.fills||[]):[]);
  const L=(ch.lines||[]).filter(l=>!(happy&&l[3]==='m')).concat(happy?(ch.smile.lines||[]):[]);
  const look=mood==='think'?(ch.look||'translate(-1.1 -1.3)'):'';
  const fill=f=>`<path d="${f[0]}" fill="${f[1]}"${f[3]?` clip-path="url(#${f[3]})"`:''}${f[4]==='p'&&look?` transform="${look}"`:''}/>`;
  const outl=F.filter(f=>f[2]!==0&&!f[3]).map(f=>`<path d="${f[0]}" stroke-width="${f[2]||1.4}"/>`).join('');
  const lines=L.map(l=>`<path d="${l[0]}" stroke-width="${l[1]||1.1}"${l[2]?` stroke="${l[2]}"`:''}/>`).join('');
  let extra='';
  if(mood==='cheer')extra=(ch.sparks||[[200,50],[42,70]]).map(([x,y],i)=>spark(x,y,i?6:8,'#F2C463')).join('');
  if(mood==='think'){const [x,y]=ch.thought||[196,60];extra=`<circle cx="${x}" cy="${y}" r="14" fill="url(#orbg)"/><circle cx="${x}" cy="${y}" r="3.2" fill="#FFF8E6"/><circle cx="${x-14}" cy="${y+18}" r="7" fill="url(#orbg)"/><circle cx="${x-22}" cy="${y+30}" r="4" fill="url(#orbg)"/>`}
  return `<g transform="${ch.tf||''}"><g filter="url(#wash)" opacity=".95">${F.map(fill).join('')}</g>${ch.raw||''}
   <g fill="url(#hatch)" opacity=".2" filter="url(#soft)">${(ch.shade||[]).map(d=>`<path d="${d}"/>`).join('')}</g>
   <g fill="none" stroke="${INK}" stroke-linecap="round" stroke-linejoin="round" filter="url(#pencil)">${outl}${lines}</g>
   <g fill="none" stroke="${INK}" stroke-linecap="round" stroke-linejoin="round" opacity=".12" filter="url(#soft)" transform="translate(.6 .5)">${outl}${lines}</g>${ch.top||''}</g>${extra}`;
}


/* v2: connected forms. Fills carry no outlines; shading is soft and blended; lines only where an edge is really visible. */
function sketch2(ch,mood){
  const happy=mood==='cheer'||mood==='encourage';
  const look=mood==='think'?(ch.look||'translate(-1.1 -1.3)'):'';
  const F=ch.fills.filter(f=>!(happy&&f[2]==='m')).concat(happy?(ch.smile.fills||[]):[]);
  const L=ch.lines.filter(l=>!(happy&&l[3]==='m')).concat(happy?(ch.smile.lines||[]):[]);
  const fill=f=>`<path d="${f[0]}" fill="${f[1]}" stroke="${f[1]}" stroke-width="${f[2]==='p'?0:1.6}"${f[2]==='p'&&look?` transform="${look}"`:''}/>`;
  const soft=(ch.soft||[]).map(s=>`<path d="${s[0]}" fill="${s[1]}" opacity="${s[2]}"/>`).join('');
  const line=l=>`<path d="${l[0]}" stroke-width="${l[1]||1.1}" stroke="${l[2]||INK}"${l[3]==='p'&&look?` transform="${look}"`:''}/>`;
  let extra='';
  if(mood==='cheer')extra=(ch.sparks||[[200,50],[42,70]]).map(([x,y],i)=>spark(x,y,i?6:8,'#F2C463')).join('');
  if(mood==='think'){const [x,y]=ch.thought||[196,60];extra=`<circle cx="${x}" cy="${y}" r="14" fill="url(#orbg)"/><circle cx="${x}" cy="${y}" r="3.2" fill="#FFF8E6"/><circle cx="${x-14}" cy="${y+18}" r="7" fill="url(#orbg)"/><circle cx="${x-22}" cy="${y+30}" r="4" fill="url(#orbg)"/>`}
  return `<g transform="${ch.tf||''}">${ch.back||''}<g filter="url(#wash)">${F.map(fill).join('')}</g>
   <g filter="url(#blur3)">${soft}</g>${ch.mid||''}
   <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#pencil)">${L.map(line).join('')}</g>${ch.top||''}</g>${extra}`;
}

function portraitURL(id,mood){

function hill(pts,y0=300){let d=`M0 ${y0} L0 ${pts[0]}`;const n=pts.length-1;for(let i=0;i<n;i++){const x1=600*i/n,x2=600*(i+1)/n,xm=(x1+x2)/2;d+=` C${xm} ${pts[i]} ${xm} ${pts[i+1]} ${x2} ${pts[i+1]}`}return d+` L600 ${y0}Z`}

const sorb=(x,y,r,g)=>`<circle cx="${x}" cy="${y}" r="${r*3.2}" fill="url(#${g})" opacity=".95"/><circle cx="${x}" cy="${y}" r="${r*.7}" fill="#FFFBEF"/>`;

const SCACHE={};
function sceneURL(night,mark){const k=(night?'n':'d')+mark;if(SCACHE[k])return SCACHE[k];const s=scene(night,mark);

function bridgeSVG(n,good){

function startFallacy(){

  else{const keys=L===0?['name','band','two','slope','after','few','circle','herring']:Object.keys(L2D.flaws);list=flawed.filter(a=>keys.includes(a.f)).slice(0,8)}
  FB={L,list,i:0,first:0,good:[]};
  say(['Hrrm, hello! To cross my bridge, find the <b>crack</b> in each argument. Each one you find lays a plank.','Some of my arguments sound smart. But look for the crack: what is wrong with the <b>reasoning</b>?','Careful now. Some of my arguments are perfectly <b>sound</b>. Only call a crack when there really is one!'][L],'hero');

    <div id="fbwhy" hidden></div></div>
   <div class="row"><button class="btn" id="fbnext" hidden>Next argument</button><button class="btn ghost" id="fbguide">Flaw Field Guide (${(S.best['fl:seen']||[]).length})</button></div>`;

function answerFallacy(b){

    say(b.dataset.k==='sound'?'Look again. Is there a reason that does not really hold up?':(q.f==='sound'?'Hmm, is that crack really there? Read it once more.':'Not that crack. Read the argument again slowly.'),'encourage');return}

/* --- Last Gem (Nim): take 1-3 gems; whoever takes the last gem wins --- */
const NIM={N:[10,15,21],smart:[.25,.65,1]};
function nimBest(n){return n%4}            // 0 means no winning move
function emberTake(n,L){const best=nimBest(n);if(best&&Math.random()<NIM.smart[L])return best;return Math.min(n,1+Math.floor(Math.random()*3))}
function startNim(){
  const L=S.lv.games;DG.nim={n:NIM.N[L],total:NIM.N[L],turn:'you',log:[],taken:[]};
  say(['Hello, small friend. Let us play <b>Last Gem</b>. We take turns taking 1, 2 or 3 gems. Whoever takes the <b>last</b> gem wins.','I am a cleverer player now. Think about what you leave for me.','I play my very best now. There is a secret to winning. Can you find it?'][L],'hero');

}
function drawNim(){

  $('#stage').innerHTML=`${gameTabs()}<div class="parch nim">
   <div class="label">Last Gem · ${s.n} gem${s.n===1?'':'s'} left</div>

   <div class="row">${[1,2,3].map(k=>`<button class="btn take" data-k="${k}" ${s.turn!=='you'||k>s.n?'disabled':''}>Take ${k}</button>`).join('')}</div>

   ${(S.best['g:nim']||0)>=1||s.lost?`<div class="tip"><b>Ember's secret:</b> <button class="btn ghost" id="nimsecret" style="min-height:44px;font-size:17px">Show me the trick</button><span id="secret" hidden> Leave Ember a number of gems that is a multiple of 4 (4, 8, 12, 16, 20). Then whatever Ember takes, you can take enough to make 4 together, and you'll get the last gem!</span></div>`:''}`;
  document.querySelectorAll('.take').forEach(b=>b.onclick=()=>nimMove(+b.dataset.k));
  const sb=$('#nimsecret');if(sb)sb.onclick=()=>{$('#secret').hidden=false;sb.hidden=true};

function nimTake(who,k){const s=DG.nim;for(let i=0;i<k;i++)s.taken[s.total-s.n+i]=who;s.n-=k}
function nimMove(k){
  const s=DG.nim;if(s.turn!=='you'||k>s.n)return;
  nimTake('y',k);SFX.mark();s.log.push(`You took ${k}. ${s.n} left.`);

/* --- Potion Code (Mastermind) --- */
const POTIONS=[['#B3261E','▲','red'],['#1F5FA8','●','blue'],['#2E7D32','■','green'],['#D9A23A','✦','gold'],['#7A4FA8','☾','violet'],['#EDE6D6','❀','white']];
const CODE=[{slots:3,colors:4,rep:false,tries:8},{slots:4,colors:6,rep:false,tries:10},{slots:4,colors:6,rep:true,tries:10}];
function scoreCode(secret,guess){let gold=0,silver=0;const a=[],b=[];secret.forEach((c,i)=>{if(guess[i]===c)gold++;else{a.push(c);b.push(guess[i])}});
  b.forEach(c=>{const j=a.indexOf(c);if(j>=0){silver++;a.splice(j,1)}});return [gold,silver]}
function startCode(){
  const L=S.lv.games,c=CODE[L];let secret=[];
  if(c.rep)for(let i=0;i<c.slots;i++)secret.push(Math.floor(Math.random()*c.colors));

  DG.code={c,secret,rows:[],cur:[],done:false};
  say([`I have brewed a secret potion row: <b>${c.slots}</b> potions${c.rep?', and a color may repeat':', all different'}. Guess it! A <b>gold</b> dot means a right potion in the right spot. A <b>silver</b> dot means a right potion in the wrong spot.`,'Four potions now, from six colors. Use each clue to rule things out, like Sherlock does!','Elder level: a color can appear more than once. Think carefully about what each dot tells you.'][L],'hero');

}
function potion(i,extra=''){const p=POTIONS[i];return `<span class="pot ${extra}" style="--pc:${p[0]}"><span>${p[1]}</span></span>`}
function drawCode(){

function brew(){
  const s=DG.code,c=s.c;if(s.cur.length<c.slots)return;
  const sc=scoreCode(s.secret,s.cur);s.rows.push({g:s.cur.slice(),s:sc});s.cur=[];
  if(sc[0]===c.slots){s.done=true;drawCode();const earned=1+S.lv.games+(s.rows.length<=Math.ceil(c.tries/2)?1:0);$('#codeend').innerHTML=winGame('code',earned,`You cracked my potion code in ${s.rows.length} guess${s.rows.length>1?'es':''}!`);$('#gagain').onclick=()=>{SFX.tap();startCode()};return}

/* --- Tower of Treasure (Towers of Hanoi) --- */
function startTower(){
  const L=S.lv.games,n=[3,4,5][L];
  DG.tw={n,p:[[...Array(n).keys()].map(i=>n-i),[],[]],held:null,moves:0,done:false};
  say(['Help me move my treasure stack to the <b>last pedestal</b>. Move one piece at a time, and never put a bigger piece on a smaller one.','Four pieces now. Plan ahead! Where does the smallest piece need to go first?',`Five pieces. The fewest possible moves is ${2**n-1}. Can you match it?`][L],'hero');
  drawTower();
}
function drawTower(){
  const s=DG.tw,best=2**s.n-1;
  $('#stage').innerHTML=`${gameTabs()}<div class="parch tower"><div class="label">Tower of Treasure · moves: ${s.moves} · fewest possible: ${best}</div>
   <div class="peds">${s.p.map((stack,i)=>`<button class="ped ${s.held&&s.held.from===i?'sel':''}" data-p="${i}" aria-label="Pedestal ${i+1}, ${stack.length} pieces">
     <span class="stack">${stack.map((d,j)=>`<i class="disk ${s.held&&s.held.from===i&&j===stack.length-1?'lift':''}" style="--w:${30+d*(70/s.n)}%"></i>`).join('')}</span><span class="base"></span><span class="pnum">${['Start','Middle','Goal'][i]}</span></button>`).join('')}</div>
   <p class="nimlog" aria-live="polite">${s.held?'Now tap where to put it.':'Tap a pedestal to pick up its top piece.'}</p>
   <div class="row"><button class="btn ghost" id="twreset">Start over</button></div></div><div id="twend"></div>`;
  document.querySelectorAll('.ped').forEach(b=>b.onclick=()=>towerTap(+b.dataset.p));
  $('#twreset').onclick=()=>{SFX.tap();startTower()};
  document.querySelectorAll('.gtab').forEach(t=>t.onclick=()=>{SFX.tap();openGame(t.dataset.g)});
}
function towerTap(i){
  const s=DG.tw;if(s.done)return;
  if(!s.held){if(!s.p[i].length)return;s.held={from:i};SFX.tap();return drawTower()}
  const from=s.held.from;if(from===i){s.held=null;return drawTower()}
  const d=s.p[from][s.p[from].length-1],top=s.p[i][s.p[i].length-1];
  if(top!==undefined&&top<d){SFX.wrong();say('Careful! A bigger piece can never sit on a smaller one.','encourage');s.held=null;drawTower();const el=document.querySelectorAll('.ped')[i];el.classList.add('wiggle');return}
  s.p[from].pop();s.p[i].push(d);s.held=null;s.moves++;SFX.mark();
  if(s.p[2].length===s.n){s.done=true;drawTower();const best=2**s.n-1;const earned=1+S.lv.games+(s.moves===best?1:0);
    $('#twend').innerHTML=winGame('tower',earned,s.moves===best?`Perfect! ${s.moves} moves, the fewest possible.`:`You moved my whole hoard in ${s.moves} moves. The fewest possible is ${best}. Can you match it?`);$('#gagain').onclick=()=>{SFX.tap();startTower()};return}
  drawTower();
}

let G=null; // {L,P,idx,marks,used,hints}
function gridZone(){

const gkey=(L,i)=>`g${L}-${i}`;
function firstUnsolved(L){const n=GRIDS[L].puzzles.length;for(let i=0;i<n;i++)if(!S.solved[gkey(L,i)])return i;return 0}
function openPuzzle(i){

   <div class="row"><button class="btn" id="check">Check my answer</button><button class="btn ghost" id="hint">Spyglass hint</button><button class="btn ghost" id="clear">Clear grid</button>
    <button class="toggle" id="autox" role="switch" aria-checked="${G.auto}"><span class="sw"></span>Auto ✗</button></div>

  $('#check').onclick=checkGrid;$('#hint').onclick=hintGrid;

  $('#autox').onclick=e=>{G.auto=!G.auto;S.prog.autoX=G.auto;save();e.currentTarget.setAttribute('aria-checked',G.auto)};

}
function persist(){S.prog[gkey(G.L,G.idx)]={marks:G.marks,used:G.used,hints:G.hints};save()}
// grid layout: column categories 1..k-1; row categories 0, k-1, k-2, ..., 2
function layout(){const k=G.P.cats.length;const cols=[];for(let c=1;c<k;c++)cols.push(c);const rows=[0];for(let c=k-1;c>=2;c--)rows.push(c);return {cols,rows}}
const mk=(a,i,b,j)=>a<b?`${a}.${i}.${b}.${j}`:`${b}.${j}.${a}.${i}`;
function truth(a,i,b,j){return G.owner[a][i]===G.owner[b][j]}
function drawGrid(){
  const P=G.P,n=P.n,{cols,rows}=layout();
  const cs=n===5?40:44;
  const C=cols.length;
  // CSS grid: [cathead col][rowhead col][cells...]; header rows: [cathead row][colhead row]
  const tmpl=`28px max-content repeat(${C*n},var(--cs))`;
  let h='';
  // row 1: category headers above columns
  h+=`<div style="grid-row:1;grid-column:1 / 3"></div>`;
  cols.forEach((c,ci)=>h+=`<div class="cathead" style="grid-row:1;grid-column:${3+ci*n} / span ${n};padding-bottom:4px">${esc(P.cats[c].label)}</div>`);
  // row 2: item headers
  cols.forEach((c,ci)=>P.cats[c].items.forEach((it,j)=>h+=`<div class="colhead" style="grid-row:2;grid-column:${3+ci*n+j}">${esc(it)}</div>`));
  rows.forEach((r,ri)=>{
    const top=3+ri*n;
    h+=`<div class="cathead v" style="grid-column:1;grid-row:${top} / span ${n}">${esc(P.cats[r].label)}</div>`;
    P.cats[r].items.forEach((it,i)=>{
      h+=`<div class="rowhead" style="grid-column:2;grid-row:${top+i}">${esc(it)}</div>`;
      const nblocks=C-ri;
      for(let ci=0;ci<nblocks;ci++){const c=cols[ci];
        for(let j=0;j<n;j++){
          const key=mk(r,i,c,j),v=G.marks[key]||'';
          const cls=['cell'];if(v==='x'||v==='ax')cls.push('x');if(v==='ax')cls.push('auto');if(v==='o')cls.push('o');
          if(j===0)cls.push('bl');if(i===0)cls.push('bt');if(j===n-1)cls.push('br');if(i===n-1)cls.push('bb');
          h+=`<button class="${cls.join(' ')}" style="grid-column:${3+ci*n+j};grid-row:${top+i}" data-k="${key}" aria-label="${esc(it)} and ${esc(P.cats[c].items[j])}: ${v==='o'?'yes':v?'no':'blank'}">${v==='x'||v==='ax'?'✗':''}</button>`;
        }}
    });
  });
  const el=$('#lg');el.className='lg';el.style.setProperty('--cs',cs+'px');el.style.gridTemplateColumns=tmpl;
  el.style.gridTemplateRows=`auto auto repeat(${rows.length*n},var(--cs))`;
  el.innerHTML=h;
  el.querySelectorAll('.cell').forEach(b=>b.onclick=()=>tapCell(b.dataset.k));
  drawAnswers();
}
function tapCell(key){
  const v=G.marks[key]||'';
  const [a,i,b,j]=key.split('.').map(Number);
  let nv=v===''?'x':v==='ax'?'x':v==='x'?'o':'';
  if(v==='o'){// removing a yes: clear its auto ✗s
    clearAuto(a,i,b,j);
  }
  if(nv)G.marks[key]=nv;else delete G.marks[key];
  if(nv==='o'&&G.auto){for(let t=0;t<G.P.n;t++){if(t!==j){const k2=mk(a,i,b,t);if(!G.marks[k2])G.marks[k2]='ax'}if(t!==i){const k3=mk(a,t,b,j);if(!G.marks[k3])G.marks[k3]='ax'}}}
  SFX.mark();persist();drawGrid();
}
function clearAuto(a,i,b,j){for(let t=0;t<G.P.n;t++){const k2=mk(a,i,b,t),k3=mk(a,t,b,j);if(G.marks[k2]==='ax'&&!stillForced(k2,mk(a,i,b,j)))delete G.marks[k2];if(G.marks[k3]==='ax'&&!stillForced(k3,mk(a,i,b,j)))delete G.marks[k3]}}
function stillForced(k,except){// an auto ✗ stays if another yes in its row/col forces it
  const [a,i,b,j]=k.split('.').map(Number);
  for(let t=0;t<G.P.n;t++){const r=mk(a,i,b,t),c=mk(a,t,b,j);if(r!==except&&G.marks[r]==='o')return true;if(c!==except&&G.marks[c]==='o')return true}return false}
function drawAnswers(){
  const P=G.P,n=P.n;
  let h=`<table class="answers"><thead><tr>${P.cats.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>`;
  for(let i=0;i<n;i++){h+=`<tr><td><b>${esc(P.cats[0].items[i])}</b></td>`;
    for(let c=1;c<P.cats.length;c++){let f='';for(let j=0;j<n;j++)if(G.marks[mk(0,i,c,j)]==='o')f=P.cats[c].items[j];h+=f?`<td>${esc(f)}</td>`:`<td class="blank">?</td>`}
    h+='</tr>'}
  $('#ans').innerHTML=h+'</tbody></table>';
}
function wrongMarks(){const out=[];for(const k in G.marks){const [a,i,b,j]=k.split('.').map(Number);const t=truth(a,i,b,j),v=G.marks[k];if((v==='o'&&!t)||((v==='x'||v==='ax')&&t))out.push(k)}return out}
function checkGrid(){
  const P=G.P,n=P.n;let filled=0;
  for(let i=0;i<n;i++)for(let c=1;c<P.cats.length;c++)for(let j=0;j<n;j++)if(G.marks[mk(0,i,c,j)]==='o')filled++;
  const need=n*(P.cats.length-1),wrong=wrongMarks();
  if(filled<need&&!wrong.length){SFX.tap();say(`So far, so good: no mistakes yet! Keep going. You still need ${need-filled} more light orb${need-filled>1?'s':''} in the <b>${esc(P.cats[0].label)}</b> rows.`,'encourage');return}
  if(wrong.length){SFX.wrong();say(`Hmm. ${wrong.length===1?'One mark doesn’t':`${wrong.length} marks don’t`} fit the clues. Use the <b>spyglass</b> to find ${wrong.length===1?'it':'one'}, or check each clue again.`,'think');$('#lg').classList.add('wiggle');setTimeout(()=>$('#lg')&&$('#lg').classList.remove('wiggle'),450);return}
  // solved
  const first=!S.solved[gkey(G.L,G.idx)];
  S.solved[gkey(G.L,G.idx)]=true;
  const earned=first?(1+(G.hints===0?1:0)+G.L):0;
  if(earned)addOrbs(earned);refreshOrbs();SFX.win();
  say(first?`Case closed! ${G.hints===0?'No hints at all. A true detective.':'Well reasoned.'} You earned <b>${earned} light orb${earned>1?'s':''}</b>.`:'Case closed again! Your logic holds.','cheer');
  document.querySelectorAll('.picker button')[G.idx].classList.add('solved');
  const nxt=firstUnsolved(G.L);
  const box=document.createElement('div');box.className='parch finish';
  box.innerHTML=`<h2>Case closed!</h2><div class="burst">${'<i></i>'.repeat(Math.max(1,earned))}</div>${nxt!==G.idx&&!S.solved[gkey(G.L,nxt)]?`<button class="btn" id="nextcase">Next case: #${nxt+1}</button>`:`<p style="margin:0">Every ${esc(GRIDS[G.L].level)} case is solved. Try the next level on the dial!</p>`}`;
  $('#stage').prepend(box);box.scrollIntoView({behavior:'smooth',block:'center'});
  const nb=$('#nextcase');if(nb)nb.onclick=()=>openPuzzle(nxt);
}
function hintGrid(){
  G.hints++;persist();SFX.tap();
  const wrong=wrongMarks();
  if(wrong.length){const k=wrong[0];const b=document.querySelector(`.cell[data-k="${k}"]`);if(b){b.classList.add('bad');b.scrollIntoView({behavior:'smooth',block:'center',inline:'center'})}
    say(`My spyglass sees a problem: the square circled in red is wrong. Tap it to change it.`,'think');return}
  // reveal one true pairing not yet marked: prefer the name rows
  const P=G.P,n=P.n;
  for(let c=1;c<P.cats.length;c++)for(let i=0;i<n;i++){const j=P.cats[c].items.indexOf(P.solution[P.cats[c].key][i]);const k=mk(0,i,c,j);
    if(G.marks[k]!=='o'){
      // find a clue that mentions both, to point at
      const nm=P.cats[0].items[i],it=P.cats[c].items[j];
      const ci=P.clues.findIndex(t=>t.includes(nm)&&t.includes(it));
      if(ci>=0&&!G.used.includes(ci)&&Math.random()<.6){const li=document.querySelector(`.clues li[data-c="${ci}"]`);li.classList.add('flash');setTimeout(()=>li.classList.remove('flash'),2200);say(`Look closely at <b>clue ${ci+1}</b>. What does it tell you for sure?`,'think');return}
      say(`My spyglass reveals: <b>${esc(nm)}</b>'s ${esc(P.cats[c].label.toLowerCase())} is <b>${esc(it)}</b>. Now, what does that rule out?`,'think');return}}
  say('Every answer is already in place. Press <b>Check my answer</b>!','encourage');
}

  $('#rhint').onclick=()=>{RB.hint=true;SFX.tap();say(`A hint: ${esc(r.hint)}`,'think')};
  $('#rscroll').onclick=()=>{SFX.tap();showScroll()};
  $('#rnext').onclick=()=>{RB.i++;SFX.tap();if(RB.i<RB.list.length)drawRebus();else finishRound('rebus',RB.first,RB.list.length,startRebus)};
}

function fitRebus(){const box=$('.rb'),el=$('.rbi');if(!box||!el)return;el.style.transform='';const w=box.clientWidth-28;const s=Math.min(1,w/el.scrollWidth);if(s<1)el.style.transform=`scale(${s.toFixed(3)})`}
window.addEventListener('resize',()=>{try{fitRebus()}catch(e){}});
function showScroll(){
  const seen=S.best['rb:seen']||[];
  const items=RID.rebus.filter(r=>seen.includes(r.a)).sort((a,b)=>a.a.replace(/^(a|an|the) /,'').localeCompare(b.a.replace(/^(a|an|the) /,'')));
  say(items.length?`You have collected <b>${items.length}</b> of ${RID.rebus.length} sayings. Every riddle you solve adds one to the scroll.`:'Your scroll is empty. Solve a riddle to add its saying!','hero');
  $('#stage').innerHTML=`<div class="parch" style="padding:20px 22px;display:flex;flex-direction:column;gap:12px"><div class="label">Saying Scroll · ${items.length} of ${RID.rebus.length}</div>
   ${items.length?`<ul class="scroll-list">${items.map(r=>`<li><b>${esc(r.a)}</b>${esc(r.why)}</li>`).join('')}</ul>`:'<p style="margin:0">No sayings yet.</p>'}
   <div class="row"><button class="btn" id="sback">Back to the riddles</button></div></div>`;
  $('#sback').onclick=()=>{SFX.tap();drawRebus()};
}
function answerRebus(b){
  const r=RB.list[RB.i];if(b.classList.contains('no')||!$('#rnext').hidden)return;
  if(b.dataset.o===r.a){
    b.classList.add('right','pop');SFX.right();
    if(!RB.miss)RB.first++;
    const seen=S.best['rb:seen']||[];if(!seen.includes(r.a)){seen.push(r.a);S.best['rb:seen']=seen;save()}
    const w=$('#why');w.hidden=false;w.className='why';w.innerHTML=`<b>${esc(r.a)}.</b> ${esc(r.why)}`;
    document.querySelectorAll('.choice').forEach(x=>{if(x!==b)x.disabled=true});
    $('#rnext').hidden=false;$('#rhint').hidden=true;
    say(pick(['Correct. You may pass… to the next riddle.','Well seen, clever one.','Yes! Your eyes are sharp.','Precisely. The Sphinx is impressed.']),'cheer');
  }else{
    RB.miss=true;b.classList.add('no','wiggle');SFX.wrong();
    say(`Not quite. Look again. ${esc(r.hint)}`,'encourage');
  }
}

/* ================= RHYMES ================= */
let RH=null;
const KINDS=['Hink Pink','Hinky Pinky','Hinkety Pinkety'];
const KDESC=['two rhyming words, each with 1 syllable','two rhyming words, each with 2 syllables','two rhyming words, each with 3 syllables'];
function rhymeZone(){
  $('#app').innerHTML=frame('rhyme',LEVELS.rhyme,S.lv.rhyme);
  bindFrame('rhyme',startRhyme);startRhyme();
}
function startRhyme(){
  const L=S.lv.rhyme;
  let list=shuffle(RID.rhymes.filter(h=>h.s===L+1));
  if(list.length<8)list=list.concat(shuffle(RID.rhymes.filter(h=>h.s===L)).slice(0,8-list.length));
  RH={L,list:list.slice(0,8),i:0,first:0};
  say(['Hoo! A <b>hink pink</b> is a riddle whose answer is two rhyming words. An obese feline? A <b>fat cat</b>!','A <b>hinky pinky</b> uses two-syllable words. A man dipped in mustard? A <b>yellow fellow</b>!','The <b>hinkety pinkety</b> is the hardest: three syllables each. Clap them out: go-ril-la, va-nil-la.'][L],'hero');
  drawRhyme();
}
function drawRhyme(){
  const h=RH.list[RH.i],[w1,w2]=h.a.split(' ');
  RH.miss=false;RH.hint=0;
  $('#stage').innerHTML=`<div class="dots">${RH.list.map((_,j)=>`<i class="${j<RH.i?'done':j===RH.i?'now':''}"></i>`).join('')}</div>
   <div class="parch hcard"><span class="kind">${KINDS[h.s-1]}</span>
    <div class="hclue">What do you call ${esc(h.clue)}?</div>
    <form class="slots" id="hform" autocomplete="off">
     <label class="slot"><small>${w1.length} letters</small><input id="h1" style="--len:${w1.length}" maxlength="${w1.length+2}" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="First word, ${w1.length} letters"></label>
     <label class="slot"><small>${w2.length} letters</small><input id="h2" style="--len:${w2.length}" maxlength="${w2.length+2}" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Second word, ${w2.length} letters"></label>
     <button class="btn" type="submit" id="hgo">Check</button>
    </form><div id="hwhy" hidden></div></div>
   <div class="row"><button class="btn ghost" id="hhint">Give me a letter</button><button class="btn ghost" id="hshow">Show me</button><button class="btn" id="hnext" hidden>Next riddle</button></div>
   <div class="tip"><b>${KINDS[h.s-1]}:</b> ${KDESC[h.s-1]}. Both words end with the same sound.</div>`;
  const i1=$('#h1'),i2=$('#h2');
  $('#hform').onsubmit=e=>{e.preventDefault();checkRhyme()};
  $('#hhint').onclick=()=>{RH.hint++;RH.miss=true;SFX.tap();
    if(RH.hint===1){i1.value=w1[0];i2.value=w2[0];say(`The first word starts with <b>${w1[0].toUpperCase()}</b> and the second with <b>${w2[0].toUpperCase()}</b>.`,'think');i1.focus()}
    else if(RH.hint===2){i1.value=w1;say(`The first word is <b>${esc(w1)}</b>. What rhymes with it?`,'think');i2.focus()}
    else{say('Try the second word yourself, or tap <b>Show me</b>.','encourage')}};
  $('#hshow').onclick=()=>{RH.miss=true;i1.value=w1;i2.value=w2;solvedRhyme(true)};
  $('#hnext').onclick=()=>{RH.i++;SFX.tap();if(RH.i<RH.list.length)drawRhyme();else finishRound('rhyme',RH.first,RH.list.length,startRhyme)};
  setTimeout(()=>{try{i1.focus({preventScroll:true})}catch(e){}},60);
}
function checkRhyme(){
  const h=RH.list[RH.i],[w1,w2]=h.a.split(' ');
  const ALT={bandanna:'bandana'};const norm=x=>ALT[x]||x;
  const a=norm($('#h1').value.trim().toLowerCase()),b=norm($('#h2').value.trim().toLowerCase());
  const HM=RID.homophones||{};const homo=(x,w)=>(HM[w]||[]).includes(x);
  if(!a||!b){say('Fill in both words first.','encourage');return}
  if(a===w1&&b===w2)return solvedRhyme(false);
  if((a===w1||homo(a,w1))&&(b===w2||homo(b,w2))){RH.miss=true;SFX.tap();say(`That <b>sounds</b> exactly right! But ${homo(a,w1)?`<b>${esc(a)}</b>`:`<b>${esc(b)}</b>`} is a homophone. Which spelling fits the clue?`,'think');return}
  RH.miss=true;SFX.wrong();
  const f=$('#hform');f.classList.add('wiggle');setTimeout(()=>f.classList.remove('wiggle'),450);
  if(a===w1)say(`<b>${esc(a)}</b> is right! Now find its rhyming partner.`,'encourage');
  else if(b===w2)say(`<b>${esc(b)}</b> is right! What rhymes with it and fits the clue?`,'encourage');
  else if(a.slice(-2)===b.slice(-2)&&a!==b)say('Those rhyme, nicely done, but they aren’t the words I’m thinking of. Check the letter counts.','think');
  else say('Not yet. Say the clue out loud, and think of two words that end with the same sound.','encourage');
}
function solvedRhyme(shown){
  const h=RH.list[RH.i];
  if(!RH.miss)RH.first++;
  $('#h1').classList.add('right');$('#h2').classList.add('right');$('#h1').disabled=$('#h2').disabled=true;
  $('#hgo').hidden=true;$('#hhint').hidden=true;$('#hshow').hidden=true;$('#hnext').hidden=false;
  const w=$('#hwhy');w.hidden=false;w.className='why';w.innerHTML=`<b>${esc(h.a)}</b>`;
  if(shown){SFX.tap();say(`It was <b>${esc(h.a)}</b>. Hoo! You'll catch the next one.`,'encourage')}
  else{SFX.right();say(pick(['Hoo-ray! That’s it!','Perfectly rhymed!','A wise owl would say the same.','Splendid! You have an ear for rhymes.']),'cheer')}
}

/* ---------- round finish ---------- */
function finishRound(zid,first,total,again){
  const earned=1+(first===total?2:first>=total-2?1:0);
  addOrbs(earned);SFX.win();
  const k='best:'+zid+':'+S.lv[zid];const prev=S.best[k]||0;if(first>prev){S.best[k]=first;save()}
  say(first===total?'A perfect round! Every riddle on the first try.':`${first} of ${total} on the first try. Splendid work.`,'cheer');
  $('#stage').innerHTML=`<div class="parch finish"><h2>${first===total?'Flawless!':'Round complete!'}</h2>
   <div class="burst">${'<i></i>'.repeat(earned)}</div>
   <p style="margin:0">You solved <b>${first} of ${total}</b> on the first try and earned <b>${earned} light orb${earned>1?'s':''}</b>.${first>prev&&prev?' That’s a new best!':''}</p>
   <div class="row" style="justify-content:center"><button class="btn" id="again">Another round</button><button class="btn ghost" id="home2">Back to the valley</button></div></div>`;
  refreshOrbs();
  $('#again').onclick=()=>{SFX.tap();again()};$('#home2').onclick=()=>{current=null;SFX.tap();render()};
}

render();
})();

</script>
