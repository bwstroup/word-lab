<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Observatory">
<meta name="theme-color" content="#2B2D5C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Everett's Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>:root{
  --indigo:#2B2D5C; --indigo-2:#34376b; --indigo-3:#3c3f78; --night:#1a1b3f; --deep:#15162e;
  --lav:#8A7FC7; --lav-d:#6f64ad; --cream:#F6EBD0; --peach:#F4A77A; --pine:#2F5D50; --pine-d:#24493f;
  --muted:#d9cfe9; --good:#7fd6a4; --ink:#1d2b33;
  --r:22px; --gap:clamp(10px,1.8vmin,18px);
  --title:'Fredoka','Avenir Next Rounded','Nunito',system-ui,sans-serif;
  --letter:'Andika','Avenir Next','Helvetica Neue',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--indigo);color:var(--cream);font-family:var(--letter);overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
img{-webkit-user-drag:none;user-select:none}
#app{min-height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ---------- loading ---------- */
.loading{align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px}
.loading .guide{width:min(220px,40vw)}
.loading .bignum{font-family:var(--title);font-weight:600;font-size:clamp(90px,22vmin,180px);line-height:1;color:var(--peach)}
.loading .dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px}
.loading .dots i{width:14px;height:14px;border-radius:50%;background:var(--indigo-3)}
.loading .dots i.on{background:var(--cream)}

/* ---------- home ---------- */
.home-hero{position:relative;height:clamp(180px,30vh,300px);overflow:hidden}
.home-hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.home-hero .title{position:absolute;left:clamp(16px,3vw,36px);top:clamp(14px,3vh,28px);font-family:var(--title);font-weight:600;font-size:clamp(28px,5.2vmin,52px);line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.home-hero .juniper{position:absolute;right:clamp(8px,4vw,60px);bottom:-6px;height:92%}
.topchips{position:absolute;right:clamp(12px,2vw,24px);top:clamp(12px,2vh,22px);display:flex;gap:10px;align-items:center}
.chip{background:rgba(21,22,46,.72);border-radius:999px;padding:8px 16px;font-family:var(--title);font-size:clamp(20px,3vmin,26px);display:flex;gap:8px;align-items:center}
.chip svg{width:1em;height:1em}
.iconbtn{width:52px;height:52px;border-radius:16px;background:rgba(21,22,46,.72);display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:28px;height:28px}
.rows{display:flex;flex-direction:column;gap:var(--gap);padding:var(--gap) clamp(12px,2.4vw,28px) calc(var(--gap) + 8px)}
.hostrow{display:flex;gap:var(--gap);align-items:stretch;background:var(--indigo-2);border-radius:var(--r);padding:10px}
.hostrow .host{flex:0 0 clamp(84px,12vw,130px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border-radius:16px;overflow:hidden}
.hostrow .host img{width:100%;display:block}
.tiles-row{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.gametile{border-radius:18px;background:var(--indigo-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;min-height:clamp(92px,14vmin,140px);transition:transform .15s}
.gametile:active{transform:scale(.96)}
.gametile .ico{width:clamp(52px,8vmin,78px);height:clamp(52px,8vmin,78px)}
.gametile .lbl{font-family:var(--title);font-size:clamp(14px,2vmin,19px);color:var(--muted);text-align:center;line-height:1.1}
.gametile.empty{background:transparent}

/* ---------- top bar in games ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:12px clamp(12px,2.4vw,28px)}
.bar .home{width:60px;height:60px;border-radius:18px;background:var(--lav);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bar .home svg{width:32px;height:32px}
.bar .face{width:64px;height:74px;border-radius:16px;overflow:hidden;flex:0 0 auto;background:var(--indigo-3)}
.bar .face img{width:100%;height:100%;object-fit:cover;object-position:top}
.bar .spacer{flex:1}
.levels{display:flex;gap:6px;background:var(--deep);border-radius:16px;padding:5px}
.levels button{min-width:58px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px}
.levels button i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.5}
.levels button.on{background:var(--peach)}
.levels button.on i{background:var(--indigo);opacity:1}
.progress{display:flex;gap:6px}
.progress i{width:14px;height:14px;border-radius:50%;background:var(--indigo-3)}
.progress i.on{background:var(--peach)}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap);padding:0 clamp(12px,2.4vw,28px) 20px}

/* ---------- pictures, tiles ---------- */
.pic{display:block;border-radius:18px;background:#05060f;object-fit:cover}
.card{position:relative;border-radius:18px;overflow:hidden;background:#05060f;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.num{position:absolute;left:8px;top:8px;min-width:34px;height:34px;padding:0 8px;border-radius:12px;background:rgba(43,45,92,.85);font-family:var(--title);font-size:20px;display:flex;align-items:center;justify-content:center}
.tiles{display:flex;gap:clamp(4px,.8vmin,8px);flex-wrap:wrap;justify-content:center}
.tile{min-width:clamp(40px,7vmin,64px);height:clamp(48px,8.4vmin,76px);padding:0 4px;border-radius:14px;background:var(--cream);color:var(--indigo);font-family:var(--letter);font-weight:700;font-size:clamp(28px,5.4vmin,50px);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tile.first{background:var(--peach)}
.tile.gap{background:transparent;box-shadow:none;min-width:16px}
.tiles.small .tile{min-width:30px;height:36px;font-size:24px;border-radius:9px}
.propername{font-family:var(--title);font-size:clamp(18px,2.8vmin,26px);color:var(--muted)}

/* ---------- explore ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(120px,17vmin,170px),1fr));gap:var(--gap);width:100%;padding:0 clamp(12px,2.4vw,28px) 24px}
.grid .card{aspect-ratio:1}
.orbit{--k:max(.68px,min(1.1px,calc((100vw - 80px) / 1380)));width:100%;overflow-x:auto;padding:10px clamp(12px,2.4vw,28px) 24px;flex:1;display:flex;align-items:center}
.orbit-inner{display:flex;align-items:flex-start;gap:clamp(6px,1.2vw,14px);min-width:max-content}
.orbit .col{display:flex;flex-direction:column;align-items:center;gap:10px}
.orbit .pl{position:relative;display:flex;align-items:center;justify-content:center}
.orbit .pl{width:calc(var(--k) * var(--s));height:calc(var(--k) * var(--s))}
.orbit .pl img{width:100%;height:100%}
.orbit .lbl{font-family:var(--title);font-size:20px;color:var(--muted)}
.orbit .moons{display:flex;flex-direction:column;gap:8px;align-items:center}
.orbit .moons button{width:calc(var(--k) * 78);height:calc(var(--k) * 78)}
.orbit .moons img{width:100%;height:100%}
.orbit .track{height:3px;background:linear-gradient(90deg,var(--peach),var(--lav));border-radius:2px;opacity:.5;align-self:stretch;margin:0 0 8px}

/* showcase */
.overlay{position:fixed;inset:0;background:rgba(14,15,34,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.show{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:900px;width:100%}
.show .card{width:min(62vmin,460px);aspect-ratio:1}
.show .num{font-size:28px;height:46px;min-width:46px;border-radius:14px}
.show .fact{font-size:clamp(16px,2.2vmin,20px);color:var(--muted);text-align:center;max-width:560px;line-height:1.35}
.show .nav{display:flex;gap:16px;align-items:center}
.roundbtn{width:72px;height:72px;border-radius:50%;background:var(--lav);display:flex;align-items:center;justify-content:center}
.roundbtn svg{width:36px;height:36px}
.roundbtn.peach{background:var(--peach)}
.closebtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:60px;height:60px;border-radius:18px;background:var(--indigo-3);display:flex;align-items:center;justify-content:center;z-index:60}
.closebtn svg{width:30px;height:30px}

/* ---------- games ---------- */
.prompt{display:flex;align-items:center;gap:var(--gap)}
.scope{position:relative;width:min(38vmin,300px);aspect-ratio:1;border-radius:50%;background-color:#05060f;background-repeat:no-repeat;box-shadow:0 0 0 10px #c8963e,0 0 0 16px #8a6326,0 10px 30px rgba(0,0,0,.4)}
.scope::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 40px 10px rgba(0,0,0,.65)}
.choices{display:grid;gap:var(--gap);width:100%;max-width:1000px}
.choices .card{aspect-ratio:1;cursor:pointer;transition:transform .15s,box-shadow .2s}
.choices .card:active{transform:scale(.97)}
.choices .card.right{box-shadow:0 0 0 6px var(--good),0 4px 14px rgba(0,0,0,.25)}
.bigletter{display:flex;gap:10px;align-items:flex-end}
.bigletter .tile{width:clamp(96px,17vmin,150px);height:clamp(110px,19vmin,170px);font-size:clamp(70px,13vmin,120px);border-radius:24px}
.bigletter .lower{background:var(--cream);width:clamp(70px,12vmin,110px);height:clamp(84px,14vmin,124px);font-size:clamp(52px,9vmin,86px)}
.reveal{min-height:clamp(54px,9vmin,84px);display:flex;align-items:center;justify-content:center}

/* spell */
.spell-pic{width:min(34vmin,280px);aspect-ratio:1}
.slots{display:flex;gap:clamp(4px,.9vmin,10px);flex-wrap:wrap;justify-content:center}
.slot{width:clamp(44px,8vmin,72px);height:clamp(54px,9.4vmin,84px);border-radius:14px;border:3px dashed var(--lav);display:flex;align-items:center;justify-content:center;font-family:var(--letter);font-weight:700;font-size:clamp(30px,5.8vmin,52px);color:rgba(246,235,208,.22)}
.slot.gapslot{border:0;width:20px}
.slot.filled{border:0;background:var(--cream);color:var(--indigo);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.slot.filled.first{background:var(--peach)}
.tray{display:flex;gap:clamp(6px,1.2vmin,12px);flex-wrap:wrap;justify-content:center;min-height:clamp(60px,10vmin,90px)}
.ltile{width:clamp(50px,8.6vmin,78px);height:clamp(58px,9.6vmin,86px);border-radius:14px;background:var(--cream);color:var(--indigo);font-family:var(--letter);font-weight:700;font-size:clamp(32px,6vmin,54px);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.28);touch-action:none;position:relative}
.ltile.used{visibility:hidden}

/* line up */
.lineup{width:100%;display:flex;flex-direction:column;gap:clamp(16px,3vh,30px);align-items:center}
.lane{position:relative;width:100%;display:flex;align-items:center;gap:clamp(2px,.6vw,8px)}
.lane .sunpart{flex:0 0 auto;width:clamp(70px,11vw,130px);aspect-ratio:.5;overflow:hidden;position:relative}
.lane .sunpart{display:flex;align-items:center;justify-content:flex-end}
.lane .sunpart img{flex:0 0 auto;width:250%;height:auto;margin-right:-25%;transform:none!important}
.pslot{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.pslot .ring{width:100%;max-width:120px;aspect-ratio:1;border-radius:50%;border:3px dashed var(--lav);display:flex;align-items:center;justify-content:center;position:relative;overflow:visible}
.pslot .ring img{width:100%;height:100%}
.pslot .ring img.ghost{opacity:.22;filter:grayscale(.6)}
.pslot .ring.done{border-color:transparent}
.pslot .n{font-family:var(--title);font-size:clamp(20px,3vmin,30px);color:var(--muted)}
.ptray{display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center;min-height:100px}
.ptile{width:clamp(84px,13vmin,130px);aspect-ratio:1;touch-action:none;position:relative}
.ptile img{width:100%;height:100%;pointer-events:none}

/* count */
.sky{position:relative;width:min(100%,980px);flex:1;min-height:min(52vh,520px);border-radius:var(--r);background:radial-gradient(ellipse at 50% 30%,#2a2c66,#15162e 70%);overflow:hidden}
.sky .thing{position:absolute;border-radius:50%;transition:transform .15s}
.sky .thing img{width:100%;height:100%;pointer-events:none}
.sky .thing .badge{position:absolute;right:-6px;top:-6px;min-width:34px;height:34px;border-radius:50%;background:var(--peach);color:var(--indigo);font-family:var(--title);font-weight:600;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.answers{display:flex;gap:var(--gap);min-height:96px}
.answers button{width:clamp(90px,14vmin,130px);height:clamp(90px,14vmin,130px);border-radius:26px;background:var(--cream);color:var(--indigo);font-family:var(--title);font-weight:600;font-size:clamp(48px,8vmin,72px)}

/* draw */
.drawwrap{display:flex;gap:var(--gap);align-items:center;justify-content:center;width:100%;flex:1}
.model{display:flex;flex-direction:column;align-items:center;gap:10px}
.model .card{width:clamp(110px,20vmin,200px);aspect-ratio:1}
.model svg{width:clamp(110px,20vmin,200px);height:clamp(110px,20vmin,200px);background:var(--deep);border-radius:18px}
.pad{position:relative;border-radius:var(--r);background:var(--deep);touch-action:none;box-shadow:inset 0 0 0 3px var(--indigo-3)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:var(--r)}
.pad .payoff{position:absolute;inset:12%;border-radius:50%;overflow:hidden;opacity:0;transition:opacity .9s}
.pad .payoff img{width:100%;height:100%;object-fit:cover}
.pad .payoff.on{opacity:1}
.drawtools{display:flex;flex-direction:column;gap:12px}

/* letter book */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,14vmin,140px),1fr));gap:var(--gap);width:100%;max-width:1100px;padding:0 clamp(12px,2.4vw,28px) 24px}
.page{aspect-ratio:.8;border-radius:18px;background:var(--indigo-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.page .L{font-family:var(--letter);font-weight:700;font-size:clamp(46px,8vmin,72px);color:var(--muted);opacity:.45}
.page.found{background:var(--cream)}
.page.found .L{color:var(--indigo);opacity:1}
.page.found img{width:62%;aspect-ratio:1;border-radius:50%;object-fit:cover}
.bookpage{display:flex;flex-direction:column;align-items:center;gap:16px}
.bookpage .row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.bookpage .entry{display:flex;flex-direction:column;align-items:center;gap:8px}
.bookpage .entry .card{width:clamp(120px,20vmin,190px);aspect-ratio:1}

/* win */
.win{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.win .guide{width:min(240px,44vw)}
.win .stars{font-family:var(--title);font-weight:600;font-size:clamp(46px,9vmin,80px);display:flex;align-items:center;gap:12px;color:var(--cream)}
.win .stars svg{width:1em;height:1em}
.win .btns{display:flex;gap:18px}

/* grown-ups */
.panel{background:var(--cream);color:var(--indigo);border-radius:24px;padding:24px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;font-family:var(--title)}
.panel h2{margin:0;font-size:28px}
.panel p{margin:0;font-family:var(--letter);font-size:16px;color:#4a4c7a}
.panel .rowx{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:20px}
.switch{width:72px;height:42px;border-radius:999px;background:#c9c3d9;position:relative;transition:background .2s}
.switch::after{content:'';position:absolute;left:4px;top:4px;width:34px;height:34px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--pine)}
.switch.on::after{transform:translateX(30px)}
.hold{position:relative;overflow:hidden;border-radius:14px;background:#e8dcc0;padding:12px 16px;font-size:18px;text-align:left}
.hold .fill{position:absolute;inset:0;width:0;background:var(--peach);opacity:.7}
.hold span{position:relative}

/* feedback */
@keyframes wiggle{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.wiggle{animation:wiggle .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .4s}
.lift{transform:scale(1.12);box-shadow:0 14px 28px rgba(0,0,0,.4);z-index:20}
@media (prefers-reduced-motion:reduce){.wiggle,.pop{animation:none}*{transition:none!important}}
@media (orientation:portrait){
  .tiles-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drawwrap{flex-direction:column}
  .model{flex-direction:row}
  .prompt{flex-direction:column}
}
@media (max-width:560px){
  .hostrow{flex-direction:column}
  .hostrow .host{flex-basis:auto;width:110px;align-self:center}
  .bar{flex-wrap:wrap}
  .levels button{min-width:46px}
}
@media (max-width:560px){
  .home-hero .title{font-size:24px;max-width:55%}
  .home-hero .juniper{height:70%;right:4px}
  .topchips{top:auto;bottom:10px;left:12px;right:auto}
}

/* ---------- celebrations ---------- */
.spark{position:fixed;z-index:80;pointer-events:none;animation:spark .85s ease-out forwards}
.spark svg{width:100%;height:100%}
@keyframes spark{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0}}
.shower{position:fixed;inset:0;width:100vw;height:100vh;z-index:70;pointer-events:none}
.win .crew{display:flex;align-items:flex-end;gap:clamp(6px,2vw,24px)}
.win .crew .guide{width:min(170px,26vw);animation:hop .9s ease-in-out infinite alternate}
.win .crew .guide.lead{width:min(250px,36vw)}
@keyframes hop{0%{transform:translateY(0) rotate(-2deg)}100%{transform:translateY(-18px) rotate(2deg)}}
.win .milestone{font-family:var(--title);font-weight:600;font-size:clamp(26px,4.4vmin,40px);background:var(--peach);color:var(--indigo);border-radius:999px;padding:6px 22px}
@media (prefers-reduced-motion:reduce){.win .crew .guide{animation:none}}

/* ---------- more explore ---------- */
.grouphead{display:flex;align-items:center;gap:12px;padding:6px clamp(12px,2.4vw,28px) 10px;font-family:var(--title);font-size:clamp(20px,3vmin,28px);color:var(--muted)}
.grouphead .face{width:46px;height:52px;border-radius:12px;overflow:hidden;background:var(--indigo-3)}
.grouphead .face img{width:100%;height:100%;object-fit:cover;object-position:top}
.orbit .beltpic{width:100%;height:100%;border-radius:16px;object-fit:cover}
.orbit .moons .beltpic{border-radius:50%}

/* ---------- line them up modes ---------- */
.modes{display:flex;gap:10px;justify-content:center;padding:0 16px 6px}
.mode{width:clamp(84px,12vmin,110px);height:62px;border-radius:16px;background:var(--indigo-3);display:flex;align-items:center;justify-content:center;padding:6px}
.mode svg{width:100%;height:100%}
.mode.on{background:var(--deep);box-shadow:inset 0 0 0 3px var(--peach)}
.sizecue{flex:0 0 auto;width:clamp(56px,8vw,90px);opacity:.7}
.homes{display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center;width:100%}
.home-planet{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:20px;background:var(--indigo-2);min-width:clamp(110px,15vmin,160px)}
.home-planet .hp{width:clamp(90px,13vmin,130px);aspect-ratio:1}
.home-planet .hp img{width:100%;height:100%}
.moonslots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:150px}
.mslot{width:clamp(44px,6.4vmin,60px);aspect-ratio:1;border-radius:50%;border:3px dashed var(--lav)}
.mslot:not(:empty){border-color:transparent}

.ptile.small{width:clamp(66px,9.6vmin,92px)}

/* ---------- star pictures ---------- */
.cgames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);padding:0 clamp(12px,2.4vw,28px) var(--gap);max-width:700px}
.pad .padbg{position:absolute;inset:0;width:100%;height:100%;border-radius:var(--r)}
.ctarget{width:min(38vmin,300px);aspect-ratio:1}
</style>
</head>
<body>
<div id="app"></div>
<script>// ===== Everett's Observatory: procedural space pictures (no libraries) =====
// Every picture is drawn on a square canvas with its own deep-space background.
const SPACE = (() => {
  let BARE = false; // transparent background, softer night side (for planets sitting on the app background)
  // ---------- noise ----------
  function h3(x, y, z, s) {
    let n = Math.imul(x, 73856093) ^ Math.imul(y, 19349663) ^ Math.imul(z, 83492791) ^ Math.imul(s, 1640531513);
    n = (n << 13) ^ n;
    n = (Math.imul(n, (Math.imul(Math.imul(n, n), 15731) + 789221) | 0) + 1376312589) & 0x7fffffff;
    return n / 1073741823.5 - 1;
  }
  function vn(x, y, z, s) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const a = h3(xi, yi, zi, s), b = h3(xi + 1, yi, zi, s), c = h3(xi, yi + 1, zi, s), d = h3(xi + 1, yi + 1, zi, s);
    const e = h3(xi, yi, zi + 1, s), f = h3(xi + 1, yi, zi + 1, s), g = h3(xi, yi + 1, zi + 1, s), h = h3(xi + 1, yi + 1, zi + 1, s);
    const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (h - g) * u;
    const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
    return y1 + (y2 - y1) * w;
  }
  function fbm(x, y, z, oct, s) {
    let a = 0.5, f = 1, t = 0, n = 0;
    for (let i = 0; i < oct; i++) { t += a * vn(x * f, y * f, z * f, s + i * 17); n += a; a *= 0.5; f *= 2.03; }
    return t / n;
  }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  // ---------- backgrounds ----------
  function starfield(ctx, S, seed, dens = 1, tint = null) {
    if (BARE) return;
    const g = ctx.createRadialGradient(S * 0.5, S * 0.45, 0, S * 0.5, S * 0.5, S * 0.75);
    g.addColorStop(0, tint || '#0b0d22'); g.addColorStop(1, '#03040b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
    const r = rng(seed);
    const n = Math.round(140 * dens * (S / 400) * (S / 400));
    for (let i = 0; i < n; i++) {
      const x = r() * S, y = r() * S, b = r(), sz = (b > 0.97 ? 1.5 : b > 0.85 ? 1.0 : 0.6) * S / 400;
      ctx.globalAlpha = 0.25 + 0.75 * r() * (b > 0.85 ? 1 : 0.6);
      const c = r(); ctx.fillStyle = c < 0.15 ? '#ffd9b0' : c < 0.3 ? '#b8ccff' : '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, sz, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function glow(ctx, x, y, r, color, a = 1) {
    if (BARE) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1;
  }
  function spikes(ctx, x, y, len, color, w = 1.2, a = 0.8, ang = 0) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 4; k++) {
      ctx.rotate(Math.PI / 2);
      const g = ctx.createLinearGradient(0, 0, len, 0);
      g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = a; ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0, -w); ctx.lineTo(len, 0); ctx.lineTo(0, w); ctx.fill();
    }
    ctx.restore();
  }
  function brightStar(ctx, x, y, r, core, halo, spike = true) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glow(ctx, x, y, r * 6, halo, 0.35);
    glow(ctx, x, y, r * 2.4, halo, 0.8);
    if (spike) spikes(ctx, x, y, r * 9, halo, r * 0.35, 0.7);
    glow(ctx, x, y, r * 1.1, core, 1);
    ctx.restore();
  }

  // ---------- sphere ----------
  // tex(x,y,z) -> [r,g,b] in 0..1 on the unit sphere (y up)
  function sphere(ctx, S, cx, cy, r, tex, o = {}) {
    const L = o.light || [-0.62, 0.5, 0.6]; const ll = Math.hypot(...L); const lx = L[0] / ll, ly = L[1] / ll, lz = L[2] / ll;
    const tilt = o.tilt || 0, ct = Math.cos(tilt), st = Math.sin(tilt);
    const spin = o.spin || 0, cs = Math.cos(spin), ss = Math.sin(spin);
    const amb = BARE ? Math.max(o.amb ?? 0.04, 0.32) : (o.amb ?? 0.04), limb = o.limb ?? 0.15;
    const x0 = Math.max(0, Math.floor(cx - r - 1)), y0 = Math.max(0, Math.floor(cy - r - 1));
    const x1 = Math.min(S, Math.ceil(cx + r + 1)), y1 = Math.min(S, Math.ceil(cy + r + 1));
    const w = x1 - x0, h = y1 - y0; if (w <= 0 || h <= 0) return;
    const img = ctx.getImageData(x0, y0, w, h), d = img.data;
    const rim = o.rim, rimS = o.rimS ?? 0.6;
    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
      const nx = (x0 + px + 0.5 - cx) / r, ny = -(y0 + py + 0.5 - cy) / r;
      const rr = nx * nx + ny * ny; if (rr > 1.0 + 2 / r) continue;
      const dist = Math.sqrt(rr), edge = clamp((1 - dist) * r + 0.5, 0, 1); if (edge <= 0) continue;
      const nz = Math.sqrt(Math.max(0, 1 - rr));
      // texture coords: untilt around view z, then spin around y
      let tx = nx * ct + ny * st, ty = -nx * st + ny * ct, tz = nz;
      const sx = tx * cs + tz * ss, sz = -tx * ss + tz * cs;
      let c = tex(sx, ty, sz, nx, ny, nz);
      let sh;
      if (o.emissive) sh = (0.3 + 0.7 * Math.pow(nz, limb)) * (o.emi ?? 1);
      else {
        const dot = nx * lx + ny * ly + nz * lz;
        sh = amb + (1 - amb) * sstep(-0.12, 0.85, dot) * Math.pow(Math.max(nz, 0.0001), limb);
      }
      let R = c[0] * sh, G = c[1] * sh, B = c[2] * sh;
      if (rim) {
        const dot = o.emissive ? 1 : clamp(nx * lx + ny * ly + nz * lz + 0.35, 0, 1);
        const f = Math.pow(1 - nz, 2.6) * rimS * dot;
        R += rim[0] * f; G += rim[1] * f; B += rim[2] * f;
      }
      const i = (py * w + px) * 4;
      d[i] = d[i] + (clamp(R, 0, 1) * 255 - d[i]) * edge;
      d[i + 1] = d[i + 1] + (clamp(G, 0, 1) * 255 - d[i + 1]) * edge;
      d[i + 2] = d[i + 2] + (clamp(B, 0, 1) * 255 - d[i + 2]) * edge;
      if (BARE) { if (d[i + 3] < 255) { const a0 = d[i + 3] / 255; d[i] = clamp(R, 0, 1) * 255; d[i + 1] = clamp(G, 0, 1) * 255; d[i + 2] = clamp(B, 0, 1) * 255; } d[i + 3] = Math.max(d[i + 3], edge * 255); }
    }
    ctx.putImageData(img, x0, y0);
  }
  function craters(seed, n, rmin, rmax) {
    const r = rng(seed), list = [];
    for (let i = 0; i < n; i++) {
      let x = r() * 2 - 1, y = r() * 2 - 1, z = r() * 2 - 1; const l = Math.hypot(x, y, z) || 1;
      const rad = rmin + (rmax - rmin) * Math.pow(r(), 2.2);
      list.push([x / l, y / l, z / l, rad, Math.cos(rad), r()]);
    }
    return list;
  }
  function craterShade(list, x, y, z) {
    let v = 0;
    for (const c of list) {
      const dt = x * c[0] + y * c[1] + z * c[2];
      if (dt < c[4] - 0.02) continue;
      const ang = Math.acos(clamp(dt, -1, 1)), t = ang / c[3];
      if (t < 0.9) v -= 0.13 * (1 - t * t * 0.7);
      else if (t < 1.25) v += 0.1 * Math.sin((t - 0.9) / 0.35 * Math.PI);
    }
    return v;
  }

  // ---------- planets and moons ----------
  const P = {};
  P.sun = (ctx, S) => {
    starfield(ctx, S, 11, 0.5);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glow(ctx, S / 2, S / 2, S * 0.5, 'rgba(255,170,60,0.9)'); glow(ctx, S / 2, S / 2, S * 0.4, 'rgba(255,220,140,1)'); glow(ctx, S / 2, S / 2, S * 0.34, 'rgba(255,240,200,1)');
    ctx.restore();
    const spots = craters(5, 6, 0.03, 0.06);
    sphere(ctx, S, S / 2, S / 2, S * 0.3, (x, y, z) => {
      const g = fbm(x * 18, y * 18, z * 18, 3, 3) * 0.5 + 0.5;
      let c = mix([1, 0.72, 0.22], [1, 0.97, 0.78], g);
      for (const s of spots) { if (Math.abs(s[1]) > 0.5) continue; const dt = x * s[0] + y * s[1] + z * s[2]; if (dt > Math.cos(s[3])) c = mix(c, [0.35, 0.12, 0.02], 0.85); else if (dt > Math.cos(s[3] * 1.8)) c = mix(c, [0.7, 0.35, 0.05], 0.4); }
      return c;
    }, { emissive: true, limb: 0.55, emi: 1.05 });
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ctx, S / 2, S / 2, S * 0.48, 'rgba(255,190,90,0.45)'); ctx.restore();
  };
  P.mercury = (ctx, S) => {
    starfield(ctx, S, 21);
    const cr = craters(7, 90, 0.02, 0.22);
    sphere(ctx, S, S / 2, S / 2, S * 0.3, (x, y, z) => {
      const n = fbm(x * 4, y * 4, z * 4, 5, 2) * 0.35;
      const v = 0.52 + n + craterShade(cr, x, y, z);
      return [v * 1.0, v * 0.95, v * 0.9];
    }, { limb: 0.25 });
  };
  P.venus = (ctx, S) => {
    starfield(ctx, S, 31);
    sphere(ctx, S, S / 2, S / 2, S * 0.34, (x, y, z) => {
      const wx = fbm(x * 2, y * 2, z * 2, 3, 5) * 1.6;
      const v = fbm(x * 1.4 + wx, y * 5 + wx, z * 1.4, 5, 9) * 0.5 + 0.5;
      return mix([0.86, 0.72, 0.45], [1, 0.95, 0.8], v);
    }, { limb: 0.35, rim: [0.5, 0.4, 0.2], rimS: 0.5 });
  };
  P.earth = (ctx, S) => {
    starfield(ctx, S, 41);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ctx, S / 2, S / 2, S * 0.4, 'rgba(80,140,255,0.35)'); ctx.restore();
    sphere(ctx, S, S / 2, S / 2, S * 0.34, (x, y, z) => {
      const c = fbm(x * 1.3 + 3, y * 1.3, z * 1.3, 4, 12) + fbm(x * 6, y * 6, z * 6, 2, 3) * 0.08;
      const ay = Math.abs(y);
      let col;
      if (ay > 0.9 || (ay > 0.82 && c > -0.05)) col = [0.93, 0.95, 0.98];
      else if (c > 0.04) {
        const dry = fbm(x * 3, y * 3, z * 3, 4, 40) * 0.5 + 0.5;
        const desert = sstep(0.2, 0.0, Math.abs(Math.abs(y) - 0.3)) * dry;
        col = mix([0.16, 0.38, 0.12], [0.45, 0.42, 0.2], dry * 0.7);
        col = mix(col, [0.82, 0.68, 0.42], clamp(desert * 1.6, 0, 0.9));
        col = mix(col, [0.35, 0.38, 0.3], sstep(0.62, 0.78, ay) * 0.5);
      } else {
        const shallow = sstep(-0.06, 0.04, c);
        col = mix([0.03, 0.12, 0.38], [0.1, 0.35, 0.6], shallow);
      }
      const wq = fbm(x * 3, y * 3, z * 3, 3, 77) * 1.5;
      const cl = fbm(x * 3.2 + wq, y * 6 + wq, z * 3.2, 5, 60);
      col = mix(col, [1, 1, 1], sstep(0.12, 0.4, cl) * 0.85);
      return col;
    }, { limb: 0.1, rim: [0.35, 0.6, 1], rimS: 0.9, spin: 0.6 });
  };
  P.moon = (ctx, S) => {
    starfield(ctx, S, 51);
    const cr = craters(19, 120, 0.015, 0.16);
    sphere(ctx, S, S / 2, S / 2, S * 0.32, moonTex(cr), { limb: 0.05, amb: 0.03 });
  };
  function moonTex(cr) {
    return (x, y, z) => {
      const m = fbm(x * 1.6, y * 1.6 + 1, z * 1.6, 4, 4);
      const mare = sstep(0.0, 0.14, m) * (0.3 + 0.7 * sstep(-0.75, -0.4, y));
      let v = 0.72 + fbm(x * 9, y * 9, z * 9, 4, 8) * 0.12 - mare * 0.32 + craterShade(cr, x, y, z) * 0.9;
      // bright rayed crater near the bottom (like Tycho)
      const tdx = x - 0.12, tdy = y + 0.72; const td = Math.hypot(tdx, tdy);
      if (td < 0.06) v += 0.16; else if (td < 0.14) v += 0.05;
      return [v, v * 0.98, v * 0.94];
    };
  }
  P.mars = (ctx, S) => {
    starfield(ctx, S, 61);
    const cr = craters(23, 25, 0.02, 0.09);
    sphere(ctx, S, S / 2, S / 2, S * 0.3, (x, y, z) => {
      const d = fbm(x * 2.2, y * 2.2, z * 2.2, 6, 14);
      let col = mix([0.78, 0.4, 0.2], [0.92, 0.6, 0.38], fbm(x * 6, y * 6, z * 6, 3, 2) * 0.5 + 0.5);
      col = mix(col, [0.42, 0.2, 0.12], sstep(0.02, 0.2, d) * 0.75);
      const v = craterShade(cr, x, y, z) * 0.6; col = [col[0] + v, col[1] + v, col[2] + v];
      if (y > 0.86 + fbm(x * 8, 0, z * 8, 2, 3) * 0.06) col = [0.96, 0.94, 0.92];
      if (y < -0.92) col = [0.9, 0.86, 0.84];
      return col;
    }, { limb: 0.2, rim: [0.9, 0.55, 0.4], rimS: 0.35, spin: 1.2 });
  };
  P.jupiter = (ctx, S) => {
    starfield(ctx, S, 71);
    sphere(ctx, S, S / 2, S / 2, S * 0.38, (x, y, z) => {
      const lon = Math.atan2(x, z);
      const turb = fbm(x * 4, y * 14, z * 4, 4, 30) * 0.9 + fbm(x * 12, y * 30, z * 12, 3, 50) * 0.25;
      const b = Math.sin(y * 17 + turb * 1.8 + Math.sin(y * 5) * 0.8);
      let col = mix([0.68, 0.48, 0.32], [0.95, 0.9, 0.8], b * 0.5 + 0.5);
      if (Math.abs(y) > 0.75) col = mix(col, [0.6, 0.55, 0.5], sstep(0.75, 0.95, Math.abs(y)));
      // Great Red Spot
      const gx = (lon - 0.35) / 0.3, gy = (y + 0.36) / 0.085, gd = gx * gx + gy * gy;
      if (gd < 1.6) {
        const sw = vn(gx * 3 + gy * 2, gy * 3, 0, 9) * 0.3;
        col = mix(col, gd < 1 ? [0.78, 0.38, 0.24] : [0.95, 0.85, 0.75], sstep(1.6, 0.6, gd + sw));
      }
      return col;
    }, { limb: 0.5, spin: 0 });
  };
  function ringsPass(ctx, S, cx, cy, R, ang, half, alpha = 1) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    ctx.beginPath(); if (half === 'back') ctx.rect(-S * 2, -S * 2, S * 4, S * 2); else ctx.rect(-S * 2, 0, S * 4, S * 2); ctx.clip();
    const k = 0.2;
    const bands = [[1.24, 1.5, [0.55, 0.5, 0.42], 0.35], [1.5, 1.92, [0.9, 0.82, 0.66], 0.95], [1.92, 1.99, [0, 0, 0], 0], [1.99, 2.25, [0.78, 0.7, 0.56], 0.8], [2.3, 2.33, [0.75, 0.7, 0.6], 0.4]];
    for (const [a, b, c, al] of bands) {
      if (!al) continue;
      for (let rr = a; rr < b; rr += 0.012) {
        const wob = 0.82 + 0.18 * Math.sin(rr * 140) * Math.sin(rr * 37);
        ctx.strokeStyle = `rgba(${c[0] * 255 * wob | 0},${c[1] * 255 * wob | 0},${c[2] * 255 * wob | 0},${al * alpha})`;
        ctx.lineWidth = R * 0.016;
        ctx.beginPath(); ctx.ellipse(0, 0, R * rr, R * rr * k, 0, 0, 6.2832); ctx.stroke();
      }
    }
    ctx.restore();
  }
  P.saturn = (ctx, S) => {
    starfield(ctx, S, 81);
    const R = S * 0.21, cx = S / 2, cy = S / 2, ang = -0.32;
    ringsPass(ctx, S, cx, cy, R, ang, 'back');
    sphere(ctx, S, cx, cy, R, (x, y, z) => {
      const turb = fbm(x * 3, y * 12, z * 3, 3, 5) * 0.6;
      const b = Math.sin(y * 13 + turb);
      let col = mix([0.78, 0.64, 0.42], [0.96, 0.88, 0.66], b * 0.5 + 0.5);
      if (y > 0.78) col = mix(col, [0.6, 0.66, 0.7], sstep(0.78, 0.98, y) * 0.6);
      // ring shadow band across the planet
      const ry = y * Math.cos(ang) + x * 0;
      return col;
    }, { limb: 0.45, tilt: ang });
    ringsPass(ctx, S, cx, cy, R, ang, 'front');
  };
  P.uranus = (ctx, S) => {
    starfield(ctx, S, 91);
    sphere(ctx, S, S / 2, S / 2, S * 0.3, (x, y, z) => {
      const b = Math.sin(y * 9 + fbm(x * 2, y * 6, z * 2, 2, 3) * 0.6) * 0.03;
      return [0.62 + b, 0.86 + b, 0.9 + b];
    }, { limb: 0.55, tilt: 1.45, rim: [0.6, 0.85, 0.9], rimS: 0.25 });
  };
  P.neptune = (ctx, S) => {
    starfield(ctx, S, 101);
    sphere(ctx, S, S / 2, S / 2, S * 0.3, (x, y, z) => {
      const lon = Math.atan2(x, z);
      const t = fbm(x * 3, y * 10, z * 3, 4, 7);
      let col = mix([0.16, 0.3, 0.75], [0.3, 0.5, 0.95], Math.sin(y * 10 + t * 2) * 0.5 + 0.5);
      const sx = (lon + 0.25) / 0.22, sy = (y + 0.3) / 0.09, sd = sx * sx + sy * sy;
      if (sd < 1) col = mix(col, [0.08, 0.12, 0.38], sstep(1, 0.4, sd));
      const streak = sstep(0.22, 0.4, fbm(x * 2, y * 24, z * 2, 3, 41)) * (Math.abs(y + 0.15) < 0.12 || Math.abs(y - 0.35) < 0.06 ? 1 : 0);
      col = mix(col, [0.9, 0.95, 1], streak * 0.8);
      return col;
    }, { limb: 0.5, rim: [0.3, 0.5, 1], rimS: 0.4 });
  };
  P.pluto = (ctx, S) => {
    starfield(ctx, S, 111);
    const cr = craters(31, 30, 0.02, 0.07);
    sphere(ctx, S, S / 2, S / 2, S * 0.28, (x, y, z) => {
      const lon = Math.atan2(x, z);
      let col = mix([0.72, 0.6, 0.48], [0.85, 0.76, 0.64], fbm(x * 5, y * 5, z * 5, 4, 3) * 0.5 + 0.5);
      // dark reddish equatorial belt
      const belt = sstep(0.0, 0.18, fbm(x * 2.5, y * 2.5, z * 2.5, 4, 9) + 0.15 - Math.abs(y + 0.1) * 1.4);
      col = mix(col, [0.35, 0.18, 0.12], belt * 0.85);
      // the bright heart (Tombaugh Regio)
      const hx = (lon - 0.25) / 0.48, hy = -(y - 0.02) / 0.48 + 0.15;
      const hv = Math.pow(hx * hx + hy * hy - 1, 3) - hx * hx * hy * hy * hy;

// ---------- pictures ----------
const PIC = {};
function idb() {
  return new Promise((res, rej) => {
    try { const r = indexedDB.open('everettObs', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); }
  });
}
async function idbGet(k) { try { const db = await idb(); return await new Promise(r => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch (e) { return null; } }
async function idbSet(k, v) { try { const db = await idb(); await new Promise(r => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = r; t.onerror = r; }); } catch (e) { } }
function checkImg(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i.naturalWidth > 0); i.onerror = () => r(false); i.src = src; }); }
function drawPic(id) { return SPACE.draw(id, PIC_SIZE).toDataURL('image/jpeg', 0.9); }
const BARE_IDS = ['sun', 'mercury', 'venus', 'earth', 'moon', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto', 'io', 'europa', 'titan', 'asteroid', 'star', 'comet', 'phobos', 'ganymede', 'callisto', 'enceladus', 'triton', 'charon'];
const BARE = {};
function drawBare(id) { return SPACE.draw(id, 256, true).toDataURL('image/png'); }
async function buildPictures(onStep) {
  const cached = await idbGet(PIC_VER);
  let fresh = false;
  for (let k = 0; k < ITEMS.length; k++) {
    const id = ITEMS[k].id;
    let src = cached && cached[id];
    if (!src || !(await checkImg(src))) { src = drawPic(id); fresh = true; await new Promise(r => setTimeout(r, 30)); }
    PIC[id] = src;
    if (BARE_IDS.includes(id)) {
      let b = cached && cached['bare_' + id];
      if (!b || !(await checkImg(b))) { b = drawBare(id); fresh = true; }
      BARE[id] = b;
    }
    onStep(k + 1, fresh);
    if (fresh) await new Promise(r => setTimeout(r, 60));
  }
  if (fresh) { const all = Object.assign({}, PIC); for (const k in BARE) all['bare_' + k] = BARE[k]; idbSet(PIC_VER, all); }
}
function img(id, cls) {
  const i = new Image(); i.src = PIC[id]; i.alt = BYID[id].word; i.draggable = false; if (cls) i.className = cls;
  i.onerror = () => { PIC[id] = drawPic(id); i.src = PIC[id]; };
  return i;
}
const FILL = { sun: .6, mercury: .6, venus: .68, earth: .68, moon: .64, mars: .6, jupiter: .76, saturn: .95, uranus: .6, neptune: .6, pluto: .56, io: .58, europa: .58, titan: .6, asteroid: .66, phobos: .68, ganymede: .66, callisto: .62, enceladus: .56, triton: .58, charon: .56 };
function bodyImg(id, cls) {

  const f = FILL[id]; if (f) i.style.transform = `scale(${(0.94 / f).toFixed(3)})`;
  return i;
}
const CPIC = {};
function consPic(c, lines = true) { const k = c.id + (lines ? '' : '_bare'); if (!CPIC[k]) CPIC[k] = drawConstellation(c, 384, { lines }).toDataURL('image/jpeg', 0.9); return CPIC[k]; }
function consCard(c, opts = {}) {

// ---------- choosing items ----------
function alike(a, b) { return LOOKALIKE.some(([x, y]) => (x === a && y === b) || (x === b && y === a)); }
function distractors(target, n, pool, ok = () => true) {
  const out = [];
  for (const it of shuffle(pool)) {
    if (out.length >= n) break;
    if (it.id === target.id || !ok(it)) continue;
    if (lvl.cur < 3 && (alike(it.id, target.id) || out.some(o => alike(o.id, it.id)))) continue;
    out.push(it);
  }
  return out;
}
function choiceGrid(n) {
  const g = el('div', 'choices');
  const cols = n <= 3 ? 3 : n === 4 ? 4 : 3;
  g.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  g.style.maxWidth = n <= 4 ? Math.min(1000, n * 230) + 'px' : '760px';
  return g;
}

// ---------- Spot It: find what Juniper sees through the telescope ----------
function spotIt() {
  const ROUNDS = 5, L = lvl('spot'); lvl.cur = L;
  const zoom = [0, 1.9, 2.6, 3.4][L], nChoice = [0, 3, 4, 6][L];
  let round = 0, used = [];
  const scr = el('div', 'screen');
  const B = bar('spot', 'juniper', { rounds: ROUNDS, restart: spotIt }); scr.append(B.b);
  const body = el('div', 'body'); scr.append(body); show(scr);
  function next() {
    if (round >= ROUNDS) return win('juniper', spotIt);
    body.innerHTML = '';
    const target = pick(ITEMS.filter(i => !used.includes(i.id))); used.push(target.id);
    const scope = el('div', 'scope');
    scope.style.backgroundImage = `url(${PIC[target.id]})`;
    scope.style.backgroundSize = (zoom * 100) + '%';
    scope.style.backgroundPosition = `${target.fx ?? 50}% ${target.fy ?? 50}%`;
    const reveal = el('div', 'reveal');
    const top = el('div', 'prompt'); top.append(scope, reveal); body.append(top);
    const opts = shuffle([target, ...distractors(target, nChoice - 1, ITEMS)]);
    const grid = choiceGrid(opts.length);
    let done = false;
    opts.forEach(it => {
      const c = card(it, { tag: 'button', num: false });
      c.onclick = () => {
        if (done) return;
        if (it.id !== target.id) { wiggle(c); guideMood(B.face, 'juniper', 'thinking', 1200); return; }
        done = true; c.classList.add('right'); pop(c); burst(c); sfx.right(); markLetter(it);
        guideMood(B.face, 'juniper', 'happy', 1400);
        scope.style.transition = 'background-size .8s'; scope.style.backgroundSize = '100%';
        reveal.innerHTML = ''; reveal.append(tiles(it.word, true));
        round++; B.setProg(round); later(next, 1900);
      };
      grid.append(c);
    });
    body.append(grid);
  }
  next();
}

// ---------- First Letter: which one starts with J? ----------
function firstLetter() {
  const ROUNDS = 5, L = lvl('first'); lvl.cur = L;
  const nChoice = [0, 3, 4, 6][L];
  let round = 0, last = '';
  const scr = el('div', 'screen');
  const B = bar('first', 'juniper', { rounds: ROUNDS, restart: firstLetter }); scr.append(B.b);
  const body = el('div', 'body'); scr.append(body); show(scr);
  function next() {
    if (round >= ROUNDS) return win('juniper', firstLetter);
    body.innerHTML = '';
    let letter; do { letter = pick(LETTERS); } while (letter === last && LETTERS.length > 1); last = letter;
    const target = pick(ITEMS.filter(i => i.word[0].toUpperCase() === letter));
    const big = el('div', 'bigletter');
    big.append(el('div', 'tile first', letter), el('div', 'tile lower', letter.toLowerCase()));
    const reveal = el('div', 'reveal');
    const top = el('div', 'prompt'); top.append(big, reveal); body.append(top);
    const seen = new Set([letter]);
    const others = distractors(target, nChoice - 1, ITEMS, it => { const f = it.word[0].toUpperCase(); if (seen.has(f)) return false; seen.add(f); return true; });
    const grid = choiceGrid(nChoice);
    let done = false;
    shuffle([target, ...others]).forEach(it => {
      const c = card(it, { tag: 'button', num: false });
      c.onclick = () => {
        if (done) return;
        if (it.word[0].toUpperCase() !== letter) { wiggle(c); guideMood(B.face, 'juniper', 'thinking', 1200); return; }
        done = true; c.classList.add('right'); pop(c); burst(c); sfx.right(); markLetter(it);
        guideMood(B.face, 'juniper', 'happy', 1400);
        reveal.innerHTML = ''; reveal.append(tiles(it.word, true));
        round++; B.setProg(round); later(next, 1900);
      };
      grid.append(c);
    });
    body.append(grid);
  }
  next();
}

// ---------- drag helper ----------
function draggable(node, onDrop) {
  node.addEventListener('pointerdown', e => {
    if (node.dataset.locked) return;
    e.preventDefault(); node.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY; let moved = false;
    node.style.transition = 'none'; node.classList.add('lift');
    const move = ev => { const dx = ev.clientX - sx, dy = ev.clientY - sy; if (Math.abs(dx) + Math.abs(dy) > 6) moved = true; node.style.transform = `translate(${dx}px,${dy}px) scale(1.12)`; };
    const up = ev => {
      node.removeEventListener('pointermove', move); node.removeEventListener('pointerup', up); node.removeEventListener('pointercancel', up);
      node.classList.remove('lift');
      const ok = onDrop(ev.clientX, ev.clientY, moved);
      node.style.transition = 'transform .25s'; node.style.transform = '';

  const g2 = el('button', 'gametile', '<div class="ico">' + ICON.cmatch + '</div><div class="lbl">Match the Stars</div>'); g2.onclick = matchStars;
  top.append(g1, g2); scr.append(top);

  scr.append(grid); show(scr);
}

  s.append(consCard(c)); s.append(tiles(c.word)); s.append(el('div', 'propername', esc(c.name))); s.append(el('div', 'fact', esc(c.fact)));

  const next = el('button', 'roundbtn', ICON.right); next.setAttribute('aria-label', 'Next'); next.onclick = () => consShowcase((k + 1) % CONSTELLATIONS.length);

}
function connectStars() {
  const L = lvl('connect'), ROUNDS = 3;
  const pools = [null, ['crux', 'triangulum', 'cassiopeia', 'pegasus', 'cygnus', 'bigdipper'], ['bigdipper', 'littledipper', 'orion', 'gemini', 'canismajor', 'lyra', 'cygnus', 'taurus'], ['orion', 'leo', 'scorpius', 'taurus', 'gemini', 'littledipper', 'lyra']];
  const pool = shuffle(pools[L]); let round = 0;
  const scr = el('div', 'screen');
  const B = bar('connect', 'mo', { rounds: ROUNDS, restart: connectStars }); scr.append(B.b);
  const body = el('div', 'body'); scr.append(body); show(scr);
  function next() {
    if (round >= ROUNDS) return win('mo', connectStars);
    body.innerHTML = '';
    const c = CBYID[pool[round % pool.length]]; OBS.cur = c;
    const wrapD = el('div', 'drawwrap'), model = el('div', 'model');
    model.append(consCard(c));
    const pad = el('div', 'pad'), bg = new Image(), gC = el('canvas'), iC = el('canvas');
    bg.src = consPic(c, false); bg.className = 'padbg'; bg.alt = '';
    pad.append(bg, gC, iC);
    const tools = el('div', 'drawtools');
    const er = el('button', 'roundbtn', ICON.erase); er.setAttribute('aria-label', 'Start over'); tools.append(er);
    wrapD.append(model, pad, tools); body.append(wrapD);
    const reveal = el('div', 'reveal'); body.append(reveal);
    if (L === 3) later(() => { model.style.transition = 'opacity .6s'; model.style.opacity = '0'; }, 4000);
    const keys = Object.keys(c.xy), done = new Set(), segKey = (a, b) => [a, b].sort().join('|');
    const segs = new Set(c.lines.map(([a, b]) => segKey(a, b)));

    function layout() {
      const r = wrapD.getBoundingClientRect(), portrait = innerHeight > innerWidth;
      size = Math.max(240, Math.floor(Math.min(portrait ? r.width - 20 : r.width - 330, portrait ? innerHeight * 0.5 : innerHeight - 200, 640)));
      pad.style.width = pad.style.height = size + 'px';
      for (const cv of [gC, iC]) cv.width = cv.height = size * dpr;
      gx = gC.getContext('2d'); ix = iC.getContext('2d'); gx.setTransform(dpr, 0, 0, dpr, 0, 0); ix.setTransform(dpr, 0, 0, dpr, 0, 0);

    }

  const sw = el('button', 'switch' + (S.sound ? ' on' : '')); sw.setAttribute('aria-label', 'Sound'); sw.setAttribute('role', 'switch'); sw.setAttribute('aria-checked', S.sound);

  sr.append(sw); p.append(sr);
  p.append(el('p', '', 'Hold a button for two seconds to reset it. Progress is saved on this iPad only.'));
  const hold = (label, fn) => {
    const b = el('button', 'hold', '<div class="fill"></div><span>' + label + '</span>');

  openOverlay(p, home);
}
