<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vehicle Lot">
<meta name="theme-color" content="#0F3B4C">
<title>Everett's Vehicle Lot</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0F3B4C; --teal:#17879A; --orange:#F26A2E; --yellow:#FFD84A; --sand:#D9B382;
  --ink:#1c2430; --sky:#cdeaf0; --foam:#f4f7f5; --gold:#ffd84a; --goldEdge:#b9831b;
  --num:'Baloo 2','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;
  --text:'Nunito',system-ui,sans-serif;
  --bar:76px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden}
body{font-family:var(--text);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bar{height:var(--bar);flex:0 0 var(--bar);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--deep);position:relative;z-index:5}
#bar .sp{flex:1}
.btn{border:0;cursor:pointer;font:inherit;color:inherit;touch-action:manipulation}
.ibtn{width:62px;height:62px;border-radius:18px;background:var(--orange);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #b24a1c}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b24a1c}
.ibtn.soft{background:#1c5a6e;box-shadow:0 4px 0 #0a2a36}
.ibtn svg{width:34px;height:34px}
#homeBtn[hidden],#soundBtn[hidden]{display:none}
#pill{display:flex;align-items:center;gap:8px;background:#0a2a36;border-radius:999px;padding:6px 20px 6px 8px;font-family:var(--num);font-weight:800;font-size:38px;line-height:1;color:var(--foam);min-width:120px}
#pill svg{width:48px;height:48px;flex:0 0 48px}
#pill.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.18)}}
#screen{flex:1;position:relative;overflow:hidden;background:linear-gradient(#cdeaf0 0 55%,#17879A 55%)}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;overflow:hidden}
/* numeral pop */
#pop{position:fixed;left:50%;top:calc(var(--bar) + 8px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;pointer-events:none;
  font-family:var(--num);font-weight:800;font-size:150px;line-height:1;color:#fff;-webkit-text-stroke:6px var(--deep);paint-order:stroke fill;opacity:0;text-shadow:0 6px 0 rgba(15,59,76,.35)}
#pop.on{animation:pop .9s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.4)}18%{opacity:1;transform:translateX(-50%) scale(1.12)}30%{transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.flycoin{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px}
/* Suds */
#suds{position:fixed;left:calc(10px + env(safe-area-inset-left));bottom:calc(6px + env(safe-area-inset-bottom));width:132px;height:132px;z-index:20;cursor:pointer;touch-action:manipulation}
#suds svg{width:100%;height:100%;overflow:visible}
#suds .bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{50%{transform:translateY(-5px)}}
#suds.hop .bob{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-34px)}60%{transform:translateY(0)}75%{transform:translateY(-8px)}}
#suds .m-happy,#suds .m-think,#suds .e-think{display:none}
#suds.happy .m-rest,#suds.think .m-rest{display:none}
#suds.happy .m-happy{display:inline}
#suds.think .m-think,#suds.think .e-think{display:inline}
#suds.think .e-rest{display:none}
#suds .armL,#suds .armR{transform-box:fill-box;transition:transform .3s}
#suds .armL{transform-origin:100% 50%}
#suds .armR{transform-origin:0% 50%}
#suds.happy .armL{transform:rotate(50deg)}
#suds.happy .armR{transform:rotate(-50deg)}
#suds.think .bulb{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{fill:#fff3b0}}
#suds .point{display:none}
/* home */
.home{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto}
.home .scenewrap{position:relative;min-height:0;background:linear-gradient(#cdeaf0 0 54.3%,#D9B382 54.3% 67.2%,#b98a55 67.2% 71.7%,#17879A 71.7%)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:16px 22px 22px 160px;background:var(--deep)}
.tile{height:150px;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.tile svg{width:120px;height:120px}
.t-wash{background:#8fd3e0}.t-park{background:var(--sand)}.t-shop{background:var(--yellow)}.t-jar{background:#f7a27b}
.tile .jarnum{font-family:var(--num);font-weight:800}
@media (orientation:portrait){
  .tiles{grid-template-columns:repeat(2,1fr);padding:16px 22px 22px 22px}
  .tiles .tile{height:140px}
  .home .scenewrap{min-height:0}
  .on-home #suds{bottom:calc(346px + env(safe-area-inset-bottom))}
}
@media (orientation:portrait) and (max-width:600px){ .on-home #suds{bottom:calc(262px + env(safe-area-inset-bottom))} }
@media (max-height:500px){ .tile{height:96px} .tile svg{width:78px;height:78px} :root{--bar:62px} .ibtn{width:52px;height:52px} #pill{font-size:30px} #pill svg{width:38px;height:38px;flex-basis:38px} #suds{width:96px;height:96px} #pop{font-size:110px} }
@media (max-width:600px){ .tiles{gap:12px;padding:12px} .tile{height:110px} .tile svg{width:86px;height:86px} #suds{width:92px;height:92px} }
/* shop */
.shop{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#e6f3f6;padding:20px 22px 150px;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;max-width:1200px;margin:0 auto}
.card{position:relative;height:190px;border-radius:24px;background:#fff;box-shadow:0 5px 0 #b8d3da;display:flex;align-items:center;justify-content:center;padding:10px}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #b8d3da}
.card svg.veh{width:100%;height:150px}
.card .tag{position:absolute;right:12px;top:10px}
.card.owned{background:#fff8dc;box-shadow:0 5px 0 #e3c873}
.card .star{position:absolute;left:12px;top:10px;width:46px;height:46px}
.tagbox{min-width:70px;height:64px;padding:0 12px;border:4px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--num);font-weight:800;font-size:46px;line-height:56px;text-align:center;color:var(--ink)}
/* buy and jar */
.buy{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;background:linear-gradient(#cdeaf0 0 62%,#d9b382 62% 70%,#b98a55 70% 74%,#17879A 74%)}
.buy .stage{position:relative;min-height:0}
.buy .stage svg{position:absolute;inset:0;width:100%;height:100%}
.buy .lower{display:flex;align-items:center;justify-content:center;gap:28px;padding:10px 20px 26px 160px;flex-wrap:wrap}
.tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:rgba(15,59,76,.85);border-radius:26px;padding:14px 18px;max-width:780px}
.slot{width:64px;height:64px;border-radius:50%;border:5px dashed rgba(255,255,255,.75);position:relative}
.slot svg{position:absolute;inset:-5px;width:64px;height:64px;animation:land .25s ease}
@keyframes land{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.slot.big{width:58px;height:58px}
.pile{width:150px;height:150px;border-radius:30px;background:var(--deep);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #071f29;position:relative}
.pile:active{transform:translateY(4px);box-shadow:0 2px 0 #071f29}
.pile svg{width:120px;height:120px}
.pile.empty{background:#2b4f5c}
.pile.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 #071f29,0 0 0 10px rgba(255,216,74,.7)}}
.earn{display:none;gap:16px;flex-wrap:wrap;justify-content:center}
.earn.on{display:flex}
.earn .tile{width:130px;height:120px}
.earn .tile svg{width:96px;height:96px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
/* jar */
.jarwrap{display:flex;align-items:center;justify-content:center;gap:34px;height:100%;padding:10px 20px 10px 150px}
.jar{position:relative;width:340px;max-width:40vw;aspect-ratio:340/420}
.jar svg{width:100%;height:100%}
.jarveh{width:360px;max-width:34vw;display:flex;flex-direction:column;align-items:center;gap:10px}
.jarveh svg{width:100%;height:auto}
@media (orientation:portrait){ .jarwrap{flex-direction:column;gap:14px;padding:16px} .jar{width:300px;max-width:70vw} .jarveh{width:340px;max-width:70vw} }
/* next button and level picker */
.next{position:absolute;right:22px;bottom:22px;width:110px;height:110px;border-radius:32px;background:var(--orange);box-shadow:0 6px 0 #b24a1c;display:none;align-items:center;justify-content:center;z-index:10}
.next.on{display:flex;animation:pulse 1.2s ease-in-out infinite}
.next svg{width:64px;height:64px}
.levels{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:34px;background:rgba(15,59,76,.55);z-index:15;padding-left:120px}
.lvl{width:170px;height:170px;border-radius:36px;background:#fff;box-shadow:0 7px 0 #8fb6c0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lvl:active{transform:translateY(4px)}
.lvl b{font-family:var(--num);font-weight:800;font-size:82px;line-height:.9}
.lvl .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:120px}
.lvl .dots i{width:10px;height:10px;border-radius:50%;background:var(--orange)}
.lvl.cur{box-shadow:0 7px 0 #8fb6c0,0 0 0 8px var(--yellow)}
@media (max-width:700px){ .levels{gap:14px;padding-left:0} .lvl{width:110px;height:130px} .lvl b{font-size:56px} .lvl .dots{width:90px} .lvl .dots i{width:7px;height:7px} }
/* motion */
.wig{animation:wig .45s ease}
@keyframes wig{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.bub{animation:bub 1s ease-out forwards}
@keyframes bub{to{transform:translateY(-70px);opacity:0}}
.spark{animation:spark .9s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%{transform:scale(0) rotate(0)}40%{transform:scale(1.2) rotate(30deg)}100%{transform:scale(0) rotate(80deg);opacity:0}}
.honk{animation:honk .5s ease}
@keyframes honk{30%{transform:translateY(-14px)}}
/* grown-ups */
#gear{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;z-index:6}
#gear svg{width:26px;height:26px}
#grown{position:fixed;inset:0;background:rgba(10,30,40,.7);z-index:60;display:none;align-items:center;justify-content:center}
#grown.on{display:flex}
#grown .box{background:#fff;border-radius:22px;padding:26px 28px;max-width:440px;width:90%;font-size:18px;line-height:1.4}
#grown h2{margin:0 0 8px;font-family:var(--num);font-size:28px}
#grown .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
#grown button{border:0;border-radius:14px;padding:14px 18px;font:700 17px var(--text);background:#e6f3f6;color:var(--ink);position:relative;overflow:hidden}
#grown button.warn{background:#fde2d6}
#grown button .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(242,106,46,.35)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="btn ibtn" id="homeBtn" aria-label="Home" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#1c2430" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
    <button class="btn ibtn soft" id="soundBtn" aria-label="Sound on or off"></button>
    <div class="sp"></div>
    <div id="pill" aria-live="polite"><svg viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="28" r="23" fill="#b9831b"/><circle cx="27" cy="25.7" r="19.8" fill="#ffd84a"/><circle cx="27" cy="25.7" r="12" fill="none" stroke="#e8b52e" stroke-width="3"/></svg><span id="coinNum">0</span></div>
  </div>
  <div id="screen"></div>
</div>
<div id="suds" role="button" aria-label="Suds the wash robot"></div>
<div id="pop" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<div id="grown" role="dialog" aria-label="Grown-ups">
  <div class="box">
    <h2>For grown-ups</h2>
    <div>Everett's Vehicle Lot saves on this device only. Every coin is worth 1. Wash and Park earn coins; the Shop and the Jar spend them.</div>
    <div class="row">
      <button id="g10">Add 10 coins</button>
      <button id="gReset" class="warn"><span class="fill"></span><span style="position:relative">Hold to reset everything</span></button>
      <button id="gClose">Close</button>
    </div>
  </div>
</div>
<script>

function tone(f,d,type,g,delay,f2){if(!S.sound)return;var c=ac();if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),a=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);a.gain.setValueAtTime(0.0001,t);a.gain.exponentialRampToValueAtTime(g||0.15,t+0.01);a.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(a);a.connect(c.destination);o.start(t);o.stop(t+d+0.05);}

  whir:function(){tone(110,.6,'sawtooth',.04,0,220);noise(.5,500,.04);},
  whoosh:function(){noise(.45,900,.09);},
  splash:function(){noise(.35,700,.08);tone(300,.2,'sine',.06,0,150);}

document.addEventListener('pointerdown',function(){ac();},{once:true,capture:true});

function containers(){var c=['#F26A2E','#FFD84A','#17879A','#e5342b','#22a35a','#1f6fd6','#f4a6c6','#D9B382'],s='';for(var r=0;r<2;r++)for(var i=0;i<8;i++){s+='<rect x="'+(-164+i*44)+'" y="'+(-86-r*25)+'" width="40" height="22" rx="2" fill="'+c[(i+r*3)%8]+'"/><path d="M'+(-156+i*44)+','+(-82-r*25)+'v14M'+(-146+i*44)+','+(-82-r*25)+'v14M'+(-136+i*44)+','+(-82-r*25)+'v14" stroke="#000" stroke-opacity=".15" stroke-width="2"/>';}return s;}
var V=[
 {id:'car',kind:'land',price:3,w:94,h:102,home:[78,462,.42],d:function(){return '<path d="M-84,-20 L-84,-46 Q-84,-58 -70,-60 L-44,-64 L-22,-96 Q-18,-102 -8,-102 L36,-102 Q46,-102 52,-94 L72,-64 L82,-58 Q90,-54 90,-44 L90,-20Z" fill="#e5342b"/><path d="M-34,-66 L-16,-92 L6,-92 L6,-66Z M14,-92 L38,-92 Q42,-92 45,-88 L58,-66 L14,-66Z" fill="'+GL+'"/><circle cx="84" cy="-46" r="5" fill="#FFD84A"/><rect x="-88" y="-28" width="182" height="10" rx="5" fill="#1c2430"/>'+wheel(-50,17)+wheel(54,17);}},

function sparkles(svg,x,y,spread,n){for(var i=0;i<(n||6);i++){var g=document.createElementNS(NS,'path');var px=x+rnd(-spread,spread),py=y+rnd(-spread*.6,spread*.4),r=rnd(10,18);g.setAttribute('d','M'+px+','+(py-r)+' L'+(px+r*.3)+','+(py-r*.3)+' L'+(px+r)+','+py+' L'+(px+r*.3)+','+(py+r*.3)+' L'+px+','+(py+r)+' L'+(px-r*.3)+','+(py+r*.3)+' L'+(px-r)+','+py+' L'+(px-r*.3)+','+(py-r*.3)+'Z');g.setAttribute('fill',i%2?'#fff':'#FFD84A');g.setAttribute('class','spark');g.style.animationDelay=(i*70)+'ms';svg.appendChild(g);(function(el){setTimeout(function(){el.remove();},1400);})(g);}}
function tween(dur,step,done){var t0=performance.now();dur=reduce?1:dur;function f(t){var k=Math.min(1,(t-t0)/dur);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;step(e);if(k<1)requestAnimationFrame(f);else if(done)done();}requestAnimationFrame(f);}
function earnTo(coinsFrom,n,done){/* fly n coins from elements into the pill, counting up */
  var pill=center($('#pill'));var i=0;
  (function next(){if(i>=n){if(done)done();return;}var src=coinsFrom[i]?center(coinsFrom[i]):{x:innerWidth/2,y:innerHeight/2};if(coinsFrom[i])coinsFrom[i].style.visibility='hidden';i++;
    fly(src,pill,480,function(){S.coins++;save();showCoins(true);sfx.coin();});later(next,170);})();
}
function makeTray(n,big){var t=document.createElement('div');t.className='tray';for(var i=0;i<n;i++){var s=document.createElement('div');s.className='slot'+(big?' big':'');t.appendChild(s);}return t;}
function fillSlot(slot){slot.innerHTML=coinSVG(64);}

function planks(y,h,x0,x1){var s='<rect x="'+x0+'" y="'+y+'" width="'+(x1-x0)+'" height="'+h+'" fill="#b98a55"/>';for(var x=x0+20;x<x1;x+=40)s+='<path d="M'+x+','+y+'v'+h+'" stroke="#8a6238" stroke-width="3"/>';return s;}
function waves(y0,y1,w){var s='<g stroke="#fff" stroke-opacity=".45" stroke-width="4" stroke-linecap="round" fill="none">';for(var i=0;i<9;i++){var x=(i*157)%w-(w>1200?600:0),y=y0+((i*53)%(y1-y0));s+='<path d="M'+x+','+y+'q20-10 40,0t40,0"/>';}return s+'</g>';}

var cur='home', onLeave=null;
function go(name,arg){clearTimers();if(onLeave){try{onLeave();}catch(e){}onLeave=null;}cur=name;suds('rest');$('#fx').innerHTML='';
  $('#homeBtn').hidden=(name==='home');$('#soundBtn').hidden=(name!=='home');

var SCREENS={};

/* HOME */
SCREENS.home=function(scr,fresh){
  var h=document.createElement('div');h.className='home';
  var owned=S.owned.slice();
  var vs='';
  /* draw back row first: land, air, then water rows */
  var order=V.filter(function(v){return owned.indexOf(v.id)>=0;}).sort(function(a,b){return a.home[1]-b.home[1];});
  order.forEach(function(v){vs+=vg(v,v.home[0],v.home[1],v.home[2]);});
  h.innerHTML='<div class="scenewrap"><svg class="scene" id="hs" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Everett\'s harbor lot">'+harborHome()+vs+'</svg><button class="btn" id="gear" aria-label="Grown-ups">'+ICON.gear+'</button></div>'+
   '<div class="tiles"><button class="btn tile t-wash" data-go="wash" aria-label="Wash">'+ICON.wash+'</button><button class="btn tile t-park" data-go="park" aria-label="Park">'+ICON.park+'</button><button class="btn tile t-shop" data-go="shop" aria-label="Shop">'+ICON.shop+'</button><button class="btn tile t-jar" data-go="jar" aria-label="Jar">'+ICON.jar+'</button></div>';
  scr.appendChild(h);
  scr.style.background='#0F3B4C';
  h.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){sfx.pop();go(b.getAttribute('data-go'));});});
  var svg=$('#hs');
  svg.querySelectorAll('.veh').forEach(function(g){g.style.cursor='pointer';g.addEventListener('click',function(){var v=VB[g.getAttribute('data-id')];var inner=g.firstChild;
    g.classList.remove('honk');void g.getBoundingClientRect();
    var tr=g.getAttribute('transform');var y0=v.home[1];tween(450,function(e){var up=Math.sin(e*Math.PI)*22;g.setAttribute('transform','translate('+v.home[0]+','+(y0-up)+') scale('+v.home[2]+')');});
    (v.kind==='land'?sfx.horn:v.kind==='air'?sfx.whir:sfx.toot)();});});
  $('#gear').addEventListener('click',function(){$('#grown').classList.add('on');});
  if(fresh&&VB[fresh]){var v=VB[fresh];later(function(){sparkles(svg,v.home[0],v.home[1]-v.h*v.home[2]*.5,v.w*v.home[2],8);sfx.cheer();suds('happy',1800);},350);}
  else if(!S.owned.length){suds('happy',1200);}
};

/* WASH */
SCREENS.wash=function(scr){
  var pool=SMALL;var v=pool[rnd(0,pool.length-1)];
  var n=rnd(2,5);
  var water=v.kind==='water';
  var s=water?560:570, k=Math.min(2.4,430/(v.w*2)), cx=600;
  var bg='<rect x="-1400" width="4000" height="700" fill="#cdeaf0"/><circle cx="1080" cy="80" r="38" fill="#FFD84A"/>'+clouds()+lighthouse(150,330,.8)+
    '<rect x="-1400" y="300" width="4000" height="400" fill="#D9B382"/><rect x="230" y="420" width="740" height="200" rx="30" fill="#8fa5ad"/><rect x="250" y="436" width="700" height="168" rx="24" fill="#a9bec5"/><g stroke="#8fa5ad" stroke-width="5"><path d="M560,600h80M570,590h60"/></g>'+
    '<g transform="translate(1060,560)"><rect x="-10" y="-210" width="20" height="210" fill="#3d444d"/><circle cy="-150" r="44" fill="#F26A2E"/><circle cy="-150" r="26" fill="none" stroke="#c4501d" stroke-width="10"/><circle cy="-150" r="8" fill="#1c2430"/></g>';
  var cradle=water?'<g fill="#7a5632"><rect x="'+(cx-130)+'" y="'+(s)+'" width="40" height="34" rx="6"/><rect x="'+(cx+90)+'" y="'+(s)+'" width="40" height="34" rx="6"/></g>':'';
  scr.innerHTML='<svg class="scene" id="ws" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Wash the muddy vehicle">'+bg+cradle+vg(v,cx,s,k,' id="wv"')+'<g id="mud"></g><g id="bubs"></g><g id="sponge" style="display:none"><rect x="-44" y="-30" width="88" height="60" rx="18" fill="#FFD84A" stroke="#1c2430" stroke-width="5"/><path d="M-30,-10h60M-30,8h60" stroke="#e0b52a" stroke-width="5"/></g></svg>'+
   '<div style="position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;pointer-events:none" id="trayWrap"></div><button class="btn next" id="nextBtn" aria-label="Next vehicle">'+ICON.next+'</button>';
  scr.style.background='linear-gradient(#cdeaf0 0 42.9%,#D9B382 42.9%)';
  var svg=$('#ws'),mud=$('#mud'),bubs=$('#bubs'),sponge=$('#sponge');
  var tray=makeTray(n);$('#trayWrap').appendChild(tray);var slots=tray.children;
  /* place mud where the vehicle is drawn */
  var blobs=[];
  later(function(){
    var R=svg.getBoundingClientRect();var vb=$('#wv').getBoundingClientRect();
    var unit=R.width/1200; if(R.height/700<unit)unit=R.height/700;
    var r=40, rs=r*unit, tries=0;
    while(blobs.length<n&&tries<900){tries++;
      var sx=vb.left+vb.width*(.12+Math.random()*.76), sy=vb.top+vb.height*(.18+Math.random()*.7);
      var el=document.elementFromPoint(sx,sy);if(!el||!el.closest||!el.closest('#wv'))continue;
      if(el.getAttribute('fill')==='#1c2430'&&tries<600)continue;
      var ok=true;for(var i=0;i<blobs.length;i++){var b=blobs[i];if(Math.hypot(b.sx-sx,b.sy-sy)<rs*2.3){ok=false;break;}}if(!ok)continue;
      var p=svgPt(svg,sx,sy);blobs.push({sx:sx,sy:sy,x:p.x,y:p.y,dirt:1});}
    while(blobs.length<n){var p2={x:cx-120+blobs.length*80,y:s-v.h*k*.5};blobs.push({x:p2.x,y:p2.y,dirt:1});}
    blobs.forEach(function(b,i){var g=document.createElementNS(NS,'g');var rr=r;g.setAttribute('transform','translate('+b.x+','+b.y+')');
      g.innerHTML='<circle r="'+rr+'" fill="#8a6238"/><circle cx="'+(rr*.7)+'" cy="'+(-rr*.4)+'" r="'+(rr*.55)+'" fill="#8a6238"/><circle cx="'+(-rr*.65)+'" cy="'+(rr*.35)+'" r="'+(rr*.5)+'" fill="#8a6238"/><circle cx="'+(-rr*.2)+'" cy="'+(-rr*.25)+'" r="'+(rr*.28)+'" fill="#6e4b28"/><circle cx="'+(rr*.4)+'" cy="'+(rr*.3)+'" r="'+(rr*.18)+'" fill="#6e4b28"/>';
      mud.appendChild(g);b.g=g;});
  },60);
  var down=false,last=null,moved=0,cleaned=0,done=false;
  function clean(b){b.g.remove();b.dirt=-1;cleaned++;sfx.pop();sparkles(svg,b.x,b.y,30,4);popNum(cleaned);
    var c=document.createElementNS(NS,'g');c.innerHTML=coinG(b.x,b.y,30);svg.appendChild(c);
    var from=center(c);var slot=slots[cleaned-1];
    later(function(){c.remove();fly(from,center(slot),450,function(){fillSlot(slot);sfx.coin();});},200);
    if(cleaned===n)later(finish,900);}
  function finish(){done=true;sponge.style.display='none';suds('happy',2200);sfx.cheer();var vb=$('#wv').getBBox();sparkles(svg,cx,s-v.h*k*.55,v.w*k*.8,10);
    later(function(){earnTo(Array.prototype.map.call(slots,function(sl){return sl.firstChild;}),n,function(){$('#nextBtn').classList.add('on');});},900);}
  function at(e){return svgPt(svg,e.clientX,e.clientY);}
  function rub(p,amt,tap){blobs.forEach(function(b){if(b.dirt<=0)return;var d=Math.hypot(b.x-p.x,b.y-p.y);if(d<70){b.dirt-=tap?.34:amt;if(b.dirt<=0)clean(b);else{b.g.setAttribute('opacity',(.25+b.dirt*.75).toFixed(2));}}});}
  function bubble(p){var c=document.createElementNS(NS,'circle');c.setAttribute('cx',p.x+rnd(-30,30));c.setAttribute('cy',p.y+rnd(-20,10));c.setAttribute('r',rnd(7,15));c.setAttribute('fill','#fff');c.setAttribute('stroke','#17879A');c.setAttribute('stroke-width','3');c.setAttribute('class','bub');bubs.appendChild(c);setTimeout(function(){c.remove();},1000);}
  svg.addEventListener('pointerdown',function(e){if(done)return;down=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}var p=at(e);last=p;sponge.style.display='';sponge.setAttribute('transform','translate('+p.x+','+p.y+')');rub(p,0,true);bubble(p);sfx.scrub();});
  svg.addEventListener('pointermove',function(e){if(!down||done)return;var p=at(e);var d=Math.hypot(p.x-last.x,p.y-last.y);last=p;moved+=d;sponge.setAttribute('transform','translate('+p.x+','+p.y+') rotate('+(Math.sin(moved/40)*12)+')');rub(p,d/260,false);if(moved>36){moved=0;bubble(p);sfx.scrub();if(Math.random()<.4)sfx.bubble();}});
  function up(){down=false;}
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  $('#nextBtn').addEventListener('click',function(){sfx.pop();go('wash');});
};

/* PARK */
var LV=[5,10,20];
SCREENS.park=function(scr){
  scr.style.background='linear-gradient(#cdeaf0 0 40%,#D9B382 40%)';
  var wrap=document.createElement('div');wrap.style.cssText='position:absolute;inset:0';scr.appendChild(wrap);
  var lv=document.createElement('div');lv.className='levels';
  LV.forEach(function(m,i){var b=document.createElement('button');b.className='btn lvl'+(S.park===i?' cur':'');b.setAttribute('aria-label','Numbers up to '+m);var dots='';for(var j=0;j<m;j++)dots+='<i></i>';b.innerHTML='<b>'+m+'</b><span class="dots">'+dots+'</span>';b.addEventListener('click',function(){S.park=i;save();sfx.pop();lv.remove();round(m);});lv.appendChild(b);});
  scr.appendChild(lv);
  function round(max){
    var cars=[],ids=shuffle(SMALL.slice());
    for(var i=0;i<4;i++)cars.push(ids[i]);
    var idx=0,earned=0;
    var trayWrap=document.createElement('div');trayWrap.style.cssText='position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;pointer-events:none;z-index:4';
    var tray=makeTray(4);trayWrap.appendChild(tray);scr.appendChild(trayWrap);
    var nb=document.createElement('button');nb.className='btn next';nb.setAttribute('aria-label','Park again');nb.innerHTML=ICON.next;nb.addEventListener('click',function(){sfx.pop();go('park');});scr.appendChild(nb);
    function one(){
      var v=cars[idx];var kind=v.kind;
      var target=rnd(1,max);var nums=[target];while(nums.length<4){var q=rnd(1,max);if(nums.indexOf(q)<0)nums.push(q);}shuffle(nums);
      var X=[500,680,860,1040];
      var bg,gy,k,sp='';
      if(kind==='land'){
        bg='<rect x="-1400" width="4000" height="700" fill="#cdeaf0"/>'+clouds()+lighthouse(1150,280,.75)+'<rect x="-1400" y="280" width="4000" height="320" fill="#D9B382"/>'+planks(600,30,-1400,2600)+'<rect x="-1400" y="630" width="4000" height="70" fill="#17879A"/>';
        gy=520;k=.78;
        X.forEach(function(x,i){sp+='<rect x="'+(x-86)+'" y="330" width="172" height="210" fill="#c9a26f"/><path d="M'+(x-86)+',330 v210 M'+(x+86)+',330 v210" stroke="#fff" stroke-width="7"/>'+signG(nums[i],x,320);});
        sp+='<rect x="70" y="330" width="240" height="210" rx="20" fill="#c9a26f" stroke="#fff" stroke-width="5" stroke-dasharray="16 12"/>';
      }else if(kind==='water'){
        bg='<rect x="-1400" width="4000" height="700" fill="#cdeaf0"/>'+clouds()+'<rect x="-1400" y="240" width="4000" height="60" fill="#D9B382"/>'+planks(300,30,-1400,2600)+'<rect x="-1400" y="330" width="4000" height="370" fill="#17879A"/>'+waves(600,690,2400);
        gy=560;k=.72;
        X.forEach(function(x,i){sp+=(i===0?'<rect x="'+(x-94)+'" y="300" width="14" height="300" fill="#7a5632"/>':'')+'<rect x="'+(x+80)+'" y="300" width="14" height="300" fill="#7a5632"/><rect x="'+(x-80)+'" y="340" width="160" height="250" fill="#0f3b4c" fill-opacity=".14"/>'+signG(nums[i],x,240);});
        sp+='<rect x="70" y="380" width="240" height="210" rx="20" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="16 12" stroke-opacity=".8"/>';
      }else{
        bg='<rect x="-1400" width="4000" height="700" fill="#cdeaf0"/>'+clouds()+'<circle cx="110" cy="90" r="40" fill="#FFD84A"/><rect x="-1400" y="440" width="4000" height="150" fill="#D9B382"/>'+planks(590,30,-1400,2600)+'<rect x="-1400" y="620" width="4000" height="80" fill="#17879A"/>';
        gy=530;k=.62;
        X.forEach(function(x,i){sp+='<ellipse cx="'+x+'" cy="'+(gy-4)+'" rx="84" ry="22" fill="#0F3B4C"/><ellipse cx="'+x+'" cy="'+(gy-4)+'" rx="66" ry="14" fill="none" stroke="#FFD84A" stroke-width="5"/>'+signG(nums[i],x,360);});
        sp+='<ellipse cx="190" cy="'+(gy-4)+'" rx="110" ry="26" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="16 12"/>';
      }
      var sx=190;
      scr.style.background=kind==='land'?'linear-gradient(#cdeaf0 0 40%,#D9B382 40% 85.7%,#b98a55 85.7% 90%,#17879A 90%)':kind==='water'?'linear-gradient(#cdeaf0 0 34.3%,#D9B382 34.3% 42.9%,#b98a55 42.9% 47.1%,#17879A 47.1%)':'linear-gradient(#cdeaf0 0 62.9%,#D9B382 62.9% 84.3%,#b98a55 84.3% 88.6%,#17879A 88.6%)';
      wrap.innerHTML='<svg class="scene" id="ps" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Park the vehicle by its number">'+bg+sp+'<g id="pv" transform="translate('+sx+','+gy+')"><rect x="'+(-v.w*k-24)+'" y="'+(-v.h*k-90)+'" width="'+(v.w*k*2+48)+'" height="'+(v.h*k+110)+'" fill="transparent" pointer-events="all"/><g transform="scale('+k+')">'+v.d()+'</g>'+tagG(target,0,-v.h*k-34)+'</g></svg>';
      var svg=$('#ps'),pv=$('#pv');pv.style.cursor='grab';
      /* arrive */
      var arriveFrom=kind==='air'?[sx,gy-320]:[-260,gy];
      pv.setAttribute('transform','translate('+arriveFrom[0]+','+arriveFrom[1]+')');
      (kind==='land'?sfx.horn:kind==='air'?sfx.whir:sfx.toot)();
      var busy=true;
      tween(800,function(e){pv.setAttribute('transform','translate('+(arriveFrom[0]+(sx-arriveFrom[0])*e)+','+(arriveFrom[1]+(gy-arriveFrom[1])*e)+')');},function(){busy=false;});
      var pos={x:sx,y:gy},drag=null;
      function place(x,y){pos.x=x;pos.y=y;pv.setAttribute('transform','translate('+x+','+y+')');}
      pv.addEventListener('pointerdown',function(e){if(busy)return;e.preventDefault();var p=svgPt(svg,e.clientX,e.clientY);drag={dx:p.x-pos.x,dy:p.y-pos.y,id:e.pointerId};try{pv.setPointerCapture(e.pointerId);}catch(_){}pv.style.cursor='grabbing';sfx.pop();});
      pv.addEventListener('pointermove',function(e){if(!drag)return;var p=svgPt(svg,e.clientX,e.clientY);place(Math.max(60,Math.min(1140,p.x-drag.dx)),Math.max(200,Math.min(660,p.y-drag.dy)));});
      function drop(){if(!drag)return;drag=null;pv.style.cursor='grab';
        var best=-1,bd=1e9;X.forEach(function(x,i){var d=Math.abs(x-pos.x);if(d<bd){bd=d;best=i;}});
        if(bd<110&&Math.abs(pos.y-gy)<230){
          if(nums[best]===target){busy=true;var x0=pos.x,y0=pos.y,tx=X[best];tween(260,function(e){place(x0+(tx-x0)*e,y0+(gy-y0)*e);},function(){
              (kind==='water'?sfx.splash:sfx.pop)();sparkles(svg,tx,gy-v.h*k*.5,70,6);suds('happy',1200);earned++;popNum(target);
              var slot=tray.children[earned-1];var c=scrPt(svg,tx,gy-v.h*k-60);
              later(function(){fly({x:c.x,y:c.y},center(slot),460,function(){fillSlot(slot);sfx.coin();});},250);
              idx++;
              later(function(){if(idx<4)one();else finishRound();},1100);});
            return;}
          /* wrong number */
          sfx.wiggle();suds('think',1400);
        }
        busy=true;var x1=pos.x,y1=pos.y;tween(420,function(e){place(x1+(sx-x1)*e,y1+(gy-y1)*e);},function(){busy=false;pv.classList.add('wig');setTimeout(function(){pv.classList.remove('wig');},500);});}
      pv.addEventListener('pointerup',drop);pv.addEventListener('pointercancel',drop);
    }
    function finishRound(){sfx.cheer();suds('happy',2500);later(function(){earnTo(Array.prototype.map.call(tray.children,function(sl){return sl.firstChild;}),4,function(){nb.classList.add('on');});},500);}
    one();
  }
};

};

/* pile of coins in the wallet */
function pileSVG(n){var s='<svg viewBox="0 0 120 120" aria-hidden="true">';if(n<=0){s+='<circle cx="60" cy="62" r="34" fill="none" stroke="#8fb6c0" stroke-width="5" stroke-dasharray="9 8"/>';}else{var m=Math.min(n,7);for(var i=0;i<m;i++){s+='<ellipse cx="60" cy="'+(98-i*11)+'" rx="38" ry="12" fill="#b9831b"/><ellipse cx="60" cy="'+(94-i*11)+'" rx="38" ry="12" fill="#ffd84a"/>';}}return s+'</svg>';}

/* BUY */
SCREENS.buy=function(scr,id){
  var v=VB[id];if(!v||S.owned.indexOf(id)>=0){go('shop');return;}
  var n=v.price,placed=0,left=S.coins;
  var b=document.createElement('div');b.className='buy';
  var k=Math.min(2.2,380/(v.w*2));
  b.innerHTML='<div class="stage"><svg id="bs" viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The vehicle and its price">'+(v.kind==='water'?'<g fill="#7a5632"><rect x="'+(500-v.w*k*.6)+'" y="390" width="34" height="30" rx="6"/><rect x="'+(500+v.w*k*.6-34)+'" y="390" width="34" height="30" rx="6"/></g>':'')+'<g id="bv">'+vg(v,500,390,k)+tagG(n,500+v.w*k+40,390-v.h*k*.7,1.3)+'</g></svg></div>'+
   '<div class="lower"><div id="tw"></div><button class="btn pile" id="pile" aria-label="Your coins"></button><div class="earn" id="earn"><button class="btn tile t-wash pulse" data-go="wash" aria-label="Wash">'+ICON.wash+'</button><button class="btn tile t-park pulse" data-go="park" aria-label="Park">'+ICON.park+'</button></div></div>';
  scr.appendChild(b);scr.style.background='#17879A';
  var tray=makeTray(n);$('#tw').appendChild(tray);
  var pile=$('#pile');
  function drawPile(){pile.innerHTML=pileSVG(left);pile.classList.toggle('empty',left<=0);pile.classList.toggle('glow',left>0&&placed<n);}
  drawPile();
  function showCoinsLeft(){$('#coinNum').textContent=left;}
  showCoinsLeft();
  onLeave=function(){showCoins();};
  function outOfCoins(){suds('think');pile.classList.remove('glow');$('#earn').classList.add('on');}
  if(left<=0)outOfCoins();
  b.querySelectorAll('#earn [data-go]').forEach(function(x){x.addEventListener('click',function(){sfx.pop();go(x.getAttribute('data-go'));});});
  var busy=false;
  pile.addEventListener('click',function(){if(busy||placed>=n)return;if(left<=0){sfx.wiggle();pile.classList.remove('wig');void pile.offsetWidth;pile.classList.add('wig');return;}
    left--;var slot=tray.children[placed];placed++;var count=placed;showCoinsLeft();drawPile();busy=true;
    fly(center(pile),center(slot),380,function(){fillSlot(slot);sfx.coin();popNum(count);busy=false;
      if(count===n)bought();else if(left<=0)outOfCoins();});});
  function bought(){busy=true;S.coins=left;S.owned.push(v.id);save();suds('happy',2500);sfx.cheer();
    var svg=$('#bs');sparkles(svg,500,390-v.h*k*.5,v.w*k,10);
    later(function(){var g=$('#bv');(v.kind==='land'?sfx.horn:v.kind==='air'?sfx.whir:sfx.toot)();
      tween(900,function(e){g.setAttribute('transform',v.kind==='air'?'translate(0,'+(-500*e)+')':'translate('+(900*e)+',0)');},function(){go('home',v.id);});},1200);}
};

/* JAR */
var JAR=20;
function jarSVG(n){var s='<svg viewBox="0 0 340 420" role="img" aria-label="The jar"><rect x="70" y="8" width="200" height="28" rx="10" fill="#8fb6c0"/><path d="M50,42 L290,42 Q316,42 316,70 L316,384 Q316,410 290,410 L50,410 Q24,410 24,384 L24,70 Q24,42 50,42Z" fill="#eef7fa" stroke="#8fb6c0" stroke-width="8"/>';
  for(var i=0;i<JAR;i++){var r=Math.floor(i/5),c=i%5;var x=66+c*52,y=372-r*76;
    if(i<n)s+=coinG(x,y,23);else s+='<circle cx="'+x+'" cy="'+y+'" r="21" fill="none" stroke="#b8d3da" stroke-width="4" stroke-dasharray="6 6"/>';}
  for(var j=1;j<4;j++)s+='<path d="M40,'+(410-j*76)+' H300" stroke="#d6e9ee" stroke-width="3"/>';
  return s+'</svg>';}
SCREENS.jar=function(scr){
  var goal=BIG.filter(function(v){return S.owned.indexOf(v.id)<0;})[0];
  scr.style.background='linear-gradient(#cdeaf0 0 70%,#17879A 70%)';
  var w=document.createElement('div');w.className='jarwrap';
  if(!goal){w.innerHTML='<div class="jar">'+jarSVG(JAR)+'</div><div style="width:140px">'+ICON.star.replace('class="star"','')+'</div>';scr.appendChild(w);suds('happy',2000);return;}
  w.innerHTML='<div class="jarveh"><svg viewBox="'+(-goal.w-20)+' '+(-goal.h-90)+' '+(goal.w*2+40)+' '+(goal.h+100)+'" role="img" aria-label="The big one">'+goal.d()+tagG(JAR,goal.w-30,-goal.h-20,1.3)+'</svg></div><div class="jar" id="jar">'+jarSVG(S.jar)+'</div><button class="btn pile" id="pile" aria-label="Your coins"></button>';
  scr.appendChild(w);
  var pile=$('#pile');
  var earn=document.createElement('div');earn.className='earn';earn.innerHTML='<button class="btn tile t-wash pulse" data-go="wash" aria-label="Wash">'+ICON.wash+'</button><button class="btn tile t-park pulse" data-go="park" aria-label="Park">'+ICON.park+'</button>';w.appendChild(earn);
  earn.querySelectorAll('[data-go]').forEach(function(x){x.addEventListener('click',function(){sfx.pop();go(x.getAttribute('data-go'));});});
  function drawPile(){pile.innerHTML=pileSVG(S.coins);pile.classList.toggle('empty',S.coins<=0);pile.classList.toggle('glow',S.coins>0);if(S.coins<=0){earn.classList.add('on');suds('think');}}
  drawPile();
  var busy=false;
  pile.addEventListener('click',function(){if(busy||S.jar>=JAR)return;if(S.coins<=0){sfx.wiggle();pile.classList.remove('wig');void pile.offsetWidth;pile.classList.add('wig');return;}
    busy=true;S.coins--;showCoins();drawPile();var i=S.jar;var r=Math.floor(i/5),c=i%5;
    var jarEl=$('#jar svg');var p=jarEl.createSVGPoint();p.x=66+c*52;p.y=372-r*76;var sp=p.matrixTransform(jarEl.getScreenCTM());
    fly(center(pile),{x:sp.x,y:sp.y},420,function(){S.jar++;save();$('#jar').innerHTML=jarSVG(S.jar);sfx.coin();popNum(S.jar);busy=false;
      if(S.jar>=JAR){busy=true;suds('happy',3000);sfx.cheer();later(function(){S.owned.push(goal.id);S.jar=0;save();go('home',goal.id);},1600);}
      else if(S.coins<=0)drawPile();});});
};

/* ---------- grown-ups ---------- */
$('#gClose').addEventListener('click',function(){$('#grown').classList.remove('on');});
$('#g10').addEventListener('click',function(){S.coins+=10;save();showCoins(true);});
(function(){var btn=$('#gReset'),fill=btn.querySelector('.fill'),t=null,t0=0;
  function stop(){cancelAnimationFrame(t);fill.style.width='0';}
  btn.addEventListener('pointerdown',function(){t0=performance.now();(function f(){var k=(performance.now()-t0)/2000;fill.style.width=Math.min(100,k*100)+'%';if(k>=1){S={v:1,coins:3,owned:[],jar:0,park:0,sound:S.sound};save();showCoins();stop();$('#grown').classList.remove('on');go('home');return;}t=requestAnimationFrame(f);})();});
  btn.addEventListener('pointerup',stop);btn.addEventListener('pointerleave',stop);btn.addEventListener('pointercancel',stop);})();

window.__lot={S:function(){return S;},go:go,V:V};
go('home');
})();
</script>
</body>
