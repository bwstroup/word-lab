}
function moreFacts(list) {
  return `<div style="display:grid;gap:6px"><button class="more" data-more aria-expanded="false">Tell me more</button><ul class="facts" hidden>${list.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>`;
}
const STATIONS = {};

/* ================= Zone 1: Tree of Life ================= */
const T = () => W.tree;
const branch = id => T().branches.find(b => b.id === id);
// family trees by level: arrays are branching points, strings are tips
const SHAPES = [
  ['bacteria', 'archaea', 'protists', 'plants', 'fungi', 'animals'],
  { k: 'root', c: [{ k: 'none', label: 'No nucleus', c: ['bacteria', 'archaea'] }, { k: 'nuc', label: 'With a nucleus', c: ['protists', 'plants', 'fungi', 'animals'] }] },
  { k: 'root', c: ['bacteria', { k: 'ae', c: ['archaea', { k: 'euk', label: 'Eukarya', c: ['protists', 'plants', { k: 'fa', c: ['fungi', 'animals'] }] }] }] },
];
function treeSvg(L, opts) {
  opts = opts || {};
  const Wd = 900, Hd = 580, tipY = 76, baseY = 540, shape = SHAPES[L - 1];
  const node = s => typeof s === 'string' ? { tip: s } : Array.isArray(s) ? { k: 'root', c: s.map(node) } : { k: s.k, label: s.label, c: s.c.map(node) };
  const root = node(shape);
  let i = 0; const order = ['bacteria', 'archaea', 'protists', 'plants', 'fungi', 'animals'];
  const depth = n => n.tip ? 0 : 1 + Math.max(...n.c.map(depth));
  const D = depth(root);
  const place = (n, d) => {
    if (n.tip) { n.x = 90 + order.indexOf(n.tip) * 144; n.y = tipY; return; }
    n.c.forEach(c => place(c, d + 1));
    n.x = n.c.reduce((a, c) => a + c.x, 0) / n.c.length;
    n.y = n === root ? baseY - 80 : tipY + 40 + (baseY - 120 - tipY) * (depth(n) / D);
  };
  place(root, 0);
  let lines = '', labels = '';
  const edge = (a, b, w) => `<path d="M${a.x},${a.y} C${a.x},${(a.y + b.y) / 2} ${b.x},${(a.y + b.y) / 2 + 30} ${b.x},${b.y}" fill="none" stroke="#6B4A2E" stroke-width="${w}" stroke-linecap="round"/>`;
  const walk = (n, w) => { if (n.tip) return; n.c.forEach(c => { lines += edge(n, c, Math.max(8, w)); walk(c, w * .72); });
    if (n.label) labels += `<text x="${n.x}" y="${n.y + 36}" text-anchor="middle" font-family="Atkinson Hyperlegible,sans-serif" font-weight="700" font-size="21" fill="#20302A" paint-order="stroke" stroke="#F3F9F5" stroke-width="6">${esc(n.label)}</text>`; };
  walk(root, 30);
  const trunk = `<path d="M${root.x - 40},${baseY + 30} C${root.x - 20},${baseY - 20} ${root.x - 18},${root.y + 10} ${root.x},${root.y} C${root.x + 18},${root.y + 10} ${root.x + 20},${baseY - 20} ${root.x + 40},${baseY + 30}Z" fill="#7A5236"/>`;
  const ground = `<path d="M0,${baseY + 20} Q450,${baseY - 6} 900,${baseY + 20} V600 H0Z" fill="#B8D7A4"/>`;
  const tips = order.map(id => {
    const b = branch(id), x = 90 + order.indexOf(id) * 144, src = (window.WILD_IMG || {})[b.photo];
    const pic = src ? `<clipPath id="cp-${id}${opts.sfx || ''}"><circle cx="${x}" cy="${tipY}" r="58"/></clipPath><image href="${src}" x="${x - 78}" y="${tipY - 58}" width="156" height="117" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp-${id}${opts.sfx || ''})"/>`
      : `<circle cx="${x}" cy="${tipY}" r="58" fill="#fff"/><text x="${x}" y="${tipY + 14}" text-anchor="middle" font-family="Young Serif,Georgia,serif" font-size="40" fill="${b.color}">${b.name[0]}</text>`;
    return `<g class="tip" data-b="${id}" tabindex="0" role="button" aria-label="${esc(b.name)}">${pic}<circle class="ring" cx="${x}" cy="${tipY}" r="58" fill="none" stroke="${b.color}" stroke-width="7"/>
      <g class="tick"><circle cx="${x + 44}" cy="${tipY - 44}" r="14" fill="#2F7A4A" stroke="#fff" stroke-width="3"/><path d="M${x + 37},${tipY - 44} l5,5 l9,-10" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="${x}" y="${tipY + 92}" text-anchor="middle" font-family="Young Serif,Georgia,serif" font-size="28" fill="#20302A" paint-order="stroke" stroke="#F3F9F5" stroke-width="6">${esc(b.name)}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${Wd} ${Hd}" role="group" aria-label="The Tree of Life">${ground}${lines}${trunk}${labels}${tips}</svg>`;
}

/* 1. Climb the Tree: tap every branch */
STATIONS.climb = function () {
  const L = lv(), seen = new Set();
  const st = stationShell('climb', `
    ${guide('moss', 'rest', `${g()} Tap each of the six branches at the top of the tree. ${L > 1 ? 'Follow the limbs down to see which branches are family.' : ''}`)}
    <div class="two">
      <div class="treeart" id="tree">${treeSvg(L)}</div>
      <div style="display:grid;gap:12px">
        <div class="card" id="bcard" style="display:grid;gap:10px;min-height:160px"><b>Tap a branch.</b><span class="muted">Six branches hold every living thing.</span></div>
        ${L > 1 ? `<p class="muted" style="font-size:16px">${esc(T().split[L - 1])}</p>` : ''}
        <p class="muted" id="bseen">Seen 0 of 6.</p>
      </div>
    </div>`);
  const tree = $('#tree');
  const showB = id => {
    const b = branch(id), tip = $(`.tip[data-b="${id}"]`, tree);
    tree.querySelectorAll('.tip').forEach(t => t.classList.toggle('sel', t === tip)); tip.classList.add('seen');
    $('#bcard').innerHTML = `${photo(b.photo)}${L > 1 && b.photo2 ? photo(b.photo2) : ''}<h3 style="color:${b.color}">${esc(b.name)}</h3><p>${esc(b.say[L - 1])}</p>
      ${L > 1 ? `<p class="muted" style="font-size:15px">${b.nucleus ? 'Cells with a nucleus.' : 'Cells with no nucleus.'}</p>` : ''}${moreFacts(b.more)}`;
    sfx.tap(); seen.add(id); $('#bseen').textContent = `Seen ${seen.size} of 6.`;
    if (seen.size === 6) { setGuide(st, 'moss', 'happy', `${g()} You’ve climbed every branch of the Tree of Life!`); award('climb', badgeOf('climb')); }
  };
  tree.addEventListener('click', e => { const t = e.target.closest('.tip'); if (t) showB(t.dataset.b); });
  tree.addEventListener('keydown', e => { const t = e.target.closest('.tip'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showB(t.dataset.b); } });
};

/* 2. Sort It: put each living thing on its branch */
function cardFor(c) { return c.photo ? photo(c.photo, c.t) : `<div class="wordcard">${esc(c.t)}</div>`; }
STATIONS.sort = function () {
  const L = lv(), all = T().sort;
  let deck = L === 1 ? all.filter(c => c.lv === 1) : L === 2 ? all.filter(c => c.lv <= 2) : all.filter(c => c.lv === 3).concat(shuffle(all.filter(c => c.lv < 3)).slice(0, 5));
  deck = shuffle(deck);
  const st = stationShell('sort', `
    ${guide('moss', 'think', `${g()} Which branch does each one belong on? Tap the branch.`)}
    <div class="two">
      <div style="display:grid;gap:12px">
        <div class="progress" aria-hidden="true"><i id="sprog" style="width:0"></i></div>
        <div class="sortcard" id="scard"></div>
        <div id="sfb"></div>
      </div>
      <div class="bins" id="sbins">${T().branches.map(b => `<button class="binbtn" data-b="${b.id}"><i style="background:${b.color}"></i><b>${esc(b.name)}</b></button>`).join('')}</div>
    </div>`);
  let k = 0, tries = 0;
  const show = () => {
    $('#sprog').style.width = (100 * k / deck.length) + '%';
    if (k >= deck.length) { $('#scard').innerHTML = `<div class="wordcard">All ${deck.length} sorted!</div>`; $('#sfb').innerHTML = '';
      setGuide(st, 'moss', 'happy', `${g()} Every one on the right branch. You sort like a real scientist!`); award('sort', badgeOf('sort')); return; }
    $('#scard').innerHTML = cardFor(deck[k]) + `<span class="muted">${k + 1} of ${deck.length}</span>`; $('#sfb').innerHTML = ''; tries = 0;
    st.querySelectorAll('.binbtn').forEach(b => b.classList.remove('wrong', 'right'));
  };
  $('#sbins').addEventListener('click', e => {
    const b = e.target.closest('.binbtn'); if (!b || k >= deck.length || $('#snext')) return;
    const c = deck[k];
    if (b.dataset.b === c.a) {
      sfx.good(); b.classList.add('right'); const br = branch(c.a);
      $('#sfb').innerHTML = `<div class="fb good">Yes! ${esc(c.why || `${c.t} sits on the ${br.name.toLowerCase()} branch.`)}</div><button class="btn" id="snext" style="margin-top:10px">${k + 1 < deck.length ? 'Next' : 'Finish'}</button>`;
      $('#snext').onclick = () => { k++; show(); }; $('#snext').focus();
    } else {
      sfx.oops(); b.classList.add('wrong'); bump(b, 'wiggle'); tries++;
      const hint = { bacteria: 'Is it one tiny cell with no nucleus?', archaea: 'Does it love very salty or hot places?', protists: 'Is it tiny, with a nucleus, but not a plant, animal or fungus?', plants: 'Does it make food from sunlight?', fungi: 'Does it soak up food from what it grows on?', animals: 'Does it eat other living things?' }[c.a];
      $('#sfb').innerHTML = `<div class="fb oops">Not that branch. ${tries > 1 ? esc(hint) : 'Try again!'}</div>`;
    }
  });
  show();
};

/* 3. Living or Not? */
STATIONS.alive = function () {
  const L = lv(), A = T().alive;
  let deck = L === 1 ? A.cards.filter(c => c.lv === 1) : L === 2 ? shuffle(A.cards.filter(c => c.lv <= 2)).slice(0, 8) : A.cards.filter(c => c.lv === 3).concat(shuffle(A.cards.filter(c => c.lv < 3)).slice(0, 3));
  deck = shuffle(deck);
  const cols = { living: '#2F7A4A', once: '#C9862A', never: '#8A9AA0' };
  const st = stationShell('alive', `
    ${guide('moss', 'think', `${g()} Is it living, once living, or never living?`)}
    <div class="two">
      <div style="display:grid;gap:12px">
        <div class="progress" aria-hidden="true"><i id="aprog" style="width:0"></i></div>
        <div class="sortcard" id="acard"></div>
        <div class="bins" id="abins">${A.bins.map(b => `<button class="binbtn" data-a="${b.id}"><i style="background:${cols[b.id]}"></i><b>${esc(b.name)}</b><span>${esc(b.say)}</span><span class="n" data-count="${b.id}">0</span></button>`).join('')}</div>
        <div id="afb"></div>
      </div>
      <div style="display:grid;gap:12px">
        <div class="card"><b>Signs of life</b><ul class="signs">${A.signs.slice(0, L === 1 ? 3 : 5).map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>
        ${L === 3 ? '<p class="muted" style="font-size:16px">Careful: some never-living things grow or move. A living thing shows all the signs, not just one.</p>' : ''}
      </div>
    </div>`);
  let k = 0; const counts = { living: 0, once: 0, never: 0 };
  const show = () => {
    $('#aprog').style.width = (100 * k / deck.length) + '%';
    if (k >= deck.length) { $('#acard').innerHTML = `<div class="wordcard">All ${deck.length} sorted!</div>`; $('#afb').innerHTML = '';
      setGuide(st, 'moss', 'happy', `${g()} Sharp eyes, detective. You can tell what’s alive!`); award('alive', badgeOf('alive')); return; }
    $('#acard').innerHTML = `<div class="wordcard">${esc(deck[k].t)}</div><span class="muted">${k + 1} of ${deck.length}</span>`; $('#afb').innerHTML = '';
    st.querySelectorAll('.binbtn').forEach(b => b.classList.remove('wrong', 'right'));
  };
  $('#abins').addEventListener('click', e => {
    const b = e.target.closest('.binbtn'); if (!b || k >= deck.length || $('#anext')) return;
    const c = deck[k];
    if (b.dataset.a === c.a) {
      sfx.good(); b.classList.add('right'); counts[c.a]++; $(`[data-count="${c.a}"]`, st).textContent = counts[c.a];
      $('#afb').innerHTML = `<div class="fb good">Yes! ${esc(c.why)}</div><button class="btn" id="anext" style="margin-top:10px">${k + 1 < deck.length ? 'Next' : 'Finish'}</button>`;
      $('#anext').onclick = () => { k++; show(); }; $('#anext').focus();
    } else { sfx.oops(); b.classList.add('wrong'); bump(b, 'wiggle'); $('#afb').innerHTML = `<div class="fb oops">Not quite. Check the signs of life and try again.</div>`; }
  });
  show();
};

/* 4. Who's Closer? */
STATIONS.closer = function () {
  const L = lv(), C = T().closer;
  const deck = C.filter(c => c.lv === L).concat(shuffle(C.filter(c => c.lv < L)).slice(0, L === 1 ? 0 : L === 2 ? 2 : 3));
  const order = shuffle(deck);
  const st = stationShell('closer', `
    ${guide('moss', 'think', `${g()} Pick the closer relative. Looks can fool you, so think about what they really are.`)}
    <div style="display:grid;gap:12px;max-width:760px">
      <div class="progress" aria-hidden="true"><i id="cprog" style="width:0"></i></div>
      <h3 id="cq"></h3>
      <div class="vs" id="cvs"></div>
      <div id="cfb"></div>
    </div>`);
  let k = 0, right = 0;
  const show = () => {
    $('#cprog').style.width = (100 * k / order.length) + '%';
    if (k >= order.length) { $('#cq').textContent = `All ${order.length} done!`; $('#cvs').innerHTML = ''; $('#cfb').innerHTML = '';
      setGuide(st, 'moss', 'happy', `${g()} You can read a family tree. Some of those surprise grown-ups too!`); award('closer', badgeOf('closer')); return; }
    const c = order[k], opts = shuffle([c.a, c.w]);
    $('#cq').textContent = c.q; $('#cfb').innerHTML = '';
    $('#cvs').innerHTML = `<button class="choice" data-a="${esc(opts[0])}">${esc(opts[0])}</button><span class="or">or</span><button class="choice" data-a="${esc(opts[1])}">${esc(opts[1])}</button>`;
  };
  $('#cvs').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b || $('#cnext')) return;
    const c = order[k];
    if (b.dataset.a === c.a) { sfx.good(); b.classList.add('right'); right++;
      $('#cfb').innerHTML = `<div class="fb good">Yes! ${esc(c.why)}</div><button class="btn" id="cnext" style="margin-top:10px">${k + 1 < order.length ? 'Next' : 'Finish'}</button>`;
      $('#cnext').onclick = () => { k++; show(); }; $('#cnext').focus();
    } else { sfx.oops(); b.classList.add('wrong'); bump(b, 'wiggle'); $('#cfb').innerHTML = `<div class="fb oops">Not this time. Think about what each one really is, then try the other.</div>`; }
  });
  show();
};

/* 5. Quick Quiz */
STATIONS.quiz = function () {
  const L = lv(), qs = shuffle(ZM().quiz[L - 1]), QK = ZONE + L; let k = 0, score = 0;
  const st = stationShell('quiz', `${guide(GID(), 'think', `${g()} Eight questions at Level ${L}. Take your time. Six right earns a star.`)}<div id="qbox" style="display:grid;gap:12px;max-width:760px"></div>`);
  const box = $('#qbox');
  const show = () => {
    if (k >= qs.length) return end();
    const q = qs[k], opts = shuffle([q.a, ...q.w]);
    box.innerHTML = `<div class="progress" aria-hidden="true"><i style="width:${100 * k / qs.length}%"></i></div>
      <h3>${k + 1}. ${esc(q.q)}</h3><div class="choices">${opts.map(o => `<button class="choice" data-a="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="qfb"></div>`;
    let answered = false;
    box.onclick = e => { const b = e.target.closest('[data-a]'); if (!b || answered) return; answered = true;
      const ok = b.dataset.a === q.a; if (ok) score++;
      box.querySelectorAll('.choice').forEach(x => { if (x.dataset.a === q.a) x.classList.add('right'); });
      if (!ok) { b.classList.add('wrong'); sfx.oops(); } else sfx.good();
      $('#qfb').innerHTML = `<div class="fb ${ok ? 'good' : 'oops'}">${ok ? 'Yes!' : 'Not quite.'} ${esc(q.why)}</div><button class="btn" id="qnext" style="margin-top:10px">${k + 1 < qs.length ? 'Next' : 'Finish'}</button>`;
      setGuide(st, GID(), ok ? 'happy' : 'rest', ok ? `${g()} Got it!` : `${g()} Good try. Read why, then keep going.`);
      $('#qnext').onclick = () => { k++; show(); }; $('#qnext').focus(); };
  };
  const end = () => {
    S.quiz[QK] = Math.max(S.quiz[QK] || 0, score); save();
    box.innerHTML = `<div class="fb ${score >= 6 ? 'good' : 'oops'}" style="font-size:22px"><b>${score} out of ${qs.length}</b></div>
      <p>${score >= 7 ? 'Great work. That earns a star and the badge.' : score >= 6 ? 'Great work. That earns a star. Get 7 or more for the badge.' : 'Get 6 or more for a star, and 7 for the badge. Every try helps you learn.'}</p>
      <div class="row"><button class="btn" id="qagain">Try again</button></div>`;
    $('#qagain').onclick = () => STATIONS.quiz();
    if (score >= 6) { setGuide(st, GID(), 'happy', `${g()} You really know ${esc(META().name)}!`); award('quiz', score >= 7 ? badgeOf('quiz') : null); }
  };
  show();
};

/* 6. Paper Mission */
STATIONS.mission = function () { missionStation('mission', ZM().mission); };
function missionStation(sid, M) {
  const L = lv(), key = ZONE + '.' + sid + '.' + L, alt = esc(`Photo of the ${M.title} work`);
  const st = stationShell(sid, `
    ${guide(GID(), 'happy', `${g()} Time to get outside! Grab the supplies and a grown-up, and do this one away from the screen.`)}
    <div class="mission">
      <h3>${esc(M.title)} · Level ${L}</h3>
      <div class="meta"><span>${esc(M.time)}</span><span>${esc(M.where)}</span></div>
      <div><b>Supplies</b>${M.supplies.map((s, i) => `<label><input type="checkbox" data-sup="${i}"> ${esc(s)}</label>`).join('')}</div>
      <div><b>Steps</b><ol>${pick(M.steps).map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>
      <p><b>Why it works:</b> ${esc(M.why)}</p>
    </div>
    <div class="stamp">
      <p>Done? ${esc(M.stamp || 'Take a photo of your work')} to stamp it here (it stays on this iPad).</p>
      <div class="row"><label class="btn alt" style="cursor:pointer">Add a photo<input type="file" accept="image/*" id="stampFile" hidden></label>
      <button class="btn" id="stampDone">${S.mission[key] ? 'Stamped ✓' : 'Mark it done'}</button></div>
      <div id="stampImg"></div>
    </div>`);
  DB.get(key).then(src => { if (src) $('#stampImg').innerHTML = `<img src="${src}" alt="${alt}">`; }).catch(() => {});
  $('#stampFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { const r = Math.min(1, 700 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const src = c.toDataURL('image/jpeg', 0.8); URL.revokeObjectURL(url);
      $('#stampImg').innerHTML = `<img src="${src}" alt="${alt}">`;
      DB.put(key, src).catch(() => toast('Couldn’t save the photo on this device, but your stamp still counts.')); stamp(); };
    img.src = url;
  });
  $('#stampDone').addEventListener('click', stamp);
  function stamp() { S.mission[key] = Date.now(); save(); $('#stampDone').textContent = 'Stamped ✓'; award(sid, badgeOf(sid)); }
}

/* ================= Zone 2: Cells and Microscopes ================= */
const CL = () => W.cells;
const part = id => CL().parts.find(p => p.id === id);
/* Drawn cells (diagrams). Each part is a <g class="part" data-p>; a part shows only from its level. */
function cellSvg(kind, L) {
  const on = id => part(id).lv <= L;
  const P = (id, inner) => on(id) ? `<g class="part" data-p="${id}" tabindex="0" role="button" aria-label="${esc(part(id).name)}">${inner}</g>` : '';
  const mito = (x, y, r) => `<g transform="translate(${x} ${y}) rotate(${r})"><ellipse rx="26" ry="13" fill="#F6C27A" stroke="#C06A1E" stroke-width="3"/><path d="M-18 0 q4 -9 8 0 t8 0 t8 0 t8 0" fill="none" stroke="#C06A1E" stroke-width="2.4"/></g>`;
  const ribo = pts => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.4" fill="#444C55"/>`).join('');
  const hit = d => `<path d="${d}" fill="none" stroke="transparent" stroke-width="26"/>`;
  if (kind === 'animal') {
    const blob = 'M200 22 C290 18 372 70 378 160 C384 250 300 300 200 298 C110 296 26 256 22 168 C18 80 108 26 200 22Z';
    return `<svg viewBox="0 0 400 320" class="cellart" role="group" aria-label="An animal cell">
      ${P('cytoplasm', `<path d="${blob}" fill="#DCEFF7"/>`)}
      ${P('er', `<path d="M118 110 q-20 50 6 92 M104 122 q-16 40 4 74 M262 104 q22 54 -4 100 M278 118 q16 40 -2 72" fill="none" stroke="#D9A0C0" stroke-width="8" stroke-linecap="round"/>${ribo([[112, 132], [108, 168], [120, 196], [270, 128], [276, 160], [266, 190]])}`)}
      ${P('nucleus', `<circle cx="190" cy="152" r="54" fill="#CDB8EA" stroke="#7A4FB0" stroke-width="4"/><circle cx="204" cy="140" r="15" fill="#7A4FB0"/>`)}
      ${P('mito', mito(90, 236, 20) + mito(300, 214, -25) + mito(286, 74, 15))}
      ${P('vacuole', `<circle cx="112" cy="74" r="17" fill="#B9DCF2" stroke="#5F9CC6" stroke-width="2.6"/><circle cx="214" cy="256" r="13" fill="#B9DCF2" stroke="#5F9CC6" stroke-width="2.6"/>`)}
      ${P('ribosome', ribo([[150, 60], [170, 48], [240, 62], [330, 130], [338, 180], [152, 268], [64, 168], [72, 128], [250, 280], [350, 250]]))}
      ${P('membrane', `${hit(blob)}<path d="${blob}" fill="none" stroke="#C8323C" stroke-width="5"/>`)}
    </svg>`;
  }
  const outer = 'M30 22 H370 Q384 22 384 36 V284 Q384 298 370 298 H30 Q16 298 16 284 V36 Q16 22 30 22Z';
  const inner = 'M40 38 H360 Q368 38 368 46 V274 Q368 282 360 282 H40 Q32 282 32 274 V46 Q32 38 40 38Z';
  const chl = (x, y, r) => `<g transform="translate(${x} ${y}) rotate(${r})"><ellipse rx="22" ry="12" fill="#7CC47F" stroke="#2F7A3A" stroke-width="2.6"/><path d="M-12 -4h24M-12 4h24" stroke="#2F7A3A" stroke-width="2"/></g>`;
  return `<svg viewBox="0 0 400 320" class="cellart" role="group" aria-label="A plant cell">
    ${P('wall', `<path d="${outer}" fill="#B9D38A" stroke="#6B8E3A" stroke-width="6"/>`)}
    ${P('cytoplasm', `<path d="${inner}" fill="#E4F3DC"/>`)}
    ${P('vacuole', `<rect x="110" y="70" width="190" height="170" rx="38" fill="#C5E3F6" stroke="#5F9CC6" stroke-width="3"/>`)}
    ${P('er', `<path d="M52 108 q30 -14 26 30 M52 214 q34 14 26 -30" fill="none" stroke="#D9A0C0" stroke-width="8" stroke-linecap="round"/>${ribo([[70, 102], [80, 128], [70, 222], [80, 196]])}`)}
    ${P('nucleus', `<circle cx="80" cy="160" r="36" fill="#CDB8EA" stroke="#7A4FB0" stroke-width="4"/><circle cx="88" cy="152" r="10" fill="#7A4FB0"/>`)}
    ${P('chloroplast', chl(76, 62, -10) + chl(262, 56, -6) + chl(336, 100, 70) + chl(338, 200, 80) + chl(300, 262, 10) + chl(200, 264, -4) + chl(110, 258, 8))}
    ${P('mito', mito(330, 152, 85) + mito(172, 56, 0))}
    ${P('ribosome', ribo([[234, 48], [312, 62], [350, 246], [254, 270], [140, 270], [52, 250], [350, 130], [60, 52]]))}
    ${P('membrane', `${hit(inner)}<path d="${inner}" fill="none" stroke="#C8323C" stroke-width="3.4"/>`)}
  </svg>`;
}

/* 1. Inside a Cell: tap every part, in both cells */
STATIONS.inside = function () {
  const L = lv(), need = CL().parts.filter(p => p.lv <= L), seen = new Set();
  let kind = 'animal';
  const st = stationShell('inside', `
    ${guide(GID(), 'rest', `${g()} Tap each part of the cell. Switch to the plant cell too: it has parts the animal cell doesn’t.`)}
    <div class="seg" role="group" aria-label="Which cell"><button data-k="animal" aria-pressed="true">Animal cell</button><button data-k="plant" aria-pressed="false">Plant cell</button></div>
    <div class="two">
      <div style="display:grid;gap:10px"><div class="cellbox" id="cell"></div><div class="partlist" id="plist"></div></div>
      <div style="display:grid;gap:12px">
        <div class="card" id="pcard" style="display:grid;gap:8px;min-height:150px"><b>Tap a part.</b><span class="muted">${esc(pick(CL().insideNote))}</span></div>
        <p class="muted" id="pseen">Seen 0 of ${need.length}.</p>
      </div>
    </div>`);
  const paint = () => {
    $('#cell').innerHTML = cellSvg(kind, L);
    $('#plist').innerHTML = need.filter(p => p.cells.includes(kind)).map(p => `<button class="pchip ${seen.has(p.id) ? 'seen' : ''}" data-p="${p.id}"><i style="background:${p.color}"></i>${esc(p.name)}</button>`).join('');
    st.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === kind)));
  };
  const showP = id => {
    const p = part(id); seen.add(id); sfx.tap();
    st.querySelectorAll('#cell .part').forEach(x => x.classList.toggle('sel', x.dataset.p === id));
    st.querySelectorAll('.pchip').forEach(x => { x.classList.toggle('seen', seen.has(x.dataset.p)); x.classList.toggle('sel', x.dataset.p === id); });
    const where = p.cells.length === 2 ? 'In animal and plant cells.' : 'Only in plant cells (of these two).';
    $('#pcard').innerHTML = `<h3 style="display:flex;align-items:center;gap:10px"><i style="width:18px;height:18px;border-radius:50%;flex:none;background:${p.color};border:2px solid #20302A33"></i>${esc(p.name)}</h3><p>${esc(p.say[L - 1])}</p><span class="muted" style="font-size:15px">${where}</span>`;
    $('#pseen').textContent = `Seen ${seen.size} of ${need.length}.`;
    if (seen.size === need.length) { setGuide(st, GID(), 'happy', `${g()} You found every part. You know your way around a cell!`); award('inside', badgeOf('inside')); }
  };
  st.addEventListener('click', e => {
    const k = e.target.closest('.seg [data-k]'); if (k) { kind = k.dataset.k; paint(); sfx.tap(); return; }
    const p = e.target.closest('#cell .part, .pchip'); if (p) showP(p.dataset.p);
  });
  st.addEventListener('keydown', e => { const p = e.target.closest('#cell .part'); if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showP(p.dataset.p); } });
  paint();
};

/* 2. Plant, Animal or Both? */
STATIONS.pab = function () {
  const L = lv(), A = CL().pab;
  let deck = L === 1 ? A.filter(c => c.lv === 1) : A.filter(c => c.lv === L).concat(shuffle(A.filter(c => c.lv < L)).slice(0, 2));
  deck = shuffle(deck);
  const bins = [{ id: 'plant', name: 'Plant cells', col: '#2F7A4A' }, { id: 'both', name: 'Both', col: '#7A4FB0' }, { id: 'animal', name: 'Animal cells', col: '#C8323C' }];
  const st = stationShell('pab', `
    ${guide(GID(), 'think', `${g()} Plant cells, animal cells, or both? Tap where each one goes.`)}
    <div style="display:grid;gap:12px;max-width:820px">
      <div class="progress" aria-hidden="true"><i id="pprog" style="width:0"></i></div>
      <div class="sortcard" id="pc"></div>
      <div class="bins three" id="pbins">${bins.map(b => `<button class="binbtn" data-a="${b.id}"><i style="background:${b.col}"></i><b>${b.name}</b></button>`).join('')}</div>
      <div id="pfb"></div>
    </div>`);
  let k = 0;
  const show = () => {
    $('#pprog').style.width = (100 * k / deck.length) + '%';
    if (k >= deck.length) { $('#pc').innerHTML = `<div class="wordcard">All ${deck.length} sorted!</div>`; $('#pfb').innerHTML = '';
      setGuide(st, GID(), 'happy', `${g()} You can tell plant cells from animal cells. Nicely done!`); award('pab', badgeOf('pab')); return; }
    $('#pc').innerHTML = `<div class="wordcard">${esc(deck[k].t)}</div><span class="muted">${k + 1} of ${deck.length}</span>`; $('#pfb').innerHTML = '';
    st.querySelectorAll('.binbtn').forEach(b => b.classList.remove('wrong', 'right'));
  };
  $('#pbins').addEventListener('click', e => {
    const b = e.target.closest('.binbtn'); if (!b || k >= deck.length || $('#pnext')) return;
    const c = deck[k];
    if (b.dataset.a === c.a) { sfx.good(); b.classList.add('right');
      $('#pfb').innerHTML = `<div class="fb good">Yes! ${esc(c.why)}</div><button class="btn" id="pnext" style="margin-top:10px">${k + 1 < deck.length ? 'Next' : 'Finish'}</button>`;
      $('#pnext').onclick = () => { k++; show(); }; $('#pnext').focus();
    } else { sfx.oops(); b.classList.add('wrong'); bump(b, 'wiggle'); $('#pfb').innerHTML = `<div class="fb oops">Not quite. ${c.a === 'both' ? 'Could it be in more than one kind of cell?' : 'Think about which cell has that part.'}</div>`; }
  });
  show();
};

/* 3. Size Ladder: biggest to smallest */
STATIONS.ladder = function () {
  const L = lv(), items = CL().ladder.filter(x => x.lv.includes(L)).sort((a, b) => b.m - a.m);
  const pool = shuffle(items);
  const st = stationShell('ladder', `
    ${guide(GID(), 'think', `${g()} ${esc(pick(CL().ladderNote))}`)}
    <div class="two">
      <div style="display:grid;gap:10px"><b>Tap the biggest one left</b><div class="pool" id="lpool">${pool.map(x => `<button class="choice" data-l="${x.id}">${esc(x.t)}</button>`).join('')}</div><div id="lfb"></div></div>
      <div style="display:grid;gap:10px"><b>Your ladder, biggest at the top</b><ol class="ladder" id="lad">${items.map(() => '<li class="empty"></li>').join('')}</ol></div>
    </div>`);
  let k = 0;
  $('#lpool').addEventListener('click', e => {
    const b = e.target.closest('[data-l]'); if (!b || b.disabled) return;
    const want = items[k];
    if (b.dataset.l === want.id) {
      sfx.good(); b.disabled = true; b.classList.add('used');
      const li = $('#lad').children[k]; li.className = 'pop'; li.innerHTML = `<b>${esc(want.t)}</b><span>${esc(want.size)}</span>`;
      $('#lfb').innerHTML = ''; k++;
      if (k === items.length) { setGuide(st, GID(), 'happy', `${g()} From ${esc(items[0].t.toLowerCase())} all the way down to ${esc(items[items.length - 1].t.toLowerCase())}. What a ladder!`); award('ladder', badgeOf('ladder')); }
    } else { sfx.oops(); bump(b, 'wiggle'); $('#lfb').innerHTML = `<div class="fb oops">Something else left is bigger than ${esc(pool.find(x => x.id === b.dataset.l).t.toLowerCase())}.</div>`; }
  });
};

/* 4. Under the Microscope: what is it? */
STATIONS.scope = function () {
  const L = lv(), C = CL().scope;
  const deck = shuffle(L === 1 ? C.filter(c => c.lv === 1) : C.filter(c => c.lv === L).concat(shuffle(C.filter(c => c.lv < L && c.photo)).slice(0, 2)));
  const st = stationShell('scope', `
    ${guide(GID(), 'think', `${g()} ${esc(pick(CL().scopeNote))}`)}
    <div style="display:grid;gap:12px;max-width:760px">
      <div class="progress" aria-hidden="true"><i id="mprog" style="width:0"></i></div>
      <div id="mq"></div>
      <div class="choices" id="mch"></div>
      <div id="mfb"></div>
    </div>`);
  let k = 0;
  const show = () => {
    $('#mprog').style.width = (100 * k / deck.length) + '%';
    if (k >= deck.length) { $('#mq').innerHTML = `<h3>All ${deck.length} done!</h3>`; $('#mch').innerHTML = ''; $('#mfb').innerHTML = '';
      setGuide(st, GID(), 'happy', `${g()} Sharp eyes! You read microscope pictures like a scientist.`); award('scope', badgeOf('scope')); return; }
    const c = deck[k];
    $('#mq').innerHTML = c.photo ? `<div class="scopeview">${photo(c.photo, false)}</div><h3>What are you looking at?</h3>` : `<h3>${esc(c.q)}</h3>`;
    $('#mch').innerHTML = shuffle([c.a, ...c.w]).map(o => `<button class="choice" data-a="${esc(o)}">${esc(o)}</button>`).join(''); $('#mfb').innerHTML = '';
  };
  $('#mch').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b || $('#mnext')) return;
    const c = deck[k];
    if (b.dataset.a === c.a) { sfx.good(); b.classList.add('right');
      $('#mfb').innerHTML = `<div class="fb good">Yes! ${esc(c.why)}</div><button class="btn" id="mnext" style="margin-top:10px">${k + 1 < deck.length ? 'Next' : 'Finish'}</button>`;
      $('#mnext').onclick = () => { k++; show(); }; $('#mnext').focus();
    } else { sfx.oops(); b.classList.add('wrong'); bump(b, 'wiggle'); $('#mfb').innerHTML = `<div class="fb oops">Not this one. Look again and try another.</div>`; }
  });
  show();
};

/* A shared sort-into-bins station (used by Food from Light and How Seeds Travel) */
function binSort(id, deck, bins, intro, win, cardHtml) {
  const st = stationShell(id, `

      <div id="bfb"></div>
    </div>`);
  let k = 0;
  const show = () => {
    $('#bprog').style.width = (100 * k / deck.length) + '%';
    if (k >= deck.length) { $('#bc').innerHTML = `<div class="wordcard">All ${deck.length} sorted!</div>`; $('#bfb').innerHTML = '';
      setGuide(st, GID(), 'happy', `${g()} ${esc(win)}`); award(id, badgeOf(id)); return; }
    $('#bc').innerHTML = cardHtml(deck[k]) + `<span class="muted">${k + 1} of ${deck.length}</span>`; $('#bfb').innerHTML = '';
    st.querySelectorAll('.binbtn').forEach(b => b.classList.remove('wrong', 'right'));
  };
  $('#bbins').addEventListener('click', e => {
    const b = e.target.closest('.binbtn'); if (!b || k >= deck.length || $('#bnext')) return;
    const c = deck[k];
    if (b.dataset.a === c.a) { sfx.good(); b.classList.add('right');

  });

}

/* A shared put-in-order station (An Apple Tree's Year, Leaf to Soil). items are in the right order. */
function orderStation(id, items, intro, win, leftHead, rightHead) {
  const pool = shuffle(items);
  const st = stationShell(id, `
    ${guide(GID(), 'think', `${g()} ${esc(intro)}`)}
    <div class="two">
      <div style="display:grid;gap:10px"><b>${esc(leftHead)}</b><div class="pool applepool" id="apool">${pool.map(x => `<button class="choice apchoice" data-l="${x.id}">${x.photo ? `<span class="apthumb">${photo(x.photo, false)}</span>` : ''}<span>${esc(x.t)}</span></button>`).join('')}</div><div id="afb"></div></div>
      <div style="display:grid;gap:10px"><b>${esc(rightHead)}</b><ol class="ladder" id="alad">${items.map(() => '<li class="empty"></li>').join('')}</ol></div>
    </div>`);
  let k = 0;
  $('#apool').addEventListener('click', e => {
    const b = e.target.closest('[data-l]'); if (!b || b.disabled) return;
    const want = items[k];
    if (b.dataset.l === want.id) {
      sfx.good(); b.disabled = true; b.classList.add('used');
      const li = $('#alad').children[k]; li.className = 'pop'; li.innerHTML = `<b>${esc(want.t)}</b>`;
      $('#afb').innerHTML = ''; k++;
      if (k === items.length) { setGuide(st, GID(), 'happy', `${g()} ${esc(win)}`); award(id, badgeOf(id)); }
    } else { sfx.oops(); bump(b, 'wiggle'); $('#afb').innerHTML = `<div class="fb oops">Not yet. What happens before that?</div>`; }
  });
}

    c => c.photo ? `<div class="seedphoto">${photo(c.photo, false)}</div><h3>Whose tracks are these?</h3>` : `<h3>${esc(c.q)}</h3>`);
};


/* ================= Zone 6: Habitat Tour ================= */
const HB = () => W.habitats;
const domeOf = id => HB().domes.find(d => d.id === id);
/* 1. Dome Walk: visit every dome */
STATIONS.domes = function () {
  const L = lv(), D = HB().domes, seen = new Set();
  let cur = null;
  const st = stationShell('domes', `
    ${guide(GID(), 'rest', `${g()} ${esc(HB().domeNote[L - 1])}`)}
    <div class="seg fgtabs" role="group" aria-label="Domes" id="dtabs">${D.map(d => `<button data-k="${d.id}" aria-pressed="false" style="--c:${d.col}">${esc(d.name)}</button>`).join('')}</div>
    <p class="muted" id="dseen">Domes visited: 0 of ${D.length}</p>
    <div id="dbody" class="card" style="display:grid;gap:12px"><b>Tap a dome to step inside.</b></div>`);
  const tile = id => `<div class="fgcard" style="cursor:default">${photo(id, false)}<b>${esc(PH[id].what)}</b></div>`;
  st.addEventListener('click', e => {
    const t = e.target.closest('#dtabs [data-k]'); if (!t) return;
    cur = domeOf(t.dataset.k); seen.add(cur.id); sfx.tap();
    st.querySelectorAll('#dtabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === cur.id)));
    $('#dbody').innerHTML = `<h3 style="color:${cur.col}">${esc(cur.name)}</h3><p>${esc(cur.say[L - 1])}</p>
      <b>Animals</b><div class="fggrid">${cur.animals.map(tile).join('')}</div>
      <b>${cur.id === 'ocean' ? 'Food makers: algae' : cur.id === 'tundra' ? 'Plants and lichen' : 'Plants'}</b><div class="fggrid">${cur.plants.map(tile).join('')}</div>`;
    $('#dseen').textContent = `Domes visited: ${seen.size} of ${D.length}`;
    if (seen.size === D.length && !S.stars[`${ZONE}.domes.${L}`]) { setGuide(st, GID(), 'happy', `${g()} You walked through all seven domes!`); award('domes', badgeOf('domes')); }
  });
};
/* 2. Who Lives Here? */
STATIONS.livehere = function () {
  const L = lv(), A = HB().live, names = HB().domes;
  const pool = L === 1 ? A.filter(c => c.lv === 1) : L === 2 ? shuffle(A.filter(c => c.lv === 2)).slice(0, 6).concat(shuffle(A.filter(c => c.lv === 1)).slice(0, 2)) : shuffle(A.filter(c => c.lv === 3)).slice(0, 8).concat(shuffle(A.filter(c => c.lv < 3)).slice(0, 2));
  const deck = shuffle(pool).map(c => ({ ...c, a: domeOf(c.a).name, w: shuffle(names.filter(d => d.id !== c.a && !(c.also || []).includes(d.id))).slice(0, 2).map(d => d.name) }));
  choiceStation('livehere', deck, HB().liveNote[L - 1], 'Every animal matched to its home. You know your habitats!',
    c => `<div class="seedphoto">${photo(c.photo, false)}</div><h3>${esc(PH[c.photo].what)}: which dome is its home?</h3>`);
};
/* 3. Climate Clues */
STATIONS.climate = function () {
  const L = lv(), C = HB().clues, names = HB().domes.map(d => d.name);
  const deck = shuffle(C.filter(c => c.lv === L)).map(c => ({ ...c, w: shuffle(names.filter(n => n !== c.a)).slice(0, 2) }));
  choiceStation('climate', deck, HB().clueNote[L - 1], 'You read the clues like a climate scientist!', c => `<h3>${esc(c.q)}</h3>`);
};
/* 4. What Every Home Gives */
STATIONS.needs = function () {
  const L = lv();
  binSort('needs', levelDeck(HB().needs, L, 2), HB().needBins, HB().needNote[L - 1],
    'Food, water, shelter and space: you know what makes a home!', c => `<div class="wordcard">${esc(c.t)}</div>`);
};


/* ================= Zone 7: Adaptations and Evolution ================= */
const AD = () => W.adapt;
const cardOrPhoto = c => c.photo ? photoCard(c) : `<div class="wordcard">${esc(c.t)}</div>`;
STATIONS.shape = function () {
  const L = lv();
  choiceStation('shape', levelDeck(AD().shape, L, 2), AD().shapeNote[L - 1], 'Every shape has a job, and you figured them out!',
    c => `<div class="seedphoto">${photo(c.photo, false)}</div><h3>${esc(c.q)}</h3>`);
};
STATIONS.beaks = function () {
  const L = lv(), F = AD().foods, fname = id => F.find(f => f.id === id).name;
  const deck = levelDeck(AD().beaks, L, 2).map(c => ({ ...c, a: fname(c.a), w: shuffle(F.filter(f => f.id !== c.a && !(c.also || []).includes(f.id))).slice(0, 2).map(f => f.name) }));
  choiceStation('beaks', deck, AD().beakNote[L - 1], 'Every beak is a tool, and you matched them all!',
    c => `<div class="seedphoto">${photo(c.photo, false)}</div><h3>${esc(PH[c.photo].what)}: what is this beak built for?</h3>`);
};
STATIONS.camo = function () {
  const L = lv();
  binSort('camo', levelDeck(AD().camo, L, 2), AD().camoBins.filter(b => L === 3 || b.id !== 'copy'), AD().camoNote[L - 1],
    'Hiding, warning and copying: you can read an animal’s colors!', cardOrPhoto);
};
STATIONS.moths = function () {
  const L = lv();
  orderStation('moths', AD().moths.filter(x => x.lv.includes(L)), AD().mothNote[L - 1],
    'That is natural selection: the moths that matched their trees had more young.', 'Tap what happened next', 'The peppered moth story');
};
STATIONS.fossils = function () {
  const L = lv();
  choiceStation('fossils', levelDeck(AD().fossils, L, 2), AD().fossilNote[L - 1], 'You know the fossils from your own backyard!',
    c => c.photo ? `<div class="seedphoto">${photo(c.photo, false)}</div><h3>What fossil is this?</h3>` : `<h3>${esc(c.q)}</h3>`);
};

/* ================= Zone 9: Wild Watch ================= */
const WW = () => W.watch;
STATIONS.natives = function () {
  const L = lv();
  binSort('natives', levelDeck(WW().natives, L, 2), WW().nativeBins, WW().nativeNote[L - 1], 'You can tell what belongs in Ohio and what doesn’t!', cardOrPhoto);
};
STATIONS.helpers = function () {
  const L = lv();
  binSort('helpers', levelDeck(WW().helpers, L, 2), WW().helperBins, WW().helperNote[L - 1], 'You know lots of ways to help wild things!', c => `<div class="wordcard">${esc(c.t)}</div>`);
};
STATIONS.comeback = function () {
  const L = lv();
  choiceStation('comeback', levelDeck(WW().comeback, L, 2), WW().comebackNote[L - 1], 'Every comeback started with people who cared. You could be one of them!',
    c => `<div class="seedphoto">${photo(c.photo, false)}</div><h3>${esc(c.q)}</h3>`);
};

/* ================= Zone 8: Food Webs ================= */
const FW = () => W.webs;
STATIONS.roles = function () {
  const L = lv();
  binSort('roles', levelDeck(FW().roles, L, 2), FW().roleBins, FW().roleNote[L - 1], 'Makers, eaters and recyclers: you know every role in the web!', cardOrPhoto);
};
STATIONS.eaters = function () {
  const L = lv();
  binSort('eaters', levelDeck(FW().eaters, L, 2), FW().eaterBins, FW().eaterNote[L - 1], 'Plants, meat or both: you can read any animal’s menu!', cardOrPhoto);
};
STATIONS.chain = function () {
  const L = lv(), C = shuffle(FW().chains.filter(c => c.lv === L))[0];
  orderStation('chain', C.items, FW().chainNote[L - 1], 'From the sun all the way to the top. That’s a food chain!', 'Tap who gets the energy next', 'Your food chain');
};
STATIONS.takeout = function () {
  const L = lv();
  choiceStation('takeout', levelDeck(FW().takeout, L, 2), FW().takeNote[L - 1], 'You can predict how a food web changes. That’s what ecologists do!',
    c => `${c.photo ? `<div class="seedphoto">${photo(c.photo, false)}</div>` : ''}<h3>${esc(c.q)}</h3>`);
};

/* ---------- badges ---------- */
function showBadges() {
  const open = W.zones.filter(z => z.open), total = open.reduce((a, z) => a + W[z.id].stations.length * 3, 0);
  const o = document.createElement('div'); o.className = 'over';
  o.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Stars and badges">
    <div class="row" style="justify-content:space-between"><h2>${starCount()} stars</h2><button class="btn alt" data-close>Close</button></div>
    <p class="muted">Each station gives one star per level, so there are ${total} stars in the zones built so far.</p>
    ${open.map(z => `<h3>${esc(z.name)} badges <span class="muted" style="font-size:15px">· ${zoneStars(z.id)} of ${W[z.id].stations.length * 3} stars</span></h3>
    <div class="badges">${W[z.id].stations.map(s => s.badge).map(b => `<div class="bdg ${S.badges[b] ? '' : 'off'}">${badgeSvg(b)}<span>${esc(b)}</span></div>`).join('')}</div>`).join('')}</div>`;
  o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) o.remove(); });
  document.body.appendChild(o); $('[data-close]', o).focus();
}

/* ---------- grown-ups ---------- */
function showAdults() {
  const o = document.createElement('div'); o.className = 'over';
  const openZ = W.zones.filter(z => z.open), shutZ = W.zones.filter(z => !z.open);
  const qz = openZ.map(z => `${z.name} quiz best ` + [1, 2, 3].map(l => S.quiz[z.id + l] != null ? `L${l}: ${S.quiz[z.id + l]}/8` : `L${l}: —`).join(' · ')).join('<br>');
  const IMG = window.WILD_IMG || {}, have = Object.keys(PH).filter(id => IMG[id]).length;
  o.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Grown-ups">
    <div class="row" style="justify-content:space-between"><h2>Grown-ups</h2><button class="btn alt" data-close>Close</button></div>
    <div class="card" style="display:grid;gap:4px"><b>Progress on this device</b><span>${starCount()} stars · ${Object.keys(S.badges).length} badges</span><span class="muted" style="font-size:15px">${qz}</span></div>
    <div style="display:grid;gap:6px"><b>Levels</b><span>${W.levels.map(l => `${l.n} ${esc(l.name)}: ${esc(l.says.toLowerCase())}.`).join(' ')} Felix picks the level in the top bar. Each station gives one star per level. A quiz gives its star at 6 out of 8 and its badge at 7.</span></div>
    <div style="display:grid;gap:6px"><b>Zones</b><span>Built: ${esc(openZ.map(z => z.name).join(', '))}.${shutZ.length ? ' Coming: ' + esc(shutZ.map(z => z.name).join(', ')) + '.' : ''} Night episodes will use the Moonlit Domes colors.</span></div>
    <div style="display:grid;gap:6px"><b>Photos (${have} of ${Object.keys(PH).length} in)</b><ul class="credits">${Object.entries(PH).filter(([, p]) => !p.guide).map(([id, p]) => `<li><b>${esc(p.what)}</b>: ${esc(p.file)} · ${esc(p.credit)} · ${esc(p.license)}${IMG[id] ? '' : ' · not added yet'}</li>`).join('')}</ul><details><summary><b>Field Guide photos (${Object.values(PH).filter(p => p.guide).length})</b></summary><ul class="credits">${Object.entries(PH).filter(([, p]) => p.guide).map(([id, p]) => `<li><b>${esc(p.what)}</b>: ${esc(p.file)} · ${esc(p.credit)} · ${esc(p.license)}${IMG[id] ? '' : ' · not added yet'}</li>`).join('')}</ul></details>
      <span class="muted">All photos are from Wikimedia Commons.</span></div>
    <div style="display:grid;gap:6px"><b>Reset progress</b><span class="muted">Press and hold for 3 seconds. This clears stars, badges and mission photos on this device.</span>
      <button class="holdreset" id="resetBtn"><i></i><span style="position:relative">Hold to reset</span></button></div>
    <div style="display:grid;gap:6px"><b>Credits</b><ul class="credits">${W.credits.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>
  </div>`;
  document.body.appendChild(o);
  o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) o.remove(); });
  const r = $('#resetBtn', o), bar = $('i', r); let t = null, start = 0;
  const stop = () => { clearInterval(t); t = null; bar.style.width = '0'; };
  r.addEventListener('pointerdown', e => { e.preventDefault(); r.setPointerCapture(e.pointerId); start = Date.now();
    t = setInterval(() => { const k = (Date.now() - start) / 3000; bar.style.width = Math.min(100, k * 100) + '%';
      if (k >= 1) { stop(); S = fresh(); save(); DB.clear().catch(() => {}); paintBar(); o.remove(); go('home'); toast('Progress reset on this device.'); } }, 50); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => r.addEventListener(ev, stop));
  $('[data-close]', o).focus();
}

paintBar(); render();
})();
</script>
