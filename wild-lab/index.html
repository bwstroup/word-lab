<!DOCTYPE html>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<title>Wild Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wild Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Wild Lab: The Seven Domes. Glasshouse Morning palette (picked Nov 11); Moonlit Domes is kept for later night episodes. */
:root{
  --mist:#DCEBE4; --sheet:#F8FBF9; --plate:#ffffff; --ink:#20302A; --muted:#55665D; --line:#C9D9D0;
  --leaf:#2F7A4A; --leaf-d:#1F5634; --macaw:#F08A24; --sand:#E2B866; --sea:#3E86B8; --deep:#1F3A2E;
  --good:#2F7A4A; --good-bg:#E2F2E8; --oops:#B5462F; --oops-bg:#FBE9E4; --chip:#E4EEE8;
  --display:'Young Serif',Georgia,serif; --body:'Atkinson Hyperlegible',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --mist:#122019; --sheet:#18271F; --ink:#E3ECE6; --muted:#9CB0A4; --line:#2C3D34; --leaf:#3E9A5E; --leaf-d:#2F7A4A;
  --good:#6FD39A; --good-bg:#173A26; --oops:#FF9B85; --oops-bg:#3A201B; --chip:#22332A; color-scheme:dark}}
:root[data-theme="dark"]{
  --mist:#122019; --sheet:#18271F; --ink:#E3ECE6; --muted:#9CB0A4; --line:#2C3D34; --leaf:#3E9A5E; --leaf-d:#2F7A4A;
  --good:#6FD39A; --good-bg:#173A26; --oops:#FF9B85; --oops-bg:#3A201B; --chip:#22332A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font:18px/1.5 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,3.6vw,34px)}
h3{font-size:21px}
p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--deep);color:#fff}
.bar-in{max-width:1120px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.logo{display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:4px 2px;font:400 24px/1.2 var(--display);color:#fff}
.logo svg{width:28px;height:28px}
.spacer{flex:1}
.dial{display:flex;background:#12261C;border-radius:999px;padding:3px;gap:2px}
.dial button{border:0;background:transparent;color:#CFE3D6;border-radius:999px;padding:6px 12px;min-height:40px;font:700 15px/1 var(--body);display:flex;gap:6px;align-items:center}
.dial button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#2A4A3A;color:#fff;font-size:13px}
.dial button[aria-pressed="true"]{background:var(--macaw);color:#2A1606}
.dial button[aria-pressed="true"] b{background:#2A1606;color:var(--macaw)}
.chipbtn{border:0;background:#2A4A3A;color:#fff;border-radius:999px;min-height:44px;padding:0 14px;font:700 16px/1 var(--body);display:flex;align-items:center;gap:6px}
.chipbtn svg{width:20px;height:20px}
.iconbtn{width:44px;padding:0;justify-content:center}

/* shared */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.sign{justify-self:start;background:var(--leaf);color:#fff;font:700 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:7px 12px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;min-height:52px;padding:0 20px;background:var(--leaf);color:#fff;font:700 18px/1 var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn.sun{background:var(--macaw);color:#2A1606}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{border:0;background:var(--chip);border-radius:999px;min-height:44px;padding:0 16px 0 10px;font:700 16px/1 var(--body);display:inline-flex;align-items:center;gap:6px;justify-self:start}
.back svg{width:20px;height:20px}
.guide{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:end}
.guide .pic svg{width:96px;height:auto;display:block}
.bubble{position:relative;background:var(--plate);color:#20302A;border:2px solid #20302A;border-radius:16px;padding:12px 14px;font-size:18px;margin-bottom:16px;min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;bottom:18px;border:10px solid transparent;border-right-color:#20302A;border-left:0}
.bubble::after{content:"";position:absolute;left:-8px;bottom:20px;border:8px solid transparent;border-right-color:var(--plate);border-left:0}
.card{background:var(--plate);color:#20302A;border-radius:14px;padding:14px;border:1px solid var(--line)}
.more{border:0;background:none;padding:0;color:var(--leaf);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:32px;justify-self:start}
.facts{margin:0;padding-left:20px;display:grid;gap:6px}
.stars{display:inline-flex;gap:2px;color:var(--macaw)}
.stars svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;border-radius:12px;padding:12px 18px;font:700 17px/1.3 var(--body);z-index:40;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* photos: a real photo, or a labeled frame until the file arrives */
.photo{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;color:#20302A}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photo .ph{aspect-ratio:4/3;display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:12px;
  background:repeating-linear-gradient(135deg,#EEF5F0 0 14px,#E3EEE7 14px 28px);color:#3E5A48}
.photo .ph svg{width:40px;height:40px}
.photo .ph b{font:400 17px/1.2 var(--display)}
.photo .ph span{font-size:13px}
.photo figcaption{font-size:13px;padding:5px 10px;background:#F2F7F4;color:#55665D}

/* home: the domes map */
.home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.mapbox{background:var(--plate);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.domes{display:block;width:100%;height:auto}
.domes .ground{fill:var(--m-ground)}
.domes .walk{stroke:var(--m-walk);stroke-width:14;stroke-linecap:round}
.domes .trail{fill:none;stroke:var(--m-accent);stroke-width:4;stroke-dasharray:2 10;stroke-linecap:round}
.domes .tunnel{fill:none;stroke:var(--m-tunnel);stroke-width:3;stroke-dasharray:9 6;opacity:.8}
.domes .h-rain{fill:var(--m-rain)} .domes .h-desert{fill:var(--m-desert)} .domes .h-grass{fill:var(--m-grass)} .domes .h-ohio{fill:var(--m-ohio)}
.domes .h-tundra{fill:var(--m-tundra)} .domes .h-ocean{fill:var(--m-ocean)} .domes .h-wet{fill:var(--m-wet)}
.domes .lat{fill:none;stroke:var(--m-frame);stroke-width:1.4;opacity:.55}
.domes .rim{fill:none;stroke:var(--m-frame);stroke-width:4}
.domes .glass{fill:var(--m-glass)}
.domes .canopy{fill:var(--m-canopy)} .domes .canopy2{fill:var(--m-leaf)} .domes .canopy3{fill:var(--m-leaf2)}
.domes .stair rect{fill:var(--m-bld);stroke:var(--m-ink);stroke-width:2} .domes .stair path{stroke:var(--m-ink);stroke-width:1.6}
.domes .ic-dk{fill:none;stroke:var(--m-canopy);stroke-width:4;stroke-linecap:round}
.domes .ic-lf{fill:var(--m-leaf2)} .domes .ic-lf2{fill:var(--m-leaf)}
.domes .ic-cac{fill:none;stroke:#3E7A3E;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.domes .ic-gr{fill:none;stroke:#5E7A2E;stroke-width:3;stroke-linecap:round}
.domes .ic-trk{stroke:#6B4A2E;stroke-width:4}
.domes .ic-snow{fill:#FFFFFF;stroke:#9AAAB4;stroke-width:1.6;stroke-linejoin:round}
.domes .ic-wave{fill:none;stroke:#FFFFFF;stroke-width:3;stroke-linecap:round;opacity:.85}
.domes .ic-reed{stroke:#3E6A2E;stroke-width:3;stroke-linecap:round} .domes .ic-cat{fill:#6B4A2E}
.domes .bldg rect{fill:var(--m-bld);stroke:var(--m-ink);stroke-width:2.4} .domes .bldg .pane{stroke:var(--m-tunnel);stroke-width:2;opacity:.6}
.domes .roof{fill:var(--m-roof);stroke:var(--m-ink);stroke-width:2.4;stroke-linejoin:round}
.domes .vault rect{fill:var(--m-tunnel);stroke:var(--m-ink);stroke-width:2} .domes .vault circle{fill:none;stroke:var(--m-bld);stroke-width:2.4}
.domes .pin circle{fill:var(--m-pin);stroke:var(--m-ink);stroke-width:3}
.domes .pin.home path{fill:var(--m-accent);stroke:var(--m-ink);stroke-width:3;stroke-linejoin:round}
.domes .num{font:700 17px var(--body);fill:#FFFFFF;text-anchor:middle;paint-order:stroke;stroke:var(--m-ink);stroke-width:1px}
.domes .lab{font:700 16px var(--body);fill:var(--m-lab);paint-order:stroke;stroke:var(--m-halo);stroke-width:5px;stroke-linejoin:round}
.domes .lab.sm{font-size:14px}
.mapbox{--m-ground:#DCEBE4;--m-walk:#F6F1E2;--m-glass:#EAF5F0;--m-frame:#FFFFFF;--m-ink:#20302A;--m-pin:#2F7A4A;--m-accent:#F08A24;--m-lab:#20302A;--m-halo:#DCEBE4;--m-tunnel:#8A6A4A;--m-bld:#F6F1E2;--m-roof:#B4562A;--m-rain:#2F7A4A;--m-desert:#E2B866;--m-grass:#B8CC6A;--m-ohio:#5E9C48;--m-tundra:#E6EEF2;--m-ocean:#3E86B8;--m-wet:#5FA89A;--m-leaf:#4E9C48;--m-leaf2:#7FB85A;--m-canopy:#3E7A2E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapbox{--m-ground:#12302A;--m-walk:#3A5A4E;--m-glass:#1E4A40;--m-frame:#BFE6D8;--m-ink:#0A1A16;--m-pin:#F2B84B;--m-accent:#F2B84B;--m-lab:#EAF6F0;--m-halo:#12302A;--m-tunnel:#6A8A7A;--m-bld:#2A4A40;--m-roof:#F2B84B;--m-rain:#2E8A5A;--m-desert:#B89A5A;--m-grass:#7E9A4A;--m-ohio:#3E7A3E;--m-tundra:#9AB8C4;--m-ocean:#2A6A9A;--m-wet:#3A8A7A;--m-leaf:#3E9A5A;--m-leaf2:#5EB86A;--m-canopy:#2E6A3E}}
:root[data-theme="dark"] .mapbox{--m-ground:#12302A;--m-walk:#3A5A4E;--m-glass:#1E4A40;--m-frame:#BFE6D8;--m-ink:#0A1A16;--m-pin:#F2B84B;--m-accent:#F2B84B;--m-lab:#EAF6F0;--m-halo:#12302A;--m-tunnel:#6A8A7A;--m-bld:#2A4A40;--m-roof:#F2B84B;--m-rain:#2E8A5A;--m-desert:#B89A5A;--m-grass:#7E9A4A;--m-ohio:#3E7A3E;--m-tundra:#9AB8C4;--m-ocean:#2A6A9A;--m-wet:#3A8A7A;--m-leaf:#3E9A5A;--m-leaf2:#5EB86A;--m-canopy:#2E6A3E}
.domes .pin,.domes .pin.home{cursor:pointer}
.domes .pin.home:focus-visible path,.domes .pin.home:hover path{stroke:var(--macaw);stroke-width:5}
.domes .pin.shut circle{fill:#9AB0A2}
.domes .pin:focus{outline:none}
.domes .pin:focus-visible circle,.domes .pin:hover circle{stroke:var(--macaw);stroke-width:5}
.route{display:grid;gap:8px}
.stop{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:6px 12px 6px 6px;min-height:68px;width:100%}
.stop .face{width:60px;height:60px;border-radius:12px;background:#fff;overflow:hidden;display:grid;place-items:center}
.stop .face svg{width:80px;height:auto;margin-top:22px}
.stop .t{display:grid;gap:2px;min-width:0}
.stop .t b{font:400 18px/1.15 var(--display)}
.stop .t span{font-size:14px;color:var(--muted)}
.stop .tag{font:700 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:6px 10px;white-space:nowrap}
.stop .tag.open{background:var(--leaf);color:#fff}
.stop .tag.soon{background:#F6E6CC;color:#6B4508}
.stop.locked{opacity:.78}

/* zone hub */
.zonehead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.tile{display:grid;grid-template-rows:auto 1fr;gap:8px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:140px;position:relative}
.tile .ico{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:#E6F2EA}
.tile .ico svg{width:40px;height:40px}
.tile b{font:400 19px/1.15 var(--display)}
.tile span{font-size:15px;color:var(--muted)}
.tile .done{position:absolute;right:10px;top:10px}
.tile.paper{border-style:dashed;border-width:2px}

/* stations */
.station{display:grid;gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.treeart{background:linear-gradient(#F3F9F5,#E7F2EA);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:0}
.treeart svg{display:block;width:100%;height:auto}
.tip{cursor:pointer}
.tip:focus{outline:none}
.tip:focus-visible .ring,.tip.sel .ring{stroke:var(--macaw);stroke-width:6}
.tip.seen .tick{display:block}
.tick{display:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:22px;min-height:44px;padding:6px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:#7A4FB0;border-color:#7A4FB0;color:#fff}
.cellbox{background:linear-gradient(#F3F9F5,#E7F2EA);border:1px solid var(--line);border-radius:16px;padding:8px}
.cellart{display:block;width:100%;height:auto}
.cellart .part{cursor:pointer}
.cellart .part:focus{outline:none}
.cellart .part.sel,.cellart .part:focus-visible{filter:drop-shadow(0 0 5px #F08A24) drop-shadow(0 0 2px #F08A24)}
.partlist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:20px;min-height:44px;padding:4px 12px;font-size:16px;font-weight:700}
.pchip i{width:14px;height:14px;border-radius:50%;flex:none}
.pchip.seen{border-color:var(--good)}
.pchip.seen::after{content:"✓";color:var(--good)}
.pchip.sel{background:var(--good-bg)}
.bins.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.bins.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.bins.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.pool{display:grid;gap:8px}
.choice.used{opacity:.35;text-decoration:line-through}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:r}
.ladder li{counter-increment:r;display:grid;gap:2px;border:2px solid var(--line);border-radius:12px;padding:8px 12px 8px 44px;min-height:52px;position:relative;background:var(--plate);color:#20302A}
.ladder li::before{content:counter(r);position:absolute;left:10px;top:9px;width:24px;height:24px;border-radius:50%;background:#7A4FB0;color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}
.ladder li.empty{background:transparent;border-style:dashed}
.ladder li.empty::before{background:var(--line)}
.ladder li span{font-size:15px;color:#55665D}
.scopeview .photo{border-radius:50%;aspect-ratio:1;max-width:min(100%,380px);margin:auto;border:10px solid #2B2B2B;box-shadow:0 0 0 3px #888}
.scopeview .photo img{aspect-ratio:1;height:100%}
.bins.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.seedphoto .photo{max-width:min(100%,420px);margin:auto;border-radius:14px}
.apchoice{display:flex;align-items:center;gap:12px;text-align:left}
.apthumb{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;display:block}
.apthumb .photo{width:64px;height:64px;margin:0;border-radius:10px}
.apthumb .photo img{width:64px;height:64px;object-fit:cover}
.fgtabs button{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.fgtabs button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.fggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.fgcard{display:grid;gap:6px;padding:0 0 8px;border:2px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--ink);overflow:hidden;text-align:center;font-size:15px;min-height:44px}
.fgcard .photo{margin:0;border-radius:0}
.fgcard .photo img{aspect-ratio:4/3;object-fit:cover;width:100%}
.fgcard b{padding:0 6px}
.ntgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ntcard{padding:0}
.ntcard.right{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.fgdetail{max-width:min(560px,92vw);display:grid;gap:10px;text-align:left}
/* big photos show the whole picture (no cropping of tall or wide photos); small grid tiles still crop to 4:3 */
.seedphoto .photo img,.sortcard .photo img,.fgdetail .photo img,#bcard .photo img{aspect-ratio:auto;object-fit:contain;width:100%;max-height:min(56vh,520px);min-height:160px;background:#F2F7F4}
.choices{display:grid;gap:10px}
.choice{border:2px solid var(--line);background:var(--sheet);border-radius:12px;min-height:56px;padding:10px 14px;text-align:left;font-size:18px;font-weight:700}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--oops);background:var(--oops-bg)}
.fb{border-radius:12px;padding:12px 14px;font-size:18px}
.fb.good{background:var(--good-bg)}
.fb.oops{background:var(--oops-bg)}
.progress{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.binbtn{border:2px solid var(--line);background:var(--sheet);border-radius:14px;min-height:72px;padding:10px;display:grid;gap:4px;justify-items:center;text-align:center}
.binbtn b{font:400 18px/1.1 var(--display)}
.binbtn i{display:block;width:26px;height:8px;border-radius:4px}
.binbtn span{font-size:13px;color:var(--muted)}
.binbtn .n{font:700 14px var(--body);color:var(--ink)}
.sortcard{display:grid;gap:10px;justify-items:center;text-align:center}
.sortcard .photo{width:min(100%,340px)}
.wordcard{width:min(100%,340px);min-height:140px;display:grid;place-items:center;background:#FFFDF6;border:2px dashed #C9B98A;border-radius:14px;padding:18px;font:400 24px/1.25 var(--display);color:#20302A}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs .or{font:400 20px var(--display);color:var(--muted)}
.signs{margin:0;padding-left:20px;display:grid;gap:4px}
.mission{color-scheme:light;background:repeating-linear-gradient(#FFFEF8 0 31px,#D3E6D9 31px 32px);color:#20302A;border-radius:16px;border:1px solid #D9D2B8;padding:18px 18px 18px 52px;position:relative;display:grid;gap:12px}
.mission::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:#E8A1A1}
.mission ol{margin:0;padding-left:22px;display:grid;gap:6px}
.mission label{display:flex;gap:10px;align-items:center;min-height:40px}
.mission input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:#2F7A4A}
.mission .meta{display:flex;flex-wrap:wrap;gap:8px}
.mission .meta span{background:#fff;border:1px solid #D9D2B8;border-radius:999px;padding:4px 12px;font-size:15px}
.stamp{display:grid;gap:10px;justify-items:start}
.stamp img{max-width:min(100%,320px);border-radius:12px;border:6px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.2);transform:rotate(-2deg)}

/* overlays */
.over{position:fixed;inset:0;background:rgba(10,24,16,.55);z-index:30;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.over .box{background:var(--sheet);border-radius:18px;max-width:640px;width:100%;max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px}
.win{text-align:center;justify-items:center}
.win .big{font:400 40px/1 var(--display);color:var(--leaf)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{display:grid;justify-items:center;gap:6px;text-align:center;padding:10px;border-radius:14px;background:var(--chip);font:700 15px/1.2 var(--body)}
.bdg svg{width:64px;height:64px}
.bdg.off{opacity:.38;filter:grayscale(1)}
.holdreset{position:relative;overflow:hidden;background:var(--oops-bg);color:var(--oops);border:2px solid var(--oops);border-radius:12px;min-height:56px;font:700 17px/1 var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
.holdreset i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(181,70,47,.25)}
.credits{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px;min-width:0;overflow-wrap:anywhere}
.wiggle{animation:wig .4s}
@keyframes wig{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){.home,.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  .ntgrid{grid-template-columns:minmax(0,1fr)}
  .fggrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bins.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bins.five{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bins.three{grid-template-columns:minmax(0,1fr)}
  body{font-size:17px}
  .dial button span{display:none}
  .dial button{padding:6px 8px}
  .guide{grid-template-columns:72px minmax(0,1fr)}
  .guide .pic svg{width:72px}
  .stop{grid-template-columns:52px minmax(0,1fr);row-gap:6px}
  .stop .face{width:52px;height:52px}
  .stop .tag{grid-column:2;justify-self:start}
  .mission{padding-left:44px}.mission::before{left:30px}
  .vs{grid-template-columns:1fr}
  .vs .or{justify-self:center}
}

     Sleeves end at the elbow line; forearms run sleeve hem → wrist; hands r 7.5 wrap the prop's side edges,

   POSE 'raise' (viewer-left arm hangs, viewer-right hand raised beside the head)
     Left:  shoulder (72,116) → elbow (64,144) → wrist (67,168); hand (67,172) rests beside the hip.
     Right: shoulder (128,116) → elbow (150,140) → wrist (150,112); hand (150,106).
     Upper arm ≈ 30, forearm ≈ 28 (≈ 0.45 H each, chibi proportions to match the 0.93 W shoulder span).
     The raised hand grips a handle; the handle shows above and below the fist.

   One mass per material: shirt + sleeves are drawn as an outline pass then a fill pass, so there is no seam

*/
(function (root) {
  const INK = '#22303a';
  const limb = (d, outline, fill, w) =>
    `<path d="${d}" fill="none" stroke="${outline}" stroke-width="${w + 4}" stroke-linecap="round" stroke-linejoin="round"/>` +

  /* ---------- parts ---------- */
  function legs(c) {

        `<path d="M96 40 Q100 32 106 36" fill="none" stroke="${c.hair}" stroke-width="4" stroke-linecap="round"/>`;
      case 'bob': return `<path d="M70 72 C68 50 84 40 100 40 C116 40 132 50 130 72 C128 66 126 62 124 60 L76 60 C74 62 72 66 70 72Z" fill="${c.hair}" stroke="${c.hair}" stroke-width="1.6" stroke-linejoin="round"/>` +
        `<path d="M76 60 C84 66 92 66 100 60 C108 66 116 66 124 60" fill="${c.hair}" stroke="${c.hair}" stroke-width="1.6"/>` +
        `<rect x="114" y="50" width="12" height="5" rx="2.5" transform="rotate(-20 120 52)" fill="#f2c14e" stroke="#a37a14" stroke-width="1.2"/>`;
      case 'puffs': return `<path d="M70 70 C66 50 82 40 100 40 C118 40 134 50 130 70 C126 62 120 56 110 56 L90 56 C80 56 74 62 70 70Z" fill="${c.hair}" stroke="${c.hair}" stroke-width="1.6" stroke-linejoin="round"/>` ;
      case 'braids': return `<path d="M70 72 C66 48 84 40 100 40 C116 40 134 48 130 72 C126 60 116 54 100 56 C86 54 74 60 70 72Z" fill="${c.hair}" stroke="${c.hair}" stroke-width="1.6" stroke-linejoin="round"/><path d="M100 41 L100 56" stroke="#3a2a26" stroke-width="1.6"/>`;
      default: return '';
    }
  }

  function hat(c) {
    if (c.hat === 'cap') return `<path d="M70 54 C70 30 130 30 130 54 L130 58 L70 58 Z" fill="#1f7a5a" stroke="#14513b" stroke-width="2.6" stroke-linejoin="round"/>` +
      `<path d="M66 58 C76 52 124 52 134 58 C138 62 132 66 126 64 C112 60 88 60 74 64 C68 66 62 62 66 58Z" fill="#1f7a5a" stroke="#14513b" stroke-width="2.6" stroke-linejoin="round"/>` +
      `<circle cx="100" cy="44" r="7" fill="#fbf3dc" stroke="#14513b" stroke-width="1.6"/><path d="M100 38.5 L102.2 44 L100 49.5 L97.8 44 Z" fill="#c8323c"/><path d="M100 44 L102.2 44 L100 49.5 L97.8 44 Z" fill="#5b6b73"/>`;
    if (c.hat === 'headset') return `<path d="M68 76 C66 40 134 40 132 76" fill="none" stroke="#22303a" stroke-width="6" stroke-linecap="round"/>` +
      `<path d="M68 76 C66 40 134 40 132 76" fill="none" stroke="#5b6b73" stroke-width="2.6" stroke-linecap="round"/>` +
      `<rect x="61" y="66" width="13" height="20" rx="6" fill="#2a8f9a" stroke="#175a61" stroke-width="2.4"/>` +
      `<rect x="126" y="66" width="13" height="20" rx="6" fill="#2a8f9a" stroke="#175a61" stroke-width="2.4"/>` +
      `<path d="M68 84 C68 96 76 100 84 98" fill="none" stroke="#22303a" stroke-width="2.6" stroke-linecap="round"/><circle cx="86" cy="97.6" r="3.4" fill="#2a8f9a" stroke="#175a61" stroke-width="1.4"/>`;
    if (c.hat === 'captain') return `<path d="M68 56 C66 36 134 36 132 56 L130 60 L70 60 Z" fill="#ffffff" stroke="#5b6b73" stroke-width="2.4" stroke-linejoin="round"/>` +
      `<path d="M70 52 L130 52 L130 60 L70 60 Z" fill="#1c3a58" stroke="#1c3a58" stroke-width="1.6"/>` +
      `<path d="M70 60 C80 56 120 56 130 60 C134 64 128 68 122 66 C110 63 90 63 78 66 C72 68 66 64 70 60Z" fill="#1c3a58" stroke="#0f2236" stroke-width="2" stroke-linejoin="round"/>` +
      `<path d="M94 46 L100 42 L106 46 L104 52 L96 52 Z" fill="#f2c14e" stroke="#a37a14" stroke-width="1.4" stroke-linejoin="round"/>`;
    if (c.hat === 'goggles') return `<path d="M70 56 C80 50 120 50 130 56" fill="none" stroke="#3a2a26" stroke-width="5" stroke-linecap="round"/>` +
      `<circle cx="88" cy="52" r="8.5" fill="#9fcfe0" stroke="#5b4636" stroke-width="3"/><circle cx="112" cy="52" r="8.5" fill="#9fcfe0" stroke="#5b4636" stroke-width="3"/>` +
      `<path d="M85 48 Q88 46 91 48 M109 48 Q112 46 115 48" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    if (c.hat === 'bushhat') return `<path d="M58 60 C70 54 130 54 142 60 C146 66 132 67 126 64 C112 60 88 60 74 64 C68 67 54 66 58 60Z" fill="#a8925a" stroke="#6a5a2a" stroke-width="2.4" stroke-linejoin="round"/>` +
      `<path d="M70 59 C68 32 132 32 130 59 Z" fill="#a8925a" stroke="#6a5a2a" stroke-width="2.4" stroke-linejoin="round"/><path d="M71 53 L129 53" stroke="#4e6b3a" stroke-width="5"/>` +
      `<path d="M128 52 C138 44 142 34 136 30 C132 38 128 44 126 52Z" fill="#6fae5a" stroke="#3a6a2a" stroke-width="1.4"/>`;
    if (c.hat === 'sunhat') return `<path d="M56 60 C70 52 130 52 144 60 C146 66 132 66 126 64 C112 60 88 60 74 64 C68 66 54 66 56 60Z" fill="#e8c27a" stroke="#9a7a3a" stroke-width="2.4" stroke-linejoin="round"/>` +
      `<path d="M68 59 C66 30 134 30 132 59 Z" fill="#e8c27a" stroke="#9a7a3a" stroke-width="2.4" stroke-linejoin="round"/><path d="M69 53 L131 53" stroke="#5e9c48" stroke-width="5"/>`;
    return '';
  }

  function face(c, mood) {
    let s = '';
    const left = c.orbs[2];
    const dy = mood === 'think' ? -2.6 : 0, dx = mood === 'think' ? (left ? -2.4 : 2.4) : 0;
    const k = c.browLift == null ? 1 : c.browLift;   // cap brims sit low, so lift less
    const up = v => (64 - (64 - v) * k).toFixed(1);
    const brows = mood !== 'think' ? 'M82 64 Q88 60 94 63 M106 63 Q112 60 118 64'
      : left ? `M81 ${up(61)} Q87 ${up(55)} 94 ${up(60)} M106 64 Q112 62 118 64` : `M82 64 Q88 62 94 64 M106 ${up(60)} Q113 ${up(55)} 119 ${up(61)}`;
    if (!c.noBrows) s += `<path d="${brows}" fill="none" stroke="${c.hair}" stroke-width="2.8" stroke-linecap="round"/>`;
    if (mood === 'happy') {
      s += `<path d="M82 76 Q88 69 94 76 M106 76 Q112 69 118 76" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
      s += `<path d="M88 88 Q100 102 112 88 Z" fill="#7a2e3a" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><path d="M94 94 Q100 99 106 94" fill="#e27d8a"/>`;
      c.sparkles.forEach(([x, y, r]) => { s += sparkle(x, y, r); });
    } else {
      [88, 112].forEach(x => {
        s += `<ellipse cx="${x + dx}" cy="${75 + dy}" rx="4.6" ry="5.6" fill="${INK}"/><circle cx="${x + dx + 1.6}" cy="${73 + dy}" r="1.6" fill="#fff"/>`;
      });
      s += mood === 'think'
        ? (c.orbs[2] ? `<path d="M93 89 Q100 93 107 92" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`
                     : `<path d="M93 92 Q100 93 107 89" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`) + orbs(c.orbs[0], c.orbs[1], 1, c.orbs[2])
        : `<path d="M91 89 Q100 96 109 89" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;
    }
    s += `<path d="M98 82 Q100 84.5 102 82" fill="none" stroke="${c.skinL}" stroke-width="2" stroke-linecap="round"/>`;
    s += `<ellipse cx="80" cy="85" rx="6" ry="3.6" fill="#e0765f" opacity=".45"/><ellipse cx="120" cy="85" rx="6" ry="3.6" fill="#e0765f" opacity=".45"/>`;
    if (c.freckles) [[91, 81], [94, 83.5], [90, 85], [109, 81], [106, 83.5], [110, 85]].forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="1" fill="#b5653a" opacity=".75"/>`; });
    return s;
  }

  function kid(id, mood) {
    const c = CREW[id];
    let s = '';
    s += hairBack(c);
    s += legs(c);
    // neck
    s += `<path d="M92 96 L108 96 L109 112 L91 112 Z" fill="${c.skin}" stroke="${c.skin}" stroke-width="1.6"/>`;
    s += `<path d="M92 104 Q100 110 108 104 L108 112 L92 112Z" fill="#000" opacity=".15"/>`;
    s += upperArms(c);
    s += shirt(c);
    s += neckwear(c);
    s += c.pose === 'hold' ? holdArms(c, props(c)) : raiseArms(c, mood);
    // ears, head, hair, hat, face
    if (c.hat !== 'headset') s += `<ellipse cx="70" cy="76" rx="6.5" ry="8" fill="${c.skin}" stroke="${c.skinL}" stroke-width="2.4"/><ellipse cx="130" cy="76" rx="6.5" ry="8" fill="${c.skin}" stroke="${c.skinL}" stroke-width="2.4"/>`;
    s += `<ellipse cx="100" cy="72" rx="30" ry="31" fill="${c.skin}" stroke="${c.skinL}" stroke-width="2.6"/>`;
    s += hairFront(c);
    s += hat(c);
    s += face(c, mood);
    return c.mirror ? `<g transform="translate(200 0) scale(-1 1)">${s}</g>` : s;
  }

  const svgWrap = (vb, inner, label, w) => `<svg viewBox="${vb}" width="${w}" role="img" aria-label="${label.replace(/&/g, "&amp;")}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  root.WildCrew = {
    ids: Object.keys(CREW),
    CREW,
    svg: (id, m, w) => svgWrap('0 0 200 240', kid(id, m || 'rest'), CREW[id].name + ', ' + CREW[id].zone + ' guide', w || 180),
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  /* ================= Zone 1: Tree of Life ================= */
  tree: {
    hello: [
      'Welcome to the atrium! This giant tree is the Tree of Life. Every living thing ever found sits somewhere on its branches, including you.',
      'Scientists sort every living thing into big groups by how they are related. Climb the tree and learn the six branches.',
      'The Tree of Life is a family tree. Branches that split recently hold close relatives. Let’s find out who is related to whom, and how scientists can tell.',
    ],
    stations: [
      { id: 'climb', title: 'Climb the Tree', blurb: 'Tap each branch and meet its living things.', badge: 'Tree Climber' },
      { id: 'sort', title: 'Sort It', blurb: 'Put each living thing on its branch.', badge: 'Master Sorter' },
      { id: 'alive', title: 'Living or Not?', blurb: 'Living, once living, or never living?', badge: 'Life Detective' },
      { id: 'closer', title: 'Who’s Closer?', blurb: 'Pick the closer relative. Some will surprise you.', badge: 'Family Finder' },
      { id: 'quiz', title: 'Quick Quiz', blurb: 'Eight questions at your level.', badge: 'Tree Expert' },
      { id: 'mission', title: 'Paper Mission: Kingdom Sort', blurb: 'Collect, photograph and sort ten things from your yard.', badge: 'Field Sorter', paper: true },
    ],

    /* The six branches, left to right on the tree. 'nucleus' marks cells with a nucleus (shown from Level 2). */
    branches: [
      { id: 'bacteria', name: 'Bacteria', color: '#C9862A', photo: 'ecoli', nucleus: false,
        say: [
          'Tiny living things made of just one cell. They live almost everywhere: in soil, in water and inside you. Most are harmless, and many are helpers.',
          'One cell with no nucleus, so their DNA floats loose inside the cell. A spoonful of garden soil can hold billions of them.',
          'One cell, no nucleus. Bacteria are among the oldest kinds of life on Earth: fossils show microbes living more than 3 billion years ago.',
        ],
        more: ['The bacteria in yogurt turn milk sour and thick.', 'Bacteria in soil break down dead leaves and help plants get nitrogen.', 'Your gut holds trillions of bacteria that help you digest food.'] },
      { id: 'archaea', name: 'Archaea', color: '#B85C8A', photo: 'halo', photo2: 'saltpond', nucleus: false,
        say: [
          'One-celled living things that look a lot like bacteria, but they are a different branch. Many live in places too salty or too hot for most life.',
          'One cell with no nucleus, like bacteria, but their cell parts are built differently. Some help turn salt ponds pink!',
          'They look like bacteria, but their genes tell a different story: archaea are closer relatives of plants, animals and fungi than bacteria are.',
        ],
        more: ['Some archaea live in hot springs hotter than a cup of tea.', 'Salt-loving archaea help make whole ponds look pink or red.', 'Archaea also live in ordinary places: the ocean, soil, even your gut.', 'Scientists only recognized archaea as their own branch in 1977, by comparing genes.'] },
      { id: 'protists', name: 'Protists', color: '#2A8F9A', photo: 'diatoms', nucleus: true,
        say: [
          'Mostly tiny living things, like amoebas and many algae, that are not plants, animals or fungi. Some swim, some ooze and some make food from sunlight.',
          'Their cells have a nucleus, like ours. Protists are a mixed bag: scientists group them together because they don’t fit the other branches.',
          'Protists are not one family. They are many separate branches near the base of the plant, animal and fungus branches, kept together in one box to make sorting easier.',
        ],
        more: ['Diatoms build glass shells and make a big share of the oxygen in the air.', 'An amoeba moves by oozing its body forward.', 'Some protists, like kelp, can grow very large even though most are tiny.'] },
      { id: 'plants', name: 'Plants', color: '#2F7A4A', photo: 'buckeye', nucleus: true,
        say: [
          'Living things that make their own food from sunlight, water and air. Trees, grass, moss, ferns and flowers are all plants.',
          'Many cells with a nucleus, and green chlorophyll that catches sunlight. Plant cells have stiff walls, pumped firm with water, which is why stems and trunks stand up.',
          'Plants make food by photosynthesis and give off oxygen. Land plants grew from green algae that moved out of the water hundreds of millions of years ago.',
        ],
        more: ['The Ohio buckeye is Ohio’s state tree.', 'Moss has no flowers or seeds; it spreads by tiny spores.', 'Your family’s Golden Russet apple trees will sit on this branch too.'] },
      { id: 'fungi', name: 'Fungi', color: '#A35A3A', photo: 'agaric', nucleus: true,
        say: [
          'Mushrooms, molds and yeast. Fungi can’t make their own food like plants do. They soak it up from what they grow on.',
          'Cells with a nucleus. A mushroom is only the fruit of a fungus: most of it is a web of thin threads hidden in soil or wood.',
          'Fungi look a bit like plants, but they are closer relatives of animals than of plants. Like us, they have to take in food made by other living things.',
        ],
        more: ['Yeast is a fungus. It makes bread dough rise.', 'Fungi and bacteria are the big recyclers of dead plants and animals.', 'Never eat a wild mushroom: some look safe but are poisonous. The red fly agaric is one of them.'] },
      { id: 'animals', name: 'Animals', color: '#C8323C', photo: 'cardinal', photo2: 'monarch', nucleus: true,
        say: [
          'Living things that move around at some point in their lives and eat other living things for food. Birds, bugs, fish, worms and you!',
          'Many cells with a nucleus and no stiff cell walls. Animals get their food by eating other living things.',
          'Animals range from sponges to people. Most kinds of animals have no backbone: insects alone outnumber all other known animal species put together.',
        ],
        more: ['The northern cardinal is Ohio’s state bird.', 'Monarch butterflies fly thousands of miles to Mexico each fall.', 'You are an animal too: a mammal, on the same branch as deer and mice.'] },
    ],
    // Level 2 and 3 add the big split by cell type
    split: [
      '',
      'Two big kinds of cells: no nucleus (bacteria and archaea) and with a nucleus (protists, plants, fungi, animals).',
      'Scientists call the three biggest branches domains: Bacteria, Archaea and Eukarya. Eukarya means “true nucleus”, and it holds protists, plants, fungi and animals.',
    ],

<script>
(function(){
'use strict';
const W = window.WILD, CREW = window.WildCrew, PH = W.photos;
let ZONE = 'tree';
const ZM = () => W[ZONE];
const META = id => W.zones.find(z => z.id === (id || ZONE));
const GID = () => META().guide, GNAME = () => CREW.CREW[GID()].name;
const badgeOf = id => (ZM().stations.find(s => s.id === id) || {}).badge;
const $ = (s, r) => (r || document).querySelector(s);
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const main = $('#main');

/* ---------- state ---------- */
const KEY = 'wildlab.v1';
const fresh = () => ({ level: 1, stars: {}, badges: {}, sound: true, quiz: {}, mission: {}, seen: {} });
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const lv = () => S.level;
const pick = arr => arr[Math.min(lv(), arr.length) - 1];
const starCount = () => Object.keys(S.stars).length;
const zoneStars = z => Object.keys(S.stars).filter(k => k.startsWith(z + '.')).length;

/* ---------- mission photo stamps (IndexedDB) ---------- */
const DB = {
  open() { return new Promise((res, rej) => { try { const r = indexedDB.open('wildlab', 1); r.onupgradeneeded = () => r.result.createObjectStore('stamps'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async put(k, v) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('stamps', 'readwrite'); t.objectStore('stamps').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k) { const d = await this.open(); return new Promise((res, rej) => { const q = d.transaction('stamps').objectStore('stamps').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async clear() { const d = await this.open(); return new Promise(res => { const t = d.transaction('stamps', 'readwrite'); t.objectStore('stamps').clear(); t.oncomplete = res; t.onerror = res; }); },
};

/* ---------- sound (synthesized, soft) ---------- */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); try { navigator.audioSession && (navigator.audioSession.type = 'playback'); } catch (e) {} } catch (e) { return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f1, f2, dur, type, vol, delay) {
  if (!S.sound) return; const c = ac(); if (!c) return;
  const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  good() { tone(520, 880, 0.18, 'sine', 0.18); tone(780, 1170, 0.2, 'sine', 0.12, 0.09); },
  oops() { tone(220, 160, 0.22, 'triangle', 0.16); },
  tap() { tone(660, 620, 0.08, 'sine', 0.12); },
  star() { [660, 880, 1320].forEach((f, i) => tone(f, f * 1.01, 0.18, 'sine', 0.13, i * 0.09)); },
};

/* ---------- helpers ---------- */
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z" fill="currentColor"/></svg>';
const BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LEAF = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 36C9 30 7 18 10 6c10 2 18 10 18 20 0 4-3 8-8 10z" fill="#9CC98A" stroke="#3E7A3E" stroke-width="2"/><path d="M20 36C17 26 14 17 11 8" fill="none" stroke="#3E7A3E" stroke-width="2"/><circle cx="30" cy="11" r="6" fill="none" stroke="#3E5A48" stroke-width="2.4"/><path d="M34.5 15.5l4 4" stroke="#3E5A48" stroke-width="2.6" stroke-linecap="round"/></svg>';
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function bump(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function photo(id, cap) {
  const p = PH[id], src = (window.WILD_IMG || {})[id];
  if (!p) return '';
  return `<figure class="photo">${src ? `<img src="${src}" alt="${esc(p.what)}" loading="lazy" decoding="async">` : `<div class="ph" role="img" aria-label="${esc(p.what)} (photo coming)">${LEAF}<b>${esc(p.what)}</b><span>Real photo coming soon</span></div>`}${cap === false ? '' : `<figcaption>${esc(cap || p.what)}</figcaption>`}</figure>`;
}
function guide(id, mood, text) {
  return `<div class="guide"><div class="pic">${CREW.svg(id, mood, 96)}</div><div class="bubble" aria-live="polite">${text}</div></div>`;
}
function setGuide(root, id, mood, html) { const g = $('.guide', root); if (!g) return; $('.pic', g).innerHTML = CREW.svg(id, mood, 96); $('.bubble', g).innerHTML = html; }
const g = () => `<b>${esc(GNAME())}:</b>`;
function award(station, badge) {
  const k = `${ZONE}.${station}.${lv()}`, first = !S.stars[k];
  S.stars[k] = 1; let newBadge = false;
  if (badge && !S.badges[badge]) { S.badges[badge] = Date.now(); newBadge = true; }
  save(); paintBar();
  if (first || newBadge) win(first, newBadge ? badge : null);
}
function win(star, badge) {
  sfx.star();
  const o = document.createElement('div'); o.className = 'over';
  o.innerHTML = `<div class="box win" role="dialog" aria-modal="true" aria-label="Well done">
    ${CREW.svg(GID(), 'happy', 120)}
    <div class="big">${star ? '+1 star' : 'Nice!'}</div>
    ${badge ? `<div class="bdg" style="background:var(--good-bg)">${badgeSvg(badge)}<span>New badge: ${esc(badge)}</span></div>` : ''}
    <p class="muted">${starCount()} stars so far.</p>
    <button class="btn" data-close>Back to ${esc(META().name)}</button></div>`;
  o.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === o) { o.remove(); go('zone'); } });
  document.body.appendChild(o); $('[data-close]', o).focus();
}
function badgeSvg(name) {
  const h = [...name].reduce((a, c) => a + c.charCodeAt(0), 0), hues = ['#2F7A4A', '#C9862A', '#3E86B8', '#B85C8A', '#C8323C', '#2A8F9A', '#A35A3A'];
  const col = hues[h % hues.length];
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4l7 5 8-1 3 8 7 5-2 8 3 8-7 5-3 8-8-1-7 5-7-5-8 1-3-8-7-5 3-8-2-8 7-5 3-8 8 1z" fill="${col}"/><circle cx="32" cy="32" r="16" fill="#fff"/><path d="M32 46c-8-3-10-10-8-18 7 1 10 7 8 18zM32 46c8-3 10-10 8-18-7 1-10 7-8 18z" fill="${col}"/></svg>`;
}

/* ---------- top bar ---------- */
function paintBar() {
  $('#dial').innerHTML = W.levels.map(l => `<button aria-pressed="${l.n === lv()}" data-lv="${l.n}" title="${esc(l.says)}"><b>${l.n}</b><span>${esc(l.name)}</span></button>`).join('');
  $('#starCount').textContent = starCount();
  $('#soundBtn').innerHTML = S.sound
    ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
  $('#soundBtn').setAttribute('aria-label', S.sound ? 'Sound on' : 'Sound off');
}
$('#dial').addEventListener('click', e => { const b = e.target.closest('[data-lv]'); if (!b) return; S.level = +b.dataset.lv; save(); paintBar(); render(); toast(`Level ${S.level}, ${W.levels[S.level - 1].name}: ${W.levels[S.level - 1].says}`); });
$('#homeBtn').addEventListener('click', () => go('home'));
$('#soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); paintBar(); if (S.sound) sfx.good(); });
$('#starBtn').addEventListener('click', showBadges);
$('#adultBtn').addEventListener('click', showAdults);

/* ---------- routing ---------- */
let view = { name: 'home' };
function go(name, arg) { view = { name, arg }; render(); window.scrollTo(0, 0); }
function render() {
  main.innerHTML = '';
  if (view.name === 'home') return home();
  if (view.name === 'zone') return zone();
  const fn = STATIONS[view.name]; if (fn) fn();
}
main.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (b) return go(b.dataset.go);
  const m = e.target.closest('[data-more]'); if (m) { const l = m.nextElementSibling; l.hidden = !l.hidden; m.setAttribute('aria-expanded', String(!l.hidden)); m.textContent = l.hidden ? 'Tell me more' : 'Show less'; }
});

/* ---------- home: the Seven Domes ---------- */
function home() {
  main.innerHTML = `
  <div class="home">
    <section class="mapbox map-wrap" aria-label="Map of the Seven Domes" id="mapbox"></section>
    <section class="sheet">
      <span class="sign">The Seven Domes</span>
      ${guide('moss', 'happy', `<b>Head Keeper Moss:</b> Welcome, keeper! ${W.zones.every(z => z.open) ? 'Every dome and lab is open. Where shall we go today?' : esc(W.zones.filter(z => z.open).map(z => z.name).join(', ')) + ' are open. The others open one by one.'}`)}
      <div class="route">
        ${W.zones.map(z => `
          <button class="stop ${z.open ? '' : 'locked'}" data-zone="${z.id}">
            <span class="face">${CREW.svg(z.guide, 'rest', 80)}</span>
            <span class="t"><b>${z.n} · ${esc(z.name)}</b><span>${esc(z.place)} · with ${esc(CREW.CREW[z.guide].name)}</span></span>
            ${z.open ? `<span class="tag open">${zoneStars(z.id)} ★ · Go</span>` : '<span class="tag soon">Coming soon</span>'}
          </button>`).join('')}
      </div>
    </section>
  </div>`;
  const box = $('#mapbox'); box.appendChild($('#mapTpl').content.cloneNode(true));
  box.querySelectorAll('.pin[data-n]').forEach(p => {
    const z = W.zones.find(x => x.n === +p.dataset.n);
    if (!z) { p.removeAttribute('tabindex'); p.removeAttribute('role'); return; }
    p.dataset.zone = z.id; p.setAttribute('aria-label', `${z.name}${z.open ? '' : ', coming soon'}`);
    if (!z.open) p.classList.add('shut');
  });
  const lodge = box.querySelector('.pin.home');
  if (lodge) { lodge.setAttribute('tabindex', '0'); lodge.setAttribute('role', 'button'); lodge.setAttribute('aria-label', 'Keepers’ Lodge: your stars and badges'); lodge.dataset.lodge = '1'; }
}
function openZone(id, el) {
  const z = W.zones.find(x => x.id === id); if (!z) return;
  if (z.open) { ZONE = id; S.seen[id] = 1; save(); return go('zone'); }
  sfx.oops(); bump(el, 'wiggle'); toast(`${CREW.CREW[z.guide].name}: ${z.name} isn’t open yet. Coming soon!`);
}
main.addEventListener('click', e => { if (view.name !== 'home') return; if (e.target.closest('[data-lodge]')) return showBadges(); const b = e.target.closest('[data-zone]'); if (b) openZone(b.dataset.zone, b); });
main.addEventListener('keydown', e => { if (view.name !== 'home' || (e.key !== 'Enter' && e.key !== ' ')) return; if (e.target.closest('[data-lodge]')) { e.preventDefault(); return showBadges(); } const b = e.target.closest('.pin[data-zone]'); if (b) { e.preventDefault(); openZone(b.dataset.zone, b); } });

function zone() {

  main.innerHTML = `

const stationNo = id => ZM().stations.findIndex(s => s.id === id) + 1;
const stationTitle = id => ZM().stations.find(s => s.id === id).title;
function stationShell(id, inner) {
  main.innerHTML = `<button class="back" data-go="zone">${BACK} ${esc(META().name)}</button>
  <section class="sheet station"><div style="display:grid;gap:6px"><span class="sign">Station ${stationNo(id)}</span><h2>${esc(stationTitle(id))}</h2></div>${inner}</section>`;
