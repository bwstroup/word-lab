<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7EBD3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gizmo Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gizmo Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one fixed top bar, then one screen at a time. Home = the cutaway house beside Goldie's panel (stacks in portrait).
   Stations = sim beside challenge (stacks in portrait). Workshop = canvas with the Parts Bin tray under it. */
:root {
  --wall: #F7EBD3;        /* house wallpaper, page ground */
  --card: #FFFBF2;        /* paper cards */
  --ink: #2C2430;         /* text */
  --ink2: #6A5B60;        /* secondary text */
  --wood: #A8703F;        /* beams, planks */
  --wood-dk: #6E4423;
  --copper: #C46A2E;      /* marble run, primary action */
  --copper-ink: #FFFFFF;
  --brass: #E2AE38;       /* stamps, stars */
  --sky: #CFE6EF;
  --grass: #79B465;
  --teal: #2A8A6F;        /* Ozzie */
  --mustard: #C98A1E;     /* Jules */
  --blue: #2F64B0;        /* Goldie */
  --good: #2E8B57;
  --soft: #EBDDC1;
  --line: #D9C7A6;
  --shadow: 0 2px 0 rgba(60, 40, 20, .18);
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #241E2A; --card: #2F2836; --ink: #F6EEDF; --ink2: #C3B6B0; --wood: #B98153; --wood-dk: #8C5A33;
    --copper: #E0884A; --copper-ink: #1E1612; --brass: #F0C25A; --sky: #2D3F55; --grass: #4F7F47; --teal: #3FB08F;
    --mustard: #E0A23A; --blue: #6C9BE6; --good: #4CC383; --soft: #3A3243; --line: #4E4458; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #241E2A; --card: #2F2836; --ink: #F6EEDF; --ink2: #C3B6B0; --wood: #B98153; --wood-dk: #8C5A33;
  --copper: #E0884A; --copper-ink: #1E1612; --brass: #F0C25A; --sky: #2D3F55; --grass: #4F7F47; --teal: #3FB08F;
  --mustard: #E0A23A; --blue: #6C9BE6; --good: #4CC383; --soft: #3A3243; --line: #4E4458; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--wall); color: var(--ink); font: 17px/1.5 var(--f-body); -webkit-text-size-adjust: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wall); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.6rem; font-weight: 700; }
h3 { font-size: 1.2rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 3px solid var(--copper); outline-offset: 2px; }
.app { max-width: 1240px; margin: 0 auto; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }

/* top bar */
.bar { position: relative; z-index: 5; background: var(--wall); display: flex; align-items: center; gap: 10px;
  padding-block: 10px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.homebtn { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--wood-dk); background: var(--card); display: grid; place-items: center; flex: none; }
.homebtn svg { width: 28px; height: 28px; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 140px; }
.brand b { font-family: var(--f-display); font-size: 1.45rem; line-height: 1; letter-spacing: -.01em; }
.brand small { color: var(--ink2); font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dial { display: flex; background: var(--soft); border-radius: 999px; padding: 4px; gap: 2px; }
.dial button { border: 0; background: transparent; border-radius: 999px; padding: 8px 12px; min-height: 44px; font-weight: 700; font-size: .95rem; color: var(--ink2); }
.dial button[aria-pressed="true"] { background: var(--copper); color: var(--copper-ink); }
.barbtn { min-height: 48px; min-width: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; font-weight: 700; }
.barbtn svg { width: 24px; height: 24px; flex: none; }
.barbtn .n { font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .dial button { padding: 8px 9px; font-size: .85rem; } .barbtn .lbl { display: none; } .brand { flex-basis: 100px; } }

.screen { padding-top: 18px; display: grid; gap: 18px; }

/* guide (mouse + speech bubble) */
.guide { display: flex; gap: 12px; align-items: flex-end; }
.guide img { width: 104px; height: auto; flex: none; }
.bubble { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px; position: relative; min-width: 0; box-shadow: var(--shadow); }
.bubble::before { content: ""; position: absolute; left: -11px; bottom: 22px; border: 10px solid transparent; border-right-color: var(--line); border-left: 0; }
.bubble b { display: block; font-family: var(--f-display); font-size: 1.05rem; }

/* home */
.home { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(260px, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .home { grid-template-columns: 1fr; } }
.house { width: 100%; height: auto; display: block; border-radius: var(--r); background: var(--sky); }
.room { cursor: pointer; }
.room:focus-visible { outline: none; }
.room:focus-visible .roomfill, .room:hover .roomfill { stroke: var(--copper); stroke-width: 5; }
.side { display: grid; gap: 14px; }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tally div { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
.tally b { display: block; font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.tally span { font-size: .8rem; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; }
.roomlist { display: grid; gap: 8px; }
.roomlist button { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 10px; text-align: left; min-height: 56px; }
.roomlist img { width: 40px; flex: none; }
.roomlist .soon { opacity: .7; }
.tag { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; border-radius: 999px; padding: 2px 8px; background: var(--soft); color: var(--ink2); white-space: nowrap; }
.tag.open { background: var(--good); color: #fff; }

/* zone hub cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; text-align: left; align-content: start; box-shadow: var(--shadow); }
.card .ico { width: 64px; height: 64px; }
.card p { color: var(--ink2); font-size: .95rem; }
.dots { display: flex; gap: 6px; align-items: center; font-size: .8rem; color: var(--ink2); flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.dot.on { background: var(--brass); border-color: var(--brass); }
.reward { font-size: .85rem; color: var(--ink2); }
.reward b { color: var(--ink); }
.mission { border-style: dashed; border-color: var(--copper); }

/* station */
.station { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .station { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.sim svg { width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.intro { color: var(--ink2); }
.tip { border-left: 4px solid var(--brass); padding: 6px 12px; background: var(--soft); border-radius: 0 10px 10px 0; font-size: .95rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { min-height: 48px; min-width: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); padding: 4px 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--copper); background: var(--soft); box-shadow: inset 0 0 0 2px var(--copper); }
.chip svg { height: 30px; width: auto; }
.go { min-height: 54px; border-radius: 14px; border: 0; background: var(--copper); color: var(--copper-ink); font-weight: 700; font-size: 1.1rem; padding: 0 22px; box-shadow: 0 3px 0 var(--wood-dk); }
.go:disabled { opacity: .45; box-shadow: none; }
.ghost { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: transparent; padding: 0 16px; font-weight: 700; }
.readout { font-variant-numeric: tabular-nums; font-size: .95rem; background: var(--soft); border-radius: 10px; padding: 8px 12px; }
.meter { height: 18px; border-radius: 9px; background: var(--soft); overflow: hidden; border: 2px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--copper); transition: width .25s; }
.slider { width: 100%; height: 44px; accent-color: var(--copper); }
.tray { display: flex; gap: 10px; flex-wrap: wrap; min-height: 76px; padding: 8px; border: 2px dashed var(--line); border-radius: 12px; align-items: center; }
.sack { width: 64px; height: 64px; touch-action: none; cursor: grab; }
.drag-ghost { position: fixed; pointer-events: none; z-index: 50; width: 64px; height: 64px; transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 6px 6px rgba(0,0,0,.3)); }

/* challenge */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.progress { display: flex; gap: 5px; }
.progress i { width: 12px; height: 12px; border-radius: 50%; background: var(--soft); border: 2px solid var(--line); }
.progress i.done { background: var(--good); border-color: var(--good); }
.progress i.now { border-color: var(--copper); }
.q { font-size: 1.12rem; font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; min-height: 54px; border-radius: 12px; border: 2px solid var(--line); background: var(--wall); padding: 10px 14px; font-weight: 700; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--card)); }
.opt.wrong { border-color: var(--line); opacity: .55; }
.feedback { display: flex; gap: 10px; align-items: center; background: var(--soft); border-radius: 12px; padding: 8px 12px; }
.feedback img { width: 78px; flex: none; }
.wiggle { animation: wiggle .4s; }
@keyframes wiggle { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-7px) } 75% { transform: translateX(7px) } }
.pop { animation: pop .35s; }
@keyframes pop { 0% { transform: scale(.85) } 60% { transform: scale(1.06) } 100% { transform: scale(1) } }

/* mission */
.checklist { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.checklist label { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.checklist input { width: 26px; height: 26px; accent-color: var(--good); }
ol.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
.photo { width: 100%; max-width: 420px; border-radius: 12px; border: 3px solid var(--brass); }
.filebtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* workshop */
.wsgrid { display: grid; gap: 12px; }
.goalbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stage { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: auto; touch-action: none; }
.selbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.selbar button { min-width: 48px; min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 700; }
.status { position: absolute; left: 8px; bottom: 8px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 4px 10px; font-size: .9rem; max-width: 60%; }
.status.warn { border-color: var(--copper); }
.partstray { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.partbtn { flex: none; width: 96px; min-height: 96px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; gap: 2px; padding: 6px; font-size: .8rem; font-weight: 700; }
.partbtn svg { width: 64px; height: 40px; }
.partbtn .n { font-variant-numeric: tabular-nums; color: var(--ink2); }
.partbtn:disabled { opacity: .4; }
.overlay { position: fixed; inset: 0; background: rgba(20, 12, 8, .55); z-index: 30; display: grid; place-items: center; padding: 16px; }
.overlay .panel { max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; }
.spotchips { display: flex; flex-wrap: wrap; gap: 8px; }

/* book */
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.stamp { text-align: center; display: grid; gap: 6px; justify-items: center; font-size: .9rem; }
.stamp svg, .stamp img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; }
.stamp.off { opacity: .35; filter: grayscale(1); }
.stamp small { color: var(--ink2); }
.bin { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.bin div { display: flex; gap: 10px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px; }
.bin svg { width: 60px; height: 38px; flex: none; }

/* grown-ups */
.hold { position: relative; overflow: hidden; }
.hold i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,255,255,.35); pointer-events: none; }
.note { font-size: .9rem; color: var(--ink2); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (min-width: 700px) { .bar { position: sticky; top: env(safe-area-inset-top, 0px); } }
@media (max-width: 699px) { .brand small { display: none; } .bar { gap: 8px; } .homebtn { width: 48px; height: 48px; } }
.stage { width: 100%; max-width: calc((100dvh - 230px) * 1.5); min-width: min(100%, 560px); margin-inline: auto; }
.compact .guide img { width: 64px; }
.compact .bubble { padding: 8px 12px; font-size: .95rem; }

/* batch 2: tap-a-part sims */
.tappable { cursor: pointer; }
.tappable.lit { filter: drop-shadow(0 0 4px var(--copper)) drop-shadow(0 0 2px var(--copper)); }
.partcard b { color: var(--copper); }
.stepsrow { gap: 6px; justify-content: center; }
.stepbtns { display: inline-flex; flex-direction: column; gap: 4px; }
.stepbtns .chip { min-height: 44px; min-width: 52px; padding: 0 8px; }
.stepsrow { flex-wrap: nowrap; }
.stepbtns .chip { min-width: 44px; padding: 0; }

/* batch 3: garage sims */
.rowlbl { font-size: .85rem; color: var(--ink2); min-width: 86px; }
.gchip { flex-direction: column; gap: 0; padding: 4px 8px; font-size: .8rem; min-width: 56px; }
.gchip svg { height: 30px; width: 30px; }
.gearsvg { max-height: 360px; }

</style>
</head>
<body>
<div class="app" id="app"><p style="padding:24px">Loading Gizmo Lab…</p></div>

<script>
/* Gizmo Lab — Rube Goldberg Workshop core.

    plank:   { name: 'Plank',      base: true,  rotate: true,  machine: 'ramp' },   // counts as a ramp when tilted
    block:   { name: 'Block',      base: true,  rotate: true,  machine: null },
    domino:  { name: 'Domino',     base: true,  rotate: true,  machine: null },
    ball:    { name: 'Marble',     base: true,  rotate: false, machine: null },
    chute:   { name: 'Long ramp',  base: false, rotate: true,  machine: 'ramp',   from: 'ramp' },
    seesaw:  { name: 'Seesaw',     base: false, rotate: true,  machine: 'lever',  from: 'lever' },
    pulley:  { name: 'Pulley lift',base: false, rotate: false, machine: 'pulley', from: 'pulley' },
    wedge:   { name: 'Wedge',      base: false, rotate: true,  machine: 'wedge',  from: 'wedge' },
    screw:   { name: 'Screw lift', base: false, rotate: false, machine: 'screw',  from: 'wedge' },
    cart:    { name: 'Cart',       base: false, rotate: false, machine: 'wheel',  from: 'wheel' },
    funnel:  { name: 'Funnel',     base: false, rotate: false, machine: null,     from: 'flush' },
    bumper:  { name: 'Spring bumper', base: false, rotate: false, machine: null,  from: 'locks' },
    paddle:  { name: 'Paddle wheel', base: false, rotate: false, machine: 'wheel',  from: 'gears' },

  var SCENES = {
    sandbox: { title: 'Free build', goal: null },
    bell:    { title: 'Ring the bell', goal: 'bell',    target: { x: 1110, y: 600 } },
    balloon: { title: 'Pop the balloon', goal: 'balloon', target: { x: 1080, y: 690 } },
    plant:   { title: 'Water the plant', goal: 'plant',  can: { x: 640, y: 300 }, pot: { x: 1100, y: 730 } },
    bowl:    { title: "Fill the cat's bowl", goal: 'bowl', hopper: { x: 1040, y: 150 }, latch: { x: 900, y: 255 }, bowlAt: { x: 640, y: 760 } }
  };

  // Level rules for goals: minimum links (parts the chain actually used), part allowance, machines needed.

      out.bodies.push(tag(B.circle(p.x, p.y, 18, { isStatic: true, restitution: 1 }, 30), info()));

      out.bodies.push(tag(pw, info()));
      out.constraints.push(C.create({ pointA: { x: p.x, y: p.y }, bodyB: pw, pointB: { x: 0, y: 0 }, length: 0, stiffness: 1 }));

    } else if (p.type === 'conveyor') {
      out.bodies.push(tag(B.rectangle(p.x, p.y, 200, 14, { isStatic: true, angle: a, friction: 0.6 }), info()));

      var wA = tag(B.circle(p.x - 36, p.y + 8, 15, { collisionFilter: { group: grp }, friction: 0.9, density: 0.0008 }), info('wheel'));
      var wB = tag(B.circle(p.x + 36, p.y + 8, 15, { collisionFilter: { group: grp }, friction: 0.9, density: 0.0008 }), info('wheel'));

  }

  function sceneBodies(M, scene) {
    var B = M.Bodies, list = [];
    var wall = function (x, y, w, h, role, opt) {

    list.push(wall(-30, H / 2, 60, H * 2, 'wall'));
    list.push(wall(W + 30, H / 2, 60, H * 2, 'wall'));

    list.push(wall(36, 84, 10, 40, 'starter'));
    var gate = wall(92, 96, 8, 30, 'gate');
    list.push(gate);
    var marble = tag(B.circle(64, 92, 14, { density: 0.004, restitution: 0.15, friction: 0, frictionAir: 0.005 }, 40), { role: 'marble', type: 'ball' });

    var s = { list: list, gate: gate, marble: marble, extra: {} };
    var g = scene.goal;
    if (g === 'bell') {
      var t = scene.target;
      s.extra.bell = tag(B.circle(t.x, t.y, 30, { isStatic: true, restitution: 0.6 }), { role: 'bell' });
      list.push(s.extra.bell);

    } else if (g === 'plant') {

      s.extra.can = tag(B.rectangle(c.x, c.y, 60, 54, { isStatic: true }), { role: 'can' });
      list.push(s.extra.can);
      s.extra.pot = tag(B.rectangle(pot.x, pot.y + 20, 90, 56, { isStatic: true, isSensor: true }), { role: 'pot' });
      list.push(s.extra.pot);
      list.push(wall(pot.x - 50, pot.y + 16, 10, 68, 'potwall'), wall(pot.x + 50, pot.y + 16, 10, 68, 'potwall'));
      s.extra.canAngle = 0;
    } else if (g === 'bowl') {
      var h = scene.hopper, l = scene.latch, bw = scene.bowlAt;
      list.push(wall(h.x - 64, h.y, 10, 120, 'hopper'), wall(h.x + 64, h.y, 10, 120, 'hopper'));
      s.extra.door = wall(h.x, h.y + 64, 138, 10, 'door');
      list.push(s.extra.door);
      s.extra.kibble = [];
      for (var i = 0; i < 12; i++) {
        var k = tag(B.circle(h.x - 40 + (i % 6) * 16, h.y + 40 - Math.floor(i / 6) * 16, 7, { density: 0.002, friction: 0, frictionAir: 0.01, restitution: 0.1 }), { role: 'kibble', type: 'kibble' });
        s.extra.kibble.push(k); list.push(k);
      }
      s.extra.latch = tag(B.rectangle(l.x, l.y, 26, 26, { isStatic: true }), { role: 'latch' });
      list.push(s.extra.latch);
      list.push(wall(l.x, l.y + 22, 70, 10, 'shelf'));
      s.extra.bowl = tag(B.rectangle(bw.x, bw.y, 90, 24, { isStatic: true, isSensor: true }), { role: 'bowl' });
      list.push(s.extra.bowl);
      list.push(wall(bw.x - 50, bw.y - 4, 8, 34, 'bowlwall'), wall(bw.x + 50, bw.y - 4, 8, 34, 'bowlwall'));

  /* ---------- run ---------- */
  function createRun(M, sceneKey, placements) {
    var scene = SCENES[sceneKey];

    engine.positionIterations = 10; engine.velocityIterations = 8;
    var world = engine.world;
    var sc = sceneBodies(M, scene);

    var parts = placements.map(function (p, i) { return buildPart(M, p, i); });

    var st = { scene: sceneKey, engine: engine, sc: sc, parts: parts, steps: 0, started: false, won: false, wonAt: -1,

          if (gx.role === 'balloon' && gy && gy.type === 'wedge') { note('pop'); st.popped = true; win('balloon'); }
          if (gx.role === 'can' && !st.tipping && hitSpeed > 0.6 && gy && gy.role !== 'drop') { st.tipping = true; note('tip'); }
          if (gx.role === 'latch' && !st.opened && hitSpeed > 0.6 && gy && gy.role !== 'kibble') { st.opened = true; note('latch'); }

      st.steps++;

        }
        pt.bodies.forEach(function (b, i) {
          if (b.isStatic) return;

        else if (st.drops.length < 30 && st.steps % 3 === 0) {
          var sp2 = SCENES[st.scene].can;
          var dpt = M.Bodies.circle(sp2.x + 44, sp2.y + 10, 5, { density: 0.001, friction: 0, restitution: 0.05, frictionAir: 0.02 });

  }

  /* judge a finished run against a level */
  function judge(run, level, placements) {
    var L = LEVELS[level], r = { won: run.won, links: run.linkCount(), machines: run.machineList(), parts: placements.length };
    r.okLinks = r.links >= L.links; r.okParts = r.parts <= L.maxParts; r.okMachines = r.machines.length >= L.machines;
    r.pass = r.won && r.okLinks && r.okParts && r.okMachines;

    createRun: createRun, overlaps: overlaps, judge: judge };
});

        wheel: 20, front: 32, rear: [12, 16, 20, 24, 32],
        parts: [
          { id: 'pedal', name: 'Pedals and crank arms', job: 'You push the pedals around in a circle. The crank arms are a wheel and axle.' },
          { id: 'chainring', name: 'Chainring', job: 'The big front sprocket, fixed to the crank. Its teeth pull the chain.' },
          { id: 'chain', name: 'Chain', job: 'Carries your pedaling from the front sprocket to the rear cog. Both turn the same way.' },
          { id: 'cog', name: 'Rear cogs', job: 'The small sprockets on the back wheel. Smaller cog = harder pedaling but faster.' },
          { id: 'derailleur', name: 'Derailleur', job: 'Pushes the chain sideways onto a different rear cog when you shift.' },
          { id: 'brake', name: 'Brake lever and pads', job: 'Squeeze the lever (a lever!) and a cable pulls rubber pads against the wheel. Friction slows you down.' },
          { id: 'tire', name: 'Tire and valve', job: 'Air in the tube makes a cushion. The valve lets air in but not out.' },
          { id: 'spokes', name: 'Spokes and hub', job: 'Thin wires that hold the rim to the hub, the axle in the middle of the wheel.' },
          { id: 'frame', name: 'Frame', job: 'Triangles of tube. Triangles are the strongest simple shape, so the frame doesn\'t bend.' }
        ],
        sets: {
          sketch: [
            { t: 'choice', q: 'Which part carries your pedaling to the back wheel?', opts: ['The chain', 'The handlebar', 'The seat'], a: 0, why: 'The chain wraps around the front sprocket and the rear cog.' },
            { t: 'choice', q: 'The front sprocket and the rear cog are joined by a chain. Which way do they turn?', opts: ['The same way', 'Opposite ways', 'Only the front one turns'], a: 0, why: 'Unlike meshed gears, a chain makes both sprockets turn the same way.' },
            { t: 'choice', q: 'Going up a hill, which rear cog makes pedaling easier?', opts: ['A big rear cog', 'A small rear cog', 'It doesn\'t matter'], a: 0, why: 'A big rear cog means more pedal turns for each wheel turn: each push is gentler.' },
            { t: 'choice', q: 'What slows the bike when you squeeze the brakes?', opts: ['Friction from the pads rubbing the wheel', 'The chain stopping', 'Air in the tires'], a: 0, why: 'The pads rub the wheel, and friction turns your speed into a little heat.' },
            { t: 'choice', q: 'Why is a bike frame made of triangles?', opts: ['Triangles don\'t bend out of shape', 'Triangles are lighter than air', 'To look like mountains'], a: 0, why: 'Push on a square and it squashes into a diamond. A triangle holds its shape.' }
          ],
          prototype: [
            { t: 'choice', q: 'Front sprocket 32 teeth, rear cog 16 teeth. How many times does the back wheel turn for each pedal turn?', opts: ['1', '2', '4'], a: 1, why: '32 ÷ 16 = 2 wheel turns per pedal turn.', check: { f: 'div', args: [32, 16] } },
            { t: 'choice', q: 'Front 32, rear 32. How many wheel turns per pedal turn?', opts: ['1', '2', '32'], a: 0, why: '32 ÷ 32 = 1. One pedal turn, one wheel turn: a very easy gear.', check: { f: 'div', args: [32, 32] } },
            { t: 'choice', q: 'Count the teeth: a rear cog has 12 and the chainring has 36. How many wheel turns per pedal turn?', opts: ['2', '3', '4'], a: 1, why: '36 ÷ 12 = 3.', check: { f: 'div', args: [36, 12] } },
            { t: 'choice', q: 'The brake lever is a lever. Where is the fulcrum?', opts: ['The pivot near the handlebar', 'The tip where your fingers pull', 'The brake pad'], a: 0, why: 'Your fingers pull at the long end; the lever turns on a pivot by the handlebar and pulls the cable with more force.' }
          ],
          patent: [
            { t: 'choice', q: 'A 20-inch wheel goes about 63 inches (20 × 3.14) in one turn. Front 32, rear 16. About how far does one pedal turn take you?', opts: ['About 63 inches', 'About 126 inches', 'About 189 inches'], a: 1, why: '2 wheel turns × about 63 inches ≈ 126 inches, a bit over 10 feet.', check: { f: 'bikeDist', args: [32, 16, 20] } },
            { t: 'choice', q: 'Same wheel, front 32, rear 24. About how far per pedal turn?', opts: ['About 84 inches', 'About 63 inches', 'About 126 inches'], a: 0, why: '32 ÷ 24 = 1⅓ wheel turns × 62.8 ≈ 84 inches.', check: { f: 'bikeDist', args: [32, 24, 20] } },
            { t: 'choice', q: 'You pedal 60 times a minute in a gear that goes 126 inches per pedal turn. How many inches in a minute?', opts: ['5,040', '7,560', '12,600'], a: 1, why: '60 × 126 = 7,560 inches, which is 630 feet.', check: { f: 'mul', args: [60, 126] } },
            { t: 'choice', q: 'A 12-tooth rear cog and a 36-tooth chainring. To make pedaling easier for a hill, you should shift to a rear cog with…', opts: ['More teeth', 'Fewer teeth', 'The same teeth'], a: 0, why: 'A bigger rear cog lowers the ratio (36 ÷ 24 = 1.5 instead of 3): less distance per pedal turn, but much easier pushing.' }
          ]
        }
      },
      {
        id: 'engine', name: 'Four-Stroke Engine (screen only)', screenOnly: true, machine: 'engine',
        intro: 'A car engine burns a tiny puff of fuel and air inside a cylinder. The push from the burning gas shoves a piston down, and the piston turns a crankshaft. It does this in four steps called strokes.',
        tip: 'A memory trick for the four strokes: suck, squeeze, bang, blow. Engines are hot, have moving belts and burn fuel, so we only open this one on screen.',
        parts: [
          { id: 'piston', name: 'Piston', job: 'A metal plug that slides up and down inside the cylinder.' },
          { id: 'cylinder', name: 'Cylinder', job: 'The tube the piston slides in. The fuel burns at the top.' },
          { id: 'rod', name: 'Connecting rod', job: 'Links the piston to the crankshaft, turning up-and-down into round-and-round.' },
          { id: 'crank', name: 'Crankshaft', job: 'A bent shaft, like bike pedals. It turns around and around and drives the wheels.' },
          { id: 'intake', name: 'Intake valve', job: 'Opens to let fuel and air in.' },
          { id: 'exhaust', name: 'Exhaust valve', job: 'Opens to let the burned gas out to the tailpipe.' },
          { id: 'spark', name: 'Spark plug', job: 'Makes a tiny spark that lights the squeezed fuel and air.' }
        ],
        sets: {
          sketch: [
            { t: 'choice', q: 'Which stroke pushes the piston down with burning gas?', opts: ['Power', 'Intake', 'Exhaust'], a: 0, why: 'In the power stroke the burning gas expands and shoves the piston down. That push is what drives the car.' },
            { t: 'choice', q: 'What turns the piston\'s up-and-down into round-and-round?', opts: ['The crankshaft', 'The spark plug', 'The tailpipe'], a: 0, why: 'The connecting rod pushes the bent crankshaft around, just like your legs push bike pedals around.' },
            { t: 'choice', q: 'What does the spark plug do?', opts: ['Lights the fuel and air', 'Lets air in', 'Cools the engine'], a: 0, why: 'A spark jumps across a tiny gap and lights the squeezed fuel and air.' },
            { t: 'choice', q: 'Why do we only look inside an engine on screen?', opts: ['It gets very hot, burns fuel and has fast moving parts', 'It is too small', 'It is boring'], a: 0, why: 'Engines can burn, pinch and spray fuel. Mechanics are trained and wait for them to cool.' }
          ],
          prototype: [
            { t: 'choice', q: 'Put the strokes in order: intake, compression, power, exhaust. What comes right after compression?', opts: ['Power', 'Intake', 'Exhaust'], a: 0, why: 'Suck (intake), squeeze (compression), bang (power), blow (exhaust).' },
            { t: 'choice', q: 'During intake, which valve is open?', opts: ['The intake valve', 'The exhaust valve', 'Both'], a: 0, why: 'The piston moves down and pulls fuel and air in through the open intake valve.' },
            { t: 'choice', q: 'The crankshaft turns once for every two strokes. How many turns for all four strokes?', opts: ['1', '2', '4'], a: 1, why: '4 strokes ÷ 2 strokes per turn = 2 turns.', check: { f: 'div', args: [4, 2] } },
            { t: 'choice', q: 'Of the four strokes, how many push the car along?', opts: ['1', '2', '4'], a: 0, check: { f: 'same', args: [1] }, why: 'Only the power stroke pushes. A heavy flywheel keeps the crankshaft turning through the other three.' }
          ],
          patent: [
            { t: 'choice', q: 'The crankshaft turns 3,000 times a minute. Each cylinder fires once every 2 turns. How many power strokes per minute in one cylinder?', opts: ['1,500', '3,000', '6,000'], a: 0, why: '3,000 ÷ 2 = 1,500 power strokes per minute.', check: { f: 'div', args: [3000, 2] } },
            { t: 'choice', q: 'A 4-cylinder engine at 3,000 turns a minute. Power strokes per minute for the whole engine?', opts: ['3,000', '6,000', '12,000'], a: 1, why: '1,500 per cylinder × 4 cylinders = 6,000.', check: { f: 'mulDiv', args: [3000, 4, 2] } },
            { t: 'choice', q: 'That is how many power strokes per second?', opts: ['50', '100', '600'], a: 1, why: '6,000 ÷ 60 seconds = 100 every second.', check: { f: 'div', args: [6000, 60] } },
            { t: 'choice', q: 'A diesel engine has no spark plug. How does its fuel light?', opts: ['Squeezing the air makes it hot enough to light the fuel', 'A match', 'Sunlight through a window'], a: 0, why: 'Squeezing a gas heats it. Diesels squeeze the air so hard that sprayed-in fuel lights by itself.' }
          ]
        }
      },
      {
        id: 'motor', name: 'Electric Motor (screen only)', part: 'conveyor', screenOnly: true, machine: 'motor',
        intro: 'An electric motor spins using magnets. Electricity flowing through a coil of wire turns the coil into a magnet, and the fixed magnets around it push and pull it around.',
        tip: 'Like poles push apart and opposite poles pull together. A part called the commutator flips the coil\'s poles every half turn, so it keeps spinning the same way.',
        parts: [
          { id: 'magnet', name: 'Magnets', job: 'Fixed magnets, one north and one south, around the coil.' },
          { id: 'coil', name: 'Coil (armature)', job: 'Wire wrapped many times. With electricity flowing it becomes a magnet that can spin.' },
          { id: 'comm', name: 'Commutator', job: 'A split ring on the shaft. Every half turn it swaps which way the electricity flows through the coil.' },
          { id: 'brush', name: 'Brushes', job: 'Springy contacts that rub on the commutator and carry electricity into it.' },
          { id: 'battery', name: 'Battery', job: 'Pushes electricity around the circuit. Never open or bite a battery.' },
          { id: 'shaft', name: 'Shaft', job: 'Spins with the coil. A fan blade or wheel goes on the end.' }
        ],
        sets: {
          sketch: [
            { t: 'choice', q: 'Two magnets with north facing north…', opts: ['Push apart', 'Pull together', 'Do nothing'], a: 0, why: 'Like poles push apart; opposite poles pull together.' },
            { t: 'choice', q: 'Flip the battery around. What happens to the motor?', opts: ['It spins the other way', 'It stops forever', 'It spins the same way'], a: 0, why: 'The electricity flows the other way, the coil\'s poles swap, and the push goes the other way.' },
            { t: 'choice', q: 'Which of these has an electric motor?', opts: ['A fan', 'A pencil', 'A ruler'], a: 0, why: 'Fans, blenders, drills, toy cars and washing machines all have electric motors.' },
            { t: 'choice', q: 'Why do we only look inside a motor on screen?', opts: ['It uses electricity and spins fast', 'It is too heavy', 'It is invisible'], a: 0, why: 'Never open a battery or poke into anything that plugs in. Motors spin fast and can pinch fingers.' }
          ],
          prototype: [
            { t: 'choice', q: 'Add a second battery in the sim. What happens?', opts: ['The motor spins faster', 'It spins backward', 'It stops'], a: 0, why: 'More push from the batteries means more electricity in the coil: stronger magnet, faster spin.' },
            { t: 'choice', q: 'How many times per turn does the commutator flip the electricity in the coil?', opts: ['1', '2', '4'], a: 1, why: 'Every half turn, so twice per turn.', check: { f: 'same', args: [2] } },
            { t: 'choice', q: 'What would happen without the commutator?', opts: ['The coil would turn halfway and stop', 'It would spin faster', 'The magnets would melt'], a: 0, why: 'The coil would swing until its poles faced the opposite magnets, then stop there. Flipping the current keeps the chase going.' }
          ],
          patent: [
            { t: 'choice', q: 'A small motor spins 3,000 times a minute. How many turns per second?', opts: ['30', '50', '300'], a: 1, why: '3,000 ÷ 60 = 50 turns every second.', check: { f: 'div', args: [3000, 60] } },
            { t: 'choice', q: 'At 50 turns a second, how many times a second does the commutator flip the current?', opts: ['25', '50', '100'], a: 2, why: '2 flips per turn × 50 turns = 100 flips a second.', check: { f: 'mul', args: [2, 50] } },
            { t: 'choice', q: 'Spin a motor\'s shaft by hand very fast with a light bulb wired to it. What can happen?', opts: ['It makes a little electricity and the bulb glows', 'Nothing at all', 'The magnets fall off'], a: 0, why: 'Run backward, a motor is a generator. Spinning coils near magnets make electricity.' },
            { t: 'choice', q: 'A toy motor spins too fast to push a car. What helps it push harder?', opts: ['Gears that turn the fast motor into a slow, strong wheel', 'A bigger battery only', 'Painting it'], a: 0, why: 'A small gear on the motor driving a big gear on the axle trades speed for turning force, just like in the Gear Lab.' }
          ]
        }
      }
    ],
    mission: {
      id: 'bike', title: 'Gear teeth and wheel turns', time: 'About 25 minutes', where: 'Garage or driveway, with a grown-up',
      supplies: ['A bike (yours is fine)', 'A grown-up to hold the bike', 'Sidewalk chalk', 'A strip of masking tape', 'A tape measure', 'Paper and pencil'],
      why: 'In the app you changed gears with a tap. Now count the real thing.',
      steps: {
        sketch: [
          'With the grown-up holding the bike, make a chalk mark on the front of the tire where it touches the ground, and a chalk line on the ground under it.',
          'Put one pedal straight down. Walk the bike forward slowly while the grown-up turns the pedal one full turn by hand. Keep your fingers away from the chain and the spokes.',
          'Watch the chalk mark on the back tire (make one there too). Did the back wheel turn more than once, less, or the same?',
          'Draw the bike and circle the chain, the front sprocket and the rear cog.'
        ],
        prototype: [
          'With the bike still, put a piece of masking tape on one tooth of the front sprocket. Count the teeth all the way around back to the tape. Write it down.',
          'Do the same for the rear cog the chain is on.',
          'Work out the ratio: front teeth ÷ rear teeth. That is how many times the back wheel should turn for one pedal turn.',
          'Test it: chalk mark on the back tire, then walk the bike while the grown-up turns the pedal once. Count the wheel turns. Fingers away from the chain and spokes.'
        ],
        patent: [
          'Count the front and rear teeth as in Prototype. Work out front ÷ rear.',
          'Measure the wheel: roll the bike until the chalk mark on the back tire goes around once, and measure that distance on the ground with the tape measure.',
          'Predict: ratio × wheel distance = how far one pedal turn takes you.',
          'Test: chalk line on the ground, walk the bike while the grown-up turns the pedal once, chalk line where you stop, measure. How close was your prediction?',
          'If the bike has gears, ask the grown-up to shift to a bigger rear cog and do it again.'
        ]
      },
      note: 'Walk the bike only: no riding during the mission. A grown-up turns the pedals and shifts gears. Keep fingers, laces and hair away from the chain, sprockets and spokes.',
      checks: [ { f: 'div', args: [32, 16], expect: 2 } ]
    }

<script>
/* Gizmo Lab batch 2: Home Machines sims (Pim's kitchen and bathroom).
   Each sim: function (host, st, H) -> { setPuzzle?, destroy? }. H carries shared helpers from app.js. */
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

/* tap-a-part card shared by every sim */
function partCards(host, st, H) {
  var card = document.createElement('div'); card.className = 'readout partcard'; card.setAttribute('aria-live', 'polite');
  card.textContent = 'Tap any part to see its name and its job.';
  host.appendChild(card);
  // react on finger-down: animated sims redraw every frame, so the element may be gone by the time a click would fire
  var show = function (t) {
    var p = st.parts.filter(function (q) { return q.id === t.getAttribute('data-part'); })[0]; if (!p) return;
    H.SND.click();
    $$('[data-part]', host).forEach(function (el) { el.classList.toggle('lit', el.getAttribute('data-part') === p.id); });

  };
  host.addEventListener('pointerdown', function (e) { var t = e.target.closest('[data-part]'); if (t) show(t); });
  host.addEventListener('keydown', function (e) { var t = e.target.closest && e.target.closest('[data-part]'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); show(t); } });
  return card;
}
function hit(id, inner) { return '<g data-part="' + id + '" class="tappable" role="button" tabindex="0">' + inner + '</g>'; }

/* ---------- The Flush: a cutaway toilet tank and bowl ---------- */
function flush(host, st, H) {
  var lv = H.level(), set = 0.82, wl = 0.82, phase = 'idle', t0 = 0, flushes = 0, raf = 0, bowl = 0.5, lift = 0;
  host.innerHTML = '<div class="sim"><svg viewBox="0 0 520 400" aria-label="Toilet tank and bowl, cut open"></svg></div>' +
    '<div class="row"><button type="button" class="go" data-act="flush">Flush</button></div>' +
    '<label for="floatSlider"><b>Float height</b></label><input id="floatSlider" class="slider" type="range" min="0.55" max="0.92" step="0.01" value="0.82"><div class="readout" id="flushOut"></div>';

  function wy(w) { return BOT - 10 - w * (BOT - TOP - 30); }

    var y = wy(wl), flapAng = lift * -40, fy = wy(wl) - 6;
    var h = '';

    h += '<path d="M120 230 L330 230 Q360 230 350 270 Q330 330 250 340 L250 380 L170 380 L175 330 Q120 320 120 230 Z" fill="#F4F2EE" stroke="var(--ink2)" stroke-width="3"/>';
    var bw = 300 - bowl * 40;
    h += '<path d="M150 ' + bw + ' Q240 ' + (bw + 6) + ' 320 ' + bw + ' Q310 300 250 316 Q190 310 160 ' + bw + ' Z" fill="#7CC0E8" opacity=".85"/>';
    h += hit('trap', '<path d="M250 316 Q300 330 312 300 Q320 270 300 262 M300 262 Q330 300 290 350 L290 380" fill="none" stroke="#9AA5AE" stroke-width="14" stroke-linecap="round" opacity=".55"/>' + '<rect x="240" y="255" width="90" height="125" fill="transparent"/>');
    // the tank
    h += '<rect x="' + L + '" y="' + TOP + '" width="' + (R - L) + '" height="' + (BOT - TOP) + '" rx="8" fill="#F4F2EE" stroke="var(--ink2)" stroke-width="3"/>';
    h += '<rect x="' + (L + 3) + '" y="' + y + '" width="' + (R - L - 6) + '" height="' + (BOT - 3 - y) + '" fill="#7CC0E8" opacity=".8"/>';
    h += '<path d="M150 ' + BOT + ' L150 230" stroke="#9AA5AE" stroke-width="16"/>';
    if (lift > 0.2) h += '<path pointer-events="none" d="M150 205 L150 235" stroke="#7CC0E8" stroke-width="10" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="12" to="0" dur=".3s" repeatCount="indefinite"/></path>';
    // overflow tube
    h += hit('overflow', '<rect x="190" y="' + (TOP + 34) + '" width="28" height="' + (BOT - TOP - 34) + '" fill="transparent"/><rect x="196" y="' + (TOP + 34) + '" width="16" height="' + (BOT - TOP - 34) + '" fill="#E8ECEF" stroke="var(--ink2)" stroke-width="2"/>');
    // handle and arm, chain, flapper
    h += hit('handle', '<rect x="' + (L - 26) + '" y="' + (TOP + 18) + '" width="30" height="12" rx="4" fill="#B8C2CC" stroke="var(--ink2)" stroke-width="2"/>' +
      '<path d="M' + L + ' ' + (TOP + 24) + ' L160 ' + (TOP + 24 - lift * 18) + '" stroke="#8C95A0" stroke-width="6" stroke-linecap="round"/>');
    h += hit('chain', '<rect x="140" y="' + (TOP + 30) + '" width="26" height="' + (BOT - TOP - 60) + '" fill="transparent"/><path d="M158 ' + (TOP + 24 - lift * 18) + ' L150 ' + (BOT - 14 - lift * 16) + '" stroke="#5E6878" stroke-width="3" stroke-dasharray="4 3"/>');
    h += hit('flapper', '<g transform="rotate(' + flapAng + ' 128 ' + (BOT - 8) + ')"><path d="M128 ' + (BOT - 8) + ' L172 ' + (BOT - 8) + ' L168 ' + (BOT - 18) + ' L132 ' + (BOT - 18) + ' Z" fill="#D9453B"/></g>');
    // fill valve and float cup
    var filling = phase === 'fill';
    h += hit('fill', '<rect x="262" y="' + (TOP + 40) + '" width="14" height="' + (BOT - TOP - 40) + '" fill="#8C95A0"/><rect x="254" y="' + (TOP + 32) + '" width="30" height="14" rx="4" fill="#5E6878"/>' +
      (filling ? '<path d="M269 ' + (TOP + 46) + ' l0 30" stroke="#3E86C6" stroke-width="4" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="10" to="0" dur=".4s" repeatCount="indefinite"/></path>' : '') +
      '<path d="M284 ' + (TOP + 38) + ' Q300 ' + (TOP + 20) + ' 206 ' + (TOP + 30) + '" fill="none" stroke="#5E6878" stroke-width="2"/>');

    if (phase !== 'idle') return;

  };

  partCards(host, st, H);
  draw();
  return { destroy: function () { cancelAnimationFrame(raf); } };
}

/* ---------- The Fridge: the refrigerant loop ---------- */
function fridge(host, st, H) {
  var lv = H.level(), on = true, open = false, raf = 0, t = 0;
  var LOOP = 'M330 330 L410 330 L410 60 L380 60 L330 40 L150 40 Q140 40 140 50 L140 60 L320 60 L320 75 L140 75 L140 90 L320 90 L320 105 L300 105 L300 330 Z';
  host.innerHTML = '<div class="sim"><svg viewBox="0 0 520 380" aria-label="A fridge with its cooling loop"></svg></div>' +
    '<div class="row"><button type="button" class="chip" data-act="power" aria-pressed="true">Compressor on</button><button type="button" class="chip" data-act="door" aria-pressed="false">Open the door</button></div><div class="readout" id="frOut"></div>';
  var svg = $('.sim svg', host), out = $('#frOut', host);
  var base = '<rect x="110" y="20" width="230" height="340" rx="12" fill="#EEF2F5" stroke="var(--ink2)" stroke-width="3"/>' +
    '<path d="M110 120 H340" stroke="var(--ink2)" stroke-width="3"/>' +
    '<rect x="130" y="135" width="190" height="200" fill="#F8FBFD"/>' +
    '<rect x="150" y="270" width="50" height="50" rx="6" fill="#E07A3A"/><rect x="215" y="285" width="60" height="35" rx="4" fill="#D9453B"/><rect x="160" y="210" width="60" height="30" rx="4" fill="#79B465"/>' +
    '<path d="M130 255 H320 M130 195 H320" stroke="#C9D3DA" stroke-width="4"/>';
  var parts = hit('cond', '<path d="M410 320 L410 70" stroke="#C46A2E" stroke-width="5"/>' + [90, 130, 170, 210, 250, 290].map(function (y) { return '<path d="M398 ' + y + ' h24" stroke="#C46A2E" stroke-width="3"/>'; }).join('') + '<rect x="392" y="60" width="36" height="270" fill="transparent"/>') +
    hit('evap', '<path d="M140 60 L320 60 L320 75 L140 75 L140 90 L320 90 L320 105 L300 105" fill="none" stroke="#3E86C6" stroke-width="5"/><rect x="130" y="52" width="200" height="60" fill="transparent"/>') +
    hit('valve', '<circle cx="355" cy="50" r="24" fill="transparent"/><circle cx="355" cy="50" r="10" fill="#E9A23B" stroke="var(--ink2)" stroke-width="2"/>') +
    '<path d="M300 330 L300 110" stroke="#8E7CC3" stroke-width="5"/>' + hit('comp', '<rect x="290" y="300" width="64" height="58" fill="transparent"/><rect x="300" y="315" width="44" height="34" rx="10" fill="#5E6878"/>') +
    '<path d="M344 330 L410 330" stroke="#D9453B" stroke-width="5"/>' +
    hit('seal', '<rect x="96" y="20" width="22" height="340" fill="transparent"/><rect x="106" y="20" width="8" height="340" fill="#5E6878"/>') +
    hit('light', '<rect x="300" y="128" width="36" height="40" fill="transparent"/><rect id="frLight" x="314" y="140" width="10" height="16" rx="3" fill="#9AA5AE" stroke="var(--ink2)"/>');
  host.querySelector('svg').innerHTML = base + parts + '<path id="loop" pointer-events="none" d="' + LOOP + '" fill="none" stroke="transparent"/><g id="frDyn" pointer-events="none"></g>';
  H.fixVars(host);
  var loop = $('#loop', host), len = loop.getTotalLength(), dyn = $('#frDyn', host), lightEl = $('#frLight', host);
  function colorAt(p) {
    // hot gas leaving the compressor and in the back coils; just past the valve; cold in the coils; warmed gas going home
    if (p.x >= 395 || (p.y >= 325 && p.x >= 330)) return '#D9453B';
    if (p.x >= 330 && p.y <= 62) return '#E9A23B';
    if (p.y <= 110) return '#3E86C6';

    }

    if (open) h += '<path d="M110 20 L40 50 L40 330 L110 360 Z" fill="#E6EBEF" stroke="#6A5B60" stroke-width="3" opacity=".95"/><circle cx="225" cy="150" r="14" fill="#FFE07A"/><path d="M210 180 q-40 10 -90 0 M210 210 q-40 10 -90 0" stroke="#E07A3A" stroke-width="3" fill="none" opacity=".6"/>';

/* ---------- Under the Sink ---------- */
function sink(host, st, H) {
  var lv = H.level(), faucet = false, hot = true, cold = true, trapFull = true, drips = 0;
  host.innerHTML = '<div class="sim"><svg viewBox="0 0 520 400" aria-label="The pipes under a kitchen sink"></svg></div>' +
    '<div class="row"><button type="button" class="chip" data-act="faucet" aria-pressed="false">Turn the tap on</button><button type="button" class="chip" data-act="hot" aria-pressed="true">Hot valve open</button><button type="button" class="chip" data-act="cold" aria-pressed="true">Cold valve open</button><button type="button" class="chip" data-act="dry" aria-pressed="false">Let the trap dry out</button></div><div class="readout" id="skOut"></div>';

              home: { key: 'homemach', guide: 'pim', place: 'Kitchen and bathroom · Home Machines', back: 'Back to the kitchen' },
              move: { key: 'onmove', guide: 'rafa', place: 'Garage · On the Move', back: 'Back to the garage' } };
function zoneOf(stationId) { for (var z in ZONES) if (K[ZONES[z].key].stations.some(function (s) { return s.id === stationId; })) return z; return 'simple'; }
function allStations() { return K.simple.stations.concat(K.homemach.stations, K.onmove.stations); }
function stationById(id) { return allStations().filter(function (s) { return s.id === id; })[0]; }
SCREENS.simple = function () { return SCREENS.zone('simple'); };
SCREENS.zone = function (zid) {
  var Z = ZONES[zid], ZC = K[Z.key];
  var cards = ZC.stations.map(function (st) {
    var dots = ['sketch', 'prototype', 'patent'].map(function (l) { return '<span class="dot ' + (S.done[st.id + ':' + l] ? 'on' : '') + '" title="' + K.levels[l].name + '"></span>'; }).join('');
    var reward = st.part ? Core.PARTS[st.part].name + (st.bonus ? ' and ' + Core.PARTS[st.bonus].name : '') : '';
    return '<button type="button" class="card" data-st="' + st.id + '"><span class="ico">' + ICON[st.machine || st.id] + '</span><h3>' + esc(st.name) + '</h3><p>' + esc(st.intro.split('. ')[0].replace(/\.$/, '')) + '.</p>' +
      '<div class="dots">' + dots + '<span>Sketch · Prototype · Patent</span></div><div class="reward">' + (reward ? 'Earns for the workshop: <b>' + esc(reward) + '</b>' : 'Earns a stamp') + '</div></button>';
  }).join('');
  var mis = ZC.mission;
  cards += '<button type="button" class="card mission" data-mission="1"><span class="ico">' + ICON[{ seesaw: 'mission', tank: 'tank', bike: 'bikemission' }[mis.id] || 'mission'] + '</span><h3>Paper mission: ' + esc(mis.title) + '</h3><p>' + esc(mis.time + ' · ' + mis.where) + '</p>' +
    '<div class="reward">' + (S.stamps['st-mission-' + mis.id] ? '<b>Done!</b> Stamp in your Patent Book.' : 'Earns a photo stamp') + '</div></button>';
  return {
    place: Z.place,
    html: guide(Z.guide, 'hero', K.cast[Z.guide].name, ZC.hello) + '<div class="cards">' + cards + '</div>',
    after: function () {
      Array.prototype.forEach.call(document.querySelectorAll('[data-st]'), function (b) { b.onclick = function () { SND.tap(); go('station', b.dataset.st); }; });
      $('[data-mission]').onclick = function () { SND.tap(); go('mission', zid); };
    }
  };
};

/* ---------------- sims ---------------- */
function svgEl(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function svgPoint(svg, cx, cy) { var p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function sackSVG(w, numbered) {
  var a = '';
  var pos = [[32, 36], [22, 40], [42, 40], [27, 28], [37, 28], [32, 20]];
  for (var i = 0; i < w && i < 6; i++) a += '<ellipse cx="' + pos[i][0] + '" cy="' + (pos[i][1] + 6) + '" rx="5.5" ry="6.5" fill="#9A6332"/><path d="M' + (pos[i][0] - 5) + ' ' + (pos[i][1] + 2) + ' Q' + pos[i][0] + ' ' + (pos[i][1] - 4) + ' ' + (pos[i][0] + 5) + ' ' + (pos[i][1] + 2) + ' Z" fill="#5E3A1A"/>';
  return '<svg viewBox="0 0 64 64"><path d="M10 22 Q8 60 32 60 Q56 60 54 22 Q44 14 32 16 Q20 14 10 22 Z" fill="#E8D3A8" stroke="#A8703F" stroke-width="2.5"/>' + a +
    (numbered ? '<circle cx="50" cy="14" r="11" fill="#2C2430"/><text x="50" y="19" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="sans-serif">' + w + '</text>' : '') + '</svg>';
}

/* Lever sim: pegs 1..6 each side, 40 units apart. Also runs the balance puzzles. */
function leverSim(host, opts) {
  var lv = S.level, numbered = lv !== 'sketch';
  var sacks = [];   // {id, w, side:-1|1|0 (0 = tray), peg, fixed}
  var nid = 0, onBalanced = opts.onBalanced;
  function setPuzzle(q) {
    sacks = []; nid = 0;
    if (q) {
      q.left.forEach(function (a) { sacks.push({ id: nid++, w: a[1], side: -1, peg: a[0], fixed: true }); });
      (q.right || []).forEach(function (a) { sacks.push({ id: nid++, w: a[1], side: 1, peg: a[0], fixed: true }); });
      q.give.forEach(function (w) { sacks.push({ id: nid++, w: w, side: 0, peg: 0, fixed: false }); });
    } else {
      [1, 2, 3, 4].forEach(function (w) { sacks.push({ id: nid++, w: w, side: 0, peg: 0, fixed: false, free: true }); });
    }
    puzzle = q; draw();
  }
  var puzzle = null;
  host.innerHTML = '<div class="sim"><svg viewBox="0 30 600 260" aria-label="Seesaw lever"></svg></div><div class="tray" aria-label="Sacks to place"></div><div class="readout" hidden></div><div class="row"><button type="button" class="go" hidden>Check balance</button><button type="button" class="ghost" data-act="clear">Clear</button></div>';
  var svg = $('.sim svg', host), tray = $('.tray', host), out = $('.readout', host), check = $('.go', host);
  function torque(side) { return sacks.reduce(function (a, s) { return a + (s.side === side ? s.w * s.peg : 0); }, 0); }
  function angle() { var d = torque(1) - torque(-1); return Math.max(-14, Math.min(14, d * 1.4)); }
  function draw() {
    svg.innerHTML = '';
    svgEl('rect', { x: 0, y: 262, width: 600, height: 28, fill: 'var(--grass)' }, svg);
    svgEl('path', { d: 'M300 196 L270 262 L330 262 Z', fill: 'var(--wood-dk)' }, svg);
    var g = svgEl('g', { transform: 'rotate(' + angle() + ' 300 196)' }, svg);
    svgEl('rect', { x: 22, y: 186, width: 556, height: 14, rx: 4, fill: 'var(--wood)', stroke: 'var(--wood-dk)', 'stroke-width': 2 }, g);
    for (var side = -1; side <= 1; side += 2) for (var p = 1; p <= 6; p++) {
      var x = 300 + side * p * 44;
      svgEl('circle', { cx: x, cy: 193, r: 4, fill: 'var(--wood-dk)' }, g);
      if (numbered) { var t = svgEl('text', { x: x, y: 222, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 700, fill: 'var(--ink2)', 'font-family': 'sans-serif' }, g); t.textContent = p; }
    }
    var stackH = {};
    sacks.filter(function (s) { return s.side !== 0; }).forEach(function (s) {
      var k = s.side + ':' + s.peg; stackH[k] = (stackH[k] || 0);
      var x = 300 + s.side * s.peg * 44, y = 186 - 56 - stackH[k];
      stackH[k] += 46;
      var fo = svgEl('g', { transform: 'translate(' + (x - 28) + ' ' + y + ') scale(.88)', 'data-id': s.id, style: s.fixed ? '' : 'cursor:grab' }, g);
      fo.innerHTML = sackSVG(s.w, numbered).replace('<svg viewBox="0 0 64 64">', '').replace('</svg>', '');
      if (s.fixed) svgEl('rect', { x: 2, y: 6, width: 60, height: 58, fill: 'none', stroke: 'var(--ink2)', 'stroke-dasharray': '4 4', rx: 10 }, fo);
    });
    tray.innerHTML = sacks.filter(function (s) { return s.side === 0; }).map(function (s) { return '<span class="sack" data-id="' + s.id + '" role="img" aria-label="Sack">' + sackSVG(s.w, numbered) + '</span>'; }).join('') || '<span class="note">Drag a sack here to take it off.</span>';
    var L = torque(-1), R = torque(1);
    out.hidden = lv === 'sketch';
    if (lv === 'prototype') out.textContent = 'Left side: ' + sacks.filter(function (s) { return s.side === -1; }).map(function (s) { return s.w + ' on peg ' + s.peg; }).join(', ') + '.  Right side: ' + (sacks.filter(function (s) { return s.side === 1; }).map(function (s) { return s.w + ' on peg ' + s.peg; }).join(', ') || 'nothing yet') + '.';
    if (lv === 'patent') out.textContent = 'Left: ' + (sacks.filter(function (s) { return s.side === -1; }).map(function (s) { return s.w + '×' + s.peg; }).join(' + ') || '0') + ' = ' + L + '   ·   Right: ' + (sacks.filter(function (s) { return s.side === 1; }).map(function (s) { return s.w + '×' + s.peg; }).join(' + ') || '0') + ' = ' + R;
    fixVars(host);
    var allPlaced = puzzle && sacks.every(function (s) { return s.side !== 0; });
    check.hidden = !puzzle; check.disabled = !allPlaced;
  }
  // dragging sacks between tray and pegs
  var drag = null;
  function startDrag(e, id) {
    var s = sacks.filter(function (q) { return q.id === id; })[0]; if (!s || s.fixed) return;
    e.preventDefault();
    var ghost = document.createElement('div'); ghost.className = 'drag-ghost'; ghost.innerHTML = sackSVG(s.w, numbered); document.body.appendChild(ghost);
    drag = { s: s, ghost: ghost }; moveDrag(e); SND.tap();
  }
  function moveDrag(e) { if (!drag) return; drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px'; }
  function endDrag(e) {
    if (!drag) return;
    var s = drag.s; drag.ghost.remove(); drag = null;
    var pt = svgPoint(svg, e.clientX, e.clientY);
    var a = -angle() * Math.PI / 180, dx = pt.x - 300, dy = pt.y - 196;
    var lx = dx * Math.cos(a) - dy * Math.sin(a), ly = dx * Math.sin(a) + dy * Math.cos(a);
    if (ly > -190 && ly < 50 && Math.abs(lx) > 18 && Math.abs(lx) < 290) {
      var side = lx > 0 ? 1 : -1, peg = Math.max(1, Math.min(6, Math.round(Math.abs(lx) / 44)));
      if (puzzle && side === -1) { s.side = 0; } else { s.side = side; s.peg = peg; SND.clack(); }
    } else { s.side = 0; }
    draw();
    if (!puzzle) { var b = torque(1) === torque(-1) && torque(1) > 0; if (b) { SND.right(); if (opts.onFree) opts.onFree(); } }
  }
  host.addEventListener('pointerdown', function (e) {
    var t = e.target.closest('[data-id]'); if (!t) return;
    startDrag(e, +t.getAttribute('data-id'));
  });
  window.addEventListener('pointermove', moveDrag);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  check.onclick = function () {
    if (torque(1) === torque(-1)) { onBalanced(true); }
    else onBalanced(false, torque(1) > torque(-1) ? 'The right side tips down: it pushes harder. Move your sack closer to the fulcrum.' : 'The left side still wins. Move your sack farther from the fulcrum.');
  };
  $('[data-act=clear]', host).onclick = function () { sacks.forEach(function (s) { if (!s.fixed) s.side = 0; }); draw(); };
  setPuzzle(null);
  return { setPuzzle: setPuzzle, destroy: function () { window.removeEventListener('pointermove', moveDrag); window.removeEventListener('pointerup', endDrag); window.removeEventListener('pointercancel', endDrag); } };
}

function strandIcon(n) { var s = '<svg viewBox="0 0 40 30">'; for (var i = 0; i < n; i++) s += '<line x1="' + (8 + i * 8) + '" y1="3" x2="' + (8 + i * 8) + '" y2="27" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>'; return s + '</svg>'; }

/* Pulley hoist: 1-4 strands, a 12-pound crate, lift it 3 feet. */
function pulleySim(host, st) {
  var lv = S.level, n = 1, pull = 0;
  host.innerHTML = '<div class="row" role="group" aria-label="Strands">' + [1, 2, 3, 4].map(function (k) { return '<button type="button" class="chip" data-n="' + k + '" aria-label="' + k + ' strands">' + strandIcon(k) + '</button>'; }).join('') + '</div>' +
    '<div class="sim"><svg viewBox="0 0 420 340"></svg></div>' +
    '<label for="pullSlider"><b>Pull the rope</b></label><input id="pullSlider" class="slider" type="range" min="0" max="3" step="0.05" value="0">' +
    '<div><b>How hard you pull</b><div class="meter"><i></i></div></div><div class="readout"></div>';
  var svg = $('.sim svg', host), sl = $('#pullSlider', host), out = $('.readout', host);
  function draw() {
    var lift = pull / n, px = 60;   // 60 px per foot
    var cy = 290 - 50 - lift * px;  // crate top
    var h = '<rect x="0" y="0" width="420" height="20" fill="var(--wood-dk)"/><rect x="0" y="290" width="420" height="50" fill="var(--grass)"/>';
    var fixedX = 200, ropeX = 120;
    // fixed pulley(s) at the top
    h += '<circle cx="' + fixedX + '" cy="44" r="18" fill="none" stroke="var(--copper)" stroke-width="6"/><path d="M' + fixedX + ' 20 V44" stroke="var(--wood-dk)" stroke-width="5"/>';
    var crateX = 220, crateW = 110, blockY = cy - 34;
    if (n === 1) {
      h += '<path d="M' + (fixedX + 18) + ' 44 V' + cy + '" stroke="var(--wood)" stroke-width="4"/>';
    } else {
      // moving block on the crate, strands between it and the top beam
      h += '<circle cx="' + (crateX + 55) + '" cy="' + blockY + '" r="16" fill="none" stroke="var(--copper)" stroke-width="5"/><path d="M' + (crateX + 55) + ' ' + blockY + ' V' + cy + '" stroke="var(--wood-dk)" stroke-width="4"/>';
      for (var i = 0; i < n; i++) { var x = crateX + 20 + i * (70 / Math.max(1, n - 1)); h += '<path d="M' + x + ' 20 V' + blockY + '" stroke="var(--wood)" stroke-width="4"/>'; }
    }
    // the pull rope from the fixed pulley down to Ozzie's paw
    var handY = 120 + pull * 40;
    h += '<path d="M' + (fixedX - 18) + ' 44 V' + handY + '" stroke="var(--wood)" stroke-width="4"/><circle cx="' + (fixedX - 18) + '" cy="' + handY + '" r="9" fill="var(--teal)"/>';
    h += '<rect x="' + crateX + '" y="' + cy + '" width="' + crateW + '" height="50" rx="4" fill="var(--wood)" stroke="var(--wood-dk)" stroke-width="3"/><path d="M' + crateX + ' ' + cy + ' l' + crateW + ' 50 M' + (crateX + crateW) + ' ' + cy + ' l-' + crateW + ' 50" stroke="var(--wood-dk)" stroke-width="2"/>';
    if (lv !== 'sketch') h += '<text x="' + (crateX + 55) + '" y="' + (cy + 31) + '" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">' + st.load + ' lb</text>';
    // height marks
    for (var f = 0; f <= 3; f++) { h += '<path d="M390 ' + (290 - f * px) + ' h20" stroke="var(--ink2)" stroke-width="2"/>'; if (lv !== 'sketch') h += '<text x="384" y="' + (295 - f * px) + '" text-anchor="end" font-size="13" fill="var(--ink2)" font-family="sans-serif">' + f + ' ft</text>'; }
    svg.innerHTML = h; fixVars(host);
    $('.meter i', host).style.width = (100 / n) + '%';
    if (lv === 'sketch') out.textContent = lift >= 2.99 ? 'Up it goes! The crate is all the way up.' : 'Slide to pull. Watch how far your paw goes compared with the crate.';
    if (lv === 'prototype') out.textContent = 'Strands holding the crate: ' + n + '.  Rope pulled: ' + pull.toFixed(1) + ' ft.  Crate up: ' + lift.toFixed(1) + ' ft.';
    if (lv === 'patent') out.textContent = 'Pull = ' + st.load + ' ÷ ' + n + ' = ' + (st.load / n) + ' lb.  Rope = ' + n + ' × ' + lift.toFixed(1) + ' = ' + pull.toFixed(1) + ' ft.';
  }
  function setN(k) { n = k; pull = 0; sl.max = 3 * n; sl.value = 0; Array.prototype.forEach.call(host.querySelectorAll('[data-n]'), function (b) { b.setAttribute('aria-pressed', +b.dataset.n === n); }); SND.click(); draw(); }
  Array.prototype.forEach.call(host.querySelectorAll('[data-n]'), function (b) { b.onclick = function () { setN(+b.dataset.n); }; });
  sl.oninput = function () { pull = +sl.value; draw(); };

}

function rampIcon(L) { var run = L === 2 ? 0 : Math.sqrt(L * L - 4) * 3; return '<svg viewBox="0 0 44 30"><path d="M' + (40 - run) + ' 26 L40 26 L40 14 Z" fill="currentColor"/>' + (L === 2 ? '<path d="M34 26 V6" stroke="currentColor" stroke-width="3"/><path d="M30 10 L34 4 L38 10" fill="none" stroke="currentColor" stroke-width="3"/>' : '') + '</svg>'; }
/* Ramp test: 60-pound box, 2-foot porch, ramps of 2 (straight up), 4, 6, 8, 12 feet. */
function rampSim(host, st) {
  var lv = S.level, L = 4, t = 0;
  host.innerHTML = '<div class="row" role="group" aria-label="Ramp length">' + st.lengths.map(function (k) { return '<button type="button" class="chip" data-l="' + k + '" aria-label="' + (k === 2 ? 'Lift straight up' : k + '-foot ramp') + '">' + rampIcon(k) + (lv === 'sketch' ? '' : '<span>' + (k === 2 ? 'Lift' : k + ' ft') + '</span>') + '</button>'; }).join('') + '</div>' +
    '<div class="sim"><svg viewBox="0 0 520 260"></svg></div><label for="pushSlider"><b>Push the box</b></label><input id="pushSlider" class="slider" type="range" min="0" max="1" step="0.01" value="0">' +
    '<div><b>How hard you push</b><div class="meter"><i></i></div></div><div class="readout"></div>';
  var svg = $('.sim svg', host), sl = $('#pushSlider', host), out = $('.readout', host);
  function draw() {
    var s = 36, porchH = st.porch * s, gx = 500, gy = 230, run = L === 2 ? 0 : Math.sqrt(L * L - st.porch * st.porch) * s;
    var h = '<rect x="0" y="' + gy + '" width="520" height="30" fill="var(--grass)"/><rect x="' + gx + '" y="' + (gy - porchH) + '" width="20" height="' + porchH + '" fill="var(--wood-dk)"/><rect x="' + (gx - 6) + '" y="' + (gy - porchH - 8) + '" width="26" height="8" fill="var(--wood)"/>';
    var bx, by, ang = 0;
    if (L === 2) { bx = gx - 40; by = gy - t * porchH; h += '<path d="M' + (gx - 20) + ' 10 V' + (by - 34) + '" stroke="var(--wood)" stroke-width="4"/>'; }
    else {
      h += '<path d="M' + (gx - run) + ' ' + gy + ' L' + gx + ' ' + gy + ' L' + gx + ' ' + (gy - porchH) + ' Z" fill="var(--wood)" stroke="var(--wood-dk)" stroke-width="3"/>';
      ang = -Math.atan2(porchH, run) * 180 / Math.PI;
      bx = gx - run + 24 + t * (run - 30); by = gy - (24 + t * (run - 30)) / run * porchH;
    }
    h += '<g transform="translate(' + bx + ' ' + by + ') rotate(' + ang + ')"><rect x="-22" y="-34" width="40" height="34" rx="3" fill="var(--teal)" stroke="var(--ink)" stroke-width="2"/>' + (lv === 'sketch' ? '' : '<text x="-2" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="sans-serif">60 lb</text>') + '</g>';
    if (lv !== 'sketch') h += '<text x="' + (gx - 4) + '" y="' + (gy - porchH - 14) + '" text-anchor="end" font-size="13" fill="var(--ink2)" font-family="sans-serif">porch 2 ft</text>';
    svg.innerHTML = h; fixVars(host);
    var push = st.box * st.porch / L;
    $('.meter i', host).style.width = (push / st.box * 100) + '%';
    if (lv === 'sketch') out.textContent = t >= 0.99 ? 'On the porch! Try a different ramp and compare the push.' : 'Slide to push the box up.';
    if (lv === 'prototype') out.textContent = (L === 2 ? 'Straight up: 2 ft of lifting.' : 'Walk ' + (t * L).toFixed(1) + ' of ' + L + ' ft along the ramp. Box is ' + (t * 2).toFixed(1) + ' ft up.') + '  Ramp ÷ porch = ' + (L / 2);
    if (lv === 'patent') out.textContent = 'Push = 60 × 2 ÷ ' + L + ' = ' + push + ' lb.  You save ' + (60 - push) + ' lb compared with lifting.';
  }
  Array.prototype.forEach.call(host.querySelectorAll('[data-l]'), function (b) {
    b.onclick = function () { L = +b.dataset.l; t = 0; sl.value = 0; Array.prototype.forEach.call(host.querySelectorAll('[data-l]'), function (q) { q.setAttribute('aria-pressed', q === b); }); SND.click(); draw(); };
  });
  sl.oninput = function () { t = +sl.value; draw(); };
  host.querySelector('[data-l="4"]').setAttribute('aria-pressed', 'true');
  draw();
  return {};
}

function screwSVG(threads, depth, wood) {
  // a screw with `threads` threads; depth = how many have gone into the wood
  var pitch = 14, top = 20, len = threads * pitch, x = 100, sink = depth * pitch;
  var s = '<svg viewBox="0 0 200 ' + (top + len + 70) + '">';
  var surf = top + 30 + len - 2;   // wood surface after full sinking lines up under the head
  if (wood) s += '<rect x="0" y="' + (top + 30 + len - len + 8) + '" width="200" height="' + (len + 40) + '" fill="var(--wood)" opacity=".9"/>';
  var y0 = top + sink;
  s += '<g><rect x="' + (x - 26) + '" y="' + y0 + '" width="52" height="10" rx="3" fill="#8C95A0"/><path d="M' + (x - 10) + ' ' + (y0 + 3) + ' h20" stroke="#5E6878" stroke-width="3"/>';
  s += '<path d="M' + (x - 9) + ' ' + (y0 + 10) + ' V' + (y0 + 10 + len) + ' L' + x + ' ' + (y0 + 22 + len) + ' L' + (x + 9) + ' ' + (y0 + 10 + len) + ' V' + (y0 + 10) + ' Z" fill="#B8C2CC"/>';
  for (var i = 0; i < threads; i++) { var ty = y0 + 14 + i * pitch; s += '<path d="M' + (x - 15) + ' ' + ty + ' L' + (x + 15) + ' ' + (ty + 7) + '" stroke="#5E6878" stroke-width="3" stroke-linecap="round"/>'; }
  s += '</g></svg>';
  return s;
}
/* Wedge and screw: split a log; turn a screw one thread at a time; wrap a ramp round a pencil. */
function wedgeSim(host) {
  var lv = S.level, kind = 'thin', depth = 0, turns = 0, mode = 'wedge';
  host.innerHTML = '<div class="row" role="tablist"><button type="button" class="chip" data-m="wedge">Wedge</button><button type="button" class="chip" data-m="screw">Screw</button><button type="button" class="chip" data-m="wrap">Ramp → screw</button></div><div class="simhost"></div>';
  var sh = $('.simhost', host);
  function wedgeView() {
    var W = kind === 'thin' ? { half: 12, len: 120, need: 6 } : { half: 30, len: 70, need: 3 };
    var gap = depth / W.need * 36, push = kind === 'thin' ? 35 : 80;
    var cx = 200, logTop = 110, tipY = logTop - 40 + depth * (W.len + 30) / W.need;
    var h = '<svg viewBox="0 0 400 260"><rect x="0" y="240" width="400" height="20" fill="var(--grass)"/>' +

function handleIcon(R) { return '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="' + (R * 2) + '" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="3" fill="currentColor"/></svg>'; }

function wheelSim(host, st) {
  var lv = S.level, R = 4, ang = 0, turns = 0;
  host.innerHTML = '<div class="row" role="group" aria-label="Handle size">' + st.handles.map(function (k) { return '<button type="button" class="chip" data-r="' + k + '" aria-label="Handle ' + k + ' inches">' + handleIcon(k) + (lv === 'sketch' ? '' : '<span>' + k + ' in</span>') + '</button>'; }).join('') + '</div>' +
    '<div class="sim"><svg viewBox="0 0 420 320"></svg></div><div class="row"><button type="button" class="go" data-act="turn">Turn once</button><button type="button" class="ghost" data-act="down">Lower the bucket</button></div>' +

      '<rect x="40" y="250" width="200" height="70" fill="#9AA5AE"/><rect x="50" y="260" width="180" height="60" fill="#3E5368"/>' +
      '<path d="M60 250 V60 M220 250 V60" stroke="var(--wood-dk)" stroke-width="10"/>' +
      '<rect x="' + (cx - 80) + '" y="' + (cy - axle) + '" width="160" height="' + (axle * 2) + '" fill="var(--wood)" stroke="var(--wood-dk)" stroke-width="2"/>';
    var bucketY = 270 - rise;
    h += '<path d="M' + cx + ' ' + (cy + axle) + ' V' + (bucketY - 30) + '" stroke="var(--wood)" stroke-width="4"/>';
    h += '<path d="M' + (cx - 26) + ' ' + (bucketY - 30) + ' L' + (cx + 26) + ' ' + (bucketY - 30) + ' L' + (cx + 20) + ' ' + bucketY + ' L' + (cx - 20) + ' ' + bucketY + ' Z" fill="var(--copper)"/>' + (lv === 'sketch' ? '' : '<text x="' + cx + '" y="' + (bucketY - 9) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="sans-serif">24 lb</text>');
    // crank on the right end of the axle, drawn face-on
    var kx = 330, ky = 120, hx = kx + Math.cos(ang) * hr, hy = ky + Math.sin(ang) * hr;
    h += '<circle cx="' + kx + '" cy="' + ky + '" r="' + hr + '" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 6"/><circle cx="' + kx + '" cy="' + ky + '" r="' + axle + '" fill="var(--wood)" stroke="var(--wood-dk)" stroke-width="2"/>' +
      '<path d="M' + kx + ' ' + ky + ' L' + hx + ' ' + hy + '" stroke="var(--copper)" stroke-width="8" stroke-linecap="round"/><circle id="knob" cx="' + hx + '" cy="' + hy + '" r="16" fill="var(--teal)" stroke="var(--ink)" stroke-width="2" style="cursor:grab"/>';
    h += '<text x="' + kx + '" y="' + (ky + 96 + 14) + '" text-anchor="middle" font-size="13" fill="var(--ink2)" font-family="sans-serif">drag the green knob around</text>';
    svg.innerHTML = h; fixVars(host);
    var push = st.bucket * st.axle / R;
    $('.meter i', host).style.width = (push / st.bucket * 100) + '%';
    var done = turns >= maxT;
    if (lv === 'sketch') out.textContent = done ? 'The bucket is at the top! Try another handle size and compare.' : 'Turn the handle to wind the rope onto the axle.';
    if (lv === 'prototype') out.textContent = 'Turns: ' + Math.min(turns, maxT) + ' of ' + maxT + '.  Handle ' + R + ' in, axle ' + st.axle + ' in: the handle circle is ' + (R / st.axle) + ' times bigger.';
    if (lv === 'patent') out.textContent = 'Push = 24 × ' + st.axle + ' ÷ ' + R + ' = ' + push + ' lb.  Turns: ' + Math.min(turns, maxT) + '.';

  $('[data-act=down]', host).onclick = function () { turns = 0; ang = 0; draw(); };

        ctx.fillStyle = '#3B2A20'; ctx.beginPath(); ctx.arc(pt.pivot.x, pt.pivot.y, 10, 0, 7); ctx.fill(); ctx.fillStyle = '#E2AE38'; ctx.beginPath(); ctx.arc(pt.pivot.x, pt.pivot.y, 4, 0, 7); ctx.fill();
      }
      if (pt.type === 'conveyor') {
        var cb = pt.bodies[0]; drawBody(cb, '#3B2A20', stroke || '#1B120D', lw);
        ctx.save(); ctx.translate(cb.position.x, cb.position.y); ctx.rotate(cb.angle);
        ctx.fillStyle = '#B8C2CC'; [-92, 92].forEach(function (x) { ctx.beginPath(); ctx.arc(x, 0, 6, 0, 7); ctx.fill(); });
        var shift = run ? (run.steps * 2) % 24 : 0; ctx.strokeStyle = '#E2AE38'; ctx.lineWidth = 3;
        for (var bx2 = -84 + shift; bx2 < 84; bx2 += 24) { ctx.beginPath(); ctx.moveTo(bx2 - 4, -3); ctx.lineTo(bx2, 0); ctx.lineTo(bx2 - 4, 3); ctx.stroke(); }
        ctx.restore();
      }
      if (pt.type === 'funnel') { pt.bodies[0].parts.slice(1).forEach(function (q) { drawBody(q, '#5C7FA8', stroke || '#34506F', lw); }); }
      if (pt.type === 'bumper') { var bm = pt.bodies[0]; ctx.fillStyle = '#D9453B'; ctx.beginPath(); ctx.arc(bm.position.x, bm.position.y, 18, 0, 7); ctx.fill(); ctx.strokeStyle = stroke || '#7A2A1E'; ctx.lineWidth = lw + 1; ctx.stroke(); ctx.fillStyle = '#F4C9C2'; ctx.beginPath(); ctx.arc(bm.position.x, bm.position.y, 7, 0, 7); ctx.fill(); }
      if (run && run.links[pt.pid]) { var bb = pt.bodies[0].bounds; ctx.fillStyle = '#2E8B57'; ctx.beginPath(); ctx.arc(bb.max.x, bb.min.y, 7, 0, 7); ctx.fill(); }
    });
    all.forEach(function (b) { var gz = b.plugin && b.plugin.gz; if (gz && gz.role === 'marble') marble(b, '#3E86C6'); });
    if (w.popped) { var bl = w.sc.extra.balloon; ctx.fillStyle = '#D9453B'; for (var k = 0; k < 8; k++) { var a = k * Math.PI / 4; ctx.fillRect(bl.position.x + Math.cos(a) * 46, bl.position.y + Math.sin(a) * 46, 10, 4); } }
    if (!run) { ctx.fillStyle = dark ? '#E8DCCB' : '#6A5B60'; ctx.font = '700 22px sans-serif'; ctx.fillText('Start', 40, 60); }
  }
  rebuild(); trayDraw(); updateSel(); draw();
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq && mq.addEventListener) mq.addEventListener('change', draw);
}

/* ---------------- grown-ups ---------------- */
function holdButton(el, ms, done) {
  var t = 0, start = 0, bar = document.createElement('i'); el.classList.add('hold'); el.appendChild(bar);
  function tick(now) { var k = Math.min(1, (now - start) / ms); bar.style.width = (k * 100) + '%'; if (k >= 1) { stop(); done(); } else t = requestAnimationFrame(tick); }
  function begin(e) { e.preventDefault(); start = performance.now(); t = requestAnimationFrame(tick); }
  function stop() { cancelAnimationFrame(t); bar.style.width = '0'; }
  el.addEventListener('pointerdown', begin); el.addEventListener('pointerup', stop); el.addEventListener('pointerleave', stop); el.addEventListener('pointercancel', stop);
}
