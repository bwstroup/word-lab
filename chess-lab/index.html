<style>
/* Layout: a quiet study table. Board is the hero; a calm side panel holds one step at a time. */
:root {
  --bg: #ebe8e1;
  --card: #f8f6f1;
  --ink: #2a2622;
  --muted: #6b645b;
  --line: #d6d0c4;
  --accent: #2f5b4e;      /* table-felt green */
  --accent-ink: #f4f1ea;
  --accent-soft: #dbe6df;
  --star: #c08a1e;
  --good: #2f6b45;
  --good-soft: #dcebdf;
  --warn: #9a4a2a;
  --warn-soft: #f4e2d8;
  --font-display: "Alegreya", Georgia, "Times New Roman", serif;
  --font-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1917; --card: #25221f; --ink: #ede7dd; --muted: #a59d92; --line: #3b3631;
    --accent: #86b8a6; --accent-ink: #14211c; --accent-soft: #2b3a34; --star: #e0ad45;
    --good: #8fcc9f; --good-soft: #233629; --warn: #e79a78; --warn-soft: #3d2a22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1917; --card: #25221f; --ink: #ede7dd; --muted: #a59d92; --line: #3b3631;
  --accent: #86b8a6; --accent-ink: #14211c; --accent-soft: #2b3a34; --star: #e0ad45;
  --good: #8fcc9f; --good-soft: #233629; --warn: #e79a78; --warn-soft: #3d2a22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--card); font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 16px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- Home ---------- */
.home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 8px 20px; }
.home-head h1 { font-size: clamp(36px, 6vw, 52px); }
.home-head p { margin: 4px 0 0; color: var(--muted); }
.next-card {
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center;
  background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 28px;
}
.next-card .mini { width: 72px; height: 72px; border-radius: 8px; overflow: hidden; }
.next-card h2 { font-size: 26px; }
.next-card .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
@media (max-width: 560px) { .next-card { grid-template-columns: auto 1fr; } .next-card .btn { grid-column: 1 / -1; justify-content: center; } }
.parts { display: grid; gap: 28px; }
.warm { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1.5px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 14px 18px; margin: -12px 0 28px; }
.warm p { margin: 2px 0 0; color: var(--muted); }
.part h2 { font-size: 26px; margin-top: 2px; }
.part .blurb { color: var(--muted); margin: 4px 0 12px; max-width: 60ch; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.lesson-btn {
  display: grid; grid-template-columns: 40px 1fr; gap: 4px 12px; align-items: center; text-align: left;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 64px;
}
.lesson-btn .n { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.lesson-btn.done .n { background: var(--accent); color: var(--accent-ink); }
.lesson-btn .t { font-weight: 700; line-height: 1.2; }
.stars { color: var(--star); letter-spacing: 2px; font-size: 15px; line-height: 1; }
.stars .off { color: var(--line); }
.soon { border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px 16px; color: var(--muted); }
.grownups { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 16px; }
.grownups summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.grownups .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

/* ---------- Lesson ---------- */
.lesson-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.lesson-top h1 { font-size: clamp(24px, 3.4vw, 32px); flex: 1 1 200px; min-width: 0; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.pill { height: 8px; flex: 1 1 18px; max-width: 64px; border-radius: 4px; background: var(--line); }
.pill.done { background: var(--accent); }
.pill.now { background: var(--star); }
.stage { display: grid; gap: 18px; grid-template-columns: 1fr; align-items: start; }
.board-col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.board-holder { width: min(100%, 620px); }
@media (min-width: 760px) and (orientation: landscape), (min-width: 980px) {
  .stage { grid-template-columns: auto minmax(300px, 1fr); }
  .board-holder { width: min(calc(100dvh - 150px), 60vw, 700px); }
}
.turn { margin-top: 8px; font-size: 16px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.turn i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
.panel { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; display: grid; gap: 16px; }
.panel h2 { font-size: 24px; }
.idea p { margin: 0 0 10px; max-width: 60ch; }
.idea p:first-child { font-size: 21px; font-family: var(--font-display); font-weight: 500; line-height: 1.35; }
.prompt { font-size: 21px; font-family: var(--font-display); font-weight: 500; line-height: 1.35; margin: 0; }
.say { margin: 0; font-size: 19px; min-height: 3em; }
.fb { border-radius: 10px; padding: 10px 14px; font-weight: 500; }
.fb.good { background: var(--good-soft); color: var(--good); }
.fb.bad { background: var(--warn-soft); color: var(--warn); }
.fb.hint { background: var(--accent-soft); color: var(--ink); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions .grow { flex: 1; }
.counter { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 16px; }
.dad { border-top: 1px solid var(--line); padding-top: 12px; font-size: 16px; }
.dad summary { font-weight: 700; cursor: pointer; color: var(--muted); min-height: 40px; display: flex; align-items: center; }
.dad p { margin: 6px 0 0; max-width: 62ch; }
.dad .polgar { color: var(--accent); font-weight: 500; }
.real { font-size: 19px; margin: 0; }
.done-stars { font-size: 46px; letter-spacing: 6px; }

/* ---------- Board ---------- */
.board { position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
  box-shadow: 0 0 0 6px #6b4a31, 0 0 0 7px #4d3422, 0 10px 24px rgba(40, 25, 10, .25);
  margin: 7px; max-width: calc(100% - 14px); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.board svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.board .b-top { cursor: pointer; }
.board.locked .b-top { cursor: default; }
.board.shake { animation: shake .38s ease; }
@keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-8px) } 50% { transform: translateX(7px) } 75% { transform: translateX(-4px) } }
.pc { transition: transform .18s ease; }
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
.pop { animation: pop .5s ease; transform-origin: center; transform-box: fill-box; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0 } 70% { transform: scale(1.15) } 100% { transform: scale(1); opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .board.shake, .pulse, .pop { animation: none; } .pc { transition: none; } }
</style>
</head>

<script>
const DATA = {"parts":[{"id":"p1","num":1,"title":"Think Like a Player","blurb":"The big ideas strong players use every game.","lessons":[{"id":"s1","title":"Control the center","idea":["The four squares in the middle of the board are d4, e4, d5 and e5.","Pieces in the center can reach more squares, and they can rush to either side fast.","Start the game by putting pawns in the center and aiming your pieces there."],"demo":{"steps":[{"text":"Here are the four center squares. Whoever controls them usually gets the easier game.","marks":["d4","e4","d5","e5"]},{"san":"e4","text":"White grabs the center with a pawn and opens lines for the queen and a bishop."},{"san":"e5","text":"Black does the same thing. Now each side has a pawn in the middle."},{"san":"Nf3","text":"White's knight jumps toward the center and attacks the e5 pawn.","arrows":[["f3","e5"]]},{"san":"Nc6","text":"Black defends e5 with a knight that also points at the center.","arrows":[["c6","e5"]]},{"san":"d4","text":"White pushes a second pawn into the center to fight for it.","arrows":[["d4","e5"]]}],"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},"tries":[{"type":"squares","prompt":"Tap the four center squares.","targets":["d4","e4","d5","e5"],"explain":"Those four squares are the most important real estate on the board.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"move","prompt":"Make a first move that puts a pawn in the center.","answers":["e4","d4"],"hint":"Try the pawn in front of the king or the queen.","hintFrom":"e2","explain":"Both of these put a pawn right in the middle and open lines for your pieces.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"move","prompt":"Bring out a knight that attacks Black's center pawn.","answers":["Nf3"],"notes":{"Nc3":"Good square, but that knight does not attack e5. Try the other knight."},"hint":"Which knight can jump to a square that attacks e5?","hintFrom":"g1","explain":"Nf3 develops a piece and makes Black defend e5.","fen":"rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq e6 0 2"},{"type":"move","prompt":"Black just took your center pawn. Take it back.","answers":["Nxd4"],"notes":{"Qxd4":"That works, but Black's knight on c6 will chase your queen. Take back with a smaller piece."},"hint":"Your knight on f3 can capture.","hintFrom":"f3","explain":"Now your knight sits in the center, and Black has no pawn there.","fen":"r1bqkbnr/pppp1ppp/2n5/8/3pP3/5N2/PPP2PPP/RNBQKB1R w KQkq - 0 4"}],"realSet":"Play the first 4 moves of a game each. Then count: how many of the four center squares does each side touch with a pawn or piece?","dad":"A knight in the center reaches 8 squares, but in a corner only 2. The center is about mobility: pieces there can switch to the kingside or queenside in one move. Ask Felix after every early move: does this help me in the middle?","polgar":null},{"id":"s2","title":"Get your pieces out","idea":["At the start, your knights and bishops are stuck at home. Bring them out early.","Try to move each piece once before you move any piece twice.","Keep your queen home at first, because the other side can chase her and win time."],"demo":{"steps":[{"text":"Watch both sides bring out a new piece on almost every move."},{"san":"e4","text":"Center pawn first."},{"san":"e5","text":"Black matches."},{"san":"Nf3","text":"A knight comes out toward the center."},{"san":"Nc6","text":"Black brings out a knight too."},{"san":"Bc4","text":"A bishop comes out and aims at f7, the weak spot next to Black's king.","arrows":[["c4","f7"]]},{"san":"Bc5","text":"Black's bishop aims at f2, White's weak spot.","arrows":[["c5","f2"]]},{"san":"Nc3","text":"Another knight out. White has three pieces in the game."},{"san":"Nf6","text":"So does Black. Both sides are ready to castle."}],"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},"tries":[{"type":"move","prompt":"Bring a new piece into the game.","answers":["Bc4","Bb5","Nc3"],"notes":{"Ng5":"That knight already moved. Bring out a different piece.","Bd3":"That bishop blocks your d-pawn. Find a better square.","Qe2":"Keep the queen home for now. Bring out a knight or bishop.","Be2":"OK, but a little shy. Can the bishop go somewhere more active?"},"hint":"Your bishop on f1 or your knight on b1 has not moved yet.","hintFrom":"f1","explain":"Every new piece in the game is like another player joining your team.","fen":"r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3"},{"type":"squares","prompt":"Tap every White knight or bishop that is still at home.","targets":["b1","c1"],"explain":"The b1 knight and c1 bishop still need to come out.","fen":"r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4"},{"type":"move","prompt":"White's queen came out early and threatens checkmate on f7! Stop it.","answers":["g6","Qe7","Qf6"],"notes":{"Nf6":"Careful! Then White plays Qxf7, checkmate.","d6":"Then White plays Qxf7, checkmate. Defend f7 or block the queen."},"hint":"The queen and bishop both aim at f7. Block the queen or guard f7.","hintFrom":"g7","explain":"Now f7 is safe. Next, Black can bring out pieces and chase the queen.","fen":"r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3"},{"type":"move","prompt":"The queen is back, still eyeing f7. Bring out a piece that blocks her.","answers":["Nf6"],"hint":"A knight can stand between the queen and f7.","hintFrom":"g8","explain":"Black blocks the threat and develops at the same time. Two jobs, one move.","fen":"r1bqkbnr/pppp1p1p/2n3p1/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR b KQkq - 1 4"}],"realSet":"Play a game where the rule is: no piece moves twice until all 4 knights and bishops are out. Who gets their pieces out first?","dad":"Development is about tempo. Each move that brings a new piece into play is a gain; moving the same piece twice or chasing with the queen hands the opponent free moves. The early-queen lines here (Qh5) are what beginners meet most online, so it is worth drilling the defense.","polgar":null},{"id":"s3","title":"Castle early","idea":["A king in the middle of the board is in danger once the pawns get traded.","Castling tucks your king into the corner behind pawns and brings a rook toward the middle.","Try to castle in the first 10 moves of every game."],"demo":{"steps":[{"text":"The knight and bishop between the king and rook are out of the way. White can castle."},{"san":"O-O","text":"To castle, the king moves two squares toward the rook, and the rook jumps over to the other side."},{"san":"Nf6","text":"Black clears the last piece on that side."},{"san":"d3","text":"White opens a path for the other bishop."},{"san":"O-O","text":"Black castles too. Both kings are safe behind a wall of pawns."}],"fen":"r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4"},"tries":[{"type":"move","prompt":"Get your king safe. Castle!","answers":["O-O"],"hint":"Tap your king, then the square two steps toward the rook.","hintFrom":"e1","explain":"King safe, rook ready to come into the game.","fen":"r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R w KQkq - 1 5"},{"type":"move","prompt":"This time castle the other way, toward the queen's side.","answers":["O-O-O"],"hint":"Tap your king, then the square two steps toward the a1 rook.","hintFrom":"e1","explain":"Castling queenside puts your rook right on the center d-file.","fen":"r3kbnr/pppqpppp/2n5/3p1b2/3P1B2/2N5/PPPQPPPP/R3KBNR w KQkq - 6 5"},{"type":"move","prompt":"Your turn as Black. Make your king safe.","answers":["O-O"],"hint":"The squares between your king and rook are empty.","hintFrom":"e8","explain":"Both kings are tucked away. Now the middle of the game can begin.","fen":"r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQ1RK1 b kq - 0 5"}],"realSet":"Play a game where each of you must castle before move 10. Write down the move number when you castled.","dad":"The main reasons to castle: king off the e-file before it opens, and the rook connected to the other rook. You cannot castle out of check, through an attacked square, or after the king or that rook has moved. Once castled, the pawns in front of the king should mostly stay put.","polgar":null},{"id":"s4","title":"What pieces are worth","idea":["Pawn = 1. Knight = 3. Bishop = 3. Rook = 5. Queen = 9.","Take pieces that are free, and trade only when you give the same or less.","Before you grab something, check whether it is guarded."],"demo":{"fen":"6k1/3r1ppp/8/4N3/2b5/8/5PPP/6K1 w - - 0 1","steps":[{"text":"White's knight attacks two things: a rook on d7 and a bishop on c4.","arrows":[["e5","d7"],["e5","c4"]]},{"text":"A rook is worth 5 and a bishop is worth 3. Which would you rather win?"},{"san":"Nxd7","text":"Take the rook! Nothing can take the knight back, so White is up 5 points."}]},"tries":[{"type":"move","fen":"6k1/5ppp/8/3n4/8/8/5PPP/3R2K1 w - - 0 1","prompt":"Something is free. Take it.","answers":["Rxd5"],"hint":"Look down the d-file.","hintFrom":"d1","explain":"Nothing guards the knight, so you win 3 points for free."},{"type":"avoid","fen":"6k1/5ppp/4p3/3p4/8/8/5PPP/3Q2K1 w - - 0 1","prompt":"The pawn on d5 looks free. Is it? Make a safe move.","bad":["Qxd5"],"badNote":"The e6 pawn takes your queen! You gave 9 points for 1.","hint":"Check what guards d5 before you grab it.","explain":"Good. That pawn was guarded by the e6 pawn."},{"type":"move","fen":"6k1/3r1ppp/8/4N3/2b5/8/5PPP/6K1 w - - 0 1","prompt":"Your knight can take two things. Take the bigger one.","answers":["Nxd7"],"notes":{"Nxc4":"A bishop is worth 3. Is there something worth more?","Nxf7":"That pawn is guarded by the king. Look for something bigger."},"hint":"Rook = 5, bishop = 3.","hintFrom":"e5","explain":"Always count points before you capture."}],"realSet":"Set up the board with only pawns, then add one piece at a time. Felix tells you its value before it goes on the board. Then race: Dad calls a total like 11, Felix makes it with pieces.","dad":"The 1-3-3-5-9 scale is a guide, not law: a bishop pair or an active piece can outweigh a point. The habit that matters most at this level is checking whether a target is defended, and counting attackers versus defenders before a capture.","polgar":null},{"id":"s5","title":"Stop and check","idea":["Before every move, ask three questions.","1. What does their last move want to do? 2. Can I give a check? 3. Can I capture something?","Strong players do this every single move. It is the biggest habit in chess."],"demo":{"fen":"6k1/5ppp/8/8/8/1q6/5PPP/3R2K1 w - - 0 1","steps":[{"text":"Black's queen is attacking White's rook. The first thought is to run away.","arrows":[["b3","d1"]]},{"text":"But ask question 2 first: can I give a check? The rook can go to d8.","arrows":[["d1","d8"]]},{"san":"Rd8#","text":"Check, and the king's own pawns block every escape. Checkmate! Asking the questions found a win instead of a retreat."}]},"tries":[{"type":"mate","fen":"6k1/5ppp/8/8/8/1q6/5PPP/3R2K1 w - - 0 1","prompt":"Black's queen attacks your rook. Before you run, ask: do I have a check?","hint":"Look at the back row behind Black's pawns.","hintFrom":"d1","explain":"Checks first. That habit wins games.","solutions":["Rd8#"]},{"type":"move","prompt":"Black just took your e4 pawn. Ask question 3: can you capture something?","answers":["Nxe4"],"notes":{"Bxf7+":"Tricky, and it can work, but keep it simple: take back the knight that just took."},"hint":"Which of your pieces attacks e4?","hintFrom":"c3","explain":"You get your pawn back by taking the piece that took it.","fen":"r1bqkb1r/pppp1ppp/2n5/4p3/2B1n3/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 0 5"},{"type":"stopmate","fen":"3r2k1/5ppp/8/8/8/8/R4PPP/6K1 w - - 0 1","prompt":"Ask question 1: what does Black want to do? Stop it.","hint":"If Black's rook goes to d1, can your king escape?","explain":"Black was threatening Rd1, checkmate. Now you are safe."}],"realSet":"Play a game where before each move the player says out loud: \"What do they want? Any checks? Any captures?\" A point for every move you remember to say it.","dad":"This is the discipline lesson, and the one worth repeating most. Most games at this level are lost to a missed threat, not to a lack of ideas. Some coaches use a physical cue: hands in lap until the three questions are done. A silly phrase helps too.","polgar":null},{"id":"s6","title":"Good squares for pieces","idea":["Rooks love open files, which are columns with no pawns on them.","Bishops love long open diagonals. Knights love center squares where pawns cannot kick them away.","If a piece has few moves, find it a better home."],"demo":{"fen":"r4rk1/pp3ppp/2p5/8/8/2P5/PP3PPP/R4RK1 w - - 0 1","steps":[{"text":"The d-file and e-file have no pawns at all. They are open files.","marks":["d1","d2","d3","d4","d5","d6","d7","d8","e1","e2","e3","e4","e5","e6","e7","e8"]},{"san":"Rad1","text":"A rook on an open file can zoom all the way to the other side.","arrows":[["d1","d8"]]},{"san":"Rfd8","text":"Black does the same. Rooks fight for open files."}]},"tries":[{"type":"move","fen":"r4rk1/pp3ppp/2p5/8/8/2P5/PP3PPP/R4RK1 w - - 0 1","prompt":"Put a rook on an open file.","answers":["Rad1","Rae1","Rfd1","Rfe1"],"hint":"Which files have no pawns?","hintFrom":"a1","explain":"From there the rook can reach the other side of the board."},{"type":"move","fen":"r4rk1/pp3ppp/3p4/2p1p3/4P3/2N5/PPP2PPP/R4RK1 w - - 0 1","prompt":"Find your knight a center square where no Black pawn can ever kick it away.","answers":["Nd5"],"notes":{"Nb5":"Black can play a6 and kick it away. Look for a safer square in the center."},"hint":"Black's c-pawn and e-pawn have already gone past one square.","hintFrom":"c3","explain":"That is called an outpost. Your knight can sit on d5 all game."},{"type":"move","prompt":"Put your bishop on the long diagonal that runs corner to corner.","answers":["Bg2"],"hint":"The g-pawn moved out of the way for a reason.","hintFrom":"f1","explain":"From g2 the bishop looks all the way to a8.","fen":"rnbqkb1r/ppp1pppp/5n2/3p4/8/5NP1/PPPPPP1P/RNBQKB1R w KQkq - 1 3"}],"realSet":"Set up only kings, rooks and pawns. Take turns placing a pawn to close a file. Then find which files are still open and put your rooks on them.","dad":"This is the bridge from tactics to strategy: piece activity. Count the moves a piece has; that number is a quick measure of how good it is. Outposts (squares an enemy pawn can never attack) are a great concept for kids because it is concrete and checkable.","polgar":null},{"id":"s7","title":"Pawn power","idea":["Pawns can never move backward, so think before you push one.","A passed pawn has no enemy pawns in front of it or beside it. It can march all the way and become a queen.","Two pawns stuck on the same file are called doubled pawns. They are weaker."],"demo":{"fen":"8/5pk1/8/1P6/8/6P1/6K1/8 w - - 0 1","steps":[{"text":"The b5 pawn has no Black pawns in front of it or on the files beside it. It is a passed pawn.","marks":["b5"]},{"san":"b6","text":"It marches."},{"san":"Kf6","text":"Black's king runs, but it is too far away."},{"san":"b7","text":"One more step."},{"san":"Ke7","text":"Still too late."},{"san":"b8=Q","text":"A new queen! Passed pawns win games, especially near the end."}]},"tries":[{"type":"squares","fen":"8/5pk1/8/1P6/8/6P1/6K1/8 w - - 0 1","prompt":"Tap White's passed pawn.","targets":["b5"],"explain":"No Black pawn can ever stop it."},{"type":"move","fen":"8/5pk1/8/1P6/8/6P1/6K1/8 w - - 0 1","prompt":"Black's king is far away. Push your passed pawn.","answers":["b6"],"hint":"March it!","hintFrom":"b5","explain":"Keep going and it becomes a queen."},{"type":"squares","fen":"6k1/5ppp/8/8/8/2P5/P1P2PPP/6K1 w - - 0 1","prompt":"Tap White's doubled pawns.","targets":["c2","c3"],"explain":"They are stuck on the same file and cannot protect each other."}],"realSet":"Pawn war: each side gets only 8 pawns. First to get a pawn to the other side wins. Play it three times.","dad":"Pawn wars are the single best game for this age; they teach ide's loose pieces, and guard or move your own.","Before every move, look for loose pieces on both sides."],"demo":{"fen":"4k3/8/8/1n3r2/8/3Q4/8/4K3 w - - 0 1","steps":[{"text":"White's queen attacks two Black pieces, and nothing guards either one.","arrows":[["d3","b5"],["d3","f5"]]},{"text":"Both are loose. Which one is worth more? The knight is 3. The rook is 5."},{"san":"Qxf5","text":"Take the rook. The queen is safe on f5, and White is ahead by 5 points."}]},"tries":[{"type":"move","fen":"4k3/8/8/3b4/8/8/8/3RK3 w - - 0 1","prompt":"Something is loose. Take it.","answers":["Rxd5"],"hint":"Look straight up the d-file.","hintFrom":"d1","explain":"Nothing protected the bishop."},{"type":"move","fen":"3rk3/8/8/8/3N4/8/5PPP/6K1 b - - 0 1","prompt":"You are Black. Grab the loose piece.","answers":["Rxd4"],"hint":"What does your rook see?","hintFrom":"d8","explain":"White's knight had no guard."},{"type":"move","fen":"4k3/8/8/3p4/4N3/8/5PPP/6K1 w - - 0 1","prompt":"Black's pawn is attacking your knight. Save it.","hint":"Move the knight to a square where nothing can take it.","hintFrom":"e4","explain":"Saved. Nf6+ was extra sneaky: check, and it attacks the d5 pawn too.","answers":["Nf6+","Nc5","Nd6+","Ng5","Ng3","Nd2","Nc3"]},{"type":"move","fen":"4k3/8/2p5/3n4/8/8/5PPP/3Q2K1 w - - 0 1","prompt":"The knight on d5 looks loose. Is it? Make a safe move.","notes":{"Qxd5":"The c6 pawn guards it! Then cxd5 and your queen is gone."},"hint":"Check what guards d5 before you grab.","explain":"That knight was guarded by the c6 pawn. Not loose at all.","answers":["f3","g3","g4","h3","h4","Qc2","Qb3","Qa4","Qd2","Qd3","Qd4","Qe2+","Qf3","Qg4","Qh5+","Qe1+","Qf1","Qc1","Qb1","Qa1","Kh1","Kf1"]},{"type":"move","fen":"4k3/8/8/1n3r2/8/3Q4/8/4K3 w - - 0 1","prompt":"Two loose pieces. Take the bigger one.","answers":["Qxf5"],"notes":{"Qxb5+":"That wins a knight, but there was a rook to take."},"hint":"Rook = 5, knight = 3.","hintFrom":"d3","explain":"Always grab the biggest loose piece."},{"type":"move","fen":"4k3/5ppp/8/8/1b6/2P5/5PPP/6K1 b - - 0 1","prompt":"You are Black. The c3 pawn attacks your bishop. Don't lose it.","hint":"Move it, or look for something even better.","hintFrom":"b4","explain":"Bxc3 was the best: the pawn was loose too!","answers":["Bxc3","Ba5","Bc5","Bd6","Be7","Bf8","Ba3"]}],"realSet":"Set up a few pieces for each side at random. Take turns pointing at every loose piece on the board. A point for each one you find first.","dad":"Coaches call this LPDO: loose pieces drop off. It is the single most useful habit for kids under 1000. Pair it with the three questions from Part 1 (what do they want, checks, captures) and he will stop dropping pieces.","polgar":null},{"id":"t2","title":"Knight forks","idea":["A fork is one piece attacking two things at once.","Knights are the best forkers, because they jump and nothing can block them.","A fork with check is the strongest: the king must move, and you take the other piece."],"demo":{"fen":"2q1k3/8/8/8/4N3/8/5PPP/6K1 w - - 0 1","steps":[{"text":"The king is on e8 and the queen is on c8. Is there a square where a knight hits both?","marks":["e8","c8"]},{"san":"Nd6+","text":"Nd6 is check, and it also attacks the queen.","arrows":[["d6","e8"],["d6","c8"]]},{"san":"Kd7","text":"Black has to get out of check."},{"san":"Nxc8","text":"The knight takes the queen. That fork won 9 points."}]},"tries":[{"type":"move","fen":"2q1k3/8/8/8/4N3/8/5PPP/6K1 w - - 0 1","prompt":"Fork the king and queen.","answers":["Nd6+"],"hint":"Find a square that touches both e8 and c8.","hintFrom":"e4","explain":"Check plus an attack on the queen."},{"type":"move","fen":"2r3k1/5ppp/8/3N4/8/8/5PPP/6K1 w - - 0 1","prompt":"Fork the king and the rook.","answers":["Ne7+"],"hint":"Which square touches g8 and c8?","hintFrom":"d5","explain":"The king moves, then Nxc8."},{"type":"move","fen":"6k1/5ppp/8/8/3n4/2Q5/5PPP/6K1 b - - 0 1","prompt":"You are Black. Your knight is attacked, but you can fork!","answers":["Ne2+"],"h answers":["d5"],"notes":{"Bxc6+":"That just trades. The b7 pawn takes back. Attack the pinned knight with something smaller."},"hint":"A pawn can attack it.","hintFrom":"d4","explain":"The knight cannot run, so the pawn wins it."},{"type":"move","fen":"4k3/8/8/3p4/1b6/2N5/1P6/4K3 b - - 0 1","prompt":"You are Black. White's knight is pinned. Win it.","answers":["d4"],"hint":"Push a pawn at it.","hintFrom":"d5","explain":"Pinned pieces cannot run away."},{"type":"move","fen":"4r1k1/8/8/8/8/8/4Q3/4K3 b - - 0 1","prompt":"You are Black. White's queen is pinned to her king. Take her.","answers":["Rxe2+"],"hint":"Your rook is on the same file.","hintFrom":"e8","explain":"The king takes back, but you traded a rook for a queen."}],"realSet":"Set up a pin on the real board: a Black king, a Black piece in front of it, and a White bishop or rook. Felix tries to move the pinned piece and Dad explains why he can't.","dad":"Absolute pin: the piece behind is the king, so the pinned piece legally cannot move. Relative pin: the piece behind is just valuable, so moving is legal but costly. The winning idea is \"pile on the pinned piece\", usually with a pawn.","polgar":null},{"id":"t5","title":"Skewers","idea":["A skewer is a pin backwards: the big piece is in front.","Attack the king or queen. When it moves out of the way, take the piece behind it.","Bishops, rooks and queens make skewers, because they attack in straight lines."],"demo":{"fen":"3r4/8/8/3k4/8/8/8/R5K1 w - - 0 1","steps":[{"text":"Black's king is on d5 and the rook is right behind it on d8.","marks":["d5","d8"]},{"san":"Rd1+","text":"Check along the d-file."},{"san":"Ke5","text":"The king has to step off the file."},{"san":"Rxd8","text":"Now the rook behind it is open. Take it."}]},"tries":[{"type":"move","fen":"3r4/8/8/3k4/8/8/8/R5K1 w - - 0 1","prompt":"Skewer the king and rook.","answers":["Rd1+"],"hint":"Check the king on the same file as the rook.","hintFrom":"a1","explain":"King moves, rook falls."},{"type":"mov wer the check first."},{"san":"Nxb5","text":"The knight takes the queen."}]},"tries":[{"type":"move","fen":"4k3/8/8/1q6/8/8/4N3/4R1K1 w - - 0 1","prompt":"Move the knight with check and win the queen.","answers":["Nc3+","Nd4+"],"hint":"The rook gives check when the knight moves. Where should the knight go?","hintFrom":"e2","explain":"Two attacks at once. Black cannot answer both."},{"type":"move","fen":"3q2k1/8/8/8/8/3B4/8/3R2K1 w - - 0 1","prompt":"Move the bishop with check. Your rook will attack the queen.","answers":["Bc4+"],"notes":{"Bh7+":"Check, but the king just takes the bishop. Find a safe check."},"hint":"Find a safe bishop check.","hintFrom":"d3","explain":"Black blocks or moves, then your rook takes the queen."},{"type":"move","fen":"4k3/8/r7/8/8/8/4B3/4R1K1 w - - 0 1","prompt":"Win the rook right now, with discovered check.","answers":["Bxa6+"],"hint":"The bishop can capture and uncover the rook at the same time.","hintFrom":"e2","explain":"Capture plus check. Black can't take back."},{"type":"move","fen":"4r1k1/8/8/4b3/8/2Q5/8/4K3 b - - 0 1","prompt":"You are Black. Uncover a check and win the queen.","answers":["Bxc3+"],"hint":"Your bishop blocks your rook's attack on the king.","hintFrom":"e5","explain":"The bishop takes the queen while the rook gives check."}],"realSet":"Set up a rook behind one of your own knights, aimed at the enemy king. Felix finds every knight move that gives discovered check, and which ones also attack something.","dad":"Discovered attacks are the strongest tactical idea because both pieces attack at once. A double check (both pieces give check) can only be answered by moving the king. Look for your own pieces lined up behind each other.","polgar":null},{"id":"t7","title":"Remove the guard","idea":["Sometimes a piece is protected by just one guard.","Capture the guard, or chase it away, and the piece it protected is loose.","If one guard has two jobs, it can only do one of them."],"demo":{"fen":"6k1/5ppp/5n2/3b2B1/8/8/5PPP/3R ]},{"san":"Ra8#","text":"The rook checks along the back row. The king cannot step forward and nothing can block. Checkmate."}]},"tries":[{"type":"mate","fen":"6k1/5ppp/8/8/8/8/5PPP/3Q2K1 w - - 0 1","prompt":"Checkmate in one move.","hint":"Use the back row.","hintFrom":"d1","explain":"Same pattern, with the queen.","solutions":["Qd8#"]},{"type":"mate","fen":"2r3k1/5ppp/8/8/8/8/5PPP/2R1R1K1 w - - 0 1","prompt":"Black's rook guards the back row. Checkmate anyway.","hint":"What if you take the guard?","hintFrom":"c1","explain":"Taking the guard with check is the same back-rank mate.","solutions":["Rxc8#"]},{"type":"mate","fen":"1r4k1/5ppp/8/8/8/8/5PPP/6K1 b - - 0 1","prompt":"You are Black. Checkmate in one move.","hint":"White's king is boxed in too.","hintFrom":"b8","explain":"It works for both sides. Protect your own back row!","solutions":["Rb1#"]}],"realSet":"Set up a back-rank mate on the real board from memory. Then Felix sets one up for Dad to solve.","dad":"The cure is \"luft\": pushing h3 or g3 (h6 or g6) at a calm moment gives the king an escape square. Teach both the pattern and the defense. Many of the mates in the front of the Polgar book are back-rank mates.","polgar":"Mate-in-one chapter: look for positions with the king behind three pawns."},{"id":"m2","title":"Two-rook ladder","idea":["Two rooks can walk a king to the edge like climbing a ladder.","One rook blocks a whole row. The other rook gives check on the next row.","The king runs out of rows and it is checkmate."],"demo":{"fen":"7k/8/8/8/8/8/R7/1R4K1 w - - 0 1","steps":[{"text":"Black's king is on the top edge. White's rooks are far away, and that is fine."},{"san":"Ra7","text":"This rook cuts off the whole 7th row. The king cannot step down.","arrows":[["a7","h7"]]},{"san":"Kg8","text":"The king can only shuffle along the top row."},{"san":"Rb8#","text":"The other rook checks along the top row. Checkmate."}]},"tries":[{"type":"mate","fen":"7k/R7/8/8/8/8/8/1R4K1 w - - 0 1","prompt":"One rook alr on the edge, king in front.","solutions":["Qf8#"]},{"type":"mate","fen":"8/8/8/8/8/1k6/3q4/K7 b - - 0 1","prompt":"You are Black. Give the kiss of death.","hint":"Put your queen right next to White's king where your king guards her.","hintFrom":"d2","explain":"The king cannot take a queen that is protected.","solutions":["Qe1#","Qd1#","Qc1#","Qb2#","Qa2#"]}],"realSet":"Kings and one queen only. Dad's king stands on an edge. Felix finds every square where the queen gives checkmate.","dad":"The kiss of death (queen adjacent, defended by the king) is the finishing shape of the king-and-queen versus king ending. Watch for stalemate traps when the lone king has no moves and is not in check; that comes up in the endgame lessons.","polgar":null},{"id":"m4","title":"Smothered mate","idea":["Sometimes a king is surrounded by its own pieces.","A knight can jump over them and give check. Nothing can block a knight.","If no piece can take the knight, it is smothered mate."],"demo":{"fen":"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1","steps":[{"text":"Black's king is boxed in by its own rook and pawns.","marks":["g8","g7","h7"]},{"san":"Nf7#","text":"The knight jumps in. The king cannot move and nothing can take the knight. Smothered!"}]},"tries":[{"type":"mate","fen":"r5rk/6pp/7N/8/8/8/8/6K1 w - - 0 1","prompt":"Checkmate with the knight.","hint":"Which square next to the corner can your knight reach?","hintFrom":"h6","explain":"Smothered again.","solutions":["Nf7#"]},{"type":"mate","fen":"6k1/8/8/8/6n1/8/6PP/6RK b - - 0 1","prompt":"You are Black. Smother White's king.","hint":"White's king is trapped by its own rook and pawns.","hintFrom":"g4","explain":"The knight's jump cannot be blocked.","solutions":["Nf2#"]}],"realSet":"Set up a smothered king in the corner with its own pieces around it. Felix finds every knight square that would give smothered mate.","dad":"The famous full version is a queen sacrifice: Nf7+, Kg8, Nh6+ (double check), Kh8, Qg8+!, Rxg8, Nf7#. It is a great one to s t covers the escapes, queen gives check.","solutions":["Qh5#"]},{"type":"mate","fen":"6k1/8/3r4/8/8/8/4nPPK/5R2 b - - 0 1","prompt":"You are Black. Checkmate in one move.","hint":"Your knight covers g1 and g3.","hintFrom":"d6","explain":"Anastasia's mate, flipped.","solutions":["Rh6#"]}],"realSet":"Set up the demo position on the real board, then move the knight one square at a time. After each move, is it still mate if the rook goes to h3?","dad":"The name comes from an 1803 novel, Anastasia und das Schachspiel. Pattern recognition grows from seeing the same shape in different spots, so moving the pieces around on the real board is worth more than another screen puzzle.","polgar":null},{"id":"m7","title":"Boden's mate","idea":["Two bishops can cross their diagonals like scissors.","This often happens against a king that castled to the queen's side.","One bishop gives check and the other covers the escape squares."],"demo":{"fen":"2kr4/p2n4/8/8/5B2/8/4B3/4K3 w - - 0 1","steps":[{"text":"The bishop on f4 already covers c7 and b8.","arrows":[["f4","b8"]]},{"san":"Ba6#","text":"The other bishop checks from a6. The king's own rook and knight are in the way. Checkmate."}]},"tries":[{"type":"mate","fen":"2kr4/p2n4/8/8/5B2/8/4B3/4K3 w - - 0 1","prompt":"Cross the bishops. Checkmate.","hint":"Your e2 bishop can reach a square next to b7.","hintFrom":"e2","explain":"Two bishops, crossing diagonals.","solutions":["Ba6#"]},{"type":"mate","fen":"4k3/4b3/8/5b2/8/8/P2N4/2KR4 b - - 0 1","prompt":"You are Black. Checkmate with the bishops.","hint":"Your f5 bishop already covers b1 and c2.","hintFrom":"e7","explain":"Boden's mate from the other side.","solutions":["Ba3#"]}],"realSet":"Set up only kings and two bishops. Can Felix find a position where the bishops give checkmate with help from the king's own pieces? Dad checks it.","dad":"Named for Samuel Boden, 1853. It shows why a king castled queenside with pawns moved can be airy: the diagonals cross right in front of it.","polgar":null},{"id":"m8","title":"Two-move nets","idea":["Some checkmates take two moves.","First move: a check that forces the reply, or a quiet move that builds the net.","Second move: checkmate. The computer will answer your first move."],"demo":{"fen":"2r3k1/5ppp/8/8/8/8/3R1PPP/3R2K1 w - - 0 1","steps":[{"text":"Two rooks line up on the d-file. Black's rook guards the back row."},{"san":"Rd8+","text":"Check! Black has only one answer."},{"san":"Rxd8","text":"Black takes the rook."},{"san":"Rxd8#","text":"The second rook takes back, and it is a back-rank mate."}]},"tries":[{"type":"mate2","fen":"2r3k1/5ppp/8/8/8/8/3R1PPP/3R2K1 w - - 0 1","prompt":"Checkmate in two moves.","hint":"Two rooks, one file, one back row.","hintFrom":"d2","explain":"Give up one rook to clear the way for the other.","solutions":["Rd8+"]},{"type":"mate2","fen":"7k/8/8/8/8/8/R7/1R4K1 w - - 0 1","prompt":"Checkmate in two. Your first move does not need to be a check.","hint":"Block the 7th row first.","hintFrom":"a2","explain":"Quiet move, then mate. That is the ladder.","solutions":["Ra7","Rb7"]}],"realSet":"Dad sets up one of today's positions on the real board and plays Black. Felix has to say both moves out loud before touching a piece.","dad":"Calculation habit: say the whole line before moving. For mate-in-two, start by listing every check, then every capture, then quiet moves that cut off squares. The mate-in-two chapter of Polgar is huge; do three a session and set up one on the real board.","polgar":"Mate-in-two chapter: pick three per session and set one up on the real board."}]},{"id":"p4","num":4,"title":"Endgame Mastery","blurb":"Few pieces, careful moves. Finish off a lone king, then win and save king-and-pawn endings against a computer that plays them perfectly.","lessons":[{"id":"e1","title":"Queen checkmate","idea":["A queen and king can always checkmate a lone king.","Use the queen to make the king's box smaller and smaller, staying a knight's jump away so it cannot be attacked." ings are not facing, a quiet rook move along the same line (a waiting move) often forces the enemy king to step into the opposition.","polgar":null},{"id":"e3","title":"Two bishops checkmate","idea":["Two bishops side by side make a wall that the king cannot cross.","Use the wall and your king to push the enemy king into a corner.","The mate always happens in a corner."],"demo":{"fen":"k7/8/1K6/1B2B3/8/8/8/8 w - - 0 1","steps":[{"text":"The king is in the corner. White's king covers a7 and b7. The e5 bishop covers b8.","arrows":[["e5","b8"]]},{"san":"Bc6#","text":"The other bishop checks. Checkmate."}]},"tries":[{"type":"mate","fen":"k7/8/1K6/1B2B3/8/8/8/8 w - - 0 1","prompt":"Checkmate with the bishops.","hint":"One bishop already covers b8.","hintFrom":"b5","explain":"Bishops on neighboring diagonals.","solutions":["Bc6#"]},{"type":"mate","fen":"k7/8/1K6/8/B4B2/8/8/8 w - - 0 1","prompt":"Checkmate in one.","hint":"Which bishop can give check along the long diagonal?","hintFrom":"a4","explain":"The corner is where bishops win.","solutions":["Bc6#"]},{"type":"play","fen":"1k6/8/2K5/8/8/3BB3/8/8 w - - 0 1","limit":20,"weekend":true,"prompt":"Weekend challenge: push the king into the corner and checkmate in 20 moves.","hint":"Keep the bishops side by side as a wall. Use your king to take squares away. Do not stalemate!","explain":"Two bishops, one corner, checkmate."}],"realSet":"Set up the mating picture in all four corners on the real board. Which squares does each piece cover?","dad":"Two bishops versus king is a forced win in under 20 moves from any position, but the technique is fiddly. The key picture: bishops on adjacent diagonals form a barrier; the king and bishops work together to herd the king to any corner. Stalemate is again the main danger.","polgar":null},{"id":"e9","title":"Bishop and knight checkmate","idea":["A bishop and knight can checkmate, but only in a corner the same color as the bishop.","A light-squared bishop mates in the light corners, a8 and h1. A dark-squared bishop mates in a1 and h8.","The pieces work as a team: the king boxes, the knight covers the squares the bishop cannot, and the bishop checks."],"demo":{"fen":"k7/3N4/1K6/8/8/7B/8/8 w - - 0 1","steps":[{"text":"Black's king is in a8, a light corner. White's bishop moves on light squares, so this is the right corner."},{"text":"White's king covers a7 and b7. The knight covers b8.","arrows":[["d7","b8"]],"marks":["a7","b7"]},{"san":"Bg2#","text":"The bishop checks down the long diagonal. Checkmate."}]},"tries":[{"type":"squares","fen":"8/8/8/4k3/8/3BN3/8/4K3 w - - 0 1","prompt":"This bishop moves on light squares. Tap the two corners where it can help checkmate.","targets":["a8","h1"],"explain":"Light bishop, light corners."},{"type":"mate","fen":"k7/3N4/1K6/8/8/7B/8/8 w - - 0 1","prompt":"Checkmate in one.","hint":"The long diagonal leads right to a8.","hintFrom":"h3","explain":"King, knight and bishop all did a job.","solutions":["Bg2#"]},{"type":"mate","fen":"k7/2K5/8/1N6/2B5/8/8/8 w - - 0 1","prompt":"A different team shape. Checkmate in one.","hint":"Your knight covers a7. Check from the diagonal.","hintFrom":"c4","explain":"Same corner, different picture.","solutions":["Bd5#"]},{"type":"play","fen":"2k5/8/1K6/3N4/8/3B4/8/8 w - - 0 1","limit":30,"weekend":true,"prompt":"Weekend challenge: checkmate in 30 moves or less. Push the king into a light corner.","hint":"Keep your king close to his. If he runs toward a dark corner, use the knight and bishop to chase him along the edge to a8.","explain":"This is one of the hardest basic checkmates. Very few kids can do it."}],"realSet":"Set up the mating picture in a8, then try to set it up in a1 with the same bishop. Can you? Why not?","dad":"From the worst case this mate can take up to 33 moves, and the technique (often taught as the \"W manoeuvre\", where the knight walks a W shape to drive the king along the edge to the right corner) is genuinely hard. It almost never happens in real games, so treat this as a challenge, not a requirement. The color-of-corner idea is the part worth keeping.","polgar":null},{"id":"e4","title":"Two knights can't win","idea":["Two knights and a king cannot force checkmate against a lone king.","The king can always step away, and the move that would trap it usually causes stalemate.","Strangely, if the other side has a pawn, checkmate becomes possible, because the pawn gives them a move."],"demo":{"fen":"7k/5K2/8/3N4/5N2/8/8/8 w - - 0 1","steps":[{"text":"The king is in the corner. It looks like White should win."},{"san":"Nf6","text":"Nf6 takes away the last squares. But it is not check, and Black has no legal move. Stalemate! A draw."},{"text":"That is why two knights alone cannot force a win. Next, see what changes when Black has a pawn."}]},"tries":[{"type":"mate","fen":"7k/5K2/8/4N1N1/8/8/8/8 w - - 0 1","prompt":"Black just walked into a trap. Checkmate with a knight.","hint":"A knight check from g6 would hit h8.","hintFrom":"e5","explain":"Mate only happens if the defender makes a mistake.","solutions":["Ng6#"]},{"type":"mate2","fen":"7k/5K2/8/p2N4/5N2/8/8/8 w - - 0 1","prompt":"Same picture, but now Black has a pawn on a5. Checkmate in two.","hint":"Play the move that was stalemate before. Now Black must move the pawn.","hintFrom":"d5","explain":"Black's pawn saved you from stalemate. That is the surprise of two knights.","solutions":["Nf6"]}],"realSet":"Set up the stalemate picture and the pawn picture side by side on two boards (or one after the other). Felix explains to Dad why one is a draw and one is a win.","dad":"With no pawns, KNN vs K is a draw: the defender always has a non-losing move, and the 'trap' move stalemates. If the defender has a pawn, the stalemate defense disappears, which is why some KNN vs K+P positions are winning (the Troitsky line covers which pawn positions). No need to go deeper; the point is stalemate.","polgar":null},{"id":"e5","title":"Rule of the square","idea":["Can a king catch a pawn racing to become a queen? Draw a square to find out.","Make a square from the pawn to its last row. If the king can step into the square, it catches the pawn.","If the king cannot get in, the pawn becomes a queen."],"demo":{"fen":"8/8/8/8/1P6/5k2/8/7K w - - 0 1","steps":[{"text":"White's pawn on b4 wants to reach b8. Its square has corners b4, b8, f8 and f4.","marks":["b4","b8","f8","f4"]},{"text":"White to move: push the pawn, and the square shrinks. Black's king is too far away to get in."},{"san":"b5","text":"Now the square is b5, b8, e8, e5. Can Black's king on f3 step into it? No!","marks":["b5","b8","e8","e5"]},{"san":"Ke4","text":"The king tries, but e4 is outside the new square."},{"san":"b6","text":"The pawn keeps going and will become a queen."}]},"tries":[{"type":"kpk","goal":"win","fen":"8/8/8/8/1P6/5k2/8/7K w - - 0 1","prompt":"Win the race. Make a queen!","hint":"Your king is far away. The pawn has to run.","hintFrom":"b4","explain":"The king never got into the square."},{"type":"kpk","goal":"draw","fen":"8/8/8/8/1P6/5k2/8/7K b - - 0 1","survive":5,"prompt":"Now you are Black, and it is your move. Step into the square and catch the pawn.","hint":"The square is b4, b8, f8, f4. Which king move steps inside?","hintFrom":"f3","explain":"One move made all the difference: whoever moves first wins the race."}],"realSet":"Pawn races: put a White pawn and the Black king anywhere. Before moving, Felix guesses who wins by drawing the square in the air with his finger. Then play it out.","dad":"If the pawn is still on its starting square, draw the square from where it will be after the two-step move. And the side to move matters: with the defender to move, it can step in one move later. This rule decides huge numbers of kids' endgames.","polgar":null},{"id":"e6","title":"Opposition","idea":["When two kings stand face to face with one square between them, they are in opposition.","The side that does NOT have to move wins the standoff, because the other king must step aside.","Taking the opposition is how a king pushes through, or how a defender holds the line."],"demo":{"fen":"8/8/4k3/8/3K4/4P3/8/8 w - - 0 1","steps":[{"text":"White wants to get the king in front of the pawn. The Black king is in the way."},{"san":"Ke4","text":"Ke4! Now the kings face each other on the e-file, and it is Black's turn. White has the opposition.","marks":["e4","e6"]},{"san":"Kd6","text":"Black has to step aside."},{"san":"Kf5","text":"White's king walks forward past the Black king."}]},"tries":[{"type":"kpk","goal":"win","fen":"8/8/4k3/8/3K4/4P3/8/8 w - - 0 1","prompt":"Take the opposition, then win the game. The computer defends perfectly.","hint":"Put your king face to face with Black's king, one square between, with Black to move.","hintFrom":"d4","explain":"Opposition, then king forward, then queen."},{"type":"kpk","goal":"draw","fen":"4k3/8/8/4K3/4P3/8/8/8 b - - 0 1","survive":6,"prompt":"You are Black. Hold the draw by taking the opposition.","hint":"Stand face to face with White's king, one square between.","hintFrom":"e8","explain":"The defender used the opposition to stop the king. Draw."}],"realSet":"Kings only, face to face. Whoever has to move loses the standoff and must step aside. Play \"king tag\" where the goal is to reach the other side.","dad":"Direct opposition: same file (or rank), one square between, opponent to move. With king and pawn vs king, the attacker needs the king in front of the pawn and the opposition (or a king on the 6th rank in front of the pawn, which wins regardless). The defender's mirror rule: when the pawn advances, stay directly in front of it and take the opposition.","polgar":null},{"id":"e7","title":"King in front","idea":["In a king and pawn ending, your king should lead the way, not follow the pawn.","A king in front of its pawn clears the path and takes squares from the defender.","If your king reaches the 6th row in front of the pawn, you win no matter whose turn it is."],"demo":{"fen":"4k3/8/4K3/4P3/8/8/8/8 w - - 0 1","steps":[{"text":"White's king is on the 6th row, right in front of the pawn. This is a win."},{"san":"Kd6","text":"Step aside, keeping control of the squares in front of the pawn."},{"san":"Kd8","text":"Black takes the opposition."},{"san":"e6","text":"Now the pawn moves up."},{"san":"Ke8","text":"Black blocks."},{"san":"e7","text":"Now Black has only one legal move."},{"san":"Kf7","text":"Black's only move."},{"san":"Kd7","text":"White's king guards e8. The pawn will become a queen."}]},"tries":[{"type":"kpk","goal":"win","fen":"8/4k3/8/8/4K3/4P3/8/8 w - - 0 1","prompt":"Lead with your king, then win the game.","hint":"Move your king forward, not your pawn.","hintFrom":"e4","explain":"King first, pawn second. That is the rule."},{"type":"kpk","goal":"win","fen":"4k3/8/4K3/4P3/8/8/8/8 w - - 0 1","prompt":"Your king is on the 6th row. Finish the job and make a queen.","hint":"Your king should guard the square in front of the pawn.","hintFrom":"e6","explain":"King on the 6th in front of the pawn wins every time."}],"realSet":"Set up king and pawn vs king with the White king behind the pawn. Then set it up with the king in front. Play both and see which one wins.","dad":"Key squares: for a pawn on the 2nd to 4th rank, the key squares are the three squares two ranks ahead of it; if the attacking king reaches any of them, it wins (except with a rook pawn). Pushing the pawn too early is the classic mistake: the defender gets in front and takes the opposition.","polgar":null},{"id":"e8","title":"Rook pawns are tricky","idea":["A pawn on the a-file or h-file is called a rook pawn.","If the defending king gets to the corner in front of it, the game is a draw, even if the other king is close.","The attacker keeps getting stuck in stalemate."],"demo":{"fen":"1k6/8/1K6/P7/8/8/8/8 w - - 0 1","steps":[{"text":"White's king is close, but Black's king is near the corner."},{"san":"a6","text":"The pawn moves up."},{"san":"Ka8","text":"Black's king hides in the corner."},{"san":"a7","text":"Black has no legal move and is not in check. Stalemate! A draw."}]},"tries":[{"type":"kpk","goal":"draw","fen":"3k4/8/1K6/8/P7/8/8/8 b - - 0 1","survive":6,"prompt":"You are Black. Head for the corner and hold the draw.","hint":"Which corner is in front of the a-pawn?","hintFrom":"d8","explain":"Once you reach the corner, White can never win."},{"type":"kpk","goal":"draw","fen":"2k5/8/1K6/8/P7/8/8/8 b - - 0 1","survive":6,"prompt":"Black again. Find the only move that holds.","hint":"Get to the corner, even if it means stepping next to the pawn's path.","hintFrom":"c8","explain":"The corner is a fortress against a rook pawn."}],"realSet":"Set up a rook pawn race on the real board. Felix plays the defender and tries to reach the corner. Then switch.","dad":"With a rook pawn, the defender draws if his king reaches the queening corner, because the attacker cannot drive it out without stalemate. That makes rook pawns the weakest pawns in many endings, which is worth remembering when choosing which pawns to trade.","polgar":null}]},{"id":"p5","num":5,"title":"Three Simple Openings","blurb":"Plans, not memorizing. The Italian Game as White, 1...e5 against 1.e4, and 1...d5 against 1.d4.","lessons":[{"id":"o1","title":"Italian Game (White)","idea":["The Italian Game uses every rule from Part 1: center pawn, knight out, bishop out, castle.","White's bishop goes to c4 and aims at f7, the weakest square next to Black's king.","You don't need to memorize long lines. Learn the first six moves and why each one is played."],"demo":{"steps":[{"san":"e4","text":"A pawn in the center. It also opens lines for the queen and bishop."},{"san":"e5","text":"Black takes a share of the center."},{"san":"Nf3","text":"A knight comes out and attacks the e5 pawn.","arrows":[["f3","e5"]]},{"san":"Nc6","text":"Black defends e5 with a knight."},{"san":"Bc4","text":"The Italian bishop. It aims at f7.","arrows":[["c4","f7"]]},{"san":"Bc5","text":"Black copies the idea, aiming at f2. This is the Giuoco Piano, Italian for \"quiet game\"."}],"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},"tries":[{"type":"line","side":"w","prompt":"Play White's moves of the Italian Game. The computer plays Black.","line":[{"san":"e4","why":"Center pawn first.","hint":"Start with a center pawn in front of the king."},{"san":"e5","why":"Black grabs the center too."},{"san":"Nf3","why":"Knight out, attacking e5.","hint":"Bring out a knight that attacks e5."},{"san":"Nc6","why":"Black guards e5."},{"san":"Bc4","why":"Bishop out, aiming at f7.","hint":"Your bishop wants to aim at f7."},{"san":"Bc5","why":"Black's bishop aims at f2."},{"san":"c3","why":"Gets ready to push d4 later.","hint":"A small pawn move that prepares d4."},{"san":"Nf6","why":"Black's other knight comes out and eyes e4."},{"san":"d3","why":"Guards e4 and lets the c1 bishop out.","hint":"Protect your e4 pawn with a pawn."},{"san":"d6","why":"Black guards e5 the same way."},{"san":"O-O","why":"King safe. Ready for the middle of the game.","hint":"Make your king safe."},{"san":"O-O","why":"Black castles too."}],"explain":"Center, knight, bishop, castle. That is the whole plan.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"move","prompt":"Black plays Nf6 instead of Bc5 and attacks your e4 pawn. Protect it calmly.","answers":["d3","Nc3"],"notes":{"Ng5":"That is a famous attacking line, but it gets tricky fast. Keep it calm: just guard e4."},"hint":"Guard e4 with a pawn or a knight.","hintFrom":"d2","explain":"Calm and solid. Your plan stays the same: c3, castle.","fen":"r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4"},{"type":"line","side":"w","prompt":"Same plan against Black's Nf6. Play White's moves.","line":[{"san":"e4","why":"Center pawn.","hint":"Same start as always."},{"san":"e5","why":"Black takes the center too."},{"san":"Nf3","why":"Knight attacks e5.","hint":"Knight out, aimed at e5."},{"san":"Nc6","why":"Black guards e5."},{"san":"Bc4","why":"Bishop to c4.","hint":"The Italian bishop."},{"san":"Nf6","why":"Black attacks e4 with a knight."},{"san":"d3","why":"Guard e4 with a pawn.","hint":"Your e4 pawn is attacked. Guard it with a pawn."},{"san":"Be7","why":"Black gets ready to castle."},{"san":"O-O","why":"King safe.","hint":"Make your king safe."},{"san":"O-O","why":"Black castles too."},{"san":"c3","why":"Room for the bishop to retreat, and ready for d4 later.","hint":"Same small pawn move as before."},{"san":"d6","why":"Black guards e5."}],"explain":"Same setup against a different Black move. That is why plans beat memorizing.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"}],"realSet":"Play the Italian Game against Dad for the first six moves. Dad tries different Black moves. Felix says the reason for each of his moves out loud.","dad":"The Giuoco Piano / Giuoco Pianissimo setup (c3, d3, O-O) is what many coaches teach first: it follows the opening principles and avoids sharp theory. The 4.Ng5 lines against the Two Knights (Fried Liver territory) are exciting but tactically heavy; save them for later.","polgar":null},{"id":"o2","title":"Answering 1.e4 (Black)","idea":["When White opens with 1.e4, answer with 1...e5. You get your own center pawn.","Then the same rules: knights out, bishops out, castle.","If White's bishop goes to b5 instead of c4, that is the Spanish Game. Ask it a question with a6."],"demo":{"steps":[{"san":"e4","text":"White opens with the king's pawn."},{"san":"e5","text":"Black answers in the center."},{"san":"Nf3","text":"White's knight attacks e5."},{"san":"Nc6","text":"Black guards e5 and develops at the same time."},{"san":"Bb5","text":"This is the Spanish Game, also called the Ruy Lopez. The bishop attacks the knight that guards e5."},{"san":"a6","text":"Black asks the bishop: are you going to take, or go back?"}],"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},"tries":[{"type":"line","side":"b","prompt":"Play Black against the Italian Game. The computer plays White.","line":[{"san":"e4","why":"White starts in the center."},{"san":"e5","why":"Your own center pawn.","hint":"Match White in the center."},{"san":"Nf3","why":"White attacks e5."},{"san":"Nc6","why":"Guard e5 and develop.","hint":"Guard e5 with a knight."},{"san":"Bc4","why":"White aims at f7."},{"san":"Bc5","why":"Your bishop aims at f2.","hint":"Copy the idea with your own bishop."},{"san":"O-O","why":"White castles."},{"san":"Nf6","why":"Last piece before castling.","hint":"Bring out your other knight."},{"san":"d3","why":"White guards e4."},{"san":"d6","why":"Guard e5 and open your c8 bishop.","hint":"Guard e5 with a pawn."},{"san":"c3","why":"White prepares d4."},{"san":"O-O","why":"King safe.","hint":"Make your king safe."}],"explain":"You played the same good moves as White, from the other side.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"line","side":"b","prompt":"Now White plays the Spanish Game. Play Black.","line":[{"san":"e4","why":"White starts in the center."},{"san":"e5","why":"Center pawn.","hint":"Same first move."},{"san":"Nf3","why":"White attacks e5."},{"san":"Nc6","why":"Guard e5.","hint":"Guard e5 with a knight."},{"san":"Bb5","why":"The Spanish bishop attacks your knight."},{"san":"a6","why":"Ask the bishop a question.","hint":"Push a pawn to attack the bishop."},{"san":"Ba4","why":"White keeps the bishop."},{"san":"Nf6","why":"Develop and attack e4.","hint":"Your other knight comes out."},{"san":"O-O","why":"White castles."},{"san":"Be7","why":"Get ready to castle.","hint":"Bishop out, short and safe."},{"san":"Re1","why":"White guards e4 with the rook."},{"san":"b5","why":"Chase the bishop away.","hint":"Push another pawn at the bishop."},{"san":"Bb3","why":"The bishop retreats."},{"san":"O-O","why":"King safe.","hint":"Make your king safe."}],"explain":"The Spanish Game is one of the oldest openings in chess, and you just played it.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"move","prompt":"White's queen and bishop both aim at f7. Stop the checkmate threat.","answers":["Nf6","Qf6","Qe7"],"notes":{"d6":"Then Qxf7 is checkmate!","Nd4":"That attacks the queen, but Qxf7 is still checkmate."},"hint":"Block the queen's line to f7, or guard f7.","hintFrom":"g8","explain":"Nf6 is best: it blocks the queen and develops a piece.","fen":"r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR b KQkq - 3 3"}],"realSet":"Dad plays White and mixes the Italian and the Spanish. Felix plays Black and must reach castling without losing a pawn.","dad":"1...e5 lines are the most instructive for kids because they lead to open, tactical positions where development matters. The early-queen tries (Qh5, Qf3 with Bc4) are what he will see constantly on chess.com, so drill the defense. The Spanish line here is the main Closed Ruy Lopez setup, kept short.","polgar":null},{"id":"o3","title":"Answering 1.d4 (Black)","idea":["When White opens with 1.d4, answer with 1...d5. Again, your own center pawn.","If White pushes c4 (the Queen's Gambit), keep your center strong with e6.","Then knights out, bishops out, castle. Same rules, different pawns."],"demo":{"steps":[{"san":"d4","text":"White opens with the queen's pawn."},{"san":"d5","text":"Black answers in the center."},{"san":"c4","text":"The Queen's Gambit. White offers the c-pawn to pull Black's d-pawn away from the center."},{"san":"e6","text":"Black says no thanks and guards d5. This is the Queen's Gambit Declined."}],"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},"tries":[{"type":"line","side":"b","prompt":"Play Black against the Queen's Gambit.","line":[{"san":"d4","why":"White starts in the center."},{"san":"d5","why":"Your own center pawn.","hint":"Match White in the center."},{"san":"c4","why":"The Queen's Gambit attacks d5."},{"san":"e6","why":"Guard d5 with a pawn.","hint":"Guard d5 with a pawn and open your bishop."},{"san":"Nc3","why":"White adds pressure on d5."},{"san":"Nf6","why":"Develop and guard d5 again.","hint":"A knight that also guards d5."},{"san":"Bg5","why":"White pins your knight to the queen."},{"san":"Be7","why":"Break the pin and get ready to castle.","hint":"Put a piece between the pinned knight and your queen."},{"san":"e3","why":"White opens a path for the other bishop."},{"san":"O-O","why":"King safe.","hint":"Make your king safe."},{"san":"Nf3","why":"White develops."},{"san":"Nbd7","why":"Last knight out. It supports the center.","hint":"Your b8 knight comes out, behind the pawns."}],"explain":"The Queen's Gambit Declined is a solid setup used by world champions.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"line","side":"b","prompt":"Now White plays the London System, with the bishop on f4. Play Black.","line":[{"san":"d4","why":"White starts in the center."},{"san":"d5","why":"Center pawn.","hint":"Same first move."},{"san":"Bf4","why":"The London bishop comes out early."},{"san":"Nf6","why":"Develop a knight.","hint":"Knight out toward the center."},{"san":"e3","why":"White guards d4."},{"san":"e6","why":"Open your bishop's path.","hint":"A small pawn move that opens your f8 bishop."},{"san":"Nf3","why":"White develops."},{"san":"Bd6","why":"Challenge White's bishop.","hint":"Put your bishop face to face with White's bishop."},{"san":"Bd3","why":"White develops instead of trading."},{"san":"O-O","why":"King safe.","hint":"Make your king safe."},{"san":"O-O","why":"White castles too."},{"san":"c5","why":"Attack White's center.","hint":"Hit d4 with your c-pawn."}],"explain":"Same rules against a different setup. Then hit the center with c5.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"move","prompt":"White's knight just grabbed your d5 pawn. It looks like your knight can't take back, because the bishop would take your queen. Look closer!","answers":["Nxd5"],"hint":"After Bxd8, your bishop has a check on b4.","hintFrom":"f6","explain":"If Bxd8, then Bb4+ Qd2 Bxd2+ Kxd2 Kxd8, and you are a piece ahead. This is the Elephant Trap.","fen":"r1bqkb1r/pppn1ppp/5n2/3N2B1/3P4/8/PP2PPPP/R2QKBNR b KQkq - 0 6"}],"realSet":"Dad plays 1.d4 openings: sometimes the Queen's Gambit, sometimes the London. Felix plays Black and must castle by move 8.","dad":"1...d5 with ...e6 (QGD structure) is solid and principled. The Elephant Trap is a real trap that catches club players: after 6.Nxd5? Nxd5! 7.Bxd8 Bb4+ 8.Qd2 Bxd2+ 9.Kxd2 Kxd8 Black is up a piece. When he is ready, the French Defense upgrade (1.e4 e6 2.d4 d5) uses many of these same pawn ideas.","polgar":null}]},{"id":"p6","num":6,"title":"Bonus Openings","blurb":"Dad's openings: the French Defense with its pawn-chain plans, and a Danish Gambit day.","lessons":[{"id":"u1","title":"French Defense","idea":["The French Defense answers 1.e4 with 1...e6, then 2...d5. Black builds a strong wall of pawns in the center.","It is quieter than 1...e5: fewer early tricks, more long-term plans.","White has three main ways to play against it: push e5, trade on d5, or bring the knight to c3."],"demo":{"steps":[{"san":"e4","text":"White starts in the center."},{"san":"e6","text":"The French. A small pawn step that gets ready for d5."},{"san":"d4","text":"White takes the whole center."},{"san":"d5","text":"Black hits e4. Now White must decide: push, trade, or defend."},{"san":"e5","text":"The Advance Variation. White grabs space. Black will attack this pawn chain from the side."}],"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},"tries":[{"type":"line","side":"b","prompt":"White pushes e5 (the Advance). Play Black.","line":[{"san":"e4","why":"White starts in the center."},{"san":"e6","why":"The French begins.","hint":"A small pawn step in front of your king."},{"san":"d4","why":"White takes the center."},{"san":"d5","why":"Hit e4.","hint":"Now challenge e4 with your d-pawn."},{"san":"e5","why":"White pushes past."},{"san":"c5","why":"Attack the base of White's pawn chain, d4.","hint":"Hit d4 with a pawn."},{"san":"c3","why":"White guards d4."},{"san":"Nc6","why":"A second attacker on d4.","hint":"Bring a knight to attack d4."},{"san":"Nf3","why":"White guards d4 again."},{"san":"Qb6","why":"A third attacker on d4, and it eyes b2 too.","hint":"Your queen can attack d4 and b2 at the same time."}],"explain":"Three Black pieces aim at d4. That is the French plan in one picture.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"line","side":"b","prompt":"White trades on d5 (the Exchange). Play Black.","line":[{"san":"e4","why":"White starts in the center."},{"san":"e6","why":"The French.","hint":"Same first move as always."},{"san":"d4","why":"White takes the center."},{"san":"d5","why":"Hit e4.","hint":"Challenge e4."},{"san":"exd5","why":"White trades pawns."},{"san":"exd5","why":"Take back. Now your c8 bishop is free!","hint":"Take back with a pawn."},{"san":"Nf3","why":"White develops."},{"san":"Nf6","why":"Develop.","hint":"Knight out."},{"san":"Bd3","why":"White develops."},{"san":"Bd6","why":"Develop, copying White.","hint":"Bishop out, ready to castle."},{"san":"O-O","why":"White castles."},{"san":"O-O","why":"King safe.","hint":"Make your king safe."}],"explain":"In the Exchange, the position is even and calm. Just develop and castle.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"line","side":"b","prompt":"White plays Nc3 (the Classical). Play Black.","line":[{"san":"e4","why":"White starts in the center."},{"san":"e6","why":"The French.","hint":"Same first move."},{"san":"d4","why":"White takes the center."},{"san":"d5","why":"Hit e4.","hint":"Challenge e4."},{"san":"Nc3","why":"White guards e4 with a knight."},{"san":"Nf6","why":"Attack e4 again.","hint":"Add a knight attack on e4."},{"san":"Bg5","why":"White pins your knight."},{"san":"Be7","why":"Break the pin.","hint":"Put a piece between the knight and your queen."},{"san":"e5","why" agonal is blocked by e6. This is the French Defense's problem bishop.","marks":["c8","e6"]}],"fen":"rnbqkbnr/ppp2ppp/4p3/3pP3/3P4/8/PPP2PPP/RNBQKBNR b KQkq - 0 3"},"tries":[{"type":"squares","prompt":"Tap the base of White's pawn chain.","targets":["d4"],"explain":"d4 holds up e5. Attack it and the whole chain wobbles.","fen":"rnbqkbnr/ppp2ppp/4p3/3pP3/3P4/8/PPP2PPP/RNBQKBNR b KQkq - 0 3"},{"type":"move","prompt":"Attack the base of the chain with a pawn.","answers":["c5"],"notes":{"f6":"That hits the head of the chain. Good idea later, but the base comes first."},"hint":"Which pawn can hit d4?","hintFrom":"c7","explain":"c5 is the classic French move.","fen":"rnbqkbnr/ppp2ppp/4p3/3pP3/3P4/8/PPP2PPP/RNBQKBNR b KQkq - 0 3"},{"type":"squares","prompt":"Tap Black's problem bishop, the one stuck behind its own pawns.","targets":["c8"],"explain":"Its diagonal is blocked by e6. Plans for it: b6 and Ba6, or Bd7 then e8 and h5.","fen":"rnbqkbnr/pp3ppp/4p3/2ppP3/3P4/8/PPP2PPP/RNBQKBNR w KQkq c6 0 4"},{"type":"move","prompt":"Pile up on d4. Find a move that adds a third attacker.","answers":["Qb6"],"hint":"Your queen can join the attack, and hit b2 too.","hintFrom":"d8","explain":"Pawn, knight and queen all hit d4.","fen":"r1bqkbnr/pp3ppp/2n1p3/2ppP3/3P4/2P2N2/PP3PPP/RNBQKB1R b KQkq - 2 5"}],"realSet":"Set up the pawns from the Advance French on the real board, no pieces. Felix points to the base and the head of each chain, for both sides.","dad":"Nimzowitsch's rule: attack a pawn chain at its base. In the Advance French, Black hits d4 with ...c5, ...Nc6, ...Qb6 and sometimes ...Nge7-f5. The ...f6 break against e5 comes later. This is the clearest way to teach Felix that strategy means pushing on one target for many moves.","polgar":null},{"id":"u3","title":"Danish Gambit day","idea":["A gambit gives away pawns to get your pieces out faster.","In the Danish, White gives up two pawns. In return, both bishops point straight at Black's king.","It is great fun to play, and it teaches why fast development matters so much."],"demo":{"steps":[{"san":"e4","text":"Center pawn."},{"san":"e5","text":"Black answers."},{"san":"d4","text":"White offers a pawn right away."},{"san":"exd4","text":"Black takes."},{"san":"c3","text":"The Danish Gambit: another pawn offered."},{"san":"dxc3","text":"Black takes again."},{"san":"Bc4","text":"White develops instead of taking back. A third pawn is on offer!"},{"san":"cxb2","text":"Black grabs it."},{"san":"Bxb2","text":"Look at White's bishops: one aims at f7, one at g7. Black is ahead in pawns, but White is way ahead in development.","arrows":[["c4","f7"],["b2","g7"]]}],"fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},"tries":[{"type":"line","side":"w","prompt":"Play the Danish Gambit as White.","line":[{"san":"e4","why":"Center pawn.","hint":"Start in the center."},{"san":"e5","why":"Black answers."},{"san":"d4","why":"Offer the first pawn.","hint":"Push your other center pawn two squares."},{"san":"exd4","why":"Black takes."},{"san":"c3","why":"Offer a second pawn.","hint":"Offer another pawn next to it."},{"san":"dxc3","why":"Black takes."},{"san":"Bc4","why":"Develop and aim at f7.","hint":"Don't take back. Bring out a bishop."},{"san":"cxb2","why":"Black grabs a third pawn."},{"san":"Bxb2","why":"Take back with the other bishop, aiming at g7.","hint":"Take back with a bishop."},{"san":"d6","why":"Black blocks the center."},{"san":"Nf3","why":"Develop.","hint":"Knight out."},{"san":"Nc6","why":"Black develops."},{"san":"O-O","why":"King safe, rook ready to join the attack.","hint":"Make your king safe."}],"explain":"Two pawns down, but every White piece is ready to attack.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"type":"move","prompt":"Your bishops point at f7 and g7. Strike!","answers":["Bxf7+","Bxg7"],"notes":{"O-O":"Safe, but there is something sharper. Look at f7 and g7."},"hint":"Take a pawn next to Black's king.","hintFrom":"c4","explain":"After Bxf7+ Kxf     (o.found || []).forEach(sq => { const [x, y] = sqXY(sq, orient); s += `<circle class="pop" cx="${x * 100 + 50}" cy="${y * 100 + 50}" r="40" fill="none" stroke="#2f6b45" stroke-width="9"/>`; });

  let ok = false, note = null;
  if (t.type === 'move') { ok = t.answers.map(norm).includes(san); note = noteFor(t, san); }
  else if (t.type === 'mate') { ok = g.in_checkmate(); note = ok ? null : (g.in_check() ? 'Check, but the king can still escape or be saved. Look for a check it cannot get out of.' : 'That is not check. Checkmate starts with a check.'); }
  else if (t.type === 'avoid') { ok = !t.bad.map(norm).includes(san); note = ok ? null : t.badNote; }
  else if (t.type === 'stopmate') {
    const m2 = mates(g); ok = m2.length === 0;
    note = ok ? null : `Then ${sideName(g.turn())} plays ${m2[0]}, checkmate. Find a move that stops it.`;
  } else if (t.type === 'mate2') {
    if (V.phase === 1) {
      ok = (t.solutions || []).map(norm).includes(san);
      if (ok) {
        V.busy = true; V.fb = { kind: 'good', text: 'Good first move! Now watch the reply.' }; drawTry();
        setTimeout(() => {
          const replies = g.moves(); const r = g.move(replies[Math.floor(Math.random() * replies.length)]);
          V.last = { from: r.from, to: r.to }; V.phase = 2; V.busy = false; V.sel = null;
          V.fb = { kind: 'hint', text: `${sideName(r.color)} played ${r.san}. Now finish it: checkmate!` };
          drawTry();
        }, reduced() ? 150 : 700);
        return;
      }
      note = mates(g).length ? null : null;
      note = 'That does not lead to mate in two. Think about checks first.';
    } else { ok = g.in_checkmate(); note = ok ? null : 'Not checkmate yet. The king has a way out.'; }
  }
  else if (t.type === 'play') {
    if (g.in_checkmate()) ok = true;
    else if (g.in_stalemate()) note = 'Stalemate! The king has no moves but is not in check. That is a draw. Leave him a square until you give check.';
    else {
      const grab = g.moves({ verbose: true }).find(x => x.captured);
      if (grab) note = `Careful! The king could take your ${PIECE_NAME[grab.captured]}. Keep your pieces guarded or far away.`;
      else {
        V.used++;
        if (V.used >= t.limit) { V.over = true; V.fb = { kind: 'bad', text: `That was move ${t.limit} and no checkmate yet. Tap Start over and try a faster plan.` }; drawTry(); return; }
        computerMove(() => loneKingReply(g), null); return;
      }
    }
  } else if (t.type === 'line') {
    const exp = t.line[V.li];
    if (exp && norm(exp.san) === san) {
      V.li++; V.hinted = false;
      const said = `${mv.san}. ${exp.why}`;
      if (V.li >= t.line.length) { V.solved = true; V.fb = { kind: 'good', text: `${said} ${t.explain}` }; drawTry(); return; }
      lineReply(said); return;
    }
    note = noteFor(t, san) || 'A fine-looking move, but not the one for this opening. Tap Hint if you are stuck.';
  } else if (t.type === 'kpk') {
    const res = kpkResult(g, mv);
    if (t.goal === 'win') {
      if (res !== 'win') note = mv.captured ? 'Oops.' : (mv.promotion ? 'The king can take your new queen. Guard the square first.' : 'That lets Black hold a draw. Try a different move.');
      else if (mv.promotion) ok = true;
      else { computerMove(() => kpkReply(g), null); return; }
    } else {
      if (res !== 'draw') note = 'That lets White win. Try a different square.';
      else if (mv.captured || g.in_stalemate()) ok = true;
      else {
        V.held++;
        if (V.held >= t.survive) ok = true;
        else { computerMove(() => kpkReply(g), () => { if (g.in_stalemate()) return 'Stalemate! You held the draw.'; return null; }); return; }
      }
    }
  }
  note = noteFor(t, san) || note;
  if (ok) {
    V.solved = true; V.fb = { kind: 'good', text: (t.type === 'mate' || t.type === 'mate2' || t.type === 'play') ? `Checkmate! ${t.explain}` : (t.type === 'kpk' && t.goal === 'win') ? `A new queen! ${t.explain}` : t.explain };
    drawTry(); return;
  }
  V.misses++; V.busy = true;
  V.fb = { kind: 'bad', text: note || 'Not quite. Try again.' };
  drawTry(); V.board.shake();
  setTimeout(() => { g.undo(); V.last = null; V.busy = false; drawTry(); }, reduced() ? 400 : 1100);
}

function computerMove(pick, afterCheck) {
  const g = V.g;
  V.busy = true; V.sel = null; V.fb = null; drawTry();
  setTimeout(() => {
    if (!V || V.g !== g) return;
    const m = g.move(pick());
    if (m) V.last = { from: m.from, to: m.to };
    V.busy = false;
    const msg = afterCheck && afterCheck();
    if (msg) { V.solved = true; V.fb = { kind: 'good', text: msg + ' ' + V.t.explain }; }
    drawTry();
  }, reduced() ? 150 : 550);
}
function bestKpkMove(g, goal) {
  let best = null, bestS = -1e9;
  for (const m of g.moves({ verbose: true })) {
    g.move(m); const res = kpkResult(g, m); const d = kpkDepth(g); g.undo();
    let s;
    if (goal === 'win') s = res === 'win' ? (m.promotion ? 1000 : 500 - d) : -1;
    else s = res === 'draw' ? (m.captured ? 100 : 10) : -1;
    if (s > bestS) { bestS = s; best = m; }
  }
  return best;
}
function showMe() {
  const t = V.t, g = V.g;
  V.shown = true;
  if (t.type === 'line') {
    const h = new Chess(g.fen()); const m = h.move(t.line[V.li].san);
    if (m) tryMove({ from: m.from, to: m.to, promotion: 'q' });
    return;
  }
  if (t.type === 'kpk') {
    const m = bestKpkMove(g, t.goal);
    if (m) { V.fb = { kind: 'hint', text: `Try ${m.san}.` }; tryMove({ from: m.from, to: m.to, promotion: 'q' }); }
    return;
  }
  if (t.type === 'squares') { V.found = t.targets.slice(); V.solved = true; V.fb = { kind: 'hint', text: t.explain }; drawTry(); return; }
  let san;
  if (t.type === 'move') san = t.answers[0];
  else if (t.type === 'mate' || (t.type === 'mate2' && V.phase === 2)) san = mates(g)[0];
  else if (t.type === 'mate2') san = t.solutions[0];
  else if (t.type === 'stopmate') san = g.moves().find(m => { g.move(m); const bad = mates(g).length > 0; g.undo(); return !bad; });
  else if (t.type === 'avoid') san = g.moves().find(m => !t.bad.map(norm).includes(norm(m)));
  const mv = g.move(san); V.last = { from: mv.from, to: mv.to };
  if (t.type === 'mate2' && V.phase === 1) {
    const replies = g.moves(); const r = g.move(replies[0]); const fin = g.move(mates(g)[0]);
    V.fb = { kind: 'hint', text: `${mv.san}, then ${r.san}, then ${fin.san}. ${t.explain}` }; V.last = { from: fin.from, to: fin.to };
  } else V.fb = { kind: 'hint', text: `The move is ${mv.san}. ${t.explain}` };
  V.solved = true; drawTry();
}

showHome();
</script>
