<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1B2440"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Culture Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Culture Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Tifinagh&display=swap" rel="stylesheet">
<style>
  /* Layout: a pen pal club's corkboard. A pinned paper map is the home screen; zones are envelopes
     on the cork; every activity sits on a sheet of airmail paper. One committed light look (a kids' app). */
  :root {
    color-scheme: light;
    --cork: #C9A273; --cork-dk: #A87F52; --paper: #FFFCF4; --paper-2: #F3EDE0; --ink: #1B2440; --ink-2: #56607A;
    --rule: #DDD4C2; --red: #C8323A; --blue: #2650A8; --good: #2E8B3E; --good-bg: #E3F3E5; --miss: #B8572A; --miss-bg: #FBEBDD;
    --sea: #BFD7E6; --land: #EFE6CF; --coast: #B9A57E; --gold: #E0A82E;
    --f-display: "Shantell Sans", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
    --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-script: "Noto Sans Tifinagh", "PingFang SC", "Hiragino Sans GB", "Kohinoor Devanagari", "Devanagari Sangam MN", "Thonburi",
                "Arial Hebrew", "Geeza Pro", "Noto Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0; color: var(--ink); font: 400 17px/1.5 var(--f-body);
    background-color: var(--cork);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.10) 0 1.2px, transparent 1.6px),
      radial-gradient(circle at 70% 80%, rgba(80,50,20,.16) 0 1.4px, transparent 1.8px),
      radial-gradient(circle at 40% 60%, rgba(80,50,20,.10) 0 1px, transparent 1.4px);
    background-size: 23px 19px, 31px 27px, 17px 21px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 40px;
    -webkit-user-select: none; user-select: none;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
  h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
  p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* top bar */
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 16px;
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
    background: var(--ink); color: #fff; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
  .bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 6px;
    background: repeating-linear-gradient(-45deg, var(--red) 0 12px, #fff 12px 18px, var(--blue) 18px 30px, #fff 30px 36px); }
  .iconbtn { min-width: 48px; height: 48px; border-radius: 14px; border: 0; background: rgba(255,255,255,.12); display: grid; place-items: center; color: #fff; padding: 0 10px; }
  .iconbtn svg { width: 26px; height: 26px; }
  .bar h1 { font-size: 24px; font-weight: 800; flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dial { display: flex; background: rgba(255,255,255,.12); border-radius: 14px; padding: 4px; gap: 4px; }
  .dial button { border: 0; background: transparent; color: #fff; border-radius: 10px; min-height: 40px; padding: 0 10px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .dial button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .dial svg { width: 20px; height: 20px; }
  @media (max-width: 560px) { .dial .lbl { display: none; } .bar h1 { font-size: 19px; } .dial button { padding: 0 7px; } .iconbtn { min-width: 44px; height: 44px; padding: 0 8px; } }

  main { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .sheet { background: var(--paper); border-radius: 8px; padding: 18px; box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 8px 18px rgba(60,35,10,.22); position: relative; min-width: 0; }
  .pin { position: absolute; top: -9px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff8a8a, var(--red) 60%, #7d1218); box-shadow: 0 2px 3px rgba(0,0,0,.35); }

  /* home */
  .hello { display: flex; gap: 14px; align-items: flex-end; }
  .hello img { width: 96px; height: 112px; flex: none; }
  .bubble { background: var(--paper); border-radius: 18px; padding: 12px 16px; position: relative; box-shadow: 0 3px 10px rgba(60,35,10,.2); font-size: 18px; flex: 1; min-width: 0; }
  .bubble::before { content: ""; position: absolute; left: -10px; bottom: 18px; border: 10px solid transparent; border-right-color: var(--paper); border-left: 0; }
  .mapwrap { overflow-x: auto; }
  .map { display: block; width: 100%; min-width: 640px; height: auto; border-radius: 4px; }
  .map .pinbtn { cursor: pointer; }
  .map .pinbtn:focus { outline: none; }
  .map .pinbtn:focus-visible circle.ring { stroke: var(--blue); stroke-width: 4; }
  .zones { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .env { border: 0; text-align: left; background: var(--paper); border-radius: 8px; padding: 14px; min-height: 132px; position: relative; display: flex; gap: 10px; align-items: flex-start;
    box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 6px 14px rgba(60,35,10,.2); }
  .env::before { content: ""; position: absolute; inset: 0 0 auto; height: 7px; border-radius: 8px 8px 0 0;
    background: repeating-linear-gradient(-45deg, var(--red) 0 8px, transparent 8px 12px, var(--blue) 12px 20px, transparent 20px 24px); }
  .env img { width: 64px; height: 75px; flex: none; }
  .env h3 { font-size: 20px; }
  .env .sub { color: var(--ink-2); font-size: 14px; }
  .env.sealed { opacity: .62; cursor: default; }
  .env.sealed::after { content: "Coming soon"; position: absolute; right: 10px; bottom: 10px; font: 700 12px var(--f-body); color: var(--ink-2); background: var(--paper-2); border-radius: 99px; padding: 2px 8px; }
  .count { display: inline-flex; gap: 6px; align-items: center; margin-top: 6px; font-weight: 700; font-size: 14px; }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-2); }
  .dots i.on { background: var(--red); border-color: var(--red); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { border: 0; border-radius: 14px; min-height: 52px; padding: 0 18px; font-weight: 700; font-size: 17px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
  .btn.alt { background: var(--paper); color: var(--ink); box-shadow: 0 2px 8px rgba(60,35,10,.22); }
  .btn.red { background: var(--red); }

  /* zone page */
  .zonehead { display: flex; gap: 14px; align-items: center; }
  .zonehead img { width: 88px; height: 103px; flex: none; }
  .zonehead h2 { font-size: 30px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button { border: 0; border-radius: 99px; min-height: 48px; padding: 0 18px; font-weight: 700; background: var(--paper); box-shadow: 0 2px 6px rgba(60,35,10,.2); }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 2px solid var(--rule); background: var(--paper); border-radius: 99px; min-height: 48px; padding: 2px 12px 2px 4px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; }
  .chip img { width: 38px; height: 44px; }
  .chip[aria-pressed="true"] { border-color: var(--c, var(--ink)); background: var(--paper-2); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .big { font-family: var(--f-script); font-size: 46px; line-height: 1.25; font-weight: 600; overflow-wrap: anywhere; }
  .big.huge { font-size: 64px; }
  .sounds { font-weight: 700; color: var(--blue); letter-spacing: .02em; }
  .muted { color: var(--ink-2); font-size: 15px; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 99px; padding: 2px 9px; background: var(--paper-2); color: var(--ink-2); }
  .phr { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .phr div { background: var(--paper-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .phr .w { font-family: var(--f-script); font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
  .phr .e { font-size: 13px; color: var(--ink-2); }
  .feature { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: start; }
  .feature img { width: 150px; height: 175px; }
  @media (max-width: 560px) { .feature { grid-template-columns: 1fr; } .feature img { width: 120px; height: 140px; } }
  .ico { width: 56px; height: 56px; }
  .card .row > img { width: 84px; height: 98px; flex: none; }

  /* quiz */
  .quiz { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 18px; align-items: start; }
  .quiz .host img { width: 130px; height: 152px; }
  @media (max-width: 560px) { .quiz { grid-template-columns: 1fr; } .quiz .host img { width: 90px; height: 105px; } }
  .qtop { display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--ink-2); font-weight: 700; font-size: 14px; }
  .qtext { font: 700 23px/1.3 var(--f-display); margin-top: 6px; }
  .opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 14px; }
  .opt { border: 2px solid var(--rule); background: var(--paper); border-radius: 14px; min-height: 60px; padding: 8px 14px; font-weight: 700; font-size: 18px; text-align: left; display: flex; align-items: center; gap: 10px; }
  .opt img { width: 46px; height: 54px; flex: none; }
  .opt.script { font-family: var(--f-script); font-size: 30px; justify-content: center; }
  .opt.right { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong { border-color: var(--miss); background: var(--miss-bg); }
  .opt:disabled { cursor: default; }
  .explain { margin-top: 14px; border-radius: 12px; padding: 12px 14px; font-size: 17px; }
  .explain.good { background: var(--good-bg); }
  .explain.miss { background: var(--miss-bg); }
  .explain b { font-family: var(--f-display); }
  .wiggle { animation: wig .4s; }
  @keyframes wig { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .pop { animation: pop .35s; }
  @keyframes pop { 50% { transform: scale(1.06); } }

  /* stamps */
  .stamp { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; text-align: center; font: 800 11px/1.05 var(--f-display); text-transform: uppercase;
    border: 2.5px dashed var(--rule); color: var(--ink-2); transform: rotate(-10deg); }
  .stamp.on { border: 3px double var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--paper)); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--paper); border-radius: 16px; padding: 10px 16px 10px 10px;
    display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 26px rgba(0,0,0,.3); font-weight: 700; max-width: calc(100vw - 32px); }
  .toast .stamp { width: 54px; height: 54px; }
  .pages { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .page { background: var(--paper); border-radius: 8px; padding: 14px; box-shadow: 0 6px 14px rgba(60,35,10,.2); display: flex; flex-direction: column; gap: 10px; }
  .page .top { display: flex; gap: 10px; align-items: center; }
  .page .top img { width: 56px; height: 65px; }
  .page .stamps { display: grid; grid-template-columns: repeat(5, 48px); gap: 6px; justify-content: space-between; }
  .page .stamp { width: 48px; height: 48px; font-size: 9px; }

  /* charts */
  .chart { overflow-x: auto; }
  .wk { border-collapse: separate; border-spacing: 3px; font-size: 14px; }
  .wk th { font-weight: 700; color: var(--ink-2); padding: 2px 4px; text-align: center; }
  .wk td { width: 44px; height: 34px; border-radius: 6px; background: var(--paper-2); text-align: center; font-weight: 700; }
  .wk td.we { background: var(--c); color: #fff; }
  .wk td.name { width: auto; background: none; text-align: left; white-space: nowrap; padding-right: 8px; }
  .fest { display: grid; grid-template-columns: 150px repeat(12, minmax(26px, 1fr)); gap: 3px; min-width: 520px; font-size: 13px; align-items: center; }
  .fest .m { text-align: center; color: var(--ink-2); font-weight: 700; }
  .fest .bar2 { height: 22px; border-radius: 6px; background: var(--c); }
  .fest .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kwrap { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; margin-top: 12px; }
  .kcol { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .kstrip { display: flex; flex-direction: column; width: 70px; border-radius: 3px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .kstrip .kb { display: block; width: 70px; height: 46px; border: 0; padding: 0; border-bottom: 1px solid rgba(0,0,0,.18); }
  .kstrip.edit .kb { cursor: pointer; }
  .kstrip .kb.bad { outline: 3px solid var(--miss); outline-offset: -3px; }
  .kcloth { display: flex; gap: 0; box-shadow: 0 3px 10px rgba(0,0,0,.3); max-width: 100%; overflow-x: auto; }
  .kcloth .kstrip { width: 52px; box-shadow: none; border-radius: 0; border-right: 2px dashed rgba(255,255,255,.55); }
  .kcloth .kb { width: 52px; height: 24px; }
  .kpaint { display: flex; gap: 10px; align-items: center; text-align: left; border: 3px solid var(--rule); background: var(--paper); border-radius: 14px; padding: 6px 12px 6px 6px; min-height: 56px; }
  .kpaint i { width: 44px; height: 44px; border-radius: 8px; flex: none; }
  .kpaint[aria-pressed="true"] { border-color: var(--ink); background: var(--paper-2); }
  .loom { display: grid; gap: 3px; touch-action: manipulation; }
  .loom button { border: 0; border-radius: 3px; aspect-ratio: 1; min-width: 0; padding: 0; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; background: var(--paper-2); border-radius: 99px; padding: 4px 10px 4px 4px; }
  .sw i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); }
  .tally { display: grid; grid-template-columns: 70px minmax(0,1fr) 30px; gap: 6px 8px; align-items: center; font-size: 14px; }
  .tally .b { height: 18px; border-radius: 4px; }

  /* mission */
  .mission ol, .mission ul { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
  .check { display: flex; gap: 10px; align-items: center; min-height: 44px; }
  .check input { width: 26px; height: 26px; }
  .lvl { border-left: 4px solid var(--gold); padding: 6px 12px; background: #FFF6DE; border-radius: 0 10px 10px 0; }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(20,20,30,.5); z-index: 15; display: grid; place-items: center; padding: 16px; }
  .modal { width: min(560px, 100%); max-height: 90vh; overflow: auto; }
  .hold { position: relative; overflow: hidden; }
  .hold .fill { position: absolute; inset: 0; width: 0; background: rgba(255,255,255,.3); }

  /* batch 2 */
  .patwrap { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 16px; margin-top: 12px; align-items: start; }
  @media (max-width: 760px) { .patwrap { grid-template-columns: 1fr; } }
  .patwrap canvas { touch-action: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); max-width: 100%; }
  .owgame { display: flex; gap: 10px; align-items: center; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
  .owside { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
  .owside img { width: 70px; height: 82px; }
  .owstore { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; height: 96px; border-radius: 40px; background: #8A5A36; color: #FFE9C7; box-shadow: inset 0 3px 8px rgba(0,0,0,.4); }
  .owstore b { font: 800 26px var(--f-display); }
  .owboard { background: #A8723F; border-radius: 22px; padding: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 4px 10px rgba(0,0,0,.3); flex: none; }
  .owrow { display: grid; grid-template-columns: repeat(6, 64px); gap: 8px; }
  @media (max-width: 640px) { .owrow { grid-template-columns: repeat(6, 46px); gap: 5px; } .owh { height: 52px !important; } .owside img { width: 50px; height: 58px; } .owstore { width: 52px; height: 70px; } }
  .owh { height: 64px; border-radius: 50%; border: 0; background: #7A4E2A; box-shadow: inset 0 4px 8px rgba(0,0,0,.45); color: #FFE9C7; position: relative; padding: 4px; }
  .owh:not([disabled]) { background: #8E5C33; outline: 2px solid #FFD27A; outline-offset: -2px; }
  .owh.last { box-shadow: inset 0 4px 8px rgba(0,0,0,.45), 0 0 0 3px var(--gold); }
  .owh b { position: absolute; right: 6px; bottom: 2px; font-size: 13px; }
  .owh .seeds { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; align-content: center; height: 100%; }
  .owh .seeds i { width: 7px; height: 7px; border-radius: 50%; background: #E9D9B8; box-shadow: inset -1px -1px 0 rgba(0,0,0,.25); }
  .schart { display: grid; grid-template-columns: 80px minmax(360px, 1fr); gap: 6px 8px; align-items: center; min-width: 460px; }
  .saxis { position: relative; height: 20px; font-size: 12px; color: var(--ink-2); font-weight: 700; }
  .saxis span { position: absolute; transform: translateX(-50%); }
  .strack { position: relative; height: 22px; background: repeating-linear-gradient(90deg, var(--paper-2) 0 calc(100%/12 - 1px), var(--rule) calc(100%/12 - 1px) calc(100%/12)); border-radius: 4px; }
  .sbar { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; }
  .schart .nm { font-weight: 700; font-size: 14px; }
  .wallwrap { max-width: 100%; }
  .wall { border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 980px; }
  .wall th, .wall td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
  .wall th { font-family: var(--f-display); font-size: 15px; }
  .wall .rowh { position: sticky; left: 0; background: var(--paper); z-index: 1; white-space: nowrap; color: var(--ink-2); }
  .wall td { font-family: var(--f-script), var(--f-body); }
  .wall .mecol { background: #FFF6DE; }
  .wall input { font: inherit; width: 120px; min-height: 40px; border: 2px solid var(--rule); border-radius: 8px; padding: 0 8px; background: #fff; }
  .hbar { display: grid; grid-template-columns: 70px minmax(0, 1fr) 90px; gap: 8px; align-items: center; font-size: 14px; }
  .hbar div { background: var(--paper-2); border-radius: 6px; height: 24px; overflow: hidden; }
  .hbar i { display: block; height: 100%; border-radius: 6px; }
  .hbar b { text-align: right; font-variant-numeric: tabular-nums; }
  details summary { list-style-position: inside; }
  @media (prefers-reduced-motion: reduce) { .wiggle, .pop { animation: none; } * { transition: none !important; } }

  /* batch 3: mailbox + names */
  .pcgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .pcthumb { position: relative; border: 0; padding: 0; background: none; border-radius: 8px; box-shadow: 0 6px 14px rgba(60,35,10,.25); text-align: left; }
  .pcthumb .pcsvg { display: block; width: 100%; height: auto; border-radius: 8px; }
  .pcthumb.locked { background: var(--paper-2); padding: 12px; display: flex; gap: 10px; align-items: center; min-height: 140px; box-shadow: inset 0 0 0 2px var(--rule); }
  .pcthumb.locked img { width: 56px; height: 65px; flex: none; opacity: .55; filter: grayscale(.6); }
  .meter { height: 10px; background: var(--paper); border-radius: 99px; overflow: hidden; margin-top: 6px; box-shadow: inset 0 0 0 1px var(--rule); }
  .meter i { display: block; height: 100%; border-radius: 99px; }
