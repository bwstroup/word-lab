<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Felix's Time Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time Lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one scene-led home (Portal Mesa) over a sand page; each zone is a single column of big tiles.
   Committed single look: sunlit desert sand with purple dusk shadows and portal green. */
:root{
  --sand:#FFF4E0; --sand2:#F7E3C2; --dune:#F4A259; --clay:#E8742A; --rust:#C4511F;
  --dusk:#3A1F5C; --mesa:#6B3FA0; --lav:#B79CE0; --night:#1A1030;
  --glow:#3DF29A; --sag:#2E8B57; --oasis:#7BC96F; --ink:#3A2433; --ink2:#6E5562;
  --zone:var(--clay); --zoneSoft:#FBD8B8;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Avenir Next','Segoe UI',system-ui,sans-serif;
  --mono:'Share Tech Mono','SF Mono',ui-monospace,Menlo,monospace;
  --r:18px; color-scheme:light;
}
html,body{height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--dusk)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--mesa);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding-block:10px 40px;display:flex;flex-direction:column;gap:18px}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--sand);border-bottom:2px solid var(--sand2)}
.bar h1{font-size:clamp(20px,3.4vw,28px);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dusk)}
.iconbtn{width:52px;height:52px;border-radius:16px;border:none;background:var(--dusk);color:var(--sand);display:grid;place-items:center;flex:none}
.iconbtn svg{width:26px;height:26px}
.iconbtn.ghost{background:var(--sand2);color:var(--dusk)}
.starpill{display:flex;align-items:center;gap:6px;background:var(--dusk);color:#FFE7A8;border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:20px;flex:none}
.starpill svg{width:20px;height:20px}
/* scene */
.scene{border-radius:24px;overflow:hidden;position:relative;background:var(--dusk);box-shadow:0 10px 30px -14px rgba(58,31,92,.6)}
.scene svg{display:block;width:100%;height:auto}
.scene .loc{cursor:pointer}
.scene .loc:focus{outline:none}
.scene .loc:focus-visible .lbl rect{stroke:var(--glow);stroke-width:4}
.skychip{position:absolute;left:12px;top:12px;background:rgba(26,16,48,.72);color:var(--sand);border:none;border-radius:999px;padding:6px 12px;font-size:14px}
.hero{display:flex;flex-direction:column;gap:4px}
.hero h2{font-size:clamp(30px,6vw,52px);color:var(--dusk);line-height:1}
.hero p{color:var(--ink2);max-width:60ch}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{display:flex;gap:12px;align-items:center;text-align:left;border:none;border-radius:var(--r);padding:12px 14px;background:#fff;box-shadow:0 2px 0 var(--sand2),0 6px 16px -10px rgba(58,31,92,.4);min-height:84px;color:var(--ink)}
.tile .ic{width:58px;height:58px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--zoneSoft);color:var(--zone)}
.tile .ic svg{width:40px;height:40px}
.tile b{font-family:var(--display);font-weight:400;font-size:20px;display:block;color:var(--dusk)}
.tile small{color:var(--ink2);font-size:14px;display:block;line-height:1.3}
.tile:active{transform:translateY(1px)}
.tile.done .ic{box-shadow:inset 0 0 0 3px var(--glow)}
.tile.locked{background:var(--sand2);box-shadow:none;cursor:default}
.tile.locked .ic{background:#EBD4B0;color:var(--ink2)}
.tile.paper{background:#FFFBF3;border:2px dashed var(--zone)}
.zone-adobe{--zone:var(--clay);--zoneSoft:#FBDABD}
.zone-plaza{--zone:var(--mesa);--zoneSoft:#E6DAF6}
.zone-oasis{--zone:var(--sag);--zoneSoft:#D5F0CF}
.zone-night{--zone:var(--dusk);--zoneSoft:#DDD3EF}
.zone-portal{--zone:#1F7A5A;--zoneSoft:#D3F5E6}
.zone-tower{--zone:#2E6FB0;--zoneSoft:#D6E6F7}
.zone-rock{--zone:var(--rust);--zoneSoft:#FBDABD}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:560px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcell{min-height:84px;border:2px dashed var(--zone);border-radius:14px;background:var(--sand);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;font-size:15px;color:var(--dusk)}
.mcell small{font-size:12px;line-height:1.2;background:#fff;border-radius:8px;padding:2px 6px;font-weight:700}
.pool button[aria-pressed=true]{outline:3px solid var(--glow);outline-offset:2px}
.skyview .q{color:#FFF4E0}.skyview .sub{color:#B79CE0}
/* guide */
.guide{display:flex;gap:14px;align-items:flex-end}
.guide .pic{flex:none;width:118px;height:118px;border-radius:50%;background:var(--zoneSoft);display:grid;place-items:center;overflow:hidden}
.guide .pic svg{width:112px;height:112px}
.bubble{position:relative;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 4px 14px -8px rgba(58,31,92,.45);max-width:60ch;margin-bottom:14px;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble .who{font-family:var(--display);color:var(--zone);font-size:15px;letter-spacing:.04em}
/* activity */
.panel{background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 18px -12px rgba(58,31,92,.45);min-width:0}
.levels{display:flex;gap:6px;background:var(--sand2);padding:5px;border-radius:14px;align-self:flex-start;flex-wrap:wrap}
.levels button{border:none;background:transparent;border-radius:10px;padding:8px 14px;font-family:var(--display);font-size:17px;color:var(--ink2);min-height:44px}
.levels button[aria-pressed=true]{background:var(--zone);color:#fff}
.q{font-size:clamp(19px,2.6vw,24px);font-weight:700;color:var(--dusk);text-wrap:balance}
.sub{color:var(--ink2);font-size:15px}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.ans{border:none;border-radius:16px;min-height:64px;padding:10px 12px;background:var(--zoneSoft);font-size:20px;font-weight:700;color:var(--dusk)}
.ans.right{background:var(--glow);color:var(--night)}
.ans.wrong{background:#F3D0C4;color:#8a3a2a}
.big{border:none;border-radius:16px;min-height:60px;padding:12px 22px;background:var(--zone);color:#fff;font-family:var(--display);font-size:22px}
.big.alt{background:var(--sand2);color:var(--dusk)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.feedback{border-radius:14px;padding:12px 14px;background:var(--sand);border-left:6px solid var(--zone);min-height:1em}
.feedback.ok{border-left-color:var(--sag);background:#E7F7E3}
.feedback.no{border-left-color:var(--rust);background:#FBE6DC}
.progress{display:flex;gap:6px;align-items:center}
.progress i{width:14px;height:14px;border-radius:50%;background:var(--sand2);display:block}
.progress i.on{background:var(--zone)}
.progress i.ok{background:var(--sag)}
.chip{border:none;border-radius:12px;padding:8px 12px;min-height:46px;min-width:52px;background:var(--sand2);font-weight:700;font-size:18px;color:var(--dusk)}
.chip[aria-pressed=true]{background:var(--zone);color:#fff}
.mono{font-family:var(--mono)}
.wiggle{animation:wig .4s}
@keyframes wig{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.07)}}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{border:none;background:#fff;border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 0 var(--sand2);min-height:150px;color:var(--ink)}
.card svg{width:56px;height:56px;color:var(--zone)}
.card b{font-size:16px;line-height:1.2;color:var(--dusk)}
.card small{font-size:13px;color:var(--ink2)}
.card.seen{box-shadow:inset 0 0 0 3px var(--zoneSoft)}
.detail{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
.detail .art{width:120px;height:120px;border-radius:20px;background:var(--zoneSoft);display:grid;place-items:center;color:var(--zone)}
.detail .art svg{width:86px;height:86px}
.facts{display:grid;gap:8px}
.facts div{background:var(--sand);border-radius:12px;padding:10px 12px}
.facts b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--zone)}
/* order game */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.slot{min-height:92px;border-radius:14px;border:2px dashed var(--zone);background:var(--sand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;text-align:center;font-size:14px;font-weight:700;color:var(--dusk)}
.slot .n{font-family:var(--display);color:var(--zone);font-size:15px;font-weight:400}
.slot.filled{border-style:solid;background:#fff}
.slot.ok{border-color:var(--sag);background:#E7F7E3}
.slot.no{border-color:var(--rust);background:#FBE6DC}
.slot svg{width:34px;height:34px;color:var(--zone)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{border:none;border-radius:14px;background:var(--zoneSoft);padding:8px 12px;min-height:56px;display:flex;gap:8px;align-items:center;font-weight:700;color:var(--dusk);font-size:16px}
.pool button svg{width:32px;height:32px;color:var(--zone)}
.pool button[disabled]{opacity:.3}
/* stage svgs */
.stage{width:100%;max-width:640px;align-self:center;touch-action:none;user-select:none;-webkit-user-select:none}
.stage svg{width:100%;height:auto;display:block}
.board{background:var(--night);border-radius:16px;padding:12px;color:#FFD48A;font-family:var(--mono);display:grid;gap:6px;overflow-x:auto}
.board .r{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:6px 10px;border-radius:8px;background:#24173F;font-size:clamp(16px,2.6vw,22px);white-space:nowrap}
.board .r.hi{background:var(--mesa);color:#fff}
.board .h{color:var(--lav);font-size:13px;letter-spacing:.12em}
.timer{font-family:var(--mono);font-size:clamp(48px,12vw,96px);text-align:center;color:var(--dusk)}
.biground{width:min(260px,70vw);height:min(260px,70vw);border-radius:50%;border:none;align-self:center;background:var(--zone);color:#fff;font-family:var(--display);font-size:34px;box-shadow:0 10px 0 rgba(58,31,92,.25)}
.biground:active{transform:translateY(4px);box-shadow:0 6px 0 rgba(58,31,92,.25)}
table.t{border-collapse:collapse;font-variant-numeric:tabular-nums;width:100%;max-width:360px}
table.t td,table.t th{padding:6px 10px;border-bottom:1px solid var(--sand2);text-align:left}
table.t th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.scroll{overflow-x:auto}
/* badges */
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;font-weight:700;color:var(--dusk);opacity:.38}
.badge.on{opacity:1;box-shadow:0 0 0 2px var(--glow)}
.badge svg{width:30px;height:30px}
/* paper */
.paperlist{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.paperlist label{display:flex;gap:10px;align-items:center;background:var(--sand);border-radius:12px;padding:10px 12px;min-height:48px}
.paperlist input{width:24px;height:24px;accent-color:var(--zone)}
ol.steps{margin:0;padding-left:1.4em;display:grid;gap:8px}
.stamp{max-width:100%;border-radius:16px;border:6px solid #fff;box-shadow:0 6px 16px -8px rgba(58,31,92,.5);transform:rotate(-1.5deg)}
.filebtn{position:relative;overflow:hidden;display:inline-grid;place-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* overlay */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(26,16,48,.6);display:grid;place-items:center;padding:20px}
.overlay .box{background:var(--sand);border-radius:24px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.overlay .box h2{color:var(--dusk);font-size:30px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;color:var(--ink2);font-size:14px}
.link{background:none;border:none;color:var(--mesa);text-decoration:underline;padding:10px 0;min-height:44px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.zscene{border-radius:24px;overflow:hidden;box-shadow:0 10px 30px -14px rgba(58,31,92,.6)}
.zscene svg{display:block;width:100%;height:auto}
.bubble.solo{margin:-34px 0 0 12px;align-self:flex-start;z-index:1}
.bubble.solo::before{left:40px;top:-10px;bottom:auto;border:10px solid transparent;border-bottom-color:#fff;border-top:0}
.astrip{height:96px;border-radius:18px;overflow:hidden;margin-bottom:-24px;position:relative;z-index:0}
.astrip svg{width:100%;height:100%;display:block}
.panel{position:relative;z-index:1}
.tower{background:var(--clay);border-radius:46% 46% 18px 18px/34% 34% 18px 18px;padding:22px 18px 20px;box-shadow:inset 0 -10px 0 var(--rust)}
.race svg{width:100%;height:auto;display:block;border-radius:14px}
@media (max-width:560px){
  body{font-size:16px}
  .detail{grid-template-columns:1fr}
  .guide .pic{width:84px;height:84px}.guide .pic svg{width:80px;height:80px}
  .grid{grid-template-columns:1fr}
  .tile{min-height:76px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app" class="wrap" aria-live="polite"></div>
<script>
// Time Lab content, batch 1 (batch 2 adds Night Mesa near the end of this script). Every fact here goes through check.js and an independent review.
// year: negative = BCE. sortable:false keeps uncertain dates out of the ordering game.
const CLOCKS = [
  {id:'shadow', name:'Shadow clock', year:-1500, when:'about 3,500 years ago', where:'Ancient Egypt',
   how:'A stick or post casts a shadow. As the Sun crosses the sky, the shadow swings around and points to marks for the hours.',
   good:'Needs no power and never needs winding.', bad:'Useless at night and on cloudy days.',
   fact:'A sundial shows sun time. Even after you correct for where you live, sun time and clock time drift apart by up to about 16 minutes during the year.', acc:5, icon:'sundial'},
  {id:'water', name:'Water clock', year:-1400, sortable:false, when:'about 3,400 years ago', where:'Ancient Egypt',
   how:'Water drips out of a tiny hole in a stone bowl. Lines on the inside show how many hours have passed as the water level drops.',
   good:'Works at night and on cloudy days.', bad:'Water drips faster when the bowl is full, and it can freeze or evaporate.',
   fact:'The Greeks called it a clepsydra, which means "water thief."', acc:4, icon:'water'},
  {id:'candle', name:'Candle clock', year:520, when:'about 1,500 years ago', where:'China, and later England',
   how:'A candle with marks down its side burns at a steady speed. Each mark that melts away means another hour is gone.',
   good:'Simple, and works indoors at night.', bad:'A draft makes the flame burn faster and spoils the time.',
   fact:'King Alfred the Great of England is said to have used candle clocks, with lantern covers to keep drafts off them.', acc:3, icon:'candle', sortable:false},
  {id:'incense', name:'Incense clock', year:null, when:'more than 800 years ago', where:'China',
   how:'A slow-burning line of incense powder is laid in a maze-shaped tray. Some had threads with little weights that dropped onto a gong as the fire reached them, like an alarm.',
   good:'You could tell the time by smell, and even set an alarm.', bad:'Damp incense burns unevenly.',
   fact:'Different scents were sometimes used for different hours.', acc:3, icon:'incense', sortable:false},
  {id:'suSong', name:'Su Song’s clock tower', year:1088, when:'built 1088 to 1092', where:'Kaifeng, China',
   how:'A giant water wheel inside a tower turned a step at a time. It turned a sky-watching ring machine on the roof, a star globe inside, and little figures that rang bells and showed signs for the hours.',
   good:'It also tracked the stars for the emperor’s astronomers.', bad:'It was huge, more than 10 meters tall, and needed constant care.',
   fact:'Its step-by-step water wheel worked a bit like the ticking part of later mechanical clocks.', acc:4, icon:'tower'},
  {id:'tower', name:'Mechanical tower clock', year:1300, when:'about 1300', where:'Europe',
   how:'Heavy weights on ropes pull the gears around. A rocking part called an escapement lets the gears move only a little bit at a time: tick, tick, tick.',
   good:'Ran day and night, rain or shine, and rang bells for the whole town.', bad:'Early ones could be off by around 15 minutes a day.',
   fact:'Many early clocks had only an hour hand. Minutes were not that important yet!', acc:3, icon:'gears'},
  {id:'hourglass', name:'Hourglass', year:1338, sortable:false, when:'clearly painted by 1338', where:'Europe',
   how:'Sand runs through a narrow neck from the top bulb to the bottom one. When the top is empty, the time is up. Flip it to start again.',
   good:'Works on a rocking ship, where a water clock would slosh.', bad:'Only measures one amount of time, then must be flipped.',
   fact:'Sailors flipped half-hour glasses all day, and rang a bell each time. That is one reason ships ring bells every half hour.', acc:4, icon:'hourglass'},
  {id:'spring', name:'Spring-wound clock', year:1430, when:'about 600 years ago', where:'Europe',
   how:'A coiled metal spring stores energy when you wind it, then slowly unwinds to turn the gears. No hanging weights needed.',
   good:'Small enough to carry. The first pocket watches came from this idea.', bad:'A spring pulls hard when wound and weakly when nearly run down.',
   fact:'Winding a clock is really storing energy in a spring, like pulling back a slingshot.', acc:3, icon:'spring'},
  {id:'pendulum', name:'Pendulum clock', year:1656, when:'1656', where:'the Netherlands, by Christiaan Huygens',
   how:'A swinging weight takes the same time for every swing. The clock counts swings to keep time.',
   good:'Suddenly clocks were off by less than a minute a day.', bad:'Can’t work on a moving ship, because the rocking messes up the swing.',
   fact:'A pendulum about 1 meter long takes about 1 second for each swing.', acc:6, icon:'pendulum'},
  {id:'chrono', name:'Marine chronometer', year:1759, when:'1759', where:'England, by John Harrison',
   how:'A very steady watch carried on ships. Sailors compared noon at sea with the time back home to work out how far east or west they were.',
   good:'Saved sailors from getting lost at sea.', bad:'Very hard to make, and expensive.',
   fact:'On a test voyage to Jamaica, Harrison’s watch, called H4, was off by only about 5 seconds after 81 days.', acc:7, icon:'watch'},
  {id:'wrist', name:'Wristwatch', year:1810, when:'about 1810', where:'France, by Abraham-Louis Breguet',
   how:'A tiny spring-wound watch strapped to the wrist, so you can check the time without digging in a pocket.',
   good:'Hands-free! Pilots and soldiers made them popular in the early 1900s.', bad:'Early ones were thought of as jewelry for women.',
   fact:'One of the first wristwatches was made around 1810 for Caroline Murat, Queen of Naples.', acc:5, icon:'wrist'},
  {id:'quartz', name:'Quartz clock', year:1927, when:'1927', where:'USA, at Bell Labs',
   how:'A tiny crystal of quartz shakes, or vibrates, when electricity goes through it. A chip counts the shakes. Most watches use 32,768 shakes every second.',
   good:'Cheap and very accurate. Off by only about half a second a day.', bad:'Needs a battery.',
   fact:'32,768 is 2 multiplied by itself 15 times, which makes it easy for a chip to count down to exactly 1 second.', acc:8, icon:'quartz'},
  {id:'atomic', name:'Cesium atomic clock', year:1955, when:'1955', where:'England, by Louis Essen and Jack Parry',
   how:'Atoms of a metal called cesium flip back and forth at an exact speed: 9,192,631,770 times each second. The clock counts those flips.',
   good:'Off by only about 1 second in 300 years, even the first one.', bad:'Big, delicate and costly.',
   fact:'Since 1967, the official length of 1 second has been defined by those cesium flips.', acc:9, icon:'atom'},
  {id:'gps', name:'GPS satellites', year:1978, when:'first launched 1978', where:'USA',
   how:'Satellites high above Earth each carry atomic clocks and send out time signals. Your phone compares the signals to work out where you are.',
   good:'Gives the exact time and your location almost anywhere on Earth.', bad:'Needs a clear view of the sky.',
   fact:'Because they move so fast and sit so high up, the satellites’ clocks run a tiny bit differently from clocks on the ground. Einstein’s ideas are used to correct them.', acc:9, icon:'satellite'},
  {id:'optical', name:'Optical clock', year:2000, when:'2000s to today', where:'labs around the world',

function bar(title,back){

// Quiz runner: rounds=[{q,sub,html,answers:[{label,right,why}]}]
function runQuiz(host,makeRounds,opts){
  let rounds=makeRounds(), i=0, res=[], firstTry=true;
  function show(){
    const r=rounds[i];
    host.innerHTML=`${dots(rounds.length,i,res)}${r.html||''}<p class="q">${r.q}</p>${r.sub?`<p class="sub">${r.sub}</p>`:''}
      <div class="answers">${r.answers.map((a,k)=>`<button class="ans" data-k="${k}">${a.label}</button>`).join('')}</div>
      <div class="feedback" id="fb" hidden></div><div class="row"><button class="big" id="nextQ" hidden>Next</button></div>`;
    firstTry=true; if(r.after) r.after(host);
    host.querySelectorAll('.ans').forEach(b=>b.onclick=()=>{
      const a=r.answers[+b.dataset.k], fb=$('#fb',host);
      if(a.right){ b.classList.add('right'); sRight(); if(res[i]===undefined) res[i]=firstTry; host.querySelectorAll('.ans').forEach(x=>x.disabled=true);
        fb.hidden=false; fb.className='feedback ok'; fb.innerHTML=(r.why||a.why||'Yes!'); $('#nextQ',host).hidden=false; $('#nextQ',host).focus(); }
      else { b.classList.add('wrong'); flash(b,'wiggle'); sWrong(); firstTry=false; b.disabled=true;
        fb.hidden=false; fb.className='feedback no'; fb.innerHTML=a.why||'Not quite. Try another one.'; }
    });
    $('#nextQ',host).onclick=()=>{ i++; if(i<rounds.length) show(); else finish(); };
  }
  function finish(){ const firsts=res.filter(x=>x===true).length; opts.done(firsts,rounds.length,()=>{rounds=makeRounds();i=0;res=[];show();}); }
  show();
}

// generic tap-to-order game
function orderGame(host,{items,label,prompt,first,last,check,explain,onWin,extra}){
  let placed=[];
  function draw(state){
    host.innerHTML=`<p class="q">${prompt}</p><p class="sub">Tap the cards in order. Tap a filled slot to take a card back.</p>
      <div class="slots">${items.map((_,k)=>{const it=placed[k]; const st=state?(state[k]?'ok':'no'):''; return `<button class="slot ${it?'filled':''} ${st}" data-k="${k}"><span class="n">${k===0?first:k===items.length-1?last:k+1}</span>${it?ICON[it.icon]+esc(it.name)+(state?`<small style="font-weight:400">${esc(label(it))}</small>`:''):''}</button>`;}).join('')}</div>
      <div class="pool">${items.map((it,k)=>`<button data-p="${k}" ${placed.includes(it)?'disabled':''}>${ICON[it.icon]}${esc(it.name)}</button>`).join('')}</div>
      <div class="feedback" id="fb" hidden></div><div id="xtra"></div>
      <div class="row"><button class="big" id="chk" ${placed.filter(Boolean).length<items.length||state?'hidden':''}>Check my order</button><button class="big alt" id="again" ${state&&!state.every(Boolean)?'':'hidden'}>Try again</button></div>`;
    host.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const it=items[+b.dataset.p]; const k=[...Array(items.length).keys()].find(j=>!placed[j]); placed[k]=it; sTick(); draw(); });
    if(!state) host.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{ placed[+b.dataset.k]=undefined; draw(); });
    const c=$('#chk',host); if(c) c.onclick=()=>{
      const ok=check(placed); const all=ok.every(Boolean); draw(ok);
      const fb=$('#fb',host); fb.hidden=false;
      if(all){ fb.className='feedback ok'; fb.innerHTML=explain(true); sRight(); if(extra) extra($('#xtra',host),placed); else onWin(); }
      else { fb.className='feedback no'; fb.innerHTML=explain(false,ok.filter(Boolean).length); sWrong(); }
      $('#again',host).onclick=()=>{ placed=placed.map((p,k)=>ok[k]?p:undefined); draw(); };
    };
  }
  draw();
}

GAMES.lineup=(host,lv)=>{
  const n=[4,5,6][lv];
  function makeSet(){ const pool=CLOCKS.filter(c=>c.sortable!==false&&c.year!=null);
    for(let t=0;t<200;t++){ const s=shuffle(pool).slice(0,n); const ys=s.map(c=>c.year).sort((a,b)=>a-b); if(ys.every((y,i)=>i===0||y-ys[i-1]>=[150,60,25][lv])) return s; }
    return shuffle(pool).slice(0,n); }
  const items=makeSet();
  const sorted=items.slice().sort((a,b)=>a.year-b.year);
  orderGame(host,{items,label:c=>yearStr(c.year),prompt:'Put these clocks in the order they were invented.',first:'Oldest',last:'Newest',
    check:p=>p.map((c,k)=>c===sorted[k]),
    explain:(ok,c)=> ok?`Perfect timeline! The ${esc(sorted[0].name.toLowerCase())} came first, around ${yearStr(sorted[0].year)}, and the ${esc(sorted[n-1].name.toLowerCase())} came last, in ${yearStr(sorted[n-1].year)}.`:`${c} of ${n} are in the right place. The green ones can stay. Try moving the others.`,
    onWin:()=>{ addStar('lineup',lv); winOverlay('Your timeline is in order.',()=>GAMES.lineup(host,lv)); },
    extra: lv<2?null:(x,placed)=>{ // Summit: years between first and last
      const a=sorted[0].year,b=sorted[n-1].year, gap=b-a;
      const span=y=>y<0?`${fmtN(-y)} BCE`:`${y} CE`;
      let opts=[gap,gap+100,Math.max(50,gap-100),a<0?Math.abs(b+a):gap+1000,gap+200].filter((v,i,arr)=>arr.indexOf(v)===i).slice(0,4);
      x.innerHTML=`<p class="q">Summit question: how many years apart were the oldest and newest?</p><p class="sub">${esc(sorted[0].name)}: ${span(a)}. ${esc(sorted[n-1].name)}: ${span(b)}.${a<0?' Tip: count the years back to year 1, then forward.':''}</p><div class="answers">${shuffle(opts).map(v=>`<button class="ans" data-v="${v}">${fmtN(v)} years</button>`).join('')}</div><div class="feedback" id="fb2" hidden></div>`;
      x.querySelectorAll('.ans').forEach(bt=>bt.onclick=()=>{ const fb=$('#fb2',x); fb.hidden=false;
        if(+bt.dataset.v===gap){ bt.classList.add('right'); sRight(); fb.className='feedback ok'; fb.innerHTML=a<0?`Yes. ${fmtN(-a)} years from ${span(a)} up to year 0, then ${fmtN(b)} more. (Historians skip a year 0, but we can ignore that tiny difference here.)`:`Yes. ${b} minus ${a} is ${fmtN(gap)}.`; x.querySelectorAll('.ans').forEach(z=>z.disabled=true); setTimeout(()=>{addStar('lineup',lv); winOverlay('Timeline and the math, both right!',()=>GAMES.lineup(host,lv));},900); }
        else { bt.classList.add('wrong'); bt.disabled=true; flash(bt,'wiggle'); sWrong(); fb.className='feedback no'; fb.textContent='Not that one. Subtract the older year from the newer year.'; } });
    }});
};

GAMES.better=(host,lv)=>{

    while(rounds.length<6 && tries++<500){ const [a,b]=shuffle(CLOCKS).slice(0,2); if(Math.abs(a.acc-b.acc)<gapMin) continue; if(rounds.some(r=>r.key===[a.id,b.id].sort().join())) continue;
      const best=a.acc>b.acc?a:b, worse=best===a?b:a;

};

// ---------- Gear Bench ----------
function gearPath(N,m){ const r=m*N/2, ro=r+m, rr=r-1.25*m, p=2*Math.PI/N; let d='';
  const P=(rad,a)=>`${(Math.cos(a)*rad).toFixed(2)},${(Math.sin(a)*rad).toFixed(2)}`;
  for(let i=0;i<N;i++){ const a=i*p; d+=(i?'L':'M')+P(rr,a-.5*p)+' L'+P(rr,a-.28*p)+' L'+P(ro,a-.14*p)+' L'+P(ro,a+.14*p)+' L'+P(rr,a+.28*p)+' L'+P(rr,a+.5*p); }
  return d+'Z'; }
const GEAR_TEETH=[10,20,30,40,60];
const GEAR_CH=[
  [[1,2],[1,3],[1,4],[1,6],[2,3],[3,4]],
  [[2,1],[3,1],[4,1],[6,1],[3,2],[4,3]],
  [[1,8],[1,9],[1,12],[1,16],[1,24],[1,36]],
]; // [output turns, crank turns]
function gearSay(p,q){ if(q===1) return `Make the output gear turn <b>${p} times</b> every time you turn the crank <b>once</b>.`;
  if(p===1) return `Make the output gear turn <b>once</b> while you turn the crank <b>${q} times</b>.`;
  return `Make the output gear turn <b>${p} times</b> while you turn the crank <b>${q} times</b>.`; }
GAMES.gears=(host,lv)=>{
  const two=lv===2; let ci=0; const chs=GEAR_CH[lv]; let sel=two?[20,40,20,40]:[20,40]; let anim=null;
  const m=two?1.5:2;
  function layout(){ // returns gear placements per panel
    const pr=N=>m*N/2;
    const pairs= two?[[sel[0],sel[1]],[sel[2],sel[3]]]:[[sel[0],sel[1]]];
    let x=10; const G=[]; const H=Math.max(...sel.map(N=>pr(N)+m))*2+20;
    pairs.forEach((pp,k)=>{ const a=pr(pp[0]), b=pr(pp[1]); const cx1=x+a+m, cx2=cx1+a+b; G.push({N:pp[0],x:cx1,y:H/2,role:k===0?'crank':'mid2'},{N:pp[1],x:cx2,y:H/2,role:k===pairs.length-1?'out':'mid1'}); x=cx2+b+m+(two?34:10); });
    return {G,W:x,H};
  }
  function svg(angles){ const {G,W,H}=layout(); let s=`<svg viewBox="0 0 ${W} ${H+(two?26:0)}" aria-label="Gears">`;
    G.forEach((g,i)=>{ const col=g.role==='crank'?'#E8742A':g.role==='out'?'#2E8B57':'#6B3FA0'; const r=m*g.N/2;
      s+=`<g transform="translate(${g.x} ${g.y}) rotate(${(angles?angles[i]:0).toFixed(2)})"><path d="${gearPath(g.N,m)}" fill="${col}" stroke="#3A2433" stroke-width="1.2"/><circle r="${Math.max(3,r*.55)}" fill="#FFF4E0" opacity=".25"/><circle r="4" fill="#FFF4E0" stroke="#3A2433"/>`;
      if(g.role==='out'||g.role==='crank') s+=`<circle cx="${r-m*1.6}" cy="0" r="${Math.max(2.4,m*1.3)}" fill="#FFF4E0" stroke="#3A2433"/>`;
      s+=`</g><text x="${g.x}" y="${g.y+r+m+16}" text-anchor="middle" font-size="10" font-weight="700" fill="#3A2433" font-family="Atkinson Hyperlegible,sans-serif" ${two?'':'hidden'}>${g.N}</text>`; });
    if(two){ const b=G[1], c=G[2]; s+=`<path d="M${b.x} ${b.y} L${c.x} ${c.y}" stroke="#3A2433" stroke-width="3" stroke-dasharray="6 5"/><path d="M${(b.x+c.x)/2} ${b.y+4} L${(b.x+c.x)/2} ${H+4}" stroke="#3A2433" stroke-width="1.2"/><text x="${(b.x+c.x)/2}" y="${H+18}" text-anchor="middle" font-size="10" fill="#3A2433" font-family="Atkinson Hyperlegible,sans-serif">same shaft</text>`; }
    return s+`</svg>`; }
  function angles(a){ // a = crank angle in degrees; mesh along +x (theta=0)
    const {G}=layout(); const out=[a]; const mesh=(a1,N1,N2)=>180-180/N2-a1*N1/N2;
    out[1]=mesh(a,G[0].N,G[1].N); if(two){ out[2]=out[1]; out[3]=mesh(out[2],G[2].N,G[3].N); } return out; }
  function ratio(){ return two? (sel[0]/sel[1])*(sel[2]/sel[3]) : sel[0]/sel[1]; }
  function draw(msg){
    const [p,q]=chs[ci];
    const chips=(idx,lab,col)=>`<div><p class="sub" style="color:${col};font-weight:700">${lab}</p><div class="row">${GEAR_TEETH.map(t=>`<button class="chip" data-i="${idx}" data-t="${t}" aria-pressed="${sel[idx]===t}">${t}</button>`).join('')}</div></div>`;
    host.innerHTML=`${dots(chs.length,ci,chs.map((_,k)=>k<ci?true:undefined))}<p class="q">${gearSay(p,q)}</p>
      <p class="sub">${two?'Two gear pairs. The purple gears are joined on one shaft, so they always turn together.':'The orange crank gear drives the green output gear. Count the teeth!'}</p>
      <div class="stage" id="stg">${svg(angles(0))}</div>
      <div style="display:grid;gap:10px">${chips(0,two?'Crank gear (orange)':'Crank gear teeth','#C4511F')}${chips(1,two?'Gear it turns (purple)':'Output gear teeth',two?'#6B3FA0':'#2E8B57')}${two?chips(2,'Gear on the same shaft (purple)','#6B3FA0')+chips(3,'Output gear (green)','#2E8B57'):''}</div>
      <p class="mono" id="math" style="font-size:18px">${mathLine()}</p>
      <div class="row"><button class="big" id="turn">Turn the crank ${q===1?'once':q+' times'}</button></div><div class="feedback" id="fb" ${msg?'':'hidden'}>${msg||''}</div>`;
    host.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ sel[+b.dataset.i]=+b.dataset.t; sTick(); draw(); });
    $('#turn',host).onclick=spin;
  }
  function frac(x){ // show a nice fraction
    for(let d=1;d<=72;d++){ const n=Math.round(x*d); if(Math.abs(n/d-x)<1e-9){ return d===1?`${n}`:`${n}/${d}`; } } return x.toFixed(3); }
  function mathLine(){ return two? `${sel[0]}/${sel[1]} × ${sel[2]}/${sel[3]} = ${frac(ratio())} turn of the output for each crank turn` : `${sel[0]} ÷ ${sel[1]} = ${frac(ratio())} turn of the output for each crank turn`; }
  function spin(){
    if(anim) return; const [p,q]=chs[ci]; const total=360*q, dur=Math.min(5000,1400+q*260); const t0=performance.now(); const stg=$('#stg',host); $('#turn',host).disabled=true;
    let lastTick=0;
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, a=total*e; stg.innerHTML=svg(angles(a));
      if(a-lastTick>=90){ lastTick=a; sTick(); }
      if(k<1){ anim=requestAnimationFrame(step); return; }
      anim=null; const outTurns=q*ratio(); const ok=Math.abs(outTurns-p)<1e-9;
      const said=`The crank turned ${q===1?'once':q+' times'} and the output turned <b>${frac(outTurns)}</b> time${outTurns===1?'':'s'}.`;
      if(ok){ sRight(); const last=ci===chs.length-1;
        const real= (p===1&&q===12)?' That’s exactly how a clock works: the hour hand turns once while the minute hand turns 12 times.':'';
        if(last){ addStar('gears',lv); const nb=lv===2&&award('gearmaster')?'gearmaster':null; winOverlay('You solved every gear challenge on this level.'+real,()=>{ci=0;draw();},nb); }
        else { ci++; draw(`<b>It works!</b> ${said}${real} Next challenge:`); $('#fb',host).className='feedback ok'; }
      } else { sWrong(); const fb=$('#fb',host); fb.hidden=false; fb.className='feedback no'; fb.innerHTML=`${said} ${outTurns>p?'Too fast. Try a bigger output gear or a smaller crank gear.':'Too slow. Try a smaller output gear or a bigger crank gear.'}`; $('#turn',host).disabled=false; }
    };
    anim=requestAnimationFrame(step);
  }
  cleanup=()=>{ if(anim) cancelAnimationFrame(anim); };
  draw();
};

// ---------- Sundial Plaza ----------
const pad=n=>String(n).padStart(2,'0');
const to12=(h,m)=>`${h%12||12}:${pad(m)} ${h<12?'a.m.':'p.m.'}`;
const to24=(h,m)=>`${pad(h)}:${pad(m)}`;
const t12=(h,m)=>`${h%12||12}:${pad(m)}`;
const NUMW=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function words(h,m){ const hh=h%12||12, nx=(h%12)+1;
  if(m===0) return `${NUMW[hh]} o’clock`; if(m===30) return `half past ${NUMW[hh]}`; if(m===15) return `quarter past ${NUMW[hh]}`; if(m===45) return `quarter to ${NUMW[nx]}`;
  const mw={5:'five',10:'ten',20:'twenty',25:'twenty-five'}; if(m<30&&mw[m]) return `${mw[m]} past ${NUMW[hh]}`; if(m>30&&mw[60-m]) return `${mw[60-m]} to ${NUMW[nx]}`; return `${hh}:${pad(m)}`; }

function clockSVG(total,{id='clk',size=300}={}){ // total minutes 0..719
  const m=total%60, hA=(total%720)/2, mA=m*6; let s=`<svg viewBox="0 0 300 300" id="${id}" aria-label="Clock">
    <circle cx="150" cy="150" r="140" fill="#FFF4E0" stroke="#3A1F5C" stroke-width="8"/>`;
  for(let i=0;i<60;i++){ const a=i*6*Math.PI/180, r1=i%5?124:116; s+=`<line x1="${150+Math.sin(a)*r1}" y1="${150-Math.cos(a)*r1}" x2="${150+Math.sin(a)*130}" y2="${150-Math.cos(a)*130}" stroke="#3A1F5C" stroke-width="${i%5?1.5:4}"/>`; }
  for(let n=1;n<=12;n++){ const a=n*30*Math.PI/180; s+=`<text x="${150+Math.sin(a)*96}" y="${150-Math.cos(a)*96+10}" text-anchor="middle" font-family="Lilita One,Arial Rounded MT Bold,sans-serif" font-size="30" fill="#3A1F5C">${n}</text>`; }
  s+=`<g transform="rotate(${hA} 150 150)"><path d="M150 168 L142 150 L150 82 L158 150Z" fill="#E8742A" stroke="#3A2433" stroke-width="2"/></g>`;
  s+=`<g transform="rotate(${mA} 150 150)" id="${id}-m"><path d="M150 172 L145 150 L150 30 L155 150Z" fill="#6B3FA0" stroke="#3A2433" stroke-width="2"/><circle cx="150" cy="40" r="14" fill="#6B3FA0" opacity=".25"/></g>`;
  return s+`<circle cx="150" cy="150" r="8" fill="#3A2433"/></svg>`; }

GAMES.setclock=(host,lv)=>{
  const N=6, snap=[30,5,1][lv]; let i=0, total, target, res=[];
  function newRound(){ const h=1+rnd(12); const m= lv===0? pick([0,30]) : lv===1? 5*rnd(12) : (Math.random()<.5? pick([15,45,10,20,25,35,40,50,55]) : rnd(60)); target={h,m};
    do{ total=snap*rnd(720/snap); }while((total%720)===((h%12)*60+m)); }
  function show(){ const T=target;
    const ask= lv===0? `Show <b>${words(T.h,T.m)}</b>.` : lv===1? `Show <span class="mono" style="font-size:1.2em">${t12(T.h,T.m)}</span>.` : `Show <b>${words(T.h,T.m)}</b>${/\d/.test(words(T.h,T.m))?'':''}.`;

// sundial: horizontal dial at Cincinnati latitude
const LAT=39.1*Math.PI/180;
const sunAngle=t=>{ const H=(t-12)*15*Math.PI/180; return Math.atan2(Math.sin(LAT)*Math.sin(H),Math.cos(H)); };
function sundialSVG(t){ const cx=200,cy=262,R=190; let s=`<svg viewBox="0 0 400 290" aria-label="Sundial"><path d="M${cx-R} ${cy} A${R} ${R} 0 0 1 ${cx+R} ${cy} Z" fill="#E6DAF6" stroke="#3A1F5C" stroke-width="5"/>`;
  for(let h=6;h<=18;h+=.5){ const a=sunAngle(h), full=h%1===0; const r1=full?120:150; s+=`<line x1="${cx+Math.sin(a)*r1}" y1="${cy-Math.cos(a)*r1}" x2="${cx+Math.sin(a)*(R-6)}" y2="${cy-Math.cos(a)*(R-6)}" stroke="#6B3FA0" stroke-width="${full?3:1.5}"/>`;
    if(full){ const lr=R-34; s+=`<text x="${cx+Math.sin(a)*lr}" y="${cy-Math.cos(a)*lr+7}" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="20" fill="#3A1F5C">${h%12||12}</text>`; } }
  const a=sunAngle(t); s+=`<path d="M${cx} ${cy} L${cx+Math.sin(a)*(R-8)+Math.cos(a)*5} ${cy-Math.cos(a)*(R-8)+Math.sin(a)*5} L${cx+Math.sin(a)*(R-8)-Math.cos(a)*5} ${cy-Math.cos(a)*(R-8)-Math.sin(a)*5}Z" fill="#3A1F5C" opacity=".55"/>`;
  s+=`<path d="M${cx} ${cy} L${cx} ${cy-110}" stroke="#C4511F" stroke-width="7" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="9" fill="#C4511F"/>`;
  s+=`<text x="${cx}" y="${cy-118}" text-anchor="middle" font-size="12" fill="#C4511F" font-family="Atkinson Hyperlegible,sans-serif" font-weight="700">GNOMON (points north)</text>`;
  return s+`</svg>`; }

      why:`Yes, ${fmt(t)} sun time. ${t<12?'Morning shadows point west, away from the rising Sun.':t>12?'Afternoon shadows point east, away from the setting Sun.':'At sun noon the shadow points straight north, and it is the shortest of the day.'}`};

GAMES.guess=(host,lv)=>{

  function draw(msg){
    host.innerHTML=guideBlock('dash',lv===2?`Thirty seconds, no peeking! Try counting "one-Mississippi, two-Mississippi..."`:`Tap Start, then tap Stop when you think ${target} seconds have passed. The numbers hide while you count!`)+
      `<div class="timer" id="tm" aria-live="off">${state==='run'?'? ? ?':'0.00'}</div><button class="biground" id="go">${state==='run'?'Stop':'Start'}</button>
      <div id="res">${msg||''}</div>${hist.length?`<div class="scroll"><table class="t"><tr><th>Try</th><th>Your time</th><th>Off by</th></tr>${hist.slice(-5).map((v,k)=>`<tr><td>${k+1}</td><td>${v.toFixed(2)} s</td><td>${Math.abs(v-target).toFixed(2)} s</td></tr>`).join('')}</table></div>`:''}`;
    $('#go',host).onclick=()=>{ if(state!=='run'){ state='run'; t0=performance.now(); tone(880,.08,'square',.06); draw(); } else { const v=(performance.now()-t0)/1000; state='ready'; tone(440,.12,'square',.06); hist.push(v); if(hist.length>20) hist.shift(); save(); result(v); } };
  }
  function result(v){ const off=Math.abs(v-target), pct=off/target; let msg;
    const W=320, max=target*2, bx=x=>Math.min(W,x/max*W);
    const chart=`<svg viewBox="0 0 ${W+60} 80" style="max-width:420px;width:100%"><text x="0" y="22" font-size="13" fill="#6E5562">Goal</text><rect x="50" y="10" width="${bx(target)}" height="18" rx="5" fill="#B79CE0"/><text x="0" y="56" font-size="13" fill="#6E5562">You</text><rect x="50" y="44" width="${bx(v)}" height="18" rx="5" fill="#6B3FA0"/><text x="${54+bx(v)}" y="58" font-size="13" fill="#3A2433" font-weight="700">${v.toFixed(2)}s</text></svg>`;
    msg=`<div class="feedback ${pct<=.1?'ok':''}"><b>${v.toFixed(2)} seconds.</b> You were ${off.toFixed(2)} seconds ${v<target?'early':'late'}. ${pct<=.05?'Amazing! That’s stopwatch-level.':pct<=.1?'Really close!':'Try again and count steadily.'}</div>${chart}`;
    const RW=1000,fx=700,dx=Math.min(930,Math.max(40,v/target*fx));
    const race=`<div class="race"><svg viewBox="0 0 ${RW} 190" aria-label="Dash ran to ${Math.round(v/target*100)} percent of the way to the flag"><rect width="${RW}" height="190" fill="#F7C08A"/><path d="M0 120 C200 104 400 130 600 116 C760 106 880 124 1000 112 V190 H0Z" fill="#F4A259"/><path d="M0 160 H1000" stroke="#E8742A" stroke-width="4" stroke-dasharray="18 14"/>
      <path d="M${fx} 160 V60" stroke="#3A1F5C" stroke-width="5"/><path d="M${fx} 62 l46 14 l-46 14z" fill="#3DF29A" stroke="#3A1F5C" stroke-width="3"/><text x="${fx}" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#3A1F5C" font-family="Atkinson Hyperlegible,sans-serif">${target} s</text>
      ${guideAt('dash',pct<=.1?'happy':'rest',dx-70,40,140)}</svg></div>`;
    msg=race+msg;
    draw(msg); if(pct<=.1){ addStar('guess',lv); refreshStars(); sRight(); }
    if(target===10&&off<=.3&&award('stopwatch')){ winOverlay('Within 0.3 seconds of 10 seconds. You’re a human stopwatch!',()=>draw(),'stopwatch'); }
  }
  draw();
  cleanup=()=>{ if(raf) cancelAnimationFrame(raf); };
};

function logChart(items){ // items sorted; bar from scale start to geometric middle, with a lighter range lo..hi
  const L=Math.log10, minY=L(20/525960)-.4, maxY=L(5000)+.2, W=640, rowH=34, left=170, H=items.length*rowH+56;
  const X=v=>left+(L(v)-minY)/(maxY-minY)*(W-left-12);
  const ticks=[[1/8766,'1 hour'],[1/365.25,'1 day'],[1/12,'1 month'],[1,'1 year'],[10,'10 yrs'],[100,'100 yrs'],[1000,'1,000 yrs']];
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px" role="img" aria-label="Life spans on a scale where each step is ten times bigger">`;
  for(const [v,t] of ticks){ s+=`<line x1="${X(v)}" y1="10" x2="${X(v)}" y2="${H-34}" stroke="#F7E3C2" stroke-width="2"/><text x="${X(v)}" y="${H-14}" font-size="12" text-anchor="middle" fill="#6E5562" font-family="Atkinson Hyperlegible,sans-serif">${t}</text>`; }
  items.forEach((it,k)=>{ const y=14+k*rowH, mid=Math.sqrt(it.lo*it.hi), col=KIND_COL[it.kind];
    s+=`<text x="${left-10}" y="${y+16}" font-size="14" text-anchor="end" fill="#3A2433" font-weight="700" font-family="Atkinson Hyperlegible,sans-serif">${esc(it.name)}</text>`;
    s+=`<rect x="${left}" y="${y+4}" width="${Math.max(2,X(it.lo)-left)}" height="18" rx="4" fill="${col}"/>`;
    if(it.hi>it.lo*1.01) s+=`<rect x="${X(it.lo)}" y="${y+4}" width="${X(it.hi)-X(it.lo)}" height="18" rx="4" fill="${col}" opacity=".4"/>`;
    s+=`<circle cx="${X(mid)}" cy="${y+13}" r="4" fill="#FFF4E0" stroke="${col}" stroke-width="2"/>`; });
  return s+`</svg>`; }

// Tree rings: deterministic generation per round, drawn on canvas
GAMES.rings=(host,lv)=>{
  const N=lv===0?5+rnd(5):lv===1?9+rnd(6):10+rnd(6), CUT=2026;
  const w=[]; const thinK=lv===2?2+rnd(N-3):-1; for(let k=0;k<N;k++) w.push(k===thinK?3:(lv===2?9+rnd(9):8+rnd(10)));
  if(lv<2) for(let j=0;j<2;j++){ const k=1+rnd(N-2); w[k]=Math.max(7,w[k]-3); }
  const sumW=w.reduce((a,b)=>a+b,0)+6; let pins=[]; let step=0;
  const wob=[...Array(6)].map(()=>Math.random()*Math.PI*2), amp=[.03,.02,.015];
  function drawCanvas(cv){ const S=cv.width, cx=S*.52, cy=S*.5, R=S*.45, sc=R/(sumW+8), g=cv.getContext('2d'); g.clearRect(0,0,S,S);
    const ring=(r,col,lw,fill)=>{ g.beginPath(); for(let i=0;i<=120;i++){ const a=i/120*Math.PI*2; const rr=r*(1+amp[0]*Math.sin(3*a+wob[0])+amp[1]*Math.sin(5*a+wob[1])+amp[2]*Math.sin(2*a+wob[2])); const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?g.lineTo(x,y):g.moveTo(x,y);} g.closePath(); if(fill){g.fillStyle=fill;g.fill();} if(col){g.strokeStyle=col;g.lineWidth=lw;g.stroke();} };
    ring(R+8*sc,null,0,'#6E4630'); ring(R+4*sc,null,0,'#8A5A3B'); ring(R,null,0,'#F2D3A2');
    let r=3*sc; ring(r*1.2,null,0,'#C98F55');
    for(let k=0;k<N;k++){ r+=w[k]*sc; ring(r-w[k]*sc*.3,'#E9BE82',w[k]*sc*.55); ring(r,'#9A5E32',Math.max(1.6,sc*1.6)); }
    for(const p of pins){ g.beginPath(); g.arc(p[0]*S,p[1]*S,S*.012,0,7); g.fillStyle='#6B3FA0'; g.fill(); g.strokeStyle='#FFF4E0'; g.lineWidth=2; g.stroke(); }
  }
  const ask=()=>{
    if(step===0) return {q:'How old was this tree when it was cut down?',sub:'Each dark ring line marks the end of one year of growth. Tap the wood to drop counting pins.',right:N,opts:[N,N-1,N+1,N+2].map(v=>({v,l:`${v} years`}))};
    if(step===1) return {q:`It was cut down in ${CUT}, so its outside ring grew in ${CUT}. In what year did its center ring grow?`,sub:'Count back from the bark. The outside ring is year 1 of counting back.',right:CUT-N+1,opts:[CUT-N+1,CUT-N,CUT-N+2,CUT-N-1].map(v=>({v,l:String(v)}))};
    const yr=CUT-(N-1-thinK); return {q:'Find the thinnest ring. A thin ring usually means a dry year. Which year was it?',sub:`The center ring is ${CUT-N+1}. Count outward.`,right:yr,opts:[yr,yr-1,yr+1,yr+2].map(v=>({v,l:String(v)}))};
  };
  const maxStep=lv;
  function show(msg){ const A=ask();
    host.innerHTML=`${guideBlock('sam',step===0?'A tree adds one ring every year, wide in a wet year and thin in a dry one. Out here in the desert, rings are a diary of the rain.':'Good counting. Now let’s use the rings like a calendar.')}
      <p class="q">${A.q}</p><p class="sub">${A.sub}</p>
      <div class="stage" style="max-width:520px"><canvas id="cv" width="900" height="900" style="width:100%;height:auto;border-radius:50%;touch-action:none"></canvas></div>
      <div class="row" style="justify-content:center"><button class="chip" id="clr">Clear pins (${pins.length})</button></div>
      <div class="answers">${shuffle(A.opts).map(o=>`<button class="ans" data-v="${o.v}">${o.l}</button>`).join('')}</div><div class="feedback" id="fb" ${msg?'':'hidden'}>${msg||''}</div>`;
    const cv=$('#cv',host); drawCanvas(cv);
    cv.onpointerdown=e=>{ const r=cv.getBoundingClientRect(); pins.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]); sTick(); drawCanvas(cv); $('#clr',host).textContent=`Clear pins (${pins.length})`; };
    $('#clr',host).onclick=()=>{ pins=[]; drawCanvas(cv); $('#clr',host).textContent='Clear pins (0)'; };
    host.querySelectorAll('.ans').forEach(b=>b.onclick=()=>{ const fb=$('#fb',host); fb.hidden=false;
      if(+b.dataset.v===A.right){ b.classList.add('right'); sRight();
        if(step<maxStep){ step++; pins=[]; show(`<b>Yes!</b> ${step===1?`${N} rings, so ${N} years old.`:`The center ring grew in ${CUT-N+1}.`}`); $('#fb',host).className='feedback ok'; }
        else { addStar('rings',lv); const nb=lv===2&&award('rings')?'rings':null; winOverlay(lv===0?`${N} rings means ${N} years old.`:'You read the tree’s diary.',()=>GAMES.rings(host,lv),nb); } }
      else { b.classList.add('wrong'); b.disabled=true; flash(b,'wiggle'); sWrong(); fb.className='feedback no'; fb.textContent= step===0?'Count again. Try dropping a pin on each dark line, from the center out.': 'Not quite. Count one ring at a time, and remember the first ring counts too.'; } });
  }
  show();
};

GAMES.doubling=(host,lv)=>{
  const steps=[3,6,12][lv], ans=2**steps, hrs=steps/3;
  const opts=[[3,6,8,16],[12,32,64,128],[48,1024,4096,65536]][lv];
  let n=1, k=0, guess=null;
  function dish(){ const S=320, c=S/2, R=146; let s=`<svg viewBox="0 0 ${S} ${S}" style="max-width:360px;width:100%" aria-label="${fmtN(n)} bacteria"><circle cx="${c}" cy="${c}" r="${R+8}" fill="#E6DAF6" stroke="#6B3FA0" stroke-width="4"/><circle cx="${c}" cy="${c}" r="${R}" fill="#FFF8E8"/>`;
    const show=Math.min(n,512), sz=show>256?3.2:show>64?5:show>16?7:10; const ga=Math.PI*(3-Math.sqrt(5));
    for(let i=0;i<show;i++){ const r=Math.sqrt((i+.5)/show)*(R-14), a=i*ga; const x=c+Math.cos(a)*r, y=c+Math.sin(a)*r; s+=`<rect x="${x-sz}" y="${y-sz/2}" width="${sz*2}" height="${sz}" rx="${sz/2}" fill="#2E8B57" transform="rotate(${(a*57)%180} ${x} ${y})"/>`; }
    if(n>512) s+=`<rect x="${c-118}" y="${c-26}" width="236" height="52" rx="14" fill="#3A1F5C" opacity=".88"/><text x="${c}" y="${c+8}" text-anchor="middle" fill="#FFF4E0" font-size="20" font-family="Atkinson Hyperlegible,sans-serif" font-weight="700">Too many to draw!</text>`;
    return s+`</svg>`; }
  function table(){ let t='<table class="t"><tr><th>Time</th><th>Bacteria</th></tr>'; for(let j=0;j<=k;j++) t+=`<tr><td>${j*20<60?j*20+' min':Math.floor(j*20/60)+' h'+(j*20%60?' '+(j*20%60)+' min':'')}</td><td>${fmtN(2**j)}</td></tr>`; return t+'</table>'; }
  function draw(){
    const time=k*20; const lbl=time<60?`${time} minutes`:`${Math.floor(time/60)} h ${time%60} min`;
    if(guess===null){ host.innerHTML=guideBlock('sam',`One bacterium in a warm dish splits in two about every 20 minutes. Then each of those splits... Make a guess before we watch.`)+
      `<p class="q">Starting with 1, how many bacteria will there be after <b>${hrs} hour${hrs>1?'s':''}</b>?</p><div class="answers">${opts.map(v=>`<button class="ans" data-v="${v}">${fmtN(v)}</button>`).join('')}</div>`;
      host.querySelectorAll('.ans').forEach(b=>b.onclick=()=>{ guess=+b.dataset.v; draw(); }); return; }
    host.innerHTML=`<p class="q">Time: <span class="mono">${lbl}</span>. Bacteria: <span class="mono">${fmtN(n)}</span></p><div class="row" style="align-items:flex-start;gap:20px"><div class="stage" style="max-width:360px;flex:1 1 260px">${dish()}</div><div class="scroll" style="flex:1 1 200px">${table()}</div></div>
      <div class="row"><button class="big" id="wait" ${k>=steps?'hidden':''}>Wait 20 minutes</button></div><div id="end"></div>`;
    const w=$('#wait',host); if(w) w.onclick=()=>{ k++; n*=2; tone(400+k*40,.08,'triangle',.08); draw(); };
    if(k>=steps){ const ok=guess===ans; $('#end',host).innerHTML=`<div class="feedback ${ok?'ok':''}"><b>${fmtN(ans)} bacteria after ${hrs} hour${hrs>1?'s':''}.</b> You guessed ${fmtN(guess)}. ${ok?'Perfect prediction!':'Doubling sneaks up on you! It looks slow at first, then explodes.'} That’s ${steps} doublings: 2 multiplied by itself ${steps} times.</div><div class="row"><button class="big" id="claim">Collect my star</button></div>`;
      $('#claim',host).onclick=()=>{ addStar('doubling',lv); const nb=lv===2&&ok&&award('detective')?'detective':null; winOverlay('You watched doubling in action.',()=>GAMES.doubling(host,lv),nb); }; }
  }
  draw();
};

// ---------- sun math (NOAA formula) ----------
// NOAA sunrise/sunset for a lat/lon; returns local clock minutes (US DST rules)
function sunTimes(y,mo,d,lat=39.10,lon=-84.51){
  const doy=Math.round((Date.UTC(y,mo-1,d)-Date.UTC(y,0,1))/864e5)+1;
  const g=2*Math.PI/365*(doy-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const de=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const la=lat*Math.PI/180;
  const ha=Math.acos(Math.cos(90.833*Math.PI/180)/(Math.cos(la)*Math.cos(de))-Math.tan(la)*Math.tan(de))*180/Math.PI;
  const off=isDST(y,mo,d)?-240:-300;
  return {rise:720-4*(lon+ha)-eq+off, set:720-4*(lon-ha)-eq+off, dst:isDST(y,mo,d)};
}
function nthSunday(y,mo,n){ const first=new Date(Date.UTC(y,mo-1,1)).getUTCDay(); return 1+((7-first)%7)+7*(n-1); }
function isDST(y,mo,d){ if(mo<3||mo>11) return false; if(mo>3&&mo<11) return true; if(mo===3) return d>=nthSunday(y,3,2); return d<nthSunday(y,11,1); }
if(typeof module!=='undefined') module.exports={sunTimes,isDST};

function orbitSVG(f){ const cx=200,cy=200,R=128, th=Math.PI+2*Math.PI*f, mx=cx+R*Math.cos(th), my=cy-R*Math.sin(th);

GAMES.moonlab=(host,lv)=>{
  const N=[4,6,6][lv]; let i=0,res=[],targets,day;
  const tonight=Math.round(moonAgeDays());
  function newSet(){ if(lv===0) targets=shuffle([0,2,4,6]); else if(lv===1) targets=shuffle([0,1,2,3,4,5,6,7]).slice(0,6); else targets=shuffle([...Array(27).keys()].map(k=>k+2)).slice(0,6); }
  function startDay(){ let d; do{ d=rnd(30); }while(lv<2? phaseIdx(d/SYN)===targets[i] : Math.abs(d-targets[i])<5); day=d; }
  const fOf=d=>d/SYN;
  function ask(){ const t=targets[i]; return lv<2? `Move the Moon to make a <b>${PHASES[t].name.toLowerCase()}</b>.` : `It’s been <b>${t} days</b> since the new moon. Put the Moon where it is now.`; }
  function view(){ const f=fOf(day), p=PHASES[phaseIdx(f)];
    $('#orb',host).innerHTML=orbitSVG(f);
    $('#see',host).innerHTML=`<div style="width:min(220px,60vw);margin:0 auto">${moonSVG(f)}</div><p class="q" style="text-align:center">${esc(p.name)}</p><p class="sub" style="text-align:center">Day ${day} of about 29 and a half · ${litPct(f)}% of the face is lit</p>`; }
  function show(){
    host.innerHTML=`${dots(N,i,res)}<p class="q">${ask()}</p><p class="sub">Drag the Moon around Earth, or use the day buttons. Watch what Pip sees from the mesa.</p>
      <div class="row" style="align-items:flex-start;gap:16px"><div class="stage" id="orb" style="flex:1 1 300px;max-width:420px"></div><div id="see" class="skyview" style="flex:1 1 220px;display:grid;gap:6px;background:var(--night);color:var(--sand);border-radius:20px;padding:16px"></div></div>
      <div class="row" style="justify-content:center"><button class="chip" id="dm" aria-label="One day back">◀ 1 day</button><button class="chip" id="dp" aria-label="One day forward">1 day ▶</button><button class="chip" id="tn">Tonight’s Moon</button></div>
      <div class="row"><button class="big" id="chk">Check</button></div><div class="feedback" id="fb" hidden></div>`;
    view();
    const orb=$('#orb',host); let drag=false;
    const setFrom=e=>{ const r=orb.querySelector('svg').getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*400-200, y=(e.clientY-r.top)/r.height*400-200;
      let f=((Math.atan2(-y,x)-Math.PI)/(2*Math.PI)); f=((f%1)+1)%1; const d=Math.round(f*SYN)%30; if(d!==day){ day=d; sTick(); restyle(); } };
    const restyle=view;
    orb.onpointerdown=e=>{ drag=true; orb.setPointerCapture(e.pointerId); setFrom(e); }; orb.onpointermove=e=>{ if(drag) setFrom(e); }; orb.onpointerup=orb.onpointercancel=()=>drag=false;
    $('#dm',host).onclick=()=>{ day=(day+29)%30; sTick(); restyle(); }; $('#dp',host).onclick=()=>{ day=(day+1)%30; sTick(); restyle(); };
    $('#tn',host).onclick=()=>{ day=tonight%30; sTick(); restyle(); const fb=$('#fb',host); fb.hidden=false; fb.className='feedback'; fb.innerHTML=`This is about how the Moon looks tonight: a <b>${esc(PHASES[phaseIdx(fOf(day))].name.toLowerCase())}</b>, day ${day} since the new moon.`; };
    $('#chk',host).onclick=()=>{ const t=targets[i], f=fOf(day), pi=phaseIdx(f), fb=$('#fb',host); fb.hidden=false;
      const ok= lv<2? pi===t : Math.abs(day-t)<=1;
      if(ok){ sRight(); if(res[i]===undefined) res[i]=true; fb.className='feedback ok'; fb.innerHTML=`<b>Yes!</b> ${lv<2?PHASES[t].say:`Day ${day} is a <b>${esc(PHASES[pi].name.toLowerCase())}</b>. ${PHASES[pi].say}`}`;
        $('#chk',host).textContent='Next'; $('#chk',host).onclick=()=>{ i++; if(i<N){ startDay(); show(); } else { addStar('moonlab',lv); const nb=lv===2&&award('moonmaker')?'moonmaker':null; winOverlay('You can steer the Moon through its month.',()=>{i=0;res=[];newSet();startDay();show();},nb); } }; }
      else { sWrong(); res[i]=false; flash($('#see',host),'wiggle'); fb.className='feedback no';
        const hint= lv===2? (day<t?'Not that far yet. Keep going around, the same way the arrow points.':'Too far. Go back a little.')
          : t===4? 'For a full moon, put the Moon on the far side of Earth from the Sun.' : t===0? 'For a new moon, put the Moon on the same side of Earth as the Sun, so its lit side faces away from us.'
          : t<4? 'Waxing phases come first: go from the new moon around the way the arrow points.' : 'Waning phases come after the full moon.';
        fb.innerHTML=`That’s a ${esc(PHASES[pi].name.toLowerCase())}. ${hint}`; } };
  }
  newSet(); startDay(); show();
};

GAMES.moonorder=(host,lv)=>{

  const sorted=seq.map(k=>({id:'p'+k,k,name:PHASES[k].name,icon:'moon'+k}));
  const items=shuffle(sorted);
  orderGame(host,{items,label:x=>`Day ${Math.round(x.k*SYN/8)}`,prompt:`Start with the ${PHASES[start].name.toLowerCase()} and put the Moon’s phases in order through one month.`,first:'Start',last:'Last',
    check:p=>p.map((x,k)=>x&&x.id===sorted[k].id),
    explain:(ok,c)=>ok?`Right! The lit part grows from the right (waxing) until the full moon, then shrinks until only a thin sliver on the left is lit (waning).`:`${c} of ${sorted.length} are in the right place. The green ones can stay.`,
    onWin:()=>{ addStar('moonorder',lv); winOverlay('Your Moon month is in order.',()=>GAMES.moonorder(host,lv)); },

        else { bt.classList.add('wrong'); bt.disabled=true; flash(bt,'wiggle'); sWrong(); fb.className='feedback no'; fb.textContent='Not quite. One whole month of phases is about 29 and a half days.'; } });

function canyonSVG(dug,next){

    s+=`<rect x="14" y="${y}" width="612" height="${h}" fill="${L.col}" opacity="${open||here?1:.45}"/>`;
    if(k===4) for(let x=40;x<620;x+=60) s+=`<path d="M${x} ${y+h-10} q10 -14 20 0" stroke="#7A2E10" stroke-width="2" fill="none" opacity=".5"/>`;

function lightSVG(L){ const c={moon:'#F4ECD8',sun:'#FFE7A8',star:'#FFF4E0',red:'#F4A259',nebula:'#B79CE0',galaxy:'#E6DAF6'}[L.kind];

  else s+=`<circle cx="50" cy="50" r="${L.kind==='red'?14:10}" fill="${c}"/><path d="M50 22 V78 M22 50 H78" stroke="${c}" stroke-width="2" opacity=".7"/>`;

function lightWhen(L){ const age=ST.checks.myage||8;

const CITIES=[
  {n:'Honolulu', tz:'Pacific/Honolulu', lon:-157.9},

  {n:'Denver', tz:'America/Denver', lon:-105},

  {n:'Cairo', tz:'Africa/Cairo', lon:31.2},

function tzOff(tz,d=new Date()){ // minutes ahead of UTC right now
  try{ const p={}; new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(d).forEach(x=>p[x.type]=x.value);
    return Math.round((Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-d.getTime())/60000); }catch(e){ return null; } }
const OFF={}; CITIES.forEach(c=>OFF[c.n]=tzOff(c.tz)); const HOME_OFF=OFF.Cincinnati;
const OK_TZ=CITIES.every(c=>OFF[c.n]!==null);
const hmm=m=>{ m=((m%1440)+1440)%1440; return to12(Math.floor(m/60),m%60); };
function cityTime(cinMin,c){ const m=cinMin+OFF[c.n]-HOME_OFF; return {m, txt:hmm(m), day:Math.floor(m/1440)}; }
const dayWord=d=>d<0?'yesterday':d>0?'tomorrow':'today';
const hrsTxt=d=>{ const h=Math.abs(d)/60; return `${Math.floor(h)}${h%1?' and a half':''} hour${h===1?'':'s'}`; };
const offTxt=c=>{ const d=OFF[c.n]-HOME_OFF, h=Math.trunc(d/60), m=Math.abs(d%60); return d===0?'same time as Cincinnati':`${Math.abs(h)}${m?' and a half':''} hour${Math.abs(d)===60&&!m?'':'s'} ${d>0?'ahead of':'behind'} Cincinnati`; };

function ribbonSVG(cinMin){ const W=1000,H=150, utc=cinMin-HOME_OFF; let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A world ribbon showing where it is day and night">`;

    if(lv<2){ const pool=lv===0? Array.from({length:40},(_,k)=>2001+k*3).filter(v=>v%100) : [1900,2000,2100,2400,1800,1600,2024,2026,2032,2200,2800,2300];
      return shuffle(pool).slice(0,6).map(v=>({q:`Is ${v} a leap year?`, answers:['Yes','No'].map(a=>({label:a,right:(a==='Yes')===isLeap(v),why:''})).map(a=>({...a,why:a.right?'':'Run it through the gates.'})),
        why:`Yes! ${v} ${v%4?'doesn’t divide by 4':v%100?'divides by 4 and doesn’t end in 00':v%400?'ends in 00 and doesn’t divide by 400':'divides by 400'}, so it ${isLeap(v)?'IS':'is NOT'} a leap year.`})); }
    return shuffle([
      {q:'How many leap years are there from 2001 to 2100?', a:'24', o:['24','25','23','100'], why:'2004, 2008 … 2096 is 24 years. 2100 isn’t one.'},
      {q:'Someone was born on February 29, 2012. Not counting the day they were born, how many real February 29 birthdays will they have had by the end of 2028?', a:'4', o:['4','16','5','3'], why:'2016, 2020, 2024 and 2028.'},
      {q:'Without leap days, the calendar would slip about 6 hours a year. About how many days would it slip in 100 years?', a:'About 25 days', o:['About 25 days','About 6 days','About 100 days','About 1 day'], why:'6 hours × 100 = 600 hours, and 600 ÷ 24 = 25 days.'},
      {q:'In 1582, October 4 was followed by October 15. How many days were skipped?', a:'10', o:['10','11','9','15'], why:'October 5 through October 14 were skipped: that’s 10 days.'},
    ]).map(Q=>({q:esc(Q.q), answers:shuffle(Q.o).map(v=>({label:esc(v),right:v===Q.a,why:v===Q.a?'':'Try it on paper.'})), why:`Yes! ${esc(Q.why)}`}));
  },{done:(f,n,again)=>{ addStar('leap',lv); const nb=lv===2&&award('leapmaster')?'leapmaster':null; winOverlay(`${f} of ${n} on the first try.`,again,nb); }});
};

// ---------- Weekday Names ----------
const WEEKNAMES=[
  {d:'Sunday', from:'the Sun', more:'The Sun’s day.'},
  {d:'Monday', from:'the Moon', more:'The Moon’s day.'},
  {d:'Tuesday', from:'Tiw, an old Germanic god (Tyr in Norse myths)', more:'Tiw’s day. The Romans called it Mars’s day.'},
  {d:'Wednesday', from:'Woden, an old Germanic god (Odin in Norse myths)', more:'Woden’s day. The Romans called it Mercury’s day.'},
  {d:'Thursday', from:'Thunor, the old Germanic god of thunder (Thor in Norse myths)', more:'Thunor’s day, or Thor’s day. The Romans called it Jupiter’s day.'},
  {d:'Friday', from:'Frige, an old Germanic goddess (Frigg in Norse myths)', more:'Frige’s day, or Frigg’s day. The Romans called it Venus’s day.'},
  {d:'Saturday', from:'Saturn, a Roman god and a planet', more:'Saturn’s day.'},
];
const SPANISH=[['lunes','Monday','the Moon'],['martes','Tuesday','Mars'],['miércoles','Wednesday','Mercury'],['jueves','Thursday','Jupiter'],['viernes','Friday','Venus']];
GAMES.weekdays=(host,lv)=>{
  host.innerHTML=guideBlock('tula',`Long ago, people saw seven lights moving across the sky: the Sun, the Moon, Mars, Mercury, Jupiter, Venus and Saturn. The Romans named a day of the week after each one. English swapped four of them for old Germanic gods, the same gods you meet in Norse myths.`)+
    `<div class="facts">${WEEKNAMES.map(w=>`<div><b>${w.d}</b>${esc(w.more)}</div>`).join('')}</div><hr style="border:none;border-top:2px dashed var(--sand2);width:100%"><div id="q" style="display:flex;flex-direction:column;gap:14px"></div>`;
  runQuiz($('#q',host),()=>{
    if(lv===0) return shuffle(WEEKNAMES).slice(0,6).map(w=>{ const o=[w.from,...shuffle(WEEKNAMES.filter(x=>x!==w)).slice(0,2).map(x=>x.from)]; return {q:`What is ${w.d} named after?`, answers:shuffle(o).map(v=>({label:esc(v),right:v===w.from,why:v===w.from?'':'Look at the first part of the name.'})), why:`Yes! ${esc(w.more)}`}; });
    if(lv===1) return shuffle(SPANISH).map(([es,en,pl])=>{ const o=[pl,...shuffle(SPANISH.filter(x=>x[2]!==pl)).slice(0,2).map(x=>x[2])]; return {q:`In Spanish, ${en} is “${es}.” Which sky light is it named after?`, answers:shuffle(o).map(v=>({label:v,right:v===pl,why:v===pl?'':'Say the Spanish word out loud. Which sky light does it sound like?'})), why:`Yes! “${es}” comes from ${pl}, just like the old Roman name.`}; });
    return Array.from({length:5},()=>{ const s=rnd(7), n=pick([3,8,10,15,30,100]), a=WDAYS[(s+n)%7], o=[a,...shuffle(WDAYS.filter(x=>x!==a)).slice(0,3)];
      return {q:`Today is ${WDAYS[s]}. What day of the week will it be in ${n} days?`, answers:shuffle(o).map(v=>({label:v,right:v===a,why:v===a?'':`Every 7 days it’s ${WDAYS[s]} again. Take away 7s first.`})), why:`Yes! ${n} days is ${Math.floor(n/7)?Math.floor(n/7)+' week'+(Math.floor(n/7)===1?'':'s')+' and ':''}${n%7} more day${n%7===1?'':'s'}, so it’s ${a}.`}; });
  },{done:(f,n,again)=>{ addStar('weekdays',lv); const nb=lv===2&&award('weekday')?'weekday':null; winOverlay(`${f} of ${n} on the first try.`,again,nb); }});
};

// ---------- Calendars of the World ----------
const CALS=[
  {id:'greg', name:'Gregorian calendar', kind:'Sun', txt:'365 days, or 366 in a leap year. Most of the world uses it for everyday dates. It follows the Sun, so the seasons stay put.'},
  {id:'hijri', name:'Islamic (Hijri) calendar', kind:'Moon', txt:'12 moon months, about 354 days. Each year its months land about 11 days earlier, so Ramadan moves through every season over about 33 years.'},
  {id:'hebrew', name:'Hebrew calendar', kind:'Moon and Sun', txt:'Moon months, plus an extra month 7 times every 19 years, so holidays like Passover stay in spring.'},
  {id:'chinese', name:'Chinese calendar', kind:'Moon and Sun', txt:'Moon months kept in step with the Sun. Lunar New Year lands between January 21 and February 20, and each year has one of 12 animals.'},
  {id:'maya', name:'Maya calendars', kind:'Cycles', txt:'A 365-day year (the Haab) and a 260-day count (the Tzolkin) turned together like gears. They lined up again every 52 years.'},
  {id:'roman', name:'Roman month names', kind:'Names', txt:'July is named for Julius Caesar and August for Augustus. September means “seventh” and December “tenth”, because the old Roman year began in March.'},
];
GAMES.calendars=(host,lv)=>{
  host.innerHTML=guideBlock('tula','People have built calendars from the Sun, from the Moon, and from both. Each one is a clever answer to the same puzzle: the Moon’s month and the Sun’s year don’t fit together evenly.')+
    `<div class="facts">${CALS.map(c=>`<div><b>${esc(c.name)} · ${esc(c.kind)}</b>${esc(c.txt)}</div>`).join('')}</div><hr style="border:none;border-top:2px dashed var(--sand2);width:100%"><div id="q" style="display:flex;flex-direction:column;gap:14px"></div>`;
  const Q=[
    [0,'Which calendar follows only the Moon?','Islamic (Hijri)',['Islamic (Hijri)','Gregorian','Maya Haab'],'Its 12 months each start when the first thin sliver of the new Moon is seen.'],
    [0,'Which calendar do most people use for everyday dates?','Gregorian',['Gregorian','Hebrew','Maya'],'It’s the one on your wall: January to December.'],
    [0,'Which month is named after Julius Caesar?','July',['July','June','January'],'July is Julius’s month.'],
    [0,'Each Chinese calendar year has one of how many animals?','12',['12','7','10'],'Rat, Ox, Tiger, Rabbit, Dragon, Snake, Horse, Goat, Monkey, Rooster, Dog and Pig.'],
    [1,'A moon year is about 354 days. A sun year is about 365. How many days shorter is the moon year?','11',['11','9','21','1'],'365 − 354 = 11.'],
    [1,'“Octo” means eight, like an octopus’s 8 arms. Which month is October in our calendar?','The 10th',['The 10th','The 8th','The 12th'],'The old Roman year started in March, so October was 8th. Now it’s 10th.'],
    [1,'Why does the Hebrew calendar add an extra month some years?','To keep holidays in the same season',['To keep holidays in the same season','To have more birthdays','Because the Moon speeds up'],'Moon months alone drift away from the seasons, so an extra month pulls them back.'],
    [2,'Ramadan moves about 11 days earlier each year. About how many years until it has moved through all 365 days of the year?','About 33',['About 33','About 11','About 365','About 3'],'365 ÷ 11 is about 33.'],
    [2,'The Maya Haab (365 days) and Tzolkin (260 days) lined up again every 18,980 days. About how many years is that?','52',['52','26','73','100'],'18,980 ÷ 365 = 52.'],
    [2,'The Hebrew calendar adds a month 7 times in 19 years. In 38 years, how many extra months is that?','14',['14','7','19','21'],'38 years is two cycles of 19, so 7 × 2 = 14.'],
  ];
  runQuiz($('#q',host),()=>shuffle(Q.filter(x=>x[0]===lv)).concat(shuffle(Q.filter(x=>x[0]<lv))).slice(0,4).map(([l,q,a,o,why])=>({q:esc(q), answers:shuffle(o).map(v=>({label:esc(v),right:v===a,why:v===a?'':'Look back at the calendar cards.'})), why:`Yes! ${esc(why)}`})),
    {done:(f,n,again)=>{ addStar('calendars',lv); const nb=lv===2&&award('calmaster')?'calmaster':null; winOverlay(`${f} of ${n} on the first try.`,again,nb); }});
};

PAPER.tower={title:'Paper world clocks', time:'20 minutes', where:'At home',
  supplies:['3 paper plates or circles of paper','A marker','3 paper-fastener brads or tape for the hands','A grown-up with a phone world clock'],

  s+=`<g stroke="#3A1F5C" stroke-width="5" fill="none"><path d="M470 300 L520 70 L570 300"/><path d="M482 245 H558 M494 190 H546 M506 135 H534 M482 245 L546 190 M558 245 L494 190 M494 190 L534 135 M546 190 L506 135"/></g>`;
  s+=`<circle cx="520" cy="62" r="10" fill="#E8483D"/>`+[1,2,3].map(k=>`<path d="M${520+k*22} ${62-k*14} a${k*26} ${k*26} 0 0 1 0 ${k*28}" stroke="#3DF29A" stroke-width="4" fill="none" opacity="${1-k*.25}"/><path d="M${520-k*22} ${62-k*14} a${k*26} ${k*26} 0 0 0 0 ${k*28}" stroke="#3DF29A" stroke-width="4" fill="none" opacity="${1-k*.25}"/>`).join('');
  s+=`<rect x="640" y="230" width="230" height="70" rx="8" fill="${night?'#8A4A36':'#E8742A'}" stroke="#3A1F5C" stroke-width="3"/>`;
  if(OK_TZ) [['Cincinnati',0],['London',1],['Tokyo',2]].forEach(([n,k])=>{ const c=CITIES.find(x=>x.n===n), now=new Date(), cin=((now.getTime()/60000+HOME_OFF)%1440+1440)%1440, t=cityTime(Math.floor(cin),c), mm=((t.m%1440)+1440)%1440, h=(mm/60)%12, mi=mm%60, x=685+k*72;
    s+=`<circle cx="${x}" cy="258" r="20" fill="#FFF4E0" stroke="#3A1F5C" stroke-width="2"/><path d="M${x} 258 L${x+11*Math.sin(h/6*Math.PI)} ${258-11*Math.cos(h/6*Math.PI)} M${x} 258 L${x+16*Math.sin(mi/30*Math.PI)} ${258-16*Math.cos(mi/30*Math.PI)}" stroke="#3A1F5C" stroke-width="2.5" stroke-linecap="round"/><text x="${x}" y="293" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF4E0" font-family="Atkinson Hyperlegible,sans-serif">${n}</text>`; });
  s+=saguaro(90,300,1,night?'#1F6B42':'#2E8B57')+guideAt('dash','rest',180,150,170);
  return `<div class="zscene"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="The Radio Tower sending signals around the world, with clocks for Cincinnati, London and Tokyo">${s}</svg></div>`; }
function rockZoneScene(){ const phase=curPhase(), night=phase==='night', W=1000, H=330, id='zsrock'; let s=sceneBase(id,phase,W,H);
  s+=`<path d="M560 300 C540 220 560 120 640 90 C720 70 820 100 850 170 C880 240 860 290 850 300Z" fill="${night?'#6E4A7A':'#C4511F'}" stroke="#3A1F5C" stroke-width="4"/>`;
  s+=`<circle cx="705" cy="190" r="62" fill="none" stroke="#FFF4E0" stroke-width="4" opacity=".85"/>`+MONTHS3.map((m,k)=>{ const a=k/12*2*Math.PI-Math.PI/2; return `<path d="M${705+52*Math.cos(a)} ${190+52*Math.sin(a)} L${705+62*Math.cos(a)} ${190+62*Math.sin(a)}" stroke="#FFF4E0" stroke-width="4"/><text x="${705+80*Math.cos(a)}" y="${195+80*Math.sin(a)}" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF4E0" font-family="Atkinson Hyperlegible,sans-serif">${m[0]}</text>`; }).join('');
  s+=`<circle cx="705" cy="190" r="14" fill="#FFE7A8"/><path d="M705 190 L${705+40*Math.cos(new Date().getMonth()/12*2*Math.PI-Math.PI/2)} ${190+40*Math.sin(new Date().getMonth()/12*2*Math.PI-Math.PI/2)}" stroke="#3DF29A" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<g stroke="#FFF4E0" stroke-width="3" opacity=".7">${[0,1,2,3].map(k=>`<path d="M${600+k*9} 250 v24"/>`).join('')}<path d="M596 268 l40 -14"/></g>`;
  s+=saguaro(470,300,.7,night?'#1F6B42':'#2E8B57')+guideAt('tula','rest',140,150,170);
  return `<div class="zscene"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calendar Rock, a sandstone rock with a carved year wheel">${s}</svg></div>`; }
