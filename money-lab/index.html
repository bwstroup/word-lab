<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Lab">
<title>Money Lab</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Money Lab: Las Veritas. Patina and Metals. One column app; home = town + dial + zone tiles; station = guide bubble + play area. */
:root{
  --bg:#dfe7e1; --panel:#f6f7f3; --ink:#1d2924; --muted:#55645d; --line:#cbd3cc;
  --accent:#2f5d4b; --accent-ink:#f6f7f3; --lit:#cfdfd6; --lit-ink:#1c3a2e;
  --copper:#a8704f; --silver:#b3b9b9; --brass:#b39a5a; --warn:#8a4b2e;
  --display:"Zilla Slab",Rockwell,Georgia,serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
#app{max-width:860px;margin:0 auto;padding:10px 14px 40px;display:flex;flex-direction:column;gap:14px;min-height:100%}

.bar{display:flex;align-items:center;gap:10px;min-height:56px}
.bar h1{flex:1;min-width:0}
.bar .sub{display:block;font-family:var(--body);font-size:.8rem;font-weight:400;color:var(--muted)}
.back{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--accent);background:var(--panel);color:var(--accent);font-size:1.5rem;font-weight:700;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:.92rem;white-space:nowrap;font-variant-numeric:tabular-nums}
button.chip{min-height:44px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.muted{color:var(--muted)} .small{font-size:.86rem}

/* guide */
.guide{display:flex;gap:12px;align-items:flex-start}
.guide .face{width:86px;flex:none;border-radius:12px;overflow:hidden}
.guide .face svg{display:block;width:100%;height:auto}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;flex:1;min-width:0}
.bubble b.who{font-family:var(--display);display:block;font-size:.95rem;color:var(--accent)}

/* town */
.town{padding:0;overflow:hidden}
.town svg{display:block;width:100%;height:auto;max-height:36vh}
.town .ctl{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;height:40px;margin:0;accent-color:var(--accent)}
.eras{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.eras button{border:0;background:transparent;min-height:44px;font-size:.8rem;font-weight:700;color:var(--muted);border-radius:8px;padding:0}
.eras button.on{background:var(--lit);color:var(--lit-ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;min-height:96px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel)}
.tile b{font-family:var(--display);font-size:1.12rem}
.tile span{font-size:.84rem;color:var(--muted)}
.tile.open{border-color:var(--accent)}
.tile.soon{opacity:.62}
.tile .meter{margin-top:auto;display:flex;gap:4px}
.tile .meter i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.tile .meter i.on{background:var(--accent)}

/* station */
.rungs{display:flex;gap:6px}
.rungs button{flex:1;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:.92rem}
.rungs button.on{border-color:var(--accent);background:var(--lit);color:var(--lit-ink)}
.rungs button .tick{color:var(--accent)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--accent)} .dots i.now{box-shadow:0 0 0 2px var(--accent)}
.play{display:flex;flex-direction:column;gap:14px}
.q{font-size:1.15rem;font-weight:700}
.show{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:12px;background:var(--bg);border-radius:12px;min-height:84px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choices.one{grid-template-columns:1fr}
.choices button{min-height:60px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:1.08rem;padding:8px 12px}
.choices button.right{border-color:var(--accent);background:var(--lit)}
.choices button.wrong{opacity:.45}
.why{border-left:4px solid var(--accent);padding:8px 12px;background:var(--lit);color:var(--lit-ink);border-radius:0 10px 10px 0}
.why.try{border-color:var(--copper);background:#f1e4d8;color:#4f2f1c}
.big{min-height:60px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1rem;padding:10px 22px;align-self:center;min-width:180px}
.big.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pal button{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;min-width:64px;min-height:64px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--muted)}
.tray{min-height:96px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.tray button{border:0;background:transparent;padding:0;line-height:0}
.tray .hint{color:var(--muted);font-size:.9rem}
.coin-svg{display:block}
.pop{animation:pop .35s ease}
.wiggle{animation:wig .4s ease}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes wig{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.pop,.wiggle{animation:none}}

/* cards (close-up) */
.deck{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.deck{grid-template-columns:repeat(3,1fr)}}
.fact{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.fact ul{list-style:none;margin:0;padding:0;font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}

/* riddle */
.steppers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 8px}
@media (min-width:560px){.steppers{grid-template-columns:repeat(5,1fr)}}
.st{display:flex;flex-direction:column;align-items:center;gap:4px}
.st .n{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1}
.st .btns{display:flex;gap:6px}
.pm{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:1.4rem;font-weight:700}
.grid99{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.grid99 span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.66rem;border-radius:4px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-variant-numeric:tabular-nums}
.grid99 span.on{background:var(--lit);color:var(--lit-ink);box-shadow:none;font-weight:700}

/* bank */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amt{font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow button{min-height:48px;border-radius:10px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;padding:6px 14px}
.btnrow button:disabled{opacity:.35}
.meterbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meterbar i{display:block;height:100%;background:var(--accent)}
.log{list-style:none;margin:0;padding:0;font-size:.86rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}

/* overlay */
.over{position:fixed;inset:0;background:rgba(20,30,26,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.over .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.over .face{width:120px;border-radius:12px;overflow:hidden}
.over .face svg{display:block;width:100%;height:auto}

/* grown-ups */
.params{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.params input{width:92px;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);font:inherit;padding:4px 8px;color:inherit}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.3)}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.mission ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.mission label{display:flex;gap:10px;align-items:flex-start;min-height:44px}
.mission input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.count4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.count4 label{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--muted)}
.count4 input{min-height:48px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-size:1.2rem;padding:4px 10px;background:var(--panel);color:inherit;width:100%}
.stamp{display:inline-block;border:3px solid var(--copper);color:var(--copper);border-radius:10px;padding:4px 12px;font-family:var(--display);font-weight:700;transform:rotate(-4deg)}
.photo img{max-width:100%;border-radius:10px;display:block}

/* market (batch 2) */
.tag{display:flex;flex-direction:column;gap:2px;align-items:center;background:var(--panel);border:1.5px solid var(--brass);border-radius:8px;padding:10px 22px;min-width:170px;box-shadow:0 1px 0 var(--line)}
.tag b{font-family:var(--display);font-size:1.05rem}
.tag span{font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag .now{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--ink)}
.tag .was{text-decoration:line-through}
.rcpt{border-collapse:collapse;width:100%;max-width:340px;background:var(--panel);border-radius:8px;font-variant-numeric:tabular-nums}
.rcpt td{padding:6px 12px;border-bottom:1px dashed var(--line);text-align:left}
.rcpt td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.rcpt tr:last-child td{border-bottom:0}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.shop{grid-template-columns:repeat(4,1fr)}}
.item{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.item .price{font-family:var(--display);font-weight:700;font-size:1.25rem;margin-top:auto;font-variant-numeric:tabular-nums}
.item .big{min-width:0;width:100%;min-height:52px}
.item .big:disabled{opacity:.35}
.mine{display:flex;flex-direction:column;align-items:center;gap:2px;width:92px;text-align:center}
.over .rcpt{margin:0 auto}

/* patina pass (Nov 20): deep-green header band, verdigris ground, a metal edge on each open zone */
.bar{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:8px 10px 8px 14px}
.bar .sub{color:#cfdfd6}
.bar .back{border-color:#cfdfd6;background:transparent;color:var(--accent-ink)}
.tile.open{border-left:7px solid var(--accent)}
.tile.z-cu{border-left-color:var(--copper)} .tile.z-au{border-left-color:var(--brass)} .tile.z-ag{border-left-color:#8f9797} .tile.z-vg{border-left-color:#7fa595}
.town{border-color:#7fa595}
.bar .chip{color:var(--ink)}

/* what money means (batch 4) */
.means{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.means{grid-template-columns:repeat(3,1fr)}}
.mean{display:flex;flex-direction:column;gap:4px;text-align:left;min-height:92px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel)}
.mean b{font-family:var(--display);font-size:1.1rem}
.mean span{font-size:.86rem;color:var(--muted)}
.mean.on{border-color:var(--accent);background:var(--lit);box-shadow:inset 0 0 0 1.5px var(--accent)}
.mean.on span{color:var(--lit-ink)}
.big:disabled{opacity:.35}

/* budget the town (batch 5) */
.servs{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.servs{grid-template-columns:repeat(2,1fr)}}
.serv .row{align-items:center;justify-content:space-between;margin:6px 0}
.serv .lv{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.chip.btn{min-width:52px;min-height:48px;justify-content:center;cursor:pointer}
.chip.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.btn:disabled{opacity:.35}

/* planner picks and the stand (batch 6) */
.pp .opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
@media (min-width:640px){.pp .opts{grid-template-columns:repeat(3,1fr)}}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);text-align:left}
.opt b{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt.on{border-color:var(--accent);background:var(--lit);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chart{max-width:none;table-layout:fixed;font-size:.92rem}
.chart td{text-align:center!important;padding:6px 2px;border-bottom:1px dashed var(--line);font-weight:400!important;white-space:normal!important}
.chart td:first-child{text-align:left!important;font-weight:700!important;width:26%;padding-left:8px}
.chart td.sel{background:var(--lit);font-weight:700!important;color:var(--lit-ink)}
.split{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
@media (min-width:640px){.split{grid-template-columns:repeat(4,1fr)}}
.jar{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.jar .row{justify-content:space-between;align-items:center;margin:6px 0}
.jar b{font-family:var(--display)}
.jar .lv{font-family:var(--display);font-variant-numeric:tabular-nums}
.over .rcpt{margin-bottom:8px}
.jar .row{flex-wrap:nowrap;gap:6px}
.jar .chip.btn{min-width:44px;padding:0}

/* smoothie stand, wise cards (batch 8) */
.standart{width:100%;height:auto;display:block;border-radius:14px}
.artcard{padding:8px}
.artcard p{margin:6px 6px 2px}
.feature{display:block;width:100%;padding:8px;border-radius:18px;border:2px solid var(--brass);background:var(--panel);text-align:left;margin-bottom:12px}
.feature .cap{display:flex;flex-direction:column;gap:2px;padding:8px 8px 4px}
.feature .cap b{font-family:var(--display);font-size:1.35rem}
.feature .cap span{font-size:.92rem;color:var(--muted)}
h2.sec{font-family:var(--display);font-size:1.2rem;margin:14px 4px 2px}
.ings{display:flex;flex-wrap:wrap;gap:6px 12px;margin:6px 0}
.ing{display:inline-flex;align-items:center;gap:4px;font-size:.88rem}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.menu .chip.btn{min-height:44px}
.big.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.big.ghost:disabled{opacity:.35}
.wisecard .q{font-size:1.15rem}
input[type=text]{min-height:48px;border-radius:10px;border:1.5px solid var(--line);padding:8px 12px;font:inherit;width:100%;max-width:320px;margin:4px 0 10px;display:block;background:#fff;color:var(--ink)}
.over .card{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.over .face{transform:scale(.8);margin:-8px auto}

</style>
</head>

<linearGradient id="gag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6dada"/><stop offset=".55" stop-color="#b3b9b9"/><stop offset="1" stop-color="#8f9797"/></linearGradient>
<linearGradient id="gau" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cdb87c"/><stop offset=".55" stop-color="#b39a5a"/><stop offset="1" stop-color="#8f7a42"/></linearGradient>

<main id="app"></main>
<script>
/* Shopkeepers of Las Veritas: half-figure portraits, viewBox 0 0 200 230.
   SKELETON (shared by all six):
   Head unit H = 56 (crown y44 to chin y100). Face width W = 46 (x77..123), centre (100,72).
   Neck base (100,116), neck 20 wide.
   Shoulder joints (47,128) and (153,128): 106 apart = 2.3 W, both ON the torso silhouette.
   Their right arm (viewer's left) hangs: elbow (40,188), wrist below the frame.
   Their left arm (viewer's right) bends across: elbow (160,190), upper arm 62 = 1.1 H;

   Prop centreline x=94, gripped at y 166..188; it shows above and below the fist.

     forearm, cuff, prop, hand. */
var CAST=(function(){
  var LN='#2b2622';

  var TORSO2='M88 112 C74 116 56 120 47 128 C36 134 30 150 30 172 L28 230 L172 230 L170 172 C170 150 164 134 153 128 C144 120 126 116 112 112 Z';

  var HAIR={
    crop:'M76 69 C74 49 88 39 100 39 C112 39 126 49 124 69 C121 59 114 53 100 53 C86 53 79 59 76 69Z',
    high:'M76 68 C75 50 88 41 100 41 C112 41 125 50 124 68 C121 58 115 49 100 48 C85 49 79 58 76 68Z',
    wavy:'M74 71 C67 50 82 35 100 35 C118 35 133 50 126 71 C124 61 118 54 110 56 C104 50 95 50 90 56 C82 54 76 61 74 71Z',
    bun:'M75 70 C72 50 84 41 92 40 C90 29 110 29 108 40 C116 41 128 50 125 70 C121 60 114 54 100 54 C86 54 79 60 75 70Z',
    part:'M75 73 C71 50 86 39 100 39 C114 39 129 50 125 73 C122 62 113 52 100 49 C87 52 78 62 75 73Z',
    bob:'M73 87 C69 56 82 38 100 38 C118 38 131 56 127 87 C128 93 121 94 120 89 C122 70 116 56 100 54 C84 56 78 70 80 89 C79 94 72 93 73 87Z',
    afro:'M72 73 C64 47 82 31 100 31 C118 31 136 47 128 73 C125 62 116 54 100 54 C84 54 75 62 72 73Z',
    puffs:'M76 69 C74 52 86 43 100 43 C114 43 126 52 124 69 C121 60 114 55 100 55 C86 55 79 60 76 69Z M62 52 A11 11 0 1 1 84 52 A11 11 0 1 1 62 52Z M116 52 A11 11 0 1 1 138 52 A11 11 0 1 1 116 52Z',
    cap:'M76 67 C75 52 86 44 100 44 C114 44 125 52 124 67 C116 62 84 62 76 67Z',
    beard:'M76 69 C74 49 88 39 100 39 C112 39 126 49 124 69 L123.5 82 C121 96 109 103.5 100 103.5 C91 103.5 79 96 76.5 82Z M79 67 C84 56 116 56 121 67 L121 82 C118 91 108 96.5 100 96.5 C92 96.5 82 91 79 82Z'
  };
  function garment(c){
    var s='';
    if(c.g==='apron'||c.g==='overalls'){

  if(r===1){var worst=0;R.ch.forEach(function(c,i){if(c<R.ch[worst])worst=i;});var downs=[],ups=[];R.ch.forEach(function(c,i){if(i!==worst)(c<0?downs:ups).push('Year '+(i+1));});

function pickplan(id){var P=PLANS[id];if(!P){go('plan');return;}var st=ppState(id),pk=st.pick,tot=ppTotal(id,pk),left=P.limit-tot,miss=pk.filter(function(v){return v<0;}).length;
  var h=bar(P.t,'The Planner','plan')+guide('hattie','<p>'+esc(P.say)+'</p>','thinking');
  h+=P.cats.map(function(c,i){return '<div class="card pp"><h3>'+esc(c[0])+'</h3><div class="opts">'+c[1].map(function(o,j){var on=pk[i]===j;return '<button class="opt'+(on?' on':'')+'" data-pp="'+i+'" data-o="'+j+'" aria-pressed="'+on+'"><span>'+esc(o[0])+'</span><b>$'+o[1]+'</b></button>';}).join('')+'</div></div>';}).join('');
  h+='<div class="card play"><p class="q">Total so far: $'+tot+' of $'+P.limit+'. '+(left<0?'That is $'+(-left)+' too much.':'$'+left+' left.')+'</p>'+(miss?'<p class="small muted">'+miss+(miss===1?' row still needs':' rows still need')+' a choice.</p>':'')+(left<0?'<p class="small muted">Trade one choice for a cheaper one.</p>':'')+
    '<button class="big" data-act="ppdone"'+(miss||left<0?' disabled':'')+'>'+(st.done?'Show Hattie again':'This is my plan')+'</button>'+(st.done?'<p><span class="stamp">Plan made</span></p>':'')+'</div>';
  app.innerHTML=h;}
function ppSay(id,pk){var P=PLANS[id],tot=ppTotal(id,pk),lo=0,hi=0,top=null;
  P.cats.forEach(function(c,i){var pr=c[1].map(function(o){return o[1];}),v=c[1][pk[i]][1];if(v===Math.min.apply(null,pr))lo++;if(v===Math.max.apply(null,pr))hi++;if(!top||v>top[1])top=[c[1][pk[i]][0],v];});
  return '<p>Your plan costs <b>$'+tot+'</b> of $'+P.limit+(P.limit-tot?', with $'+(P.limit-tot)+' left over.':', using every dollar.')+'</p><p>You took the lowest-cost choice in '+lo+' of '+P.cats.length+' rows and the highest-cost choice in '+hi+'. Your biggest spend was “'+esc(top[0])+'” at $'+top[1]+'. Spending more there meant spending less somewhere else. Choosing that on purpose is what a plan is.</p><p class="muted small">Try a different plan. There is more than one good answer.</p>';}

function standState(){var s=S.stand;if(s.v!==2){var old=s.up||{};s.v=2;s.day=s.day||0;s.last=s.last||'';s.grow=s.grow||0;s.up={};if(old.pitcher)s.up.blender=1;if(old.sign)s.up.sign=1;s.book=[];s.pend=null;s.menu=[{r:'mango',pi:3,cups:8},{r:'kiwi',pi:3,cups:6}];s.helper=false;s.custom=null;s.draft={ing:[]};s.edit=-1;delete s.cups;delete s.pi;}return s;}
function standToday(){return new Date().toDateString();}
function standWx(day){return STAND.cycle[day%STAND.cycle.length];}
function standRec(id,custom){if(id==='mine')return custom?{id:'mine',n:custom.name,ing:custom.ing,col:'#5fa8a0',base:STAND.mineBase,d:'Your own invention.'}:null;return REC.filter(function(r){return r.id===id;})[0]||null;}
function recCost(rec){return rec.ing.reduce(function(a,i){return a+ING[i][1];},0)+STAND.cup;}
function standCap(up,helper){return (up&&up.blender?STAND.cap2:STAND.cap)+(helper?STAND.help:0);}
function standSlots(up){return 2+(up&&up.menu3?1:0)+(up&&up.menu4?1:0);}
function standDemand(rec,wi,pi,up){var w=(wi===2&&up&&up.awning)?1:wi;return Math.floor((rec.base[w]*STAND.F[w][pi]+5)/10)+(up&&up.sign?STAND.sign:0);}
function standDay(wi,menu,up,helper,taxRate,custom){var items=menu.map(function(m){var rec=standRec(m.r,custom),dm=standDemand(rec,wi,m.pi,up),sold=Math.min(m.cups,dm);return {r:m.r,n:rec.n,demand:dm,sold:sold,cups:m.cups,rev:sold*STAND.prices[m.pi],cost:m.cups*recCost(rec),waste:m.cups-sold};});
  var rev=items.reduce(function(a,x){return a+x.rev;},0),cost=items.reduce(function(a,x){return a+x.cost;},0),tax=Math.round(rev*taxRate/100),wage=helper?STAND.wage:0;
  return {items:items,rev:rev,tax:tax,cost:cost,wage:wage,profit:rev-tax-cost-wage};}
function standCups(s){return s.menu.reduce(function(a,m){return a+m.cups;},0);}

function standOpen(practice){var s=standState(),wi=standWx(s.day);if(!standValid(s))return null;
  var r=standDay(wi,s.menu,s.up,s.helper,S.params.tax,s.custom);if(practice)return r;
  if(s.pend||s.last===standToday()||S.cash<r.cost+r.wage)return null;
  S.fund+=r.tax;if(r.profit>0)s.pend={profit:r.profit,save:0,give:0,grow:0};else S.cash+=r.profit;
  s.book.unshift({d:s.day+1,w:wi,h:s.helper?1:0,it:r.items.map(function(x,i){return [x.n,s.menu[i].pi,x.cups,x.sold];}),pr:r.profit});if(s.book.length>14)s.book.length=14;
  s.day++;s.last=standToday();save();return r;}
function standSplit(){var s=standState(),p=s.pend;if(!p)return;var sp=p.profit-p.save-p.give-p.grow;if(sp<0)return;
  if(p.save>0){if(!S.bank)S.lastInt=Date.now();S.bank+=p.save;}S.fund+=p.give;s.grow+=p.grow;S.cash+=sp;

function standShop(s){var need={};s.menu.forEach(function(m){var rec=standRec(m.r,s.custom);if(rec&&m.cups)rec.ing.forEach(function(i){need[i]=(need[i]||0)+m.cups;});});return need;}

function riddleDraw(){var R=RIDDLE[run.rung],s={0:1},n=0;

  var ok=0,miss=[];document.querySelectorAll('#rg span').forEach(function(el,i){var on=!!s[i+1];el.className=on?'on':'';if(on)ok++;else miss.push(i+1);});
  $('#rv').textContent=n+(n===1?' coin pays ':' coins pay ')+ok+' of '+R.max+' amounts.';
  $('#rm').textContent=miss.length?'Can’t pay yet: '+miss.slice(0,8).map(function(m){return m+'¢';}).join(', ')+(miss.length>8?' and '+(miss.length-8)+' more.':'.'):'Every amount is covered.';
  var f=$('#fb');
  if(!miss.length&&n<=R.goal){ if(!run.solved){run.solved=true;f.innerHTML='<div class="why"><b>You solved it with '+n+' coins.</b> '+(run.rung===1?'That matches Dad’s answer. There are exactly two pockets of 10 that work.':run.rung===0?'Four pennies cover 1 to 4, a nickel gets you to 9, and two dimes carry you to 25.':'The half dollar does the work of two quarters.')+'</div><button class="big" data-act="riddledone" style="margin-top:12px">Finish rung</button>';snd.ok();} }
  else{run.solved=false;f.innerHTML=(!miss.length)?'<div class="why try">It works, but it uses '+n+' coins. The goal is '+R.goal+'.</div>':'';}
}

    '<p class="small muted">Next interest in '+left+' day'+(left===1?'':'s')+'. '+(S.bank>0?'If you leave '+fmtW(S.bank)+' alone for 4 more weeks it becomes about <b>'+fmtW(proj)+'</b>.':'Savings of 20 w would grow to 24.31 w in 4 weeks.')+'</p>'+

function missionTotal(){var t=0,parts=[],c={};COINS4.forEach(function(k){var e=$('#mc-'+k),n=Math.max(0,Math.min(999,parseInt(e&&e.value,10)||0));c[k]=n;t+=n*US[k].v;if(n)parts.push(n+' × '+fmtUS(US[k].v)+' = '+fmtUS(n*US[k].v));});

  h+='<div class="card play"><h3>About this app</h3><ul class="plain"><li>Batch 1: The Mint (8 stations, 3 rungs each, and a paper mission), the wallet and the bank.</li><li>Batch 2: The Market (8 stations, 3 rungs each, and two paper missions) and Samir’s Store, where workles can be spent. Store sales tax goes to the Town Fund.</li><li>Tax practice uses 7¢ on the dollar because it is easy to work with. Ohio’s state rate is 5.75%, and each county adds its own, so the rate on your receipt will differ.</li><li>Prices and candy-bar shares in the Market are made up for practice.</li><li>Batch 3: The Works (8 stations, 3 rungs each, and two paper missions). Wages, salaries and pay stubs are made up for practice. The pay stub shows one “taxes taken out” line. Real stubs list several.</li><li>Batch 4: The Four Jars (7 stations, 3 rungs each, two paper missions) and What Money Means. Interest rates, share prices and the saver-and-investor race are made up for practice. Nothing here is investment advice.</li><li>Batch 5: Town Hall (5 stations, 3 rungs each, two paper missions) and Budget the Town. Taxes are described by what they pay for and what they cost. The app takes no side on how high taxes should be, and Budget the Town has no right answer. Pay stubs and tax amounts are made up for practice, except the Social Security and Medicare rates.</li><li>Town Hall also teaches that taxes are required by law, so the people who spend them owe an open account: public records, audits, open meetings and elections (Watch the Money).</li><li>Batch 6: The Planner (3 stations, Party Planner, Grocery Trip, a paper mission) and Felix’s Stand. Nothing at the stand is random: the weather and the customer chart are posted and always right, so every result comes from his own choices. Stand profit is real workles. He splits it across Spend (wallet), Save (the Bank), Give (the Town Fund) and Grow (stand upgrades).</li><li>Batch 8: Safe Money with Officer Marcus (4 stations, two paper missions), a Wise or Unwise deck in every zone (36 cards: each names a choice, what it costs or gains, and a way back), and Felix’s Smoothie Stand, which replaces the lemonade stand. The stand has six plant-based recipes, a menu he chooses, a price and a batch size for each smoothie, a helper he can hire for a wage, six upgrades and a recipe book for inventing his own. Nothing at the stand is random. Recipe costs and customer numbers are made up. Peanut butter is in one recipe, and its name says so.</li><li>Batch 7: The Clinic (5 stations, 3 rungs each, two paper missions). Clinic prices, bills and insurance amounts are made up for practice. The app describes how care is paid for and takes no side on how a country should pay for it. It gives no medical advice, and it leaves all medicines to grown-ups.</li><li>What Money Means has no right answers and nothing is scored. Your child’s picks are saved on this device only.</li><li>Progress and workles are saved on this device only.</li><li>The savings rate is deliberately far higher than a real bank’s so a child can see compounding within weeks.</li><li>No real money is ever involved. Nothing is sold and no reward depends on chance.</li><li>Many stores round cash totals to the nearest nickel now that pennies are not made. It is a common practice, not a single national rule, so your store may differ.</li></ul></div>';
  h+='<div class="card play"><h3>Sources</h3><ul class="plain"><li>Coin sizes, weights, edges and metals: United States Mint, Coin Specifications.</li><li>Bill security features and paper: U.S. Currency Education Program (uscurrency.gov).</li><li>Cash rounding guidance: U.S. Treasury, penny production FAQs.</li><li>Last circulating penny (November 12, 2025) and rounding: Federal Reserve Bank of St. Louis, Page One Economics, May 2026.</li><li>2026 coin designs: United States Mint, Semiquincentennial Circulating Coin Program.</li><li>What Ohio taxes (food to take home, soft drinks, eating in): Ohio Department of Taxation, Information Release ST 2004-01.</li><li>Ohio sales tax rate: Ohio Department of Taxation.</li><li>What Money Means uses the five headings from the exercise “What Does Money Mean to You?” in The Gottman Institute’s “The Meaning of Money in Marriage” (Love, Security, Significance, Personal Development, Contribution). The card wording is our own, and their graphic is not used.</li><li>Ohio public records and open meetings: Ohio Revised Code 149.43 and 121.22 (Ohio Sunshine Laws). Audits of local governments: Ohio Auditor of State.</li><li>Scams, gift cards and phishing: Federal Trade Commission consumer advice. Family code words: FBI. Suspected counterfeit notes: Federal Reserve and U.S. Currency Education Program.</li><li>Doctor and nurse training: U.S. Bureau of Labor Statistics, Occupational Outlook Handbook. Emergency care regardless of ability to pay: the federal Emergency Medical Treatment and Labor Act. Medicare and Medicaid: Medicare.gov and Medicaid.gov. Generic medicines: U.S. Food and Drug Administration.</li><li>Social Security (6.2%) and Medicare (1.45%) payroll tax rates: Social Security Administration and IRS.</li><li>Ohio fuel tax, school funding and levies: Ohio Department of Transportation, Ohio Department of Education and Workforce, Ohio Department of Taxation.</li><li>Deposit insurance ($250,000 per depositor, per insured bank): Federal Deposit Insurance Corporation.</li><li>First UPC scan (Troy, Ohio, June 26, 1974): Smithsonian National Museum of American History.</li><li>Cocoa growing countries: International Cocoa Organization.</li></ul><p class="small muted">Facts checked November 2026. Tax rules and rates change, so recheck them each year.</p></div>';
  h+='<div class="card play"><h3>Felix’s Smoothie Stand</h3><p class="small muted">The stand opens for one real business day each real day, so workles can’t be farmed. Practice days are unlimited and move no money. Every recipe is plant based. Use this to let it open again today, for a demonstration or a second try.</p><p class="small muted">If the app inspires a real stand: in Ohio, a stand run by children under 12 at their own home needs no food licence (ORC 3717.42). Away from home, city or township rules may apply, and sweetened drinks are technically taxable. Check locally, and stay with your child.</p><button class="big" data-act="standagain">Let the stand open again today</button></div>';
  h+='<div class="card play"><h3>Start over</h3><p class="small muted">Erases all progress, workles and the mission photo on this device.</p><button class="big hold" id="reset" style="background:var(--warn)"><i></i><span>Hold for 3 seconds to reset</span></button></div>';
  app.innerHTML=h;
  var b=$('#reset'),t0=0,raf=0;function stop(){cancelAnimationFrame(raf);b.querySelector('i').style.width='0';t0=0;}
  function tick(){var f=(Date.now()-t0)/3000;b.querySelector('i').style.width=Math.min(100,f*100)+'%';if(f>=1){try{localStorage.removeItem(KEY);}catch(e){}S=load();go('home');return;}raf=requestAnimationFrame(tick);}
  b.addEventListener('pointerdown',function(){t0=Date.now();tick();});['pointerup','pointerleave','pointercancel'].forEach(function(e){b.addEventListener(e,stop);});
}

  if(d.sadd){var s6=standState();if(s6.menu.length<standSlots(s6.up)){var free=REC.filter(function(x){return !s6.menu.some(function(y){return y.r===x.id;});})[0];if(free){s6.menu.push({r:free.id,pi:3,cups:0});s6.edit=s6.menu.length-1;save();}}stand();return;}
  if(d.shelp){var s7=standState();s7.helper=!s7.helper;var cp=standCap(s7.up,s7.helper);for(var mi=s7.menu.length-1;mi>=0&&standCups(s7)>cp;mi--){s7.menu[mi].cups=Math.max(0,s7.menu[mi].cups-(standCups(s7)-cp));}save();snd.tap();stand();return;}
