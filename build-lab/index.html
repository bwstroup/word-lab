  <div class="mission">${toolIcon('colors')}<div><strong>Today's paper mission</strong><p>${esc(mission)}</p></div></div>
  <h2 class="sec">Activities</h2><div class="grid">
    <button class="card" data-act="build">${toolIcon('pencil','act-ico')}<h3>City Builder</h3><p>Zone homes, shops, factories and parks. Add schools, power and water, and watch your town grow.</p><span class="chip lvl">Math dial: level ${lvl('city')}</span></button>
    <button class="card" data-act="cmissions">${toolIcon('star','act-ico')}<h3>City Missions</h3><p>Five challenges, including opening Felix's Bakery in the perfect spot.</p><span class="chip lvl">${Object.keys(S.cSolved).length} of ${CMIS.length} done</span></button>
    <button class="card" data-act="whatif">${toolIcon('magnifier','act-ico')}<h3>What If?</h3><p>What happens when something is missing? Figure out how a town's parts connect.</p></button>
    <button class="card" data-act="notebook">${toolIcon('clipboard','act-ico')}<h3>Designer's Notebook</h3><p>All your saved cities, towns, blocks, rooms and plans.</p></button></div>
  <h2 class="sec">Map colors</h2><div class="digsafe"><p class="lede">City planners color their maps by what the land is used for. Use the same colors on your graph paper!</p><ul>${Object.values(ZT).map(z=>`<li><i style="background:${z.c}"></i><b>${z.n}</b></li>`).join('')}<li><i style="background:#8fb8ff"></i><b>Schools &amp; town buildings</b></li></ul></div>
  <h2 class="sec">Bea's planning facts</h2><div class="rules">${CFACTS.map(([t,d])=>`<div class="rule"><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>`;
  $('#view').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='build')openCity(C&&!C.mission?C:makeCity('starter'),false);else go(a)})}
function openCity(nc,fresh){const doIt=()=>{C=nc;cundo=[];cdirty=false;cfocus=null;bakeryCache.v=null;S.currentCity=C;persist();go('build')};
  if(fresh&&cdirty&&C&&!C.mission&&C!==nc){openModal(`<h3>Start a new city?</h3><p>Your current city has changes that aren't in your notebook yet.</p><div class="row"><button class="btn" data-x="save">Save it first</button><button class="btn primary" data-x="go">Start new</button></div>`,{save:()=>{closeModal();go('build');saveCityDialog()},go:()=>{closeModal();doIt()}})}else doIt()}
function viewCMissions(){const L=lvl('city');
  $('#view').innerHTML=`<div class="pagehead"><div><p class="eyebrow">City Builder</p><h2>City Missions</h2></div>${dialHTML('city')}</div>
  <section class="hero"><div class="pic">${mascot('bea')}</div><div class="bubble"><p class="who">Chief Bea</p><h2>The town council has some requests.</h2><p>Each mission starts with a town that needs your help. Read Bea's report as you build. It tells you what the townspeople are asking for.</p></div></section>
  <div class="grid nb">${CMIS.map(m=>{const c=makeCity(m.start),tw=cTwist(L,evalCity(c));return `<div class="card">${citySVG(c,{label:m.title})}<h3>${esc(m.title)}</h3>${S.cSolved[m.id]?`<span class="chip open">Done up to level ${S.cSolved[m.id]}</span>`:''}<p>${esc(m.story)}</p><ul class="clist">${m.goals.map(g=>`<li>${esc(g.t)}</li>`).join('')}${tw?`<li><b>Level ${L}:</b> ${esc(tw.t)}</li>`:''}</ul><button class="btn primary" data-cm="${m.id}">Start</button></div>`}).join('')}</div>`;
  wireDial($('#view'),'city',viewCMissions);
  $('#view').querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{const m=CMIS.find(x=>x.id===b.dataset.cm),c=makeCity(m.start);c.mission=m.id;openCity(c,true)})}
let wi={order:null,i:0,picked:null,right:0};
function viewWhatIf(){if(!wi.order)wi.order=shuffle(WHATIF.map((_,i)=>i));const Q=WHATIF[wi.order[wi.i%WHATIF.length]];if(!Q._o)Q._o=shuffle([Q.a,...Q.w]);
  const done=wi.picked!==null,ok=wi.picked===Q.a;
  $('#view').innerHTML=`<div class="pagehead"><div><p class="eyebrow">City Builder</p><h2>What If?</h2></div></div>
  <div class="det"><div class="panel qcard"><p class="score">Question ${wi.i%WHATIF.length+1} of ${WHATIF.length} · ${wi.right} right</p><h3>${esc(Q.q)}</h3>
    <div class="opts one">${Q._o.map(o=>`<button class="opt ${done&&o===Q.a?'right':done&&o===wi.picked?'wrong':''}" data-wo="${esc(o)}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div>
    ${done?`<div class="fb">${mascot('bea')}<div class="bubble"><b>${ok?pick(['Exactly right!','You think like a planner!','That\'s how it works!']):'Good guess! Here\'s what really happens:'}</b> ${esc(Q.e)}</div></div>`:''}
    <div class="qactions"><button class="btn primary" id="wiNext">${done?'Next question':'Skip'}</button></div></div>
    <div class="panel"><div class="tip">${mascot('bea')}<p>A town is like a machine with lots of parts. When one part is missing, other parts stop working too. Planners call this <b>systems thinking</b>.</p></div></div></div>`;
  $('#view').querySelectorAll('[data-wo]').forEach(b=>b.onclick=()=>{wi.picked=b.dataset.wo;if(wi.picked===Q.a)wi.right++;viewWhatIf()});
  $('#wiNext').onclick=()=>{wi.i++;wi.picked=null;if(wi.i%WHATIF.length===0){wi.order=shuffle(WHATIF.map((_,i)=>i));WHATIF.forEach(q=>q._o=null)}viewWhatIf()}}

function viewBuild(){if(!C)C=makeCity('starter');const L=lvl('city'),m=C.mission&&CMIS.find(x=>x.id===C.mission);
  $('#view').innerHTML=`<div class="pagehead"><div><p class="eyebrow">${m?'City Mission':'City Builder'}${C.id?' · from your notebook':''}</p><h2>${esc(m?m.title:(C.name||'Your City'))}</h2></div>${dialHTML('city')}</div>
  ${m?'<div class="chal" id="cbanner"></div>':''}
  <div class="draft"><div class="tools panel" id="ctools"></div>
    <div><div class="sheet rboard" id="cboard"></div>
      <div class="boardbar" role="group" aria-label="Map views"><span class="tl">Show</span>${[['none','Nothing extra'],['power','Power & water'],['school','Schools'],['fire','Fire safety'],['park','Parks'],['noise','Factory noise'],['bus','Bus stops']].map(([k,n])=>`<button class="toggle" data-cov="${k}" aria-pressed="${cov===k}">${n}</button>`).join('')}</div>
      <div class="boardbar"><button class="btn small" id="cUndo">Undo</button><button class="btn small" id="cNew">New city</button><span class="spacer"></span><button class="btn small primary" id="cSave">Save to notebook</button></div></div>
    <aside class="panel measure" id="cpanel"></aside></div>`;
  wireDial($('#view'),'city',viewBuild);
  $('#view').querySelectorAll('[data-cov]').forEach(b=>b.onclick=()=>{cov=b.dataset.cov;cfocus=null;$('#view').querySelectorAll('[data-cov]').forEach(x=>x.setAttribute('aria-pressed',x===b));updateCity()});
  $('#cUndo').onclick=()=>{if(!cundo.length){toast('Nothing to undo yet.','bea');return}C=JSON.parse(cundo.pop());updateCity()};
  $('#cNew').onclick=()=>openModal(`<h3>Start a new city?</h3><div class="row" style="justify-content:flex-start"><button class="btn" data-x="starter">Little starter town</button><button class="btn" data-x="basic">Almost empty</button><button class="btn" data-x="river">River valley</button></div><div class="row"><button class="btn" data-x="cancel">Cancel</button></div>`,{cancel:closeModal,starter:()=>{closeModal();openCity(makeCity('starter'),true)},basic:()=>{closeModal();openCity(makeCity('basic'),true)},river:()=>{closeModal();openCity(makeCity('river'),true)}});
  $('#cSave').onclick=saveCityDialog;wireCity($('#cboard'));renderCTools();updateCity()}
function renderCTools(){const zones=[['R','Homes'],['C','Shops'],['I','Factories'],['P','Park']],svc=['school','fire','hospital','library','solar','water','bus','hall','bakery'];
  const tips={road:'Drag to build roads. Roads over the river become bridges.',doze:'Drag to clear anything: roads, zones, buildings or trees.',R:'Drag to zone land for homes. Homes need a road, power and water.',C:'Drag to zone land for shops. Shops need customers nearby.',I:'Drag to zone land for factories. They make lots of jobs, but they\'re noisy.',P:'Drag to plant a park. Homes within 3 squares get a place to play.'};
  let s=`<div class="tblock"><p class="tl">Build</p><div class="toolrow">${[['road','Road','paint'],['doze','Bulldozer','erase']].map(([k,n,g])=>`<button class="tool ${ctool===k?'on':''}" data-ctool="${k}" aria-pressed="${ctool===k}">${toolGlyph(g)}${n}</button>`).join('')}</div></div>
  <div class="tblock"><p class="tl">Zones</p><div class="toolrow">${zones.map(([k,n])=>`<button class="tool ${ctool===k?'on':''}" data-ctool="${k}" aria-pressed="${ctool===k}"><i class="dot big sq" style="background:${ZT[k].c}"></i>${n}</button>`).join('')}</div></div>
  <div class="tblock"><p class="tl">Buildings</p><div class="ipieces">${svc.map(k=>`<button class="ipiece ${ctool===k?'on':''}" data-ctool="${k}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5" fill="${SV[k].c}"/>${cGlyph(k,12,12,16)}</svg><span>${SV[k].n}</span><span class="pr">${lvl('city')>=5?money(SV[k].cost):SV[k].w+' × '+SV[k].h}</span></button>`).join('')}</div></div>
  <div class="tip">${mascot('bea')}<p>${esc(tips[ctool]||`Tap the map to build a ${SV[ctool].n.toLowerCase()}. Put it next to a road!${SV[ctool].r?` It helps everything within ${SV[ctool].r} squares.`:''}`)}</p></div>`;
  const el=$('#ctools');el.innerHTML=s;el.querySelectorAll('[data-ctool]').forEach(b=>b.onclick=()=>{ctool=b.dataset.ctool;renderCTools()})}
function updateCity(){const E=evalCity(C),L=lvl('city'),m=C.mission&&CMIS.find(x=>x.id===C.mission);
  $('#cboard').innerHTML=citySVG(C,{E,ov:cov,cells:cfocus,bakeryRing:m&&m.id==='bakery'});
  let s=`<div class="meter"><span>Happiness</span><b>${E.bh.length?E.happy+'%':'—'}</b><div class="mbar"><i style="width:${E.happy}%"></i></div></div>`;
  s+=`<h3 style="margin-top:12px">Bea's report</h3><ul class="report">${E.report.slice(0,5).map((r,i)=>`<li class="sev${r.sev}"><p class="say">“${esc(r.say)}”<span> · ${esc(r.who)}</span></p>${r.tip?`<p class="tipx">${esc(r.tip)}</p>`:''}${r.cells&&r.cells.length?`<button class="btn small" data-show="${i}">Show me</button>`:''}</li>`).join('')}</ul>`;
  s+=`<div class="msec"><h3>${LEVELS[L].name}</h3>`;
  if(L===1)s+=`<p class="lede">Zoned lots with dashed edges are waiting for a road, power or water. When everything they need is there, buildings pop up!</p>`;
  if(L===2)s+=`<div class="totals"><span>Homes built</span><b>${E.bh.length}</b><span>People (4 per home)</span><b class="big">${E.people}</b><span>Shops built</span><b>${E.bs.length}</b><span>Factories built</span><b>${E.bf.length}</b><span>Jobs (3 per shop, 6 per factory)</span><b>${E.jobs}</b><span>Park squares</span><b>${E.parks.length}</b></div>`;
  if(L===3){const tot=C.W*C.H,used=E.zs.length;s+=`<p class="lede">Land use: how much of the town is each kind of zone?</p><div class="lu">${['R','C','I','P'].map(t=>{const n=E.zs.filter(z=>z.t===t).length;return `<span style="flex:${n||0.0001};background:${ZT[t].c}"></span>`}).join('')}</div>
    <div class="totals">${['R','C','I','P'].map(t=>`<span><i class="dot" style="background:${ZT[t].c}"></i>${ZT[t].n}</span><b>${E.zs.filter(z=>z.t===t).length} squares</b>`).join('')}<span>Town area</span><b>${C.W} × ${C.H} = ${tot}</b><span>Fraction zoned</span><b class="big">${used}/${tot}</b><span>Roads</span><b>${C.roads.length} squares</b></div>`}
  if(L===4){const pj=E.people?(E.jobs/E.people):0;s+=`<p class="lede">Ratios compare two numbers.</p><div class="totals"><span>People : jobs</span><b class="big">${E.people} : ${E.jobs}</b><span>Jobs for every 10 people</span><b>${E.people?Math.round(pj*10):0}</b><span>People per park square</span><b>${E.parks.length?Math.round(E.people/E.parks.length):'no parks'}</b><span>Students (1 in 4 people)</span><b>${Math.round(E.people/4)}</b><span>Schools</span><b>${C.bldgs.filter(b=>b.k==='school').length}</b></div><p class="note">${E.people&&E.jobs*10<E.people*6?'Fewer than 6 jobs for every 10 people. Some workers need jobs!':E.people?'Good balance of jobs and people.':''}</p>`}
  if(L===5)s+=`<p class="lede">Each month, people and businesses pay taxes, and the town pays to run everything.</p><div class="totals"><span>Built so far</span><b>${money(E.buildCost)}</b><span>Taxes from ${E.people} people ($50 each)</span><b>${money(E.people*50)}</b><span>Taxes from shops ($200) and factories ($400)</span><b>${money(E.bs.length*200+E.bf.length*400)}</b>${E.bakery&&E.bakery.active?`<span>Bakery sales tax</span><b>${money(E.bakery.customers*15)}</b>`:''}<span>Upkeep (buildings, roads, parks)</span><b>−${money(E.upkeep)}</b><span>Each month</span><b class="big" style="color:${E.net>=0?'var(--mint)':'var(--berry)'}">${E.net>=0?'+':'−'}${money(Math.abs(E.net))}</b></div>`;
  $('#cpanel').innerHTML=s+'</div>';
  $('#cpanel').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const r=E.report[+b.dataset.show];cfocus=r.cells;if(r.ov){cov=r.ov;$('#view').querySelectorAll('[data-cov]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cov===cov))}updateCity()});
  if(m){const tw=cTwist(L,E),goals=m.goals.map(g=>({t:g.t,ok:!!g.ok(E,C),prog:g.prog?g.prog(E,C):''}));if(tw)goals.push({t:tw.t,ok:tw.ok,prog:tw.prog,twist:true});const all=goals.every(g=>g.ok);
    $('#cbanner').innerHTML=`${mascot('bea').replace('<svg','<svg class="m"')}<div><p class="eyebrow">City mission</p><h3>${esc(m.title)}</h3><p>${esc(m.story)}</p><ul class="goals">${goals.map(g=>`<li><span class="st ${g.ok?'done':''}">${g.ok?'Done':g.twist?'Level '+L+' goal':'To do'}</span><span>${esc(g.t)}</span>${g.prog&&!g.ok?`<span class="prog mono">${esc(g.prog)}</span>`:''}</li>`).join('')}</ul></div>`;
    const key=m.id+L;if(all&&!cDone[key]){cDone[key]=true;S.cSolved[m.id]=Math.max(S.cSolved[m.id]||0,L);persist();
      if(L<5&&!cPeek[L]){cPeek[L]=true;toast(`Mission complete! The town council cheers! Want to peek at level ${L+1}?`,'bea',[{label:'Peek',primary:true,fn:()=>showPeek('city',viewBuild)},{label:'Keep building'}])}else toast('Mission complete! The town council cheers!','bea')}
    if(!all)cDone[key]=false}
  S.currentCity=C;persist()}
function wireCity(el){let act=null;
  const cell=e=>{const svg=el.querySelector('svg'),r=svg.getBoundingClientRect();return [Math.floor((e.clientX-r.left)/r.width*C.W),Math.floor((e.clientY-r.top)/r.height*C.H)]};
  const bAt=(x,y)=>C.bldgs.findIndex(b=>bCells(b).some(([a,c])=>a===x&&c===y));
  const isRd=(x,y)=>C.roads.includes(x+','+y);
  const apply=(x,y)=>{if(x<0||y<0||x>=C.W||y>=C.H)return false;const k=x+',',key=x+','+y,t=C.terrain[y*C.W+x];
    if(ctool==='road'){if(isRd(x,y)||C.zones[key]||bAt(x,y)>=0)return false;if(t==='t')C.terrain[y*C.W+x]='g';C.roads.push(key);return true}
    if(ctool==='doze'){if(isRd(x,y)){C.roads=C.roads.filter(r=>r!==key);return true}if(C.zones[key]){delete C.zones[key];return true}const i=bAt(x,y);if(i>=0){C.bldgs.splice(i,1);return true}if(t==='t'){C.terrain[y*C.W+x]='g';return true}return false}
    if(ZT[ctool]){if(t==='w'||isRd(x,y)||bAt(x,y)>=0||C.zones[key]===ctool)return false;if(t==='t')C.terrain[y*C.W+x]='g';C.zones[key]=ctool;return true}return false};
  el.addEventListener('pointerdown',e=>{const [x,y]=cell(e);if(x<0||y<0||x>=C.W||y>=C.H)return;e.preventDefault();cfocus=null;
    if(ctool==='road'||ctool==='doze'||ZT[ctool]){act={before:JSON.stringify(C),ch:false,last:[x,y]};act.ch=apply(x,y);if(act.ch)updateCity();try{el.setPointerCapture(e.pointerId)}catch(_){}return}
    const S2=SV[ctool];for(let yy=y;yy<y+S2.h;yy++)for(let xx=x;xx<x+S2.w;xx++){if(xx>=C.W||yy>=C.H||C.terrain[yy*C.W+xx]==='w'||isRd(xx,yy)||C.zones[xx+','+yy]||bAt(xx,yy)>=0){toast(`A ${S2.n.toLowerCase()} needs ${S2.w} × ${S2.h} empty squares of land. The bulldozer can clear space.`,'bea');return}}
    if(ctool==='bakery'&&C.bldgs.some(b=>b.k==='bakery')){cPush();C.bldgs=C.bldgs.filter(b=>b.k!=='bakery')}else cPush();
    for(let yy=y;yy<y+S2.h;yy++)for(let xx=x;xx<x+S2.w;xx++)if(C.terrain[yy*C.W+xx]==='t')C.terrain[yy*C.W+xx]='g';C.bldgs.push({k:ctool,x,y});updateCity()});
  el.addEventListener('pointermove',e=>{if(!act)return;const [x,y]=cell(e);if(x===act.last[0]&&y===act.last[1])return;
    cellsOnLine(act.last[0],act.last[1],x,y).forEach(([cx,cy],i,arr)=>{if(i>0&&ctool==='road'&&Math.abs(cx-arr[i-1][0])+Math.abs(cy-arr[i-1][1])===2)act.ch=apply(cx,arr[i-1][1])||act.ch;act.ch=apply(cx,cy)||act.ch});act.last=[x,y];if(act.ch)updateCity()});
  const end=()=>{if(act&&act.ch){cundo.push(act.before);if(cundo.length>60)cundo.shift();cdirty=true}act=null};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function saveCityDialog(){const m=C.mission&&CMIS.find(x=>x.id===C.mission);
  openModal(`<h3>Save to your notebook</h3><label>Name your city<input id="svName" maxlength="40" value="${esc(C.name||(m?m.title:''))}" placeholder="Felix City"></label>
  <label>Why did you plan it this way?<textarea id="svWhy" maxlength="600" placeholder="I put the factories by the river so...">${esc(C.why||'')}</textarea></label>
  <div class="row"><button class="btn" data-x="cancel">Cancel</button>${C.id?'<button class="btn" data-x="copy">Save as a copy</button>':''}<button class="btn primary" data-x="save">Save</button></div>`,{cancel:closeModal,save:()=>doCitySave(false),copy:()=>doCitySave(true)})}
function doCitySave(copy){const name=$('#svName').value.trim()||'Untitled city';C.name=name;C.why=$('#svWhy').value.trim();if(!C.id||copy)C.id='c'+Date.now();C.updated=Date.now();
  const rec=clone(C),i=S.designs.findIndex(x=>x.id===C.id);if(i>=0)S.designs[i]=rec;else S.designs.unshift(rec);cdirty=false;persist();closeModal();toast(`Saved "${esc(name)}" to your notebook.`,'bea');viewBuild()}

/* ============ boot ============ */
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
render();
</script>
