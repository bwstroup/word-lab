<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Build Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#123a6b">
<link rel="apple-touch-icon" href="icon-180.png">
<style>[hidden]{display:none!important}</style>
<title>Felix's Build Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a drafting table. Blueprint-blue field with a soft grid, chunky rounded panels,
   tools on the left, the plan sheet in the middle, live measurements on the right. */
:root{
  --field:#123a6b; --field-2:#0e305b; --panel:#194a84; --panel-2:#21589a;
  --grid:rgba(214,232,255,.08); --grid-strong:rgba(214,232,255,.18);
  --chalk:#f1f7ff; --chalk-dim:#b9cfec; --chalk-faint:#86a6cf;
  --tang:#ff9b45; --tang-ink:#3a1c00; --mint:#62dcb4; --mint-ink:#05352a;
  --berry:#ff7aa2; --ink:#0d2a4f;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--field);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;color:var(--chalk);font:17px/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.eyebrow{font:600 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim)}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 16px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{display:block;font:800 1.55rem/1 var(--display)}
.brand span{display:block;font:500 .68rem/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.crumbs button{background:var(--field-2);border:2px solid var(--grid-strong);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer;font:700 .95rem/1 var(--display)}
.crumbs .here{border-color:var(--tang);color:var(--tang)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:2px solid var(--chalk-dim);background:transparent;cursor:pointer;font:700 1.05rem/1 var(--display);color:var(--chalk)}
.btn.primary{background:var(--tang);border-color:var(--tang);color:var(--tang-ink)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mint);outline-offset:3px}

/* speech bubble */
.bubble{background:var(--chalk);color:var(--ink);border-radius:22px;padding:16px 20px;position:relative;min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;top:34px;border:12px solid transparent;border-right-color:var(--chalk);border-left:0}
.bubble .who{font:600 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#4a6a95;margin-bottom:6px}
.bubble h1{font-size:clamp(1.7rem,4vw,2.5rem);margin-bottom:6px}
.bubble h2{font-size:1.5rem;margin-bottom:4px}

.hero{display:flex;gap:18px;align-items:center;margin-bottom:26px}
.hero .pic{flex:none;width:clamp(96px,16vw,150px)}
.hero .pic svg{width:100%;height:auto;display:block}
@media (max-width:560px){.hero{flex-direction:column;align-items:stretch}.hero .pic{align-self:center}.bubble::before{display:none}}

.sec{font-size:1.35rem;margin:6px 0 12px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;border-top:2px dashed var(--grid-strong)}

/* cards */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-bottom:28px}
.card{background:var(--panel);border:2px solid var(--grid-strong);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
button.card{cursor:pointer}
button.card:hover{border-color:var(--chalk-dim)}
.card h3{font-size:1.3rem}
.card p{color:var(--chalk-dim);font-size:.98rem}
.card .port{width:96px;height:96px;border-radius:50%;background:var(--field-2);border:2px solid var(--grid-strong);display:grid;place-items:center;overflow:hidden}
.card .port svg{width:88px;height:88px}
.card.locked{border-style:dashed;background:transparent}
.zones{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:28px}
.zones .feature{grid-column:span 2;flex-direction:row;align-items:center;gap:20px;border-color:var(--tang);background:var(--panel-2)}
.zones .feature:last-child:nth-child(odd){grid-column:1/-1}
.zones .feature .port{width:120px;height:120px;flex:none}.zones .feature .port svg{width:110px;height:110px}
.zones .feature .ftext{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.zones .feature h3{font-size:1.7rem}
.zones .feature .go{flex:none}
@media (max-width:860px){.zones{grid-template-columns:repeat(2,minmax(0,1fr))}.zones .feature{grid-column:1/-1}}
@media (max-width:520px){.zones{grid-template-columns:minmax(0,1fr)}.zones .feature{flex-direction:column;align-items:flex-start}}
.card.locked .port{opacity:.75}
.chip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border-radius:999px;padding:4px 10px;font:600 .72rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.chip.open{background:var(--mint);color:var(--mint-ink)}
.chip.build{border:2px solid var(--tang);color:var(--tang);background:repeating-linear-gradient(-45deg,rgba(255,155,69,.18) 0 6px,transparent 6px 12px)}
.chip.lvl{background:var(--field-2);color:var(--chalk);border:1px solid var(--grid-strong)}
.act-ico{width:56px;height:56px}
.mission{background:var(--field-2);border:2px dashed var(--tang);border-radius:22px;padding:18px;display:flex;gap:16px;align-items:center;margin-bottom:28px}
.mission svg{flex:none;width:64px;height:64px}
.mission p{color:var(--chalk-dim)}
.mission strong{color:var(--chalk);font-family:var(--display);font-size:1.2rem;display:block}

/* math dial */
.dialbox{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.dial{display:flex;gap:6px;align-items:flex-start}
.knob{width:62px;min-height:62px;border-radius:16px;border:2px solid var(--grid-strong);background:var(--field-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px}
.knob b{font:800 1.35rem/1 var(--display)}
.knob span{font:500 .62rem/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--chalk-dim)}
.knob.on{background:var(--tang);border-color:var(--tang);color:var(--tang-ink)}
.knob.on span{color:var(--tang-ink)}
.peek{background:none;border:0;color:var(--mint);font:700 1rem/1.2 var(--display);cursor:pointer;text-decoration:underline;text-underline-offset:4px;padding:8px 2px;min-height:44px}
.dial-label{font:600 .72rem/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}
@media (max-width:420px){.knob{width:52px;min-height:56px}.knob span{font-size:.55rem}}

/* drafting table */
.pagehead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.pagehead h2{font-size:clamp(1.5rem,3.4vw,2.1rem)}
.draft{display:grid;grid-template-columns:210px minmax(0,1fr) 270px;gap:14px;align-items:start}
@media (max-width:1100px){.draft{grid-template-columns:minmax(0,1fr) 280px}.tools{grid-column:1/-1}}
@media (max-width:760px){.draft{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:2px solid var(--grid-strong);border-radius:20px;padding:14px;min-width:0}
.tools{display:flex;flex-direction:column;gap:12px}
.toolrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:1100px){.tools{flex-direction:row;flex-wrap:wrap;align-items:flex-start}.toolrow{grid-template-columns:repeat(6,minmax(0,1fr));flex:1 1 100%}}
@media (max-width:620px){.toolrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tool{border:2px solid var(--grid-strong);background:var(--field-2);border-radius:14px;min-height:58px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 .9rem/1.1 var(--display)}
.tool svg{width:24px;height:24px}
.tool.on{border-color:var(--tang);background:var(--tang);color:var(--tang-ink)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:1100px){.palette{flex:1 1 100%}}
.swatch{display:flex;align-items:center;gap:6px;border:2px solid var(--grid-strong);background:var(--field-2);border-radius:999px;padding:5px 10px 5px 6px;min-height:40px;cursor:pointer;font:700 .88rem/1 var(--body)}
.swatch i{width:20px;height:20px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.6)}
.swatch.on{border-color:var(--tang);box-shadow:0 0 0 2px var(--tang) inset}
.fpiece{border:2px solid var(--grid-strong);background:var(--field-2);border-radius:12px;width:62px;height:62px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 .66rem/1 var(--mono);color:var(--chalk-dim)}
.fpiece svg{width:34px;height:34px}
.fpiece.on{border-color:var(--tang);color:var(--tang)}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;color:var(--chalk-dim)}
.tip svg{flex:none;width:40px;height:40px}
@media (max-width:1100px){.tip{flex:1 1 100%}}

.sheet{background:var(--field-2);border:2px solid var(--chalk-faint);border-radius:18px;padding:10px;position:relative}
.sheet svg.plan{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.boardbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.boardbar .spacer{flex:1}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--grid-strong);background:var(--field-2);cursor:pointer;font:700 .95rem/1 var(--display)}
.toggle[aria-pressed="true"]{border-color:var(--tang);color:var(--tang)}

/* plan svg */
.pg-bg{fill:var(--field-2)}
.pg-grid{stroke:var(--grid-strong);stroke-width:1;fill:none}
.pg-room{opacity:.5}
.pg-wall{stroke:var(--chalk);stroke-width:6;stroke-linecap:square;fill:none}
.pg-door{stroke:var(--chalk);stroke-width:2.5;fill:none;stroke-linecap:round}
.pg-arc{stroke:var(--chalk);stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.pg-win{fill:var(--field-2);stroke:var(--chalk);stroke-width:2}
.pg-winline{stroke:var(--mint);stroke-width:2.5}
.pg-furn .fx{fill:rgba(14,48,91,.65);stroke:var(--chalk);stroke-width:2;stroke-linejoin:round}
.pg-furn .fl{fill:none;stroke:var(--chalk);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ftxt{font:700 10px var(--mono);fill:var(--chalk);text-anchor:middle;dominant-baseline:central}
.pg-label{font:700 13px var(--body);fill:var(--chalk);paint-order:stroke;stroke:var(--field-2);stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.pg-sub{font:600 11px var(--mono);fill:var(--tang);paint-order:stroke;stroke:var(--field-2);stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.pg-num{font:600 12px var(--mono);fill:var(--chalk);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--field-2);stroke-width:3px}
.pg-hl{fill:none;stroke:var(--tang);stroke-width:4;stroke-dasharray:8 6;animation:march 1s linear infinite}
.pg-ok{fill:none;stroke:var(--mint);stroke-width:5}
.pg-mirror{stroke:var(--tang);stroke-width:2;stroke-dasharray:6 6}
.pg-ruler{stroke:var(--mint);stroke-width:4;stroke-linecap:round}
.pg-rtick{stroke:var(--mint);stroke-width:2}
.pg-rlab{font:600 13px var(--mono);fill:var(--mint-ink);text-anchor:middle;dominant-baseline:central}
.pg-rpill{fill:var(--mint)}
@keyframes march{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.pg-hl{animation:none}}

/* measurement panel */
.measure h3{font-size:1.2rem;margin-bottom:4px}
.measure .lede{font-size:.92rem;color:var(--chalk-dim);margin-bottom:10px}
.rooms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rooms li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.95rem;background:var(--field-2);border-radius:12px;padding:7px 10px}
.rooms li i{width:14px;height:14px;border-radius:50%}
.rooms .num{font:600 .85rem/1.2 var(--mono);color:var(--tang);text-align:right;font-variant-numeric:tabular-nums}
.rooms .sub{grid-column:2/-1;font:500 .78rem/1.3 var(--mono);color:var(--chalk-dim)}
.rooms select{grid-column:2/-1;background:var(--panel);color:var(--chalk);border:1px solid var(--grid-strong);border-radius:8px;padding:6px;font:600 .85rem var(--body);min-height:36px}
.totals{margin-top:12px;border-top:2px dashed var(--grid-strong);padding-top:10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.95rem}
.totals b{font:600 .95rem var(--mono);color:var(--chalk);text-align:right;font-variant-numeric:tabular-nums}
.totals .big{font:800 1.3rem var(--display);color:var(--tang)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.seg button{border:2px solid var(--grid-strong);background:var(--field-2);border-radius:999px;min-height:40px;padding:0 12px;cursor:pointer;font:600 .85rem var(--mono)}
.seg button.on{border-color:var(--tang);color:var(--tang)}
.bar{display:flex;height:18px;border-radius:999px;overflow:hidden;margin:10px 0 4px;background:var(--field-2)}
.bar span{display:block;height:100%}
.note{font-size:.88rem;color:var(--chalk-dim);margin-top:10px}
.empty{color:var(--chalk-dim);font-size:.95rem;background:var(--field-2);border-radius:12px;padding:12px}

/* challenge banner */
.chal{display:flex;gap:14px;align-items:flex-start;background:var(--panel-2);border:2px solid var(--tang);border-radius:20px;padding:14px;margin-bottom:14px}
.chal svg.m{flex:none;width:64px;height:64px}
.chal h3{font-size:1.3rem}
.chal p{color:var(--chalk-dim);font-size:.96rem}
.chal ul{margin:6px 0 0;padding-left:20px;color:var(--chalk-dim);font-size:.94rem}
.twist{margin-top:8px;display:flex;gap:8px;align-items:center;font-weight:700;flex-wrap:wrap}
.twist .st{font:600 .75rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--field-2);color:var(--chalk-dim)}
.twist .st.done{background:var(--mint);color:var(--mint-ink)}

/* detective */
.det{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.det{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:2px solid var(--grid-strong);background:var(--field-2);border-radius:999px;min-height:42px;padding:0 14px;cursor:pointer;font:700 .95rem var(--display)}
.tabs button.on{border-color:var(--tang);color:var(--tang)}
.qcard h3{font-size:1.45rem;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:2px solid var(--grid-strong);background:var(--field-2);border-radius:14px;min-height:56px;padding:8px;cursor:pointer;font:700 1.1rem/1.2 var(--display)}
.opt.right{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.opt.wrong{border-color:var(--berry);color:var(--berry)}
.tapnote{background:var(--field-2);border:2px dashed var(--tang);border-radius:14px;padding:12px;font-weight:700;color:var(--tang)}
.fb{margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.fb svg{flex:none;width:52px;height:52px}
.fb .bubble{padding:12px 14px;font-size:.98rem}
.fb .bubble::before{top:16px}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.score{font:600 .8rem var(--mono);color:var(--chalk-dim);letter-spacing:.06em;text-transform:uppercase}

/* tool shed */
.kit{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.kit .card{gap:8px}
.kit .top{display:flex;gap:12px;align-items:center}
.kit .top svg{flex:none;width:70px;height:70px;background:var(--field-2);border-radius:16px;padding:6px}
.kit ol{margin:0;padding-left:20px;color:var(--chalk-dim);font-size:.95rem;display:flex;flex-direction:column;gap:3px}
.kit .pm{background:var(--field-2);border-radius:12px;padding:10px;font-size:.94rem;border-left:4px solid var(--tang)}
.kit .pm b{color:var(--tang);font-family:var(--display)}
.have{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;min-height:40px}
.have input{width:22px;height:22px;accent-color:var(--mint)}

/* notebook */
.nb .card svg.plan{width:100%;height:auto;border-radius:12px}
.nb .why{font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* toast + modal */
.toast{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast .in{pointer-events:auto;max-width:560px;width:100%;display:flex;gap:12px;align-items:center;background:var(--chalk);color:var(--ink);border-radius:20px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast .in svg{flex:none;width:48px;height:48px}
.toast .in p{flex:1;font-weight:700}
.toast .acts{display:flex;gap:6px;flex-wrap:wrap}
.toast .btn{color:var(--ink);border-color:#9fb6d6;min-height:42px}
.toast .btn.primary{color:var(--tang-ink)}
.modal{position:fixed;inset:0;background:rgba(6,22,44,.7);display:grid;place-items:center;z-index:50;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .box{background:var(--panel);border:2px solid var(--chalk-faint);border-radius:22px;padding:20px;width:min(520px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.modal h3{font-size:1.5rem}
.modal label{font:700 .95rem var(--display);display:flex;flex-direction:column;gap:6px}
.modal input,.modal textarea{background:var(--field-2);border:2px solid var(--grid-strong);border-radius:12px;color:var(--chalk);font:1.05rem var(--body);padding:10px 12px}
.modal textarea{min-height:110px;resize:vertical}
.modal .row{justify-content:flex-end}
.peekbox{display:flex;gap:14px;align-items:flex-start}
.rboard{touch-action:none;user-select:none;-webkit-user-select:none}
svg.room{width:100%;height:auto;display:block}
.boardbar .seg{margin:0}
.tblock{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:1100px){.tblock{flex:1 1 100%}}
.tl{font:600 .7rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}
.small{font-size:.84rem;color:var(--chalk-dim)}
.selcard{background:var(--field-2);border:2px solid var(--tang);border-radius:14px;padding:10px}
.selcard b{font:700 1.15rem var(--display)}
.gchips{display:flex;flex-wrap:wrap;gap:6px}

function rectsToLevel(k,def,ox,oy){const l=blankLevel(k);
  def.rooms.forEach(r=>{for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)l.cells[(x+ox)+','+(y+oy)]=r.t;if(r.n&&r.n!==RT[r.t].name)l.labels[(r.x+ox)+','+(r.y+oy)]=r.n});
  def.rooms.forEach((r,i)=>def.rooms.forEach((q,j)=>{if(j<=i)return;
    if(r.x+r.w===q.x||q.x+q.w===r.x){const X=r.x+r.w===q.x?q.x:r.x;for(let y=Math.max(r.y,q.y);y<Math.min(r.y+r.h,q.y+q.h);y++)l.walls.push(`v:${X+ox}:${y+oy}`)}
    if(r.y+r.h===q.y||q.y+q.h===r.y){const Y=r.y+r.h===q.y?q.y:r.y;for(let x=Math.max(r.x,q.x);x<Math.min(r.x+r.w,q.x+q.w);x++)l.walls.push(`h:${x+ox}:${Y+oy}`)}}));
  const sh=e=>{const [t,x,y]=e.split(':');return `${t}:${+x+ox}:${+y+oy}`};
  l.doors=(def.doors||[]).map(sh);l.windows=(def.windows||[]).map(sh);l.furn=clone(def.furn||[]).map(f=>Object.assign(f,{x:f.x+ox,y:f.y+oy}));return l}

  zoom=Math.max(1,Math.min(5,z));sizeBoard();const r2=svg.getBoundingClientRect();wrap.scrollLeft+=r2.left+fx*r2.width-cx;wrap.scrollTop+=r2.top+fy*r2.height-cy}

function shiftEdgeK(k,dx,dy){const [t,x,y]=k.split(':');return `${t}:${+x+dx}:${+y+dy}`}

function growLot(side){const n=4,horiz=side==='l'||side==='r';if(horiz?D.cols+n>48:D.rows+n>36){toast(horiz?'The lot is as wide as it can get!':'The lot is as long as it can get!');return}
  pushUndo();const dx=side==='l'?n:0,dy=side==='t'?n:0;D.levels.forEach(l=>shiftLevel(l,dx,dy));if(D.before)D.before.levels.forEach(l=>shiftLevel(l,dx,dy));

function fitLot(){let x0=1e9,y0=1e9,x1=-1,y1=-1;const see=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)};

  all.forEach(l=>{Object.keys(l.cells).forEach(k=>{const [x,y]=k.split(',').map(Number);see(x,y)});l.furn.forEach(f=>{const [w,h]=furnSize(f);see(f.x,f.y);see(f.x+w-1,f.y+h-1)});l.notes.forEach(n=>see(n.x,n.y));

function moveStroke({gx,gy}){const s=stroke,lev=LV();if(!s||s.once)return;const cx=Math.floor(gx),cy=Math.floor(gy);
  if(s.tool==='paint'||s.tool==='erase'){if(cx===s.last[0]&&cy===s.last[1])return;let any=false;cellsOnLine(s.last[0],s.last[1],cx,cy).forEach(([x,y])=>{any=applyCell(x,y)||any});s.last=[cx,cy];if(any){s.changed=true;updateBoard()}}
  else if(s.tool==='rect'){const x=clampI(cx,D.cols),y=clampI(cy,D.rows);if(rectPrev&&(x===(s.x0<=x?rectPrev.x1:rectPrev.x0))&&(y===(s.y0<=y?rectPrev.y1:rectPrev.y0)))return;fillRect(x,y)}

function endStroke(){const s=stroke;stroke=null;if(!s)return;if(s.changed&&chalOpen&&D.challenge){chalOpen=false;renderChallenge()}if(s.tool==='rect'){rectPrev=null;updateBoard()}if(s.changed){undoStack.push(s.before);if(undoStack.length>60)undoStack.shift();dirty=true}}
function fillRect(x1,y1){const s=stroke,lev=LV(),base=JSON.parse(s.base);lev.cells=base.c;
  const x0=Math.min(s.x0,x1),x2=Math.max(s.x0,x1),y0=Math.min(s.y0,y1),y2=Math.max(s.y0,y1);
  const boxes=[[x0,x2]];if(mirror){const mx0=D.cols-1-x2,mx2=D.cols-1-x0;if(mx0>x2||mx2<x0)boxes.push([mx0,mx2])}

function houseStats(d){const per=d.levels.map(l=>{const P=deriveDesign(d,l);return {l,P,inA:P.rooms.filter(r=>!r.out).reduce((a,r)=>a+r.area,0),outA:P.rooms.filter(r=>r.out).reduce((a,r)=>a+r.area,0)}});

      out.push({ok:false,stairs:1,t:'Stairs that go nowhere',det:`The stairs on the ${nlo} lead into ${ri>=0?'the '+lc(P.rooms[ri].name):'thin air'} on the ${nhi}!`,why:`Put stairs on the ${nhi} right on top of them. The faint outline shows where.`})}

    else out.push({ok:false,stairs:1,t:`How do people get to the ${lo.k==='base'?nlo:nhi}?`,det:`There are no stairs between the ${nlo} and the ${nhi}.`,why:hi.k==='attic'?'Add stairs or a ladder on both floors, in the same spot.':'Add stairs on both floors, in the same spot.'})}

function isoSVG(d,o={}){const rot=o.rot||0,gap=o.gap==null?80:o.gap,TW=14,TH=7,WH=30,W=d.cols,H=d.rows;

    if(li===mainIdx)out+=ground(z0-1);

    const items=[],doorSet=new Set(l.doors),winSet=new Set(l.windows);

    const edges=[];for(let y=0;y<=H;y++)for(let x=0;x<W;x++)edges.push(['h',x,y]);for(let y=0;y<H;y++)for(let x=0;x<=W;x++)edges.push(['v',x,y]);
    edges.forEach(([t,x,y])=>{const k=`${t}:${x}:${y}`;if(edgeKind(P,k)!=='wall')return;const [ax,ay,bx,by]=t==='h'?[x,y,x+1,y]:[x,y,x,y+1];
      const [a1]=R(ax,ay),[a2]=R(bx,by),fill=a1!==a2?shadeHex(siding,.95):shadeHex(siding,.8);

      if(winSet.has(k)){const [p1,q1]=R(ax,ay),[p2,q2]=R(bx,by),m=(u,v,f)=>u+(v-u)*f;
        const ps=[P2(m(p1,p2,.2),m(q1,q2,.2),z0+WH*.35),P2(m(p1,p2,.8),m(q1,q2,.8),z0+WH*.35),P2(m(p1,p2,.8),m(q1,q2,.8),z0+WH*.82),P2(m(p1,p2,.2),m(q1,q2,.2),z0+WH*.82)];

const PH={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const r=indexedDB.open('buildlab-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async put(id,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(v,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  async get(id){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async del(id){const db=await this.open();return new Promise(res=>{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>res();t.onerror=()=>res()})}};
function shrinkImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'))};img.src=url})}
function pickPhoto(cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)cb(f)};inp.click()}
function loadPhotos(){document.querySelectorAll('img[data-ph]').forEach(img=>{PH.get(img.dataset.ph).then(src=>{if(src)img.src=src;else img.alt='Photo not found on this device'}).catch(()=>{img.alt='Photo not available on this device'})})}
function addPhoto(mission,title){pickPhoto(async f=>{let data;try{data=await shrinkImage(f)}catch(e){toast('That picture couldn\'t be opened. Try a different photo.');return}
  openModal(`<h3>Add it to your notebook</h3><img class="phprev" src="${data}" alt="Your photo"><label>Name it<input id="phName" maxlength="40" value="${esc(title||'')}" placeholder="My chalk room"></label><label>What did you make? (you can skip this)<textarea id="phWhy" maxlength="400"></textarea></label><div class="row"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="save">Save photo</button></div>`,
  {cancel:closeModal,save:async()=>{const id='ph'+Date.now(),name=$('#phName').value.trim()||'Paper drawing',why=$('#phWhy').value.trim();
    try{await PH.put(id,data)}catch(e){closeModal();toast('This device couldn\'t save the photo. Try again later.');return}
    S.photos=S.photos||[];S.photos.unshift({id,mission:mission||null,title:name,why,date:Date.now()});persist();closeModal();award('photo');toast('Photo saved to your notebook!');
    if(VIEW==='mission')viewMission();if(VIEW==='notebook')viewNotebook()}})})}

const det={mode:'q',plan:0,floor:0,q:null,done:false,picked:null,streakOk:0,streakBad:0,helper:false,right:0,asked:0,lastText:'',peekShown:{},mi:0,mfloor:0,mfound:false,mgot:false,mwrong:0,mhint:false};
function ovl(a,al,b,bl){return a<b+bl&&b<a+al}
function makeOpts(ans,cands,fmt=x=>String(x)){const set=[];cands.forEach(c=>{if(typeof c==='number'&&(c<=0||!Number.isFinite(c)))return;if(c!==ans&&!set.includes(c))set.push(c)});
  let k=1;while(set.length<3&&typeof ans==='number'){const c=ans+k*(k%2?1:-1)*Math.ceil(k/2);if(c>0&&c!==ans&&!set.includes(c))set.push(c);k++;if(k>40)break}
  return shuffle([ans,...shuffle(set).slice(0,3)]).map(fmt)}
const STRONG=['stove','fridge','toilet','tub','bed','sofa','counter','stairs'];
function signature(P,i){const mine=new Set(),others=new Set();P.furn.forEach(f=>{(furnRoom(P,f)===i?mine:others).add(f.t)});const sig=[...mine].filter(t=>!others.has(t)),strong=sig.filter(t=>STRONG.includes(t));return strong.length?strong:sig}
const MAKERS={
  symbol(P){const items=[...P.furn.map((f,i)=>({hl:{kind:'furn',i},t:f.t})),...P.doors.map(k=>({hl:{kind:'edge',key:k},t:'door'})),...P.windows.map(k=>({hl:{kind:'edge',key:k},t:'window'}))];
    const it=pick(items),name=SYM[it.t].name,others=shuffle(Object.keys(SYM).filter(k=>k!==it.t)).slice(0,3).map(k=>SYM[k].name);
    return {text:'What does the flashing symbol stand for?',opts:shuffle([name,...others]),ans:name,explain:SYM[it.t].ex,hl:it.hl}},

function viewNotebook(){
  const list=S.designs,photos=S.photos||[],dt=t=>new Date(t||Date.now()).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const acts=d=>`<div class="row"><button class="btn small primary" data-open="${d.id}">Open</button><button class="btn small" data-del="${d.id}">Delete</button></div>`;
  const cards=list.map(d=>{if(d.kind==='city'){const E=evalCity(d),m=d.mission&&CMIS.find(x=>x.id===d.mission);
      return `<div class="card">${citySVG(d,{E,label:d.name})}<h3>${esc(d.name)}</h3>${m?`<span class="chip lvl">${esc(m.title)}</span>`:''}<p class="why">${d.why?esc(d.why):'No reason written yet.'}</p><p class="eyebrow">City · ${E.people} people · ${E.jobs} jobs · ${dt(d.updated)}</p>${acts(d)}</div>`}
    if(d.kind==='town'){const E=evalTown(d);
      return `<div class="card">${mapSVG(E.MD,{signs:d.signs,noCoords:true,label:d.name})}<h3>${esc(d.name)}</h3><p class="why">${d.why?esc(d.why):'No reason written yet.'}</p><p class="eyebrow">Town · ${d.places.length} places · ${E.roads} road squares · ${dt(d.updated)}</p>${acts(d)}</div>`}
    if(d.kind==='block'){const p=d.puzzle&&UPUZ.find(x=>x.id===d.puzzle);
      return `<div class="card">${blockSVG(d,{E:evalBlock(d),label:d.name})}<h3>${esc(d.name)}</h3>${p?`<span class="chip lvl">${esc(p.title)}</span>`:''}<p class="why">${d.why?esc(d.why):'No reason written yet.'}</p><p class="eyebrow">Block · ${d.objects.filter(o=>o.t==='house').length} houses · ${dt(d.updated)}</p>${acts(d)}</div>`}
    if(d.kind==='room'){const cl=d.client&&CLIENTS.find(c=>c.id===d.client),dc=d.doctor&&DOCTOR.find(x=>x.id===d.doctor);
      return `<div class="card">${roomSVG(d,{label:d.name})}<h3>${esc(d.name)}</h3>${cl||dc?`<span class="chip lvl">${esc((cl||dc).title)}</span>`:''}<p class="why">${d.why?esc(d.why):'No reason written yet.'}</p><p class="eyebrow">Room · ${d.items.length} piece${d.items.length===1?'':'s'} · ${dt(d.updated)}</p>${acts(d)}</div>`}
    const g=migrateDesign(clone(d)),filled=g.levels.filter(l=>Object.keys(l.cells).length),l=filled.find(x=>x.k==='main')||filled[0]||g.levels[0],P=deriveDesign(g,l),ch=g.challenge&&CHALLENGES.find(c=>c.id===g.challenge);
    const rooms=filled.reduce((a,x)=>a+deriveDesign(g,x).rooms.length,0);
    return `<div class="card">${planSVG(P,{noLabels:true,label:d.name})}<h3>${esc(d.name)}</h3><div class="chips">${filled.length>1?`<span class="chip lvl">${filled.length} floors</span>`:''}${ch?`<span class="chip lvl">${esc(ch.title)}</span>`:''}${g.renos?`<span class="chip lvl">Renovated</span>`:''}</div><p class="why">${d.why?esc(d.why):'No reason written yet.'}</p><p class="eyebrow">${rooms} room${rooms===1?'':'s'} · ${dt(d.updated)}</p>
      <div class="row"><button class="btn small primary" data-open="${d.id}">Open</button><button class="btn small" data-show="${d.id}">Show Mode</button><button class="btn small" data-del="${d.id}">Delete</button></div></div>`}).join('');
  const phs=photos.map(f=>{const p=f.mission&&PAPER.find(x=>x.id===f.mission);return `<div class="card phcard"><img data-ph="${f.id}" alt="${esc(f.title)}"><h3>${esc(f.title)}</h3>${p?`<span class="chip lvl">${esc(p.title)}</span>`:''}${f.why?`<p class="why">${esc(f.why)}</p>`:''}<p class="eyebrow">Paper work · ${dt(f.date)}</p><div class="row"><button class="btn small" data-delph="${f.id}">Delete</button></div></div>`}).join('');
  $('#view').innerHTML=`<div class="pagehead"><div><p class="eyebrow">Your saved work</p><h2>Designer's Notebook</h2></div><div class="row"><button class="btn" id="nbPhoto">Add a paper drawing</button><button class="btn primary" id="nbNew">Start a new plan</button></div></div>
  ${list.length||photos.length?`${phs?`<h2 class="sec">Paper work</h2><div class="grid nb">${phs}</div>`:''}${cards?`<h2 class="sec">Designs</h2><div class="grid nb">${cards}</div>`:''}`
  :`<section class="hero"><div class="pic">${mascot('bea')}</div><div class="bubble"><p class="who">Chief Bea</p><h2>Your notebook is empty, for now.</h2><p>Draw a plan at the Drafting Table, design a room with Kofi, or snap a photo of your paper drawings. Everything you save shows up here with the reasons you made it that way.</p></div></section>`}`;
  loadPhotos();
  $('#nbNew').onclick=()=>startFresh(null);$('#nbPhoto').onclick=()=>addPhoto(null,'');
  $('#view').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const d=S.designs.find(x=>x.id===b.dataset.show);if(d)openShow(d)});
  $('#view').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const d=S.designs.find(x=>x.id===b.dataset.open);if(!d)return;if(d.kind==='room'){openRoom(clone(d));return}if(d.kind==='block'){openBlock(clone(d),true);return}if(d.kind==='town'){openTown(clone(d),true);return}if(d.kind==='city'){openCity(clone(d),true);return}
    const open=()=>{D=migrateDesign(clone(d));S.current=D;undoStack=[];dirty=false;ruler=null;fsel=-1;viewBefore=false;zoom=1;persist();go('draft')};
    if(hasContent(D)&&dirty&&D.id!==d.id){openModal(`<h3>Open "${esc(d.name)}"?</h3><p>Your plan on the Drafting Table has changes that aren't saved yet.</p><div class="row"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">Open anyway</button></div>`,{no:closeModal,yes:()=>{closeModal();open()}})}else open()});
  $('#view').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const d=S.designs.find(x=>x.id===b.dataset.del);
    openModal(`<h3>Delete "${esc(d.name)}"?</h3><p>This can't be undone.</p><div class="row"><button class="btn" data-x="no">Keep it</button><button class="btn primary" data-x="yes">Delete</button></div>`,{no:closeModal,yes:()=>{S.designs=S.designs.filter(x=>x.id!==d.id);if(D.id===d.id)D.id=null;if(R.id===d.id)R.id=null;if(B&&B.id===d.id)B.id=null;if(T&&T.id===d.id)T.id=null;if(C&&C.id===d.id)C.id=null;persist();closeModal();viewNotebook()}})});
  $('#view').querySelectorAll('[data-delph]').forEach(b=>b.onclick=()=>{const f=(S.photos||[]).find(x=>x.id===b.dataset.delph);
    openModal(`<h3>Delete the photo "${esc(f.title)}"?</h3><p>This can't be undone.</p><div class="row"><button class="btn" data-x="no">Keep it</button><button class="btn primary" data-x="yes">Delete</button></div>`,{no:closeModal,yes:()=>{S.photos=S.photos.filter(x=>x.id!==f.id);PH.del(f.id);persist();closeModal();viewNotebook()}})});
}

      {t:'She can reach every piece',ok:(R,A)=>A.allReach}]}
];
const DOCTOR=[
  {id:'door',title:'The Stuck Door',story:'Nobody can get into this bedroom! Something is in the way of the door.',preset:'bedroom',
    items:[{t:'wardrobe',x:1,y:8,r:0},{t:'twin',x:8,y:1,r:0},{t:'dresser',x:0,y:0,r:0},{t:'chair',x:1,y:2,r:0},{t:'rug',x:4,y:4,r:0}]},

function newRoom(preset,items,extra){const p=PRESETS[preset];return Object.assign({kind:'room',id:null,name:'',why:'',preset,W:p.W,H:p.H,door:{...p.door},windows:p.windows.map(w=>({...w})),wall:p.wall,floor:p.floor,items:clone(items||[]),client:null,doctor:null},extra||{})}
function defaultRoom(){return newRoom('bedroom',[{t:'rug',x:4,y:4,r:0},{t:'twin',x:8,y:1,r:0},{t:'night',x:6,y:1,r:0},{t:'desk',x:0,y:3,r:1},{t:'chair',x:2,y:4,r:0},{t:'dresser',x:6,y:9,r:0},{t:'lamp',x:0,y:0,r:0},{t:'plant',x:11,y:10,r:0}])}

/* ---- geometry ---- */
function isz(it){const c=CAT[it.t];return it.r%2?[c.h,c.w]:[c.w,c.h]}
function cellsOf(it){const [w,h]=isz(it),a=[];for(let y=it.y;y<it.y+h;y++)for(let x=it.x;x<it.x+w;x++)a.push([x,y]);return a}
function wallLen(R,side){return side==='N'||side==='S'?R.W:R.H}
function spanCells(R,o){const a=[];for(let i=0;i<3;i++){const u=o.pos+i;if(o.side==='N')a.push([u,0]);else if(o.side==='S')a.push([u,R.H-1]);else if(o.side==='W')a.push([0,u]);else a.push([R.W-1,u])}return a}
function swingCells(R){const a=[],s=R.door.side;spanCells(R,R.door).forEach(([x,y])=>{for(let d=0;d<3;d++)a.push(s==='N'?[x,d]:s==='S'?[x,R.H-1-d]:s==='W'?[d,y]:[R.W-1-d,y])});return a}
function near(a,b,gap){const [aw,ah]=isz(a),[bw,bh]=isz(b);return a.x-gap<b.x+bw&&b.x<a.x+aw+gap&&a.y-gap<b.y+bh&&b.y<a.y+ah+gap}
function ctr(it){const [w,h]=isz(it);return [it.x+w/2,it.y+h/2]}
function occGrid(R){const g=new Array(R.W*R.H).fill(-1);R.items.forEach((it,i)=>{if(CAT[it.t].rug)return;cellsOf(it).forEach(([x,y])=>{if(x>=0&&y>=0&&x<R.W&&y<R.H)g[y*R.W+x]=i})});return g}
function fitsRect(R,skip,x,y,w,h,rug){if(x<0||y<0||x+w>R.W||y+h>R.H)return false;if(rug)return true;
  return R.items.every((o,j)=>{if(j===skip||CAT[o.t].rug)return true;const [ow,oh]=isz(o);return x+w<=o.x||o.x+ow<=x||y+h<=o.y||o.y+oh<=y})}
function fits(R,i,x,y,r){const c=CAT[R.items[i].t];const [w,h]=r%2?[c.h,c.w]:[c.w,c.h];return fitsRect(R,i,x,y,w,h,c.rug)}
function findSpot(R,t,skip){const c=CAT[t],cx=R.W/2,cy=R.H/2,cand=[];
  for(const r of [0,1]){const [w,h]=r?[c.h,c.w]:[c.w,c.h];for(let y=0;y+h<=R.H;y++)for(let x=0;x+w<=R.W;x++)cand.push({x,y,r,d:Math.hypot(x+w/2-cx,y+h/2-cy)+r*.01})}
  cand.sort((a,b)=>a.d-b.d);for(const p of cand){const [w,h]=p.r?[c.h,c.w]:[c.w,c.h];if(fitsRect(R,skip,p.x,p.y,w,h,c.rug))return p}return null}

/* ---- walking ---- */
function walk(R,g,k){const W=R.W,H=R.H,free=(px,py)=>{if(px<0||py<0||px+k>W||py+k>H)return false;for(let y=py;y<py+k;y++)for(let x=px;x<px+k;x++)if(g[y*W+x]>=0)return false;return true};
  const dist=new Map(),q=[],s=R.door.side,p=R.door.pos;
  for(let o=p;o<=p+3-k;o++){let px,py;if(s==='N'){px=o;py=0}else if(s==='S'){px=o;py=H-k}else if(s==='W'){px=0;py=o}else{px=W-k;py=o}
    if(free(px,py)&&!dist.has(px+','+py)){dist.set(px+','+py,0);q.push([px,py])}}
  for(let qi=0;qi<q.length;qi++){const [x,y]=q[qi],d=dist.get(x+','+y);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,key=nx+','+ny;if(!dist.has(key)&&free(nx,ny)){dist.set(key,d+1);q.push([nx,ny])}})}
  return dist}
function reachInfo(R,g,k){const dist=walk(R,g,k),W=R.W,H=R.H,best=new Array(W*H).fill(Infinity),zone=new Set();
  dist.forEach((d,key)=>{const [px,py]=key.split(',').map(Number);
    for(let i=0;i<k;i++)[[px+i,py-1],[px+i,py+k],[px-1,py+i],[px+k,py+i]].forEach(([x,y])=>{if(x>=0&&y>=0&&x<W&&y<H&&best[y*W+x]>d)best[y*W+x]=d});
    for(let y=py;y<py+k;y++)for(let x=px;x<px+k;x++)zone.add(x+','+y)});
  const items=R.items.map(it=>{if(CAT[it.t].rug)return {ok:true,steps:0};let m=Infinity;cellsOf(it).forEach(([x,y])=>{if(x<W&&y<H)m=Math.min(m,best[y*W+x])});return {ok:m<Infinity,steps:m+1}});
  return {items,zone}}

/* ---- light ---- */
function lightMap(R,time,lamps){const W=R.W,H=R.H,L=new Array(W*H).fill(0),tall=new Array(W*H).fill(false);
  R.items.forEach(it=>{if(CAT[it.t].tall)cellsOf(it).forEach(([x,y])=>{if(x<W&&y<H)tall[y*W+x]=true})});
  R.windows.forEach(w=>{const s=SUN[w.side][time],reach=3+7*s,ns=w.side==='N'||w.side==='S';
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=w.side==='N'?y:w.side==='S'?H-1-y:w.side==='W'?x:W-1-x,u=ns?x:y;if(d>=reach)continue;
      const spread=d*.5,ld=Math.max(w.pos-u,u-(w.pos+2),0);let I=s*(1-d/reach)*Math.max(0,1-ld/(spread+1));if(I<=0)continue;
      const uc=Math.min(Math.max(u,w.pos),w.pos+2);
      for(let dd=0;dd<d;dd++){const cx=ns?uc:(w.side==='W'?dd:W-1-dd),cy=ns?(w.side==='N'?dd:H-1-dd):uc;if(tall[cy*W+cx]){I*=.2;break}}
      L[y*W+x]+=I}});
  if(lamps)R.items.forEach(it=>{if(it.t!=='lamp')return;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dd=Math.hypot(x-it.x,y-it.y);if(dd<3.5)L[y*W+x]+=.6*(1-dd/3.5)}});
  return L.map(v=>Math.min(1,v))}
function itemLight(R,L,it){const c=cellsOf(it);return c.reduce((a,[x,y])=>a+L[y*R.W+x],0)/c.length}
function triangle(a,b,c){const d=(p,q)=>{const [px,py]=ctr(p),[qx,qy]=ctr(q);return Math.hypot(px-qx,py-qy)};const legs=[d(a,b),d(b,c),d(c,a)],total=legs.reduce((x,y)=>x+y,0);return {legs,total,ok:total>=13&&total<=26&&legs.every(l=>l>=4&&l<=9)}}

/* ---- checks ---- */
function analyzeRoom(R){const g=occGrid(R),ri=reachInfo(R,g,2),checks=[],nm=it=>CAT[it.t].name.toLowerCase();
  const un=R.items.filter((it,i)=>!ri.items[i].ok);
  checks.push({k:'reach',ok:!un.length,title:'Everyone can reach every piece',why:'People need a path about 2 feet wide to walk through a room.',detail:un.length?`Can't reach: the ${[...new Set(un.map(nm))].join(', the ')}`:''});
  const sw=swingCells(R).some(([x,y])=>g[y*R.W+x]>=0);
  checks.push({k:'door',ok:!sw,title:'The door can swing open',why:'A door needs a clear space, as big as the door, to open into the room.',detail:sw?'Something is in the way of the door.':''});
  const blk=R.windows.filter(w=>spanCells(R,w).some(([x,y])=>{const i=g[y*R.W+x];return i>=0&&CAT[R.items[i].t].tall}));
  checks.push({k:'win',ok:!blk.length,title:'Windows are not blocked',why:'Tall furniture in front of a window blocks the light and the view.',detail:blk.length?`Blocked: the ${blk.map(w=>SIDE[w.side]).join(' and ')} window`:''});
  const cache={},LM=t=>cache[t]||(cache[t]=lightMap(R,t,false)),light=(it,t)=>itemLight(R,LM(t),it);
  const desks=R.client==='owl'?[]:R.items.filter(it=>it.t==='desk');
  if(desks.length){const dark=desks.filter(it=>Math.max(light(it,'morning'),light(it,'noon'))<.3);
    checks.push({k:'desk',ok:!dark.length,title:'The desk gets daylight',why:'Daylight makes reading and drawing easier on your eyes.',detail:dark.length?'Try moving the desk closer to a sunny window.':''})}
  const f=R.items.find(i=>i.t==='fridge'),s=R.items.find(i=>i.t==='stove'),k=R.items.find(i=>i.t==='sink');
  if(f&&s&&k){const T=triangle(f,s,k);checks.push({k:'tri',ok:T.ok,tri:T,title:'Kitchen work triangle',why:'Cooks walk between the fridge, sink and stove all day. Close, but not squished, is best.',
    detail:T.ok?'':(T.total>26||T.legs.some(l=>l>9)?'The fridge, sink and stove are too far apart.':'The fridge, sink and stove are squished too close together.')})}
  return {g,ri,checks,light,n:t=>R.items.filter(i=>i.t===t).length,items:t=>R.items.filter(i=>i.t===t),allReach:!un.length,
    check:key=>{const c=checks.find(c=>c.k===key);return c?c.ok:true}}}
function floorStats(R,g){const area=R.W*R.H,covered=g.filter(v=>v>=0).length;return {area,covered,open:area-covered,perim:2*(R.W+R.H)}}
function twistText(c,L){const tn=CAT[c.target].name.toLowerCase();
  return [null,`Pick a ${c.mood} wall color for this client.`,`Put the ${tn} ${c.steps} steps or fewer from the door.`,'Leave at least half the floor open.',`Make a 3-foot (36-inch) walkway from the door to the ${tn}.`,`Spend ${money(c.budget)} or less.`][L]}
function roomTwist(c,L,R,A){const t=twistText(c,L);
  if(L===1)return {t,ok:WALL[R.wall].mood===c.mood,prog:`${WALL[R.wall].name} is ${WALL[R.wall].mood}`};
  if(L===2){let st=Infinity;R.items.forEach((it,i)=>{if(it.t===c.target&&A.ri.items[i].ok)st=Math.min(st,A.ri.items[i].steps)});return {t,ok:st<=c.steps,prog:st<Infinity?`${st} steps now`:`no reachable ${CAT[c.target].name.toLowerCase()} yet`}}
  if(L===3){const fs=floorStats(R,A.g);return {t,ok:fs.open*2>=fs.area,prog:`${fs.open} of ${fs.area} squares open`}}
  if(L===4){const r3=reachInfo(R,A.g,3);return {t,ok:R.items.some((it,i)=>it.t===c.target&&r3.items[i].ok)}}
  const tot=R.items.reduce((a,i)=>a+CAT[i.t].price,0);return {t,ok:tot<=c.budget,prog:money(tot)+' so far'}}

/* ---- drawing ---- */
function itemInner(t,w,h){const c=CAT[t].c,N='#0d2a4f',st=`stroke="${N}" stroke-width="2"`,p=3,iw=w-2*p,ih=h-2*p;
  const Rr=(x,y,ww,hh,rx,f)=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="${rx}" fill="${f||c}" ${st}/>`;
  const C=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f||c}" ${st}/>`;
  const Ln=(d,sw=2)=>`<path d="${d}" fill="none" stroke="${N}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  switch(t){
    case 'twin':case 'big':case 'bunk':{let s=Rr(p,p,iw,ih,6);const two=t==='big',pw=two?(iw-3*p)/2:iw-2*p;s+=Rr(2*p,2*p,pw,20,6,'#fff');if(two)s+=Rr(3*p+pw,2*p,pw,20,6,'#fff');
      s+=`<rect x="${p+1}" y="${h*.42}" width="${iw-2}" height="12" fill="#fff" opacity=".45"/>`+Ln(`M${p} ${h*.42}H${w-p}`);
      if(t==='bunk')s+=`<rect x="${p+6}" y="${p+6}" width="${iw-12}" height="${ih-12}" rx="4" fill="none" stroke="${N}" stroke-width="1.5" stroke-dasharray="5 4"/>`;return s}
    case 'night':return Rr(p,p,iw,ih,4)+C(w/2,h/2,9,'#ffe08a');
    case 'dresser':return Rr(p,p,iw,ih,4)+Ln(`M${w/2} ${p}V${h-p}`)+C(w/4,h*.62,2.5,'#fff')+C(w*.75,h*.62,2.5,'#fff');
    case 'wardrobe':return Rr(p,p,iw,ih,4)+Ln(`M${w/2} ${p}V${h-p}`)+C(w/2-7,h/2,2.5,'#fff')+C(w/2+7,h/2,2.5,'#fff');
    case 'sofa':return Rr(p,p,iw,ih,8)+Rr(p,p,iw,ih*.36,6)+Rr(p,p,16,ih,6)+Rr(w-p-16,p,16,ih,6)+Ln(`M${w/2} ${p+ih*.36}V${h-p-4}`,1.5);
    case 'arm':return Rr(p,p,iw,ih,10)+Rr(p,p,iw,ih*.32,8)+Rr(p,p,14,ih,7)+Rr(w-p-14,p,14,ih,7);
    case 'bean':return `<path d="M${w*.5} ${p}C${w-p} ${p} ${w-p} ${h*.4} ${w-p*2} ${h*.72}C${w*.8} ${h-p} ${w*.2} ${h-p} ${p*2} ${h*.72}C${p} ${h*.45} ${p} ${p} ${w*.5} ${p}Z" fill="${c}" ${st}/>`+Ln(`M${w*.3} ${h*.38}q${w*.2} ${h*.12} ${w*.4} 0`,1.5);
    case 'chair':return Rr(p+3,p+8,iw-6,ih-8,6)+Rr(p,p,iw,9,4);
    case 'coffee':return Rr(p+4,p+4,iw-8,ih-8,12)+`<circle cx="${w*.3}" cy="${h/2}" r="5" fill="#fff" opacity=".7"/>`;
    case 'dining':{let s='';[w*.32,w*.68].forEach(cx=>{s+=Rr(cx-13,p,26,16,5,'#ffc46b')+Rr(cx-13,h-p-16,26,16,5,'#ffc46b')});
      s+=Rr(p,h/2-13,16,26,5,'#ffc46b')+Rr(w-p-16,h/2-13,16,26,5,'#ffc46b');return s+Rr(w*.18,h*.24,w*.64,h*.52,8)+C(w/2,h/2,7,'#9ee28a')}
    case 'desk':return Rr(p,p,iw,ih,4)+`<rect x="${w*.15}" y="${h*.25}" width="22" height="16" fill="#fff" stroke="${N}" stroke-width="1.5" transform="rotate(-8 ${w*.15+11} ${h*.25+8})"/>`+Ln(`M${w*.6} ${h*.35}l${w*.22} ${h*.3}`,3);
    case 'shelf':{let s=Rr(p,p,iw,ih,3);const cols=['#ff7aa2','#62dcb4','#ffc46b','#8fb8ff','#f0a6ff'];for(let i=0,x=p+4;x<w-p-8;i++,x+=9)s+=`<rect x="${x}" y="${p+4}" width="7" height="${ih-8}" rx="1.5" fill="${cols[i%5]}" stroke="${N}" stroke-width="1"/>`;return s}
    case 'toy':return Rr(p,p,iw,ih,6)+Ln(`M${p} ${h*.35}H${w-p}`)+`<path d="M${w/2} ${h*.45}l3 6 6 .5-4.5 4 1.5 6-6-3.5-6 3.5 1.5-6-4.5-4 6-.5z" fill="#ff9b45" stroke="${N}" stroke-width="1"/>`;
    case 'piano':{let s=Rr(p,p,iw,ih,4,'#3b4a63')+`<rect x="${p+4}" y="${h-p-16}" width="${iw-8}" height="13" fill="#fff" stroke="${N}" stroke-width="1.5"/>`;for(let x=p+10;x<w-p-8;x+=8)s+=`<rect x="${x}" y="${h-p-16}" width="4" height="8" fill="${N}"/>`;return s}
    case 'tv':return Rr(p,p+10,iw,ih-10,4)+`<rect x="${w*.1}" y="${p}" width="${w*.8}" height="7" rx="2" fill="${N}"/>`;
    case 'tank':return Rr(p,p,iw,ih,5)+`<path d="M${w*.35} ${h/2}q8-8 16 0q-8 8-16 0zm16 0l7-5v10z" fill="#ff9b45" stroke="${N}" stroke-width="1.2"/><circle cx="${w*.75}" cy="${h*.35}" r="3" fill="#fff" opacity=".8"/><circle cx="${w*.8}" cy="${h*.6}" r="2" fill="#fff" opacity=".8"/>`;
    case 'rug':return `<rect x="${p}" y="${p}" width="${iw}" height="${ih}" rx="6" fill="${c}" opacity=".8"/><rect x="${p+8}" y="${p+8}" width="${iw-16}" height="${ih-16}" rx="4" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 5"/>`;
    case 'plant':{let s='';for(let i=0;i<6;i++)s+=`<ellipse cx="${w/2}" cy="${h/2-6}" rx="3.5" ry="7" fill="${c}" stroke="${N}" stroke-width="1.2" transform="rotate(${i*60} ${w/2} ${h/2})"/>`;return s+C(w/2,h/2,3.5,'#3f8f3a')}
    case 'lamp':return `<circle cx="${w/2}" cy="${h/2}" r="12" fill="#ffe08a" opacity=".55"/>`+C(w/2,h/2,7,c);
    case 'fridge':return Rr(p,p,iw,ih,4,'#e8eef7')+Ln(`M${p} ${h*.35}H${w-p}`,1.5)+`<text x="${w/2}" y="${h*.66}" font-family="IBM Plex Mono,ui-monospace,monospace" font-weight="600" font-size="13" text-anchor="middle" dominant-baseline="central" fill="${N}">REF</text>`;
    case 'stove':return Rr(p,p,iw,ih,4,'#e8eef7')+C(w*.3,h*.33,7,'#fff')+C(w*.7,h*.33,7,'#fff')+C(w*.3,h*.7,7,'#fff')+C(w*.7,h*.7,7,'#fff');
    case 'sink':return Rr(p,p,iw,ih,4,'#e8eef7')+`<ellipse cx="${w/2}" cy="${h*.58}" rx="${w*.28}" ry="${h*.26}" fill="#bfe6ff" stroke="${N}" stroke-width="2"/>`+C(w/2,p+6,3,'#fff');
    case 'counter':return Rr(p,p,iw,ih,4,'#e8eef7')+Ln(`M${p+6} ${h*.65}H${w-p-6}`,1.5);
  }return ''}
function itemIcon(t,cls){const c=CAT[t],w=c.w*IC,h=c.h*IC,m=Math.max(w,h)+8;return `<svg ${cls?`class="${cls}"`:''} viewBox="${(w-m)/2} ${(h-m)/2} ${m} ${m}" aria-hidden="true">${itemInner(t,w,h)}</svg>`}
function itemG(it){const c=CAT[it.t],w=c.w*IC,h=c.h*IC,[fw,fh]=isz(it);let tr=`translate(${it.x*IC} ${it.y*IC})`;
  if(it.r===1)tr+=` translate(${h} 0) rotate(90)`;else if(it.r===2)tr+=` translate(${w} ${h}) rotate(180)`;else if(it.r===3)tr+=` translate(0 ${w}) rotate(270)`;
  return (c.tall?`<rect x="${it.x*IC+5}" y="${it.y*IC+5}" width="${fw*IC-4}" height="${fh*IC-4}" rx="5" fill="rgba(13,42,79,.35)"/>`:'')+`<g transform="${tr}">${itemInner(it.t,w,h)}</g>`}
function floorPattern(f,id){
  if(f==='wood')return `<pattern id="${id}" width="120" height="60" patternUnits="userSpaceOnUse"><rect width="120" height="60" fill="#d6a874"/><path d="M0 30H120M0 60H120M45 0V30M105 0V30M15 30V60M75 30V60" stroke="#b58552" stroke-width="2"/><path d="M8 12h20M60 44h24" stroke="#c99a6b" stroke-width="2" stroke-linecap="round"/></pattern>`;

    const x=i%W,y=(i-x)/W;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=B.H)continue;const j=ny*W+nx;

/* ---- Follow the Flow ---- */
let fj=0,fdone=[],fdeck=null,fmiss=0;
function viewFlow(){const J=FLOWS[fj];if(!fdeck)fdeck=shuffle(J.steps.map((s,i)=>i));
  const complete=fdone.length===J.steps.length;
  $('#view').innerHTML=`<div class="pagehead"><div><p class="eyebrow">Utilities Underground</p><h2>Follow the Flow</h2></div></div>
  <div class="tabs" role="group" aria-label="Journeys">${FLOWS.map((f,i)=>`<button data-j="${i}" class="${i===fj?'on':''}">${f.name}</button>`).join('')}</div>
  <div class="chal">${mascot('luz').replace('<svg','<svg class="m"')}<div><p class="eyebrow">Luz asks</p><h3>${complete?'You followed the whole trip!':`What comes ${fdone.length?'next':'first'}?`}</h3><p>${complete?esc(J.fact):`Tap the steps of the ${J.name.toLowerCase()} journey in order, from start to finish.`}</p></div></div>
  <div class="flowrow" style="--fc:${J.c}">${fdone.map((i,n)=>`${n?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="fstep"><b>${n+1}. ${esc(J.steps[i][0])}</b><span>${esc(J.steps[i][1])}</span></div>`).join('')||'<p class="empty">The trip will build here, step by step.</p>'}</div>
  ${complete?`<div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn primary" id="fNext">${fj<FLOWS.length-1?'Next journey':'Start over'}</button><button class="btn" id="fAgain">Do it again</button></div>`
  :`<h2 class="sec" style="margin-top:20px">Steps to place</h2><div class="fdeck">${fdeck.filter(i=>!fdone.includes(i)).map(i=>`<button class="fcard" data-step="${i}"><b>${esc(J.steps[i][0])}</b><span>${esc(J.steps[i][1])}</span></button>`).join('')}</div>`}`;
  $('#view').querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{fj=+b.dataset.j;fdone=[];fdeck=null;fmiss=0;viewFlow()});
  $('#view').querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const i=+b.dataset.step;
    if(i===fdone.length){fdone.push(i);fmiss=0;viewFlow();if(fdone.length===J.steps.length)toast('Every step in order. That\'s how it really works!','luz')}
    else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');fmiss++;
      toast(fmiss>=2?`Here's a hint: the ${fdone.length?'next':'first'} step is "${J.steps[fdone.length][0]}".`:'Not yet! Think about what has to happen before that step.','luz')}});
  const nx=$('#fNext');if(nx)nx.onclick=()=>{fj=(fj+1)%FLOWS.length;fdone=[];fdeck=null;viewFlow()};
  const ag=$('#fAgain');if(ag)ag.onclick=()=>{fdone=[];fdeck=null;viewFlow()};
}

function renderUTools(){const sand=!B.puzzle;

  const el=$('#utools');el.innerHTML=s;el.querySelectorAll('[data-utool]').forEach(b=>b.onclick=()=>{utool=b.dataset.utool;uhint=null;renderUTools();updateBlock()})}
function updateBlock(){const E=evalBlock(B),L=lvl('utilities'),p=B.puzzle&&UPUZ.find(x=>x.id===B.puzzle);

function blockPanel(E,L){const p=B.puzzle&&UPUZ.find(x=>x.id===B.puzzle),P=p&&UPAR[p.id];
  let s=`<h3>Hookups</h3><p class="lede">${E.houses.length?`${E.got} of ${E.need} hooked up.`:'Place a house to get started.'}</p><ul class="hooks">${E.houses.map((h,i)=>`<li><span class="hn" style="background:${h.c}">${i+1}</span><span class="hc">${UKEYS.map(u=>`<span class="uch ${E.done[i][u]?'ok':''}" style="--uc:${UT[u].c}" title="${UT[u].name}">${E.done[i][u]?ICON_OK:''}${UT[u].name}</span>`).join('')}</span></li>`).join('')}</ul>`;

  if(L===2)s+=`<p class="lede">Count your pipe pieces. Each square is one piece.</p><ul class="rooms">${UKEYS.map(u=>{const n=B.lines.filter(l=>l.u===u).reduce((a,l)=>a+l.cells.length,0);return `<li><i style="background:${UT[u].c}"></i><span>${UT[u].name}</span><span class="num">${n} pieces</span></li>`}).join('')}</ul><div class="totals"><span>All pieces</span><b class="big">${E.pieces}</b>${P?`<span>Goal</span><b>${P.par} or fewer</b>`:''}</div>`;
  if(L===3)s+=`<p class="lede">The yard is every square that isn't street, a house or something in the way.</p><div class="totals"><span>Yard area</span><b>${E.yard} squares</b><span>Squares dug up (shared trenches count once)</span><b class="big">${E.dug}</b><span>Fraction dug</span><b>${E.dug} / ${E.yard}</b></div>${E.houses.map((h,i)=>`<p class="note">House ${i+1} covers ${h.w} × ${h.h} = ${h.w*h.h} squares.</p>`).join('')}`;
  if(L===4){s+=`<p class="lede">1 square = 10 feet. Each hill step is 1 foot higher.</p><ul class="rooms">${UKEYS.map(u=>{const n=B.lines.filter(l=>l.u===u).reduce((a,l)=>a+l.cells.length,0);return `<li><i style="background:${UT[u].c}"></i><span>${UT[u].name}</span><span class="num">${n*10} ft</span></li>`}).join('')}</ul><div class="totals"><span>All pipe</span><b class="big">${E.pieces*10} ft</b></div>`;
    const sw=B.lines.map((l,i)=>({l,i})).filter(o=>o.l.u==='sewer'&&E.info[o.i].ok);sw.forEach(({l})=>{const a=hAt(B,l.cells[0]),b=hAt(B,l.cells[l.cells.length-1]),drop=Math.abs(a-b),run=l.cells.length*10;s+=`<p class="note">A sewer pipe ${run} feet long drops ${drop} foot${drop===1?'':'s'}${drop?`: about 1 foot for every ${Math.round(run/drop)} feet.`:'. Flat pipes work, but a little tilt is better.'}</p>`})}
  if(L===5){s+=`<p class="lede">Every foot of pipe costs money. 1 square = 10 feet.</p><ul class="rooms">${UKEYS.map(u=>{const n=B.lines.filter(l=>l.u===u).reduce((a,l)=>a+l.cells.length,0);return `<li><i style="background:${UT[u].c}"></i><span>${UT[u].name} · $${UT[u].price}/ft</span><span class="num">${money(n*10*UT[u].price)}</span><span class="sub">${n*10} ft × $${UT[u].price} per foot</span></li>`}).join('')}</ul><div class="totals"><span>Total</span><b class="big">${money(E.cost)}</b>${P?`<span>Budget</span><b>${money(P.budget)}</b>`:''}</div>`}
  return s+'</div>'}
function blockCell(e,el){const svg=el.querySelector('svg'),r=svg.getBoundingClientRect();return [Math.floor((e.clientX-r.left)/r.width*B.W),Math.floor((e.clientY-r.top)/r.height*B.H)]}
function wireBlockBoard(el){let act=null;
  const free=(x,y,og,lg,self)=>x>=0&&y>=0&&x<B.W&&y<B.H&&og[y*B.W+x]<0&&(lg[y*B.W+x]<0||lg[y*B.W+x]===self);
  el.addEventListener('pointerdown',e=>{const [x,y]=blockCell(e,el);if(x<0||y<0||x>=B.W||y>=B.H)return;e.preventDefault();uhint=null;const og=objGrid(B),lg=lineGrid(B);
    if(utool==='erase'){const li=lg[y*B.W+x];if(li>=0){uPush();B.lines.splice(li,1);updateBlock();return}
      const oi=og[y*B.W+x];if(oi>=0&&!B.puzzle){uPush();B.objects.splice(oi,1);recolor();updateBlock();return}return}
    if(UT[utool]){const lu=lineGrid(B,utool),li=lu[y*B.W+x];
      if(li>=0){const Ln=B.lines[li],last=Ln.cells[Ln.cells.length-1],first=Ln.cells[0];
        if(Ln.u===utool&&last[0]===x&&last[1]===y){act={li,before:JSON.stringify(B)}}
        else if(Ln.u===utool&&first[0]===x&&first[1]===y){Ln.cells.reverse();act={li,before:JSON.stringify(B)}}
        else{toast(`There's already a ${UT[utool].name.toLowerCase()} pipe here. Two of the same kind can't share a square.`,'luz');return}}
      else if(og[y*B.W+x]>=0){toast('Start next to a house or a box, not on top of it.','luz');return}
      else{act={li:B.lines.length,before:JSON.stringify(B),fresh:true};B.lines.push({u:utool,cells:[[x,y]]})}
      try{el.setPointerCapture(e.pointerId)}catch(_){}updateBlock();return}
    /* sandbox placing */
    if(B.puzzle)return;const street=y>=B.H-B.street;
    const area=(w,h)=>{for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){if(xx>=B.W||yy>=B.H-B.street||og[yy*B.W+xx]>=0||lg[yy*B.W+xx]>=0)return false}return true};
    if(utool==='house'){if(street||!area(3,2)){toast('A house needs 3 × 2 empty squares of yard.','luz');return}uPush();B.objects.push({t:'house',x,y,w:3,h:2});recolor()}
    else if(utool==='tree'||utool==='rock'){if(street||!area(1,1)){toast('Pick an empty square of yard.','luz');return}uPush();B.objects.push({t:utool,x,y})}
    else if(utool.startsWith('box-')){if(og[y*B.W+x]>=0||lg[y*B.W+x]>=0){toast('Pick an empty square.','luz');return}uPush();B.objects.push({t:'box',u:utool.slice(4),x,y})}
    updateBlock()});
  el.addEventListener('pointermove',e=>{if(!act)return;const [tx,ty]=blockCell(e,el),Ln=B.lines[act.li];if(!Ln)return;const og=objGrid(B),lg=lineGrid(B,Ln.u);let changed=false;
    for(let k=0;k<30;k++){const c=Ln.cells,last=c[c.length-1];if(last[0]===tx&&last[1]===ty)break;
      const dx=tx-last[0],dy=ty-last[1],nx=last[0]+(Math.abs(dx)>=Math.abs(dy)?Math.sign(dx):0),ny=last[1]+(Math.abs(dx)>=Math.abs(dy)?0:Math.sign(dy));
      const prev=c[c.length-2];if(prev&&prev[0]===nx&&prev[1]===ny){c.pop();changed=true;continue}
      if(!free(nx,ny,og,lg,act.li)||c.some(q=>q[0]===nx&&q[1]===ny))break;c.push([nx,ny]);lg[ny*B.W+nx]=act.li;changed=true}
    if(changed)updateBlock()});
  const end=()=>{if(act){uundo.push(act.before);if(uundo.length>60)uundo.shift();udirty=true}act=null};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function recolor(){let i=0;B.objects.forEach(o=>{if(o.t==='house')o.c=ROOFS[i++%ROOFS.length]})}
function showHint(){const E=evalBlock(B);if(E.all){toast('Everything is already hooked up!','luz');return}
  for(let hi=0;hi<E.houses.length;hi++)for(const u of UKEYS){if(E.done[hi][u])continue;if(!B.objects.some(o=>o.t==='box'&&o.u===u))continue;
    const occ=objGrid(B).map(v=>v>=0?1:0);B.lines.forEach(L=>{if(L.u===u)L.cells.forEach(([x,y])=>occ[y*B.W+x]=1)});
    const p=bfsPath(B,occ,[...idxSet(B,adjSet(B,E.houses[hi]))],boxGoals(B,u),u==='sewer');
    if(p){uhint={u,cells:p.map(i=>[i%B.W,(i-i%B.W)/B.W])};utool=u;renderUTools();updateBlock();toast(`Here's one way to hook up House ${hi+1}'s ${UT[u].name.toLowerCase()}. Follow the dotted line!`,'luz');return}}
  const missing=UKEYS.find(u=>!B.objects.some(o=>o.t==='box'&&o.u===u));
  toast(missing?`This block has no ${UT[missing].box.toLowerCase()} yet. Place one first!`:'Some pipes are blocking the way. Try erasing one and taking a different route.','luz')}
function saveBlockDialog(){if(!B.lines.length&&!B.objects.some(o=>o.t==='house')){toast('Build something first, then save it.','luz');return}const p=B.puzzle&&UPUZ.find(x=>x.id===B.puzzle);
  openModal(`<h3>Save to your notebook</h3><label>Name your block<input id="svName" maxlength="40" value="${esc(B.name||(p?p.title:''))}" placeholder="Felix Street"></label>

/* ---- map model ---- */
function mapModel(m){const W=m.W,H=m.H,road=new Array(W*H).fill(false),pg=new Array(W*H).fill(-1);
  if(m.roads)m.roads.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='#')road[y*W+x]=true}));
  if(m.roadSet)m.roadSet.forEach(k=>{const [x,y]=k.split(',').map(Number);road[y*W+x]=true});
  m.places.forEach((p,i)=>{for(let y=p.y;y<p.y+p.h;y++)for(let x=p.x;x<p.x+p.w;x++)pg[y*W+x]=i});
  const isR=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&road[y*W+x];
  const nb=(x,y)=>Object.keys(DIRS).filter(d=>isR(x+DIRS[d][0],y+DIRS[d][1]));
  const doors=m.places.map(p=>{const s=new Set();for(let y=p.y;y<p.y+p.h;y++)for(let x=p.x;x<p.x+p.w;x++)Object.values(DIRS).forEach(([dx,dy])=>{if(isR(x+dx,y+dy))s.add((y+dy)*W+x+dx)});return [...s]});
  return {m,W,H,road,pg,isR,nb,doors}}
function roadPath(MD,a,b){const W=MD.W,goal=new Set(MD.doors[b]),prev=new Map(),q=[];
  MD.doors[a].forEach(i=>{prev.set(i,-1);q.push(i)});
  for(let qi=0;qi<q.length;qi++){const i=q[qi];if(goal.has(i)){const p=[];let c=i;while(c!==-1){p.push(c);c=prev.get(c)}return p.reverse().map(j=>[j%W,(j-j%W)/W])}
    const x=i%W,y=(i-x)/W;for(const [dx,dy] of Object.values(DIRS)){const nx=x+dx,ny=y+dy;if(!MD.isR(nx,ny))continue;const j=ny*W+nx;if(!prev.has(j)){prev.set(j,i);q.push(j)}}}
  return null}
function streetOf(m,x,y){if(!m.streets)return [];const a=[];if(m.streets.h[y])a.push(m.streets.h[y]);if(m.streets.v[x])a.push(m.streets.v[x]);return a}
const coordName=(x,y)=>COLS[x]+(y+1);

    case 'icecream':return g(`M${X(6)} ${Y(9)}L${X(10)} ${Y(18)}L${X(14)} ${Y(9)}Z`,'#e9a65c')+`<circle cx="${X(10)}" cy="${Y(7)}" r="${4.5*u}" fill="#ff9fc8" stroke="${N}" stroke-width="1.6"/>`;

    case 'shop':return g(`M${X(4)} ${Y(9)}V${Y(17)}H${X(16)}V${Y(9)}`,'#fff')+`<path d="M${X(3)} ${Y(5)}H${X(17)}L${X(17)} ${Y(9)}H${X(3)}Z" fill="#ff7aa2" stroke="${N}" stroke-width="1.6"/>`+g(`M${X(7)} ${Y(5)}V${Y(9)}M${X(10)} ${Y(5)}V${Y(9)}M${X(13)} ${Y(5)}V${Y(9)}`);

function mapSVG(MD,o={}){const m=MD.m,W=m.W*MC,H=m.H*MC,R=MC*.4;

  if(o.coordHl){const [cx,cy]=o.coordHl;s+=`<rect x="${cx*MC}" y="0" width="${MC}" height="${H}" fill="#ffe14d" opacity=".25"/><rect x="0" y="${cy*MC}" width="${W}" height="${MC}" fill="#ffe14d" opacity=".25"/>`}

    dots+=`<circle cx="${cx}" cy="${cy}" r="${R}"/>`;
    if(MD.isR(x+1,y))seg+=`M${cx} ${cy}H${cx+MC}`;if(MD.isR(x,y+1))seg+=`M${cx} ${cy}V${cy+MC}`;
    if(n.length===1&&!(x===0||y===0||x===m.W-1||y===m.H-1))bulbs+=`<circle cx="${cx}" cy="${cy}" r="${MC*.52}"/>`;
    if(n.length<=2)n.forEach(d=>{const [dx,dy]=DIRS[d];dash+=`M${cx} ${cy}L${cx+dx*MC/2} ${cy+dy*MC/2}`})}

    else if(sg.t==='stop'){const r=9,px=cx+MC*.32,py=cy-MC*.32;let pts='';for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;pts+=`${px+r*Math.cos(a)},${py+r*Math.sin(a)} `}s+=`<polygon points="${pts}" fill="#e53935" stroke="#fff" stroke-width="1.5"/>`}
    else s+=`<rect x="${cx+MC*.2}" y="${cy-MC*.5}" width="9" height="20" rx="3" fill="#2b2f3a" stroke="#fff" stroke-width="1.2"/><circle cx="${cx+MC*.2+4.5}" cy="${cy-MC*.5+4.5}" r="2.3" fill="#ff4d4d"/><circle cx="${cx+MC*.2+4.5}" cy="${cy-MC*.5+10}" r="2.3" fill="#ffd84d"/><circle cx="${cx+MC*.2+4.5}" cy="${cy-MC*.5+15.5}" r="2.3" fill="#3ddc84"/>`});

  for(let y=0;y<t.H;y++)for(let x=0;x<W;x++)if(MD.isR(x,y)){roads++;cells.push([x,y]);const n=MD.nb(x,y).length;if(n===3)inter3++;if(n===4)inter4++;if(n===1)dead++}

/* ---- model ---- */
function cityBase(W=16,H=12){return {kind:'city',id:null,name:'',why:'',W,H,terrain:Array(W*H).fill('g'),roads:[],zones:{},bldgs:[],mission:null}}
function cAddRoad(C,x0,y0,x1,y1){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const k=x+','+y;if(!C.roads.includes(k))C.roads.push(k)}}
function cZone(C,t,x0,y0,x1,y1){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)C.zones[x+','+y]=t}
function cTrees(C,list){list.forEach(([x,y])=>{if(C.terrain[y*C.W+x]==='g')C.terrain[y*C.W+x]='t'})}
const TREES=[[1,1],[2,0],[9,1],[14,10],[13,11],[0,11],[8,10],[15,3]];
function makeCity(kind){const C=cityBase();
  if(kind==='river'){for(let y=0;y<C.H;y++){const x=y<6?7:8;C.terrain[y*C.W+x]='w';C.terrain[y*C.W+x+1]='w'}
    cAddRoad(C,3,0,3,11);cAddRoad(C,0,6,6,6);cAddRoad(C,12,0,12,11);cAddRoad(C,10,6,15,6);
    C.bldgs.push({k:'solar',x:0,y:4},{k:'water',x:2,y:5});cTrees(C,[[1,1],[5,10],[14,1],[15,10],[11,2]]);return C}
  cAddRoad(C,0,6,15,6);C.bldgs.push({k:'solar',x:0,y:4},{k:'water',x:2,y:5});
  if(kind==='starter'){cAddRoad(C,4,0,4,11);cAddRoad(C,11,0,11,11);cZone(C,'R',5,5,10,5);cZone(C,'R',5,7,10,7);cZone(C,'C',12,5,14,5);cZone(C,'P',6,9,8,10);cTrees(C,TREES);C.terrain[1*C.W+13]='w';C.terrain[1*C.W+14]='w';C.terrain[2*C.W+13]='w';C.terrain[2*C.W+14]='w'}
  else if(kind==='factory'){cAddRoad(C,10,0,10,11);cAddRoad(C,10,9,15,9);cZone(C,'I',11,7,14,8);cTrees(C,TREES)}
  else if(kind==='bakery'){cAddRoad(C,4,0,4,11);cAddRoad(C,11,0,11,11);cAddRoad(C,0,2,15,2);cAddRoad(C,0,10,15,10);
    cZone(C,'R',5,3,10,3);cZone(C,'R',5,5,10,5);cZone(C,'R',5,7,9,7);cZone(C,'R',5,9,10,9);cZone(C,'R',0,7,3,7);cZone(C,'R',12,3,15,3);cZone(C,'I',12,7,15,7);cZone(C,'I',12,9,15,9);cZone(C,'P',6,8,8,8);C.bldgs.push({k:'fire',x:0,y:3})}
  else cTrees(C,TREES);
  return C}
function bCells(b){const s=SV[b.k],a=[];for(let y=b.y;y<b.y+s.h;y++)for(let x=b.x;x<b.x+s.w;x++)a.push([x,y]);return a}

function evalCity(C){const W=C.W,H=C.H,I=(x,y)=>y*W+x,road=new Array(W*H).fill(false);C.roads.forEach(k=>{const [x,y]=k.split(',').map(Number);road[I(x,y)]=true});
  const isR=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&road[I(x,y)],comp=new Array(W*H).fill(-1);let nc=0;
  for(let i=0;i<W*H;i++){if(!road[i]||comp[i]>=0)continue;const st=[i];comp[i]=nc;while(st.length){const c=st.pop(),x=c%W,y=(c-x)/W;for(const [dx,dy] of Object.values(DIRS)){const nx=x+dx,ny=y+dy;if(isR(nx,ny)&&comp[I(nx,ny)]<0){comp[I(nx,ny)]=nc;st.push(I(nx,ny))}}}nc++}
  const adj=cells=>{const s=new Set();cells.forEach(([x,y])=>Object.values(DIRS).forEach(([dx,dy])=>{if(isR(x+dx,y+dy))s.add(comp[I(x+dx,y+dy)])}));return s};
  const bc=C.bldgs.map(b=>({b,cells:bCells(b),comps:adj(bCells(b))}));
